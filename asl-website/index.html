<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Fingerspelling Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <div class="display-section">
            <div class="letter-display" id="letterDisplay">
                <div class="placeholder">Click "New Word" to begin</div>
            </div>
        </div>

        <div class="control-section">
            <div class="header">
                <h1>ASL Practice</h1>
                <div class="score">Score: <span id="scoreValue">0</span></div>
            </div>

            <div class="main-controls">
                <button id="newWordBtn" class="btn primary">New Word</button>
                <button id="replayBtn" class="btn secondary">Replay</button>
            </div>

            <form id="answerForm" class="answer-form">
                <input type="text" id="answerInput" placeholder="Type what you see">
                <button type="submit" class="btn check">Check</button>
            </form>

            <div class="settings-grid">
                <div class="setting">
                    <div class="label">Speed</div>
                    <div class="options">
                        <label><input type="radio" name="speed" value="1200">Slow</label>
                        <label><input type="radio" name="speed" value="800" checked>Medium</label>
                        <label><input type="radio" name="speed" value="400">Fast</label>
                    </div>
                </div>

                <div class="setting">
                    <div class="label">Length</div>
                    <div class="options">
                        <label><input type="radio" name="length" value="3">3</label>
                        <label><input type="radio" name="length" value="4">4</label>
                        <label><input type="radio" name="length" value="5">5</label>
                        <label><input type="radio" name="length" value="99" checked>Any</label>
                    </div>
                </div>

                <div class="setting">
                    <div class="label">Attempts</div>
                    <div class="options">
                        <label><input type="radio" name="attempts" value="1">1</label>
                        <label><input type="radio" name="attempts" value="2">2</label>
                        <label><input type="radio" name="attempts" value="3" checked>3</label>
                        <label><input type="radio" name="attempts" value="99">∞</label>
                    </div>
                </div>

                <div class="setting">
                    <div class="label">Mode</div>
                    <div class="options">
                        <label><input type="radio" name="mode" value="words" checked>Words</label>
                        <label><input type="radio" name="mode" value="alphabet">Letters</label>
                        <label><input type="radio" name="mode" value="custom">Custom</label>
                    </div>
                </div>
            </div>

            <div class="custom-section" id="customSection">
                <div class="label">Paste your vocab list</div>
                <textarea id="customWords" placeholder="Paste your vocabulary words here - any format works!"></textarea>
            </div>
        </div>
    </div>

    <div class="footer">© 2025 Tobias Schmidt Services LLC</div>

    <script src="assets/js/words.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
