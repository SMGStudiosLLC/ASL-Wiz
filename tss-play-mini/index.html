    };
    mat.customProgramCacheKey = () => 'mc-world-light';
    return mat;
  },

  createWorld: function(seed, edits, savedPlayer) {
    this.worldSeed = seed >>> 0;
    this.world = new World({
      seed: this.worldSeed,
      scene: this.scene,
      materials: this.materials,
      viewRadius: this.settings.render,
      smoothLighting: this.settings.smooth
    });
    if (edits) this.world.loadEdits(edits);
    this.entities.setWorld(this.world);

    this.player = new Player(this.world);
    this.spawn = this.world.gen.findSpawn();
    this.usedSavedPos = false;
    if (savedPlayer && typeof savedPlayer.x === 'number') {
      this.player.teleport(savedPlayer.x, savedPlayer.y, savedPlayer.z);
      this.player.yaw = savedPlayer.yaw || 0;
      this.player.pitch = savedPlayer.pitch || 0;
      this.player.flying = !!savedPlayer.flying;
      this.usedSavedPos = true;
    } else {
      this.player.teleport(this.spawn.x, this.spawn.y + 1, this.spawn.z);
    }
    this.sky.setTimeOfDay(this.saveData && typeof this.saveData.time === 'number' ? this.saveData.time : 0.1);
  },

  saveWorld: function() {
    if (!this.world || !this.player) return;
    craftSaveJSON(CRAFT_WORLD_KEY, {
      seed: this.worldSeed,
      edits: this.world.serializeEdits(),
      player: {
        x: this.player.pos.x, y: this.player.pos.y, z: this.player.pos.z,
        yaw: this.player.yaw, pitch: this.player.pitch, flying: this.player.flying
      },
      hotbar: this.hotbar,
      slot: this.selected,
      time: this.sky.timeOfDay
    });
  },

  finishLoading: function() {
    if (!this.usedSavedPos) {
      const bx = Math.floor(this.player.pos.x), bz = Math.floor(this.player.pos.z);
      let y = WORLD_H - 2;
      while (y > 1 && !BLOCKS[this.world.getBlock(bx, y, bz)].solid) y--;
      this.player.teleport(bx + 0.5, y + 1, bz + 0.5);
    }
    this.state = 'playing';
    if (this.ui && this.ui.loader) this.ui.loader.style.display = 'none';
    if (this.ui && this.ui.hud) this.ui.hud.style.display = 'block';
  },

  // ----------------------------------------------------------
  // UI (Play Mini glass style, Inter)
  // ----------------------------------------------------------

    this.ui.slots = [];
    for (let i = 0; i < 9; i++) {
      const slot = document.createElement('div');
      slot.style.cssText = 'width:46px;height:46px;border-radius:11px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;position:relative;transition:background 0.12s ease, border-color 0.12s ease;';
      const img = document.createElement('img');
      img.draggable = false;
      img.style.cssText = 'width:78%;height:78%;image-rendering:pixelated;pointer-events:none;';
      const num = document.createElement('span');
      num.textContent = String(i + 1);
      num.style.cssText = 'position:absolute;top:2px;left:5px;font:600 8px Inter;color:rgba(255,255,255,0.4);';
      slot.appendChild(img);
      slot.appendChild(num);
      slot.addEventListener('pointerdown', (e) => {
        e.preventDefault();

        if (this.selected === i && this.state === 'playing') this.togglePicker();

    hud.appendChild(toast);

    // coords chip

      const img = document.createElement('img');

  // Nine slots must fit a 375pt phone, and on touch the bar has to clear the
  // on-screen pad (above it in portrait, top center in landscape)
  layoutHotbar: function() {
    if (!this.ui || !this.ui.slots) return;
    const hb = document.getElementById('mindcraft-hotbar');
    const vw = window.innerWidth, vh = window.innerHeight;
    const size = Math.max(28, Math.min(46, Math.floor((vw - 32 - 12 - 8 * 5) / 9)));
    for (const slot of this.ui.slots) {
      slot.style.width = size + 'px';
      slot.style.height = size + 'px';
      slot.style.borderRadius = Math.round(size * 0.24) + 'px';
    }
    let toastBottom = size + 40;
    if (this.isTouch && vw <= vh) {
      const lift = (TouchControls.bottomInset || 150) + 6;
      hb.style.top = 'auto';
      hb.style.bottom = lift + 'px';
      toastBottom = lift + size + 24;
    } else if (this.isTouch) {
      hb.style.bottom = 'auto';
      hb.style.top = 'max(12px, env(safe-area-inset-top))';
    } else {
      hb.style.top = 'auto';
      hb.style.bottom = 'max(16px, env(safe-area-inset-bottom))';
    }
    if (this.ui.toast) this.ui.toast.style.bottom = toastBottom + 'px';
  },

  // Back with the block picker open closes the picker instead of quitting
  onEscape: function() {
    if (this.pickerOpen) { this.closePicker(); return true; }
    return false;
  },

  showToast: function(text) {
    if (!this.ui) return;
    this.ui.toast.textContent = text;
    this.ui.toast.style.opacity = '1';
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => { if (this.ui) this.ui.toast.style.opacity = '0'; }, 1300);
  },

  flashDamage: function() {
    if (!this.ui) return;
    this.ui.damage.style.opacity = '1';
    clearTimeout(this._dmgTimer);
    this._dmgTimer = setTimeout(() => { if (this.ui) this.ui.damage.style.opacity = '0'; }, 220);
  },

  updateHotbarUI: function() {
    if (!this.ui) return;
    this.hotbar.forEach((id, i) => {
      const slot = this.ui.slots[i];
      const img = slot.querySelector('img');
      const url = this.icons.get(id);
      if (url && img.src !== url) img.src = url;
      const sel = i === this.selected;
      slot.style.background = sel ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.06)';
      slot.style.borderColor = sel ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.1)';
    });
    for (const pc of (this.ui.pickerCells || [])) {
      const active = pc.id === this.hotbar[this.selected];
      pc.cell.style.background = active ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.06)';
      pc.cell.style.borderColor = active ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.1)';
    }
  },

  selectSlot: function(i) {
    this.selected = i;
    this.updateHotbarUI();
    this.showToast(BLOCKS[this.hotbar[i]].name);
    this.dipT = 0;
    this.audio.pop();
  },

  cycleSlot: function(dir) {
    this.selectSlot((this.selected + dir + 9) % 9);
  },

  assignBlock: function(id) {
    this.hotbar[this.selected] = id;
    this.updateHotbarUI();
    this.showToast(BLOCKS[id].name);
    this.audio.click();
    this.dipT = 0;
  },

  cyclePaletteBlock: function(dir) {
    const cur = this.hotbar[this.selected];
    let i = PALETTE.indexOf(cur);
    if (i < 0) i = 0;
    this.assignBlock(PALETTE[(i + dir + PALETTE.length) % PALETTE.length]);
  },

  togglePicker: function() {
    if (this.pickerOpen) this.closePicker();
    else this.openPicker();
  },

  openPicker: function() {
    if (this.state !== 'playing') return;
    this.pickerOpen = true;
    this.mining = false;
    this.rmbHeld = false;
    this.ui.picker.style.display = 'flex';
    this.updateHotbarUI();
    if (document.exitPointerLock) document.exitPointerLock();
  },

  closePicker: function() {
    this.pickerOpen = false;
    this.ui.picker.style.display = 'none';
    if (!this.isTouch && this.state === 'playing') this.lockPointer();
  },

  lockPointer: function() {
    try {
      const p = this.canvas.requestPointerLock({ unadjustedMovement: true });
      if (p && p.catch) p.catch(() => { try { this.canvas.requestPointerLock(); } catch (e) {} });
    } catch (e) {
      try { this.canvas.requestPointerLock(); } catch (e2) {}
    }
  },

  // ----------------------------------------------------------
  // Icons (real block geometry rendered with the atlas)
  // ----------------------------------------------------------

  makeIcons: function() {
    const icons = new Map();
    const SIZE = 64;
    const rt = new THREE.WebGLRenderTarget(SIZE, SIZE);
    const iconScene = new THREE.Scene();
    const cam = new THREE.OrthographicCamera(-0.82, 0.82, 0.82, -0.82, 0.1, 10);
    cam.position.set(1.84, 1.5, 1.84);
    cam.lookAt(0, 0, 0);

    const buf = new Uint8Array(SIZE * SIZE * 4);
    const cnv = document.createElement('canvas');
    cnv.width = cnv.height = SIZE;
    const ictx = cnv.getContext('2d');

    for (const id of PALETTE) {
      const def = BLOCKS[id];
      if (def.shape === 'cross' || def.shape === 'torch' || def.shape === 'liquid') {
        icons.set(id, tileIconCanvas(def.tex.py, SIZE).toDataURL());
        continue;
      }
      const mesh = new THREE.Mesh(this.heldGeometry(id), this.materials.solid);
      iconScene.add(mesh);
      this.renderer.setRenderTarget(rt);
      this.renderer.setClearColor(0x000000, 0);
      this.renderer.clear();
      this.renderer.render(iconScene, cam);
      this.renderer.readRenderTargetPixels(rt, 0, 0, SIZE, SIZE, buf);
      this.renderer.setRenderTarget(null);
      iconScene.remove(mesh);

      const img = ictx.createImageData(SIZE, SIZE);
      for (let y = 0; y < SIZE; y++) {
        const src = (SIZE - 1 - y) * SIZE * 4;
        const dst = y * SIZE * 4;
        for (let x = 0; x < SIZE * 4; x += 4) {
          img.data[dst + x] = buf[src + x];
          img.data[dst + x + 1] = buf[src + x + 1];
          img.data[dst + x + 2] = buf[src + x + 2];
          img.data[dst + x + 3] = buf[src + x + 3];
        }
      }
      ictx.putImageData(img, 0, 0);
      icons.set(id, cnv.toDataURL());
    }
    rt.dispose();
    return icons;
  },

  heldGeometry: function(id) {
    let g = this.heldGeoCache.get(id);
    if (!g) { g = buildBlockGeometry(id); this.heldGeoCache.set(id, g); }
    return g;
  },

  // ----------------------------------------------------------
  // Interaction
  // ----------------------------------------------------------

  currentTarget: function() {
    if (this._touchScreen) {
      const r = this.rayFromScreen(this._touchScreen.x, this._touchScreen.y);
      return raycastVoxel(this.world, r.origin, r.dir, CRAFT_REACH + 1.5);
    }
    const eye = this.player.eyePosition(new THREE.Vector3());
    const dir = this.player.lookDir(new THREE.Vector3());
    return raycastVoxel(this.world, eye, dir, CRAFT_REACH);
  },

  rayFromScreen: function(clientX, clientY) {
    const ndcX = (clientX / window.innerWidth) * 2 - 1;
    const ndcY = -(clientY / window.innerHeight) * 2 + 1;
    const v = new THREE.Vector3(ndcX, ndcY, 0.5).unproject(this.camera);
    const origin = new THREE.Vector3();
    this.camera.getWorldPosition(origin);
    return { origin, dir: v.sub(origin).normalize() };
  },

  swing: function() { this.swingT = 0; },

  updateInteraction: function(dt) {
    const target = this.currentTarget();

    if (target) {
      this.outline.visible = true;
      this.outline.position.set(target.x + 0.5, target.y + 0.5, target.z + 0.5);
    } else {
      this.outline.visible = false;
    }

    if (this.mining && target) {
      const key = target.x + ',' + target.y + ',' + target.z;
      if (this.miningCell !== key) {
        this.miningCell = key;
        this.miningProgress = 0;
      }
      const def = BLOCKS[target.id];
      if (def.hardness !== Infinity) {
        const speed = this.player.headInWater ? 0.35 : 1;
        this.miningProgress += dt * speed;
        if (this.swingT > 0.7) this.swing();
        const frac = Math.min(1, this.miningProgress / def.hardness);
        const stage = Math.min(7, Math.floor(frac * 8));
        if (frac > 0.02 && def.hardness > 0.12) {
          this.crack.visible = true;
          this.crack.position.copy(this.outline.position);
          this.crackMat.map = this.crackTextures[stage];
          this.crackMat.needsUpdate = true;
        } else {
          this.crack.visible = false;
        }
        if (this.miningProgress >= def.hardness) {
          this.breakBlock(target);
          GamepadManager.rumble(70, 0.4, 0.3);
          this.miningCell = null;
          this.miningProgress = -0.08;
          this.crack.visible = false;
        }
      } else {
        this.crack.visible = false;
      }
    } else {
      this.crack.visible = false;
      if (!this.mining) { this.miningProgress = 0; this.miningCell = null; }
    }

    if (this.rmbHeld) {
      this.placeTimer -= dt;
      if (this.placeTimer <= 0) {
        this.placeTimer = 0.24;
        this.placeBlock();
      }
    }
  },

  breakBlock: function(target) {
    const id = target.id;
    if (id === B.TNT) {
      this.entities.igniteTNT(target.x, target.y, target.z);
      return;
    }
    this.world.setBlock(target.x, target.y, target.z, B.AIR);
    this.particles.spawnBlockBreak(target.x, target.y, target.z, id);
    this.audio.blockBreak(id);
  },

  placeBlock: function() {
    const target = this.currentTarget();
    if (!target) return false;
    const id = this.hotbar[this.selected];
    const def = BLOCKS[id];
    const targetDef = BLOCKS[target.id];

    let cx, cy, cz;
    if (targetDef.replaceable) {
      cx = target.x; cy = target.y; cz = target.z;
    } else {
      if (target.nx === 0 && target.ny === 0 && target.nz === 0) return false;
      cx = target.x + target.nx; cy = target.y + target.ny; cz = target.z + target.nz;
    }
    if (cy < 1 || cy >= WORLD_H) return false;

    const cellId = this.world.getBlock(cx, cy, cz);
    const cellDef = BLOCKS[cellId];
    if (cellId !== B.AIR && !cellDef.replaceable) return false;
    if (def.solid && this.player.intersectsCell(cx, cy, cz)) return false;

    const below = this.world.getBlock(cx, cy - 1, cz);
    if (def.support === 'floor') {
      if (id === B.TORCH) {
        if (!BLOCKS[below].solid) return false;
      } else if (below !== B.GRASS && below !== B.DIRT && below !== B.SNOW_GRASS && below !== B.SAND) {
        return false;
      }
    }
    if (def.support === 'sand' && below !== B.SAND && below !== B.CACTUS) return false;

    this.world.setBlock(cx, cy, cz, id);
    this.audio.blockPlace(id);
    this.swing();
    return true;
  },

  pickTargetBlock: function() {
    const target = this.currentTarget();
    if (!target) return;
    if (PALETTE.indexOf(target.id) >= 0) this.assignBlock(target.id);
  },

  processSupportChecks: function() {
    const list = this.world.supportChecks;
    if (!list.length) return;
    const batch = list.splice(0, 128);
    for (const cell of batch) {
      const x = cell[0], y = cell[1], z = cell[2];
      const id = this.world.getBlock(x, y, z);
      if (id === B.AIR) continue;
      const def = BLOCKS[id];
      const below = this.world.getBlock(x, y - 1, z);
      const belowSolid = BLOCKS[below].solid;

      if (def.gravity && !belowSolid) {
        this.entities.spawnFallingBlock(x, y, z, id);
      } else if (def.support === 'floor' && !belowSolid) {
        this.world.setBlock(x, y, z, B.AIR);
        this.particles.spawnBlockBreak(x, y, z, id);
        this.audio.blockBreak(id);
      } else if (def.support === 'sand' && below !== B.SAND && below !== B.CACTUS) {
        this.world.setBlock(x, y, z, B.AIR);
        this.particles.spawnBlockBreak(x, y, z, id);
        this.audio.blockBreak(id);
      }
    }
  },

  // ----------------------------------------------------------
  // Shell adapters (mouse handlers live in the Play Mini shell)
  // ----------------------------------------------------------

  onMouseDown: function(button) {
    if (this.state !== 'playing' || this.pickerOpen) return;
    this.audio.ensure();
    if (button === 0) {
      this.mining = true;
      this.miningProgress = 0;
      this.miningCell = null;
      this.swing();
    } else if (button === 1) {
      this.pickTargetBlock();
    } else if (button === 2) {
      this.rmbHeld = true;
      this.placeTimer = 0.24;
      this.placeBlock();
    }
  },

  onMouseUp: function(button) {
    if (button === 0) { this.mining = false; this.miningProgress = 0; this.miningCell = null; }
    if (button === 2) this.rmbHeld = false;
  },

  onLook: function(dx, dy) {
    if (this.state !== 'playing' || !this.player) return;
    const sens = (this.settings.sens / 100) * 0.0023;
    this.player.yaw -= dx * sens;
    this.player.pitch -= dy * sens;
    const lim = Math.PI / 2 - 0.001;
    this.player.pitch = Math.max(-lim, Math.min(lim, this.player.pitch));
  },

  // ----------------------------------------------------------
  // Touch: drag = look, tap = place, press-and-hold = mine
  // ----------------------------------------------------------

  attachTouch: function() {
    this.detachTouch();
    const cv = this.canvas;
    this._lookId = null;
    this._lookLast = null;
    this._lookStart = null;
    this._touchDown = (e) => {
      if (e.pointerType === 'mouse') return;
      e.preventDefault();
      this.audio.ensure();
      this._lookId = e.pointerId;
      this._lookLast = { x: e.clientX, y: e.clientY };
      this._lookStart = { x: e.clientX, y: e.clientY, t: performance.now(), dist: 0 };
    };
    this._touchMove = (e) => {
      if (e.pointerId !== this._lookId || !this._lookLast) return;
      const dx = e.clientX - this._lookLast.x;
      const dy = e.clientY - this._lookLast.y;
      this._lookLast = { x: e.clientX, y: e.clientY };
      if (this._lookStart) this._lookStart.dist += Math.abs(dx) + Math.abs(dy);
      if (this.state !== 'playing' || !this.player) return;
      this.player.yaw -= dx * 0.005;
      const lim = Math.PI / 2 - 0.001;
      this.player.pitch = Math.max(-lim, Math.min(lim, this.player.pitch - dy * 0.005));
    };
    this._touchUp = (e) => {
      if (e.pointerId !== this._lookId) return;
      const s = this._lookStart;
      if (this._touchScreen) {
        this._touchScreen = null;
        this.mining = false;
        this.miningProgress = 0;
        this.miningCell = null;
      } else if (s && s.dist < 14 && performance.now() - s.t < 260 && this.state === 'playing' && !this.pickerOpen) {
        this._touchScreen = { x: e.clientX, y: e.clientY };
        this.placeBlock();
        this._touchScreen = null;
      }
      this._lookId = null;
      this._lookLast = null;
      this._lookStart = null;
    };
    cv.addEventListener('pointerdown', this._touchDown);
    cv.addEventListener('pointermove', this._touchMove);
    cv.addEventListener('pointerup', this._touchUp);
    cv.addEventListener('pointercancel', this._touchUp);
  },

  detachTouch: function() {
    this._touchScreen = null;
    const cv = this.canvas;
    if (!cv || !this._touchDown) return;
    cv.removeEventListener('pointerdown', this._touchDown);
    cv.removeEventListener('pointermove', this._touchMove);
    cv.removeEventListener('pointerup', this._touchUp);
    cv.removeEventListener('pointercancel', this._touchUp);
    this._touchDown = null;
  },

  // ----------------------------------------------------------
  // Frame
  // ----------------------------------------------------------

  update: function(delta) {
    const dt = Math.min(0.1, delta / 1000);

    // keep the synth SFX in step with the global mute
    if (this.audio.master) {
      const target = audioManager.muted ? 0 : 0.55;
      if (this.audio.volume !== target) this.audio.setVolume(target);
    }

    if (this.state === 'loading') {
      this.world.update(this.player.pos.x, this.player.pos.z, 14);
      const radius = Math.min(4, this.settings.render);
      const r = this.world.readiness(this.player.pos.x, this.player.pos.z, radius);
      if (this.ui) this.ui.loaderBar.style.width = Math.round((r.total ? r.ready / r.total : 0) * 100) + '%';
      this.sky.update(dt, this.camera.position);
      if (r.ready >= r.total) this.finishLoading();
      return;
    }

    const p = this.player;
    const gp = GamepadManager.latest;

    // ---- gamepad look / actions ----
    if (gp && this.state === 'playing' && !this.pickerOpen) {
      const rx = gp.state.axes[2], ry = gp.state.axes[3];
      if (rx !== 0 || ry !== 0) {
        const rate = 0.0034 * delta;
        p.yaw -= rx * Math.abs(rx) * rate;
        const lim = Math.PI / 2 - 0.001;
        p.pitch = Math.max(-lim, Math.min(lim, p.pitch - ry * Math.abs(ry) * rate));
      }

      const rHeld = gp.state.triggers[1] > 0.4;
      if (rHeld && !this._gpMining) {
        this.mining = true; this.miningProgress = 0; this.miningCell = null;
        this.swing();
        this._gpMining = true;
      }
      if (!rHeld && this._gpMining) {
        this.mining = false; this.miningProgress = 0; this.miningCell = null;
        this._gpMining = false;
      }

      const now = performance.now();
      if (gp.state.triggers[0] > 0.4 && now - this._gpPlaceAt > 260) {
        if (this.placeBlock()) {
          this._gpPlaceAt = now;
          GamepadManager.rumble(55, 0.18, 0.16);
        }
      }

      if (gp.justPressed.r1) this.cycleSlot(1);
      if (gp.justPressed.l1) this.cycleSlot(-1);
      // raw d-pad only (state.up/down also fire on stick flicks)
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      const rawPad = pads && pads[gp.index];
      const dUp = !!(rawPad && rawPad.buttons[12] && rawPad.buttons[12].pressed);
      const dDown = !!(rawPad && rawPad.buttons[13] && rawPad.buttons[13].pressed);
      if (dUp && !this._dUpPrev) this.cyclePaletteBlock(1);
      if (dDown && !this._dDownPrev) this.cyclePaletteBlock(-1);
      this._dUpPrev = dUp;
      this._dDownPrev = dDown;
      if (gp.justPressed.y) {
        p.flying = !p.flying;
        if (p.flying) p.vel.y = 0;
        this.showToast(p.flying ? 'Flying' : 'Walking');
        this.audio.pop();
      }
    }

    // ---- movement input (keyboard + touch d-pad + pad stick) ----
    const k = keysDown;
    const active = this.state === 'playing' && !this.pickerOpen;
    const stickX = gp ? gp.state.axes[0] : 0;
    const stickY = gp ? gp.state.axes[1] : 0;
    const input = {
      forward: active && !!(k['w'] || k['W'] || k['ArrowUp'] || stickY < -0.3),
      back: active && !!(k['s'] || k['S'] || k['ArrowDown'] || stickY > 0.3),
      left: active && !!(k['a'] || k['A'] || k['ArrowLeft'] || stickX < -0.3),
      right: active && !!(k['d'] || k['D'] || k['ArrowRight'] || stickX > 0.3),
      jump: active && !!(k[' '] || (gp && gp.state.a)),
      sneak: active && !!(k['Shift'] || (gp && gp.state.r3))
    };
    const wantSprint = active && !!(k['Control'] || this.sprintLatch || (gp && gp.state.l3));
    p.sprinting = wantSprint && input.forward && !input.sneak;

    p.update(dt, input);

    if (p.pos.y < -14) {
      p.teleport(this.spawn.x, Math.max(this.spawn.y + 2, 70), this.spawn.z);
      p.vel.set(0, 0, 0);
    }

    for (const ev of p.events) {
      if (ev.type === 'step') this.audio.step(ev.id);
      else if (ev.type === 'land') {
        this.audio.land(ev.impact);
        if (ev.impact > 22) { this.flashDamage(); GamepadManager.rumble(120, 0.5, 0.3); }
      } else if (ev.type === 'splash') this.audio.splash();
    }
    p.events.length = 0;

    // ---- touch press-and-hold starts mining at the finger ray ----
    if (this._lookStart && this._lookLast) {
      const s = this._lookStart;
      if (s.dist < 14 && performance.now() - s.t >= 260 && !this.pickerOpen) {
        if (!this._touchScreen) {
          this.mining = true;
          this.miningProgress = 0;
          this.miningCell = null;
        }
        this._touchScreen = { x: this._lookLast.x, y: this._lookLast.y };
      } else if (s.dist >= 14 && this._touchScreen) {
        this._touchScreen = null;
        this.mining = false;
        this.miningProgress = 0;
        this.miningCell = null;
      }
    }

    if (!this.pickerOpen) this.updateInteraction(dt);
    else { this.outline.visible = false; this.crack.visible = false; }

    this.world.update(p.pos.x, p.pos.z, 5);
    this.processSupportChecks();
    this.entities.update(dt);
    this.particles.update(dt, this.camera);

    // ---- camera ----
    const eye = p.eyePosition(new THREE.Vector3());
    let bobY = 0, bobRoll = 0;
    if (this.settings.bob && !p.flying) {
      bobY = Math.abs(Math.sin(p.walkCycle)) * 0.052 * p.bobStrength;
      bobRoll = Math.sin(p.walkCycle) * 0.004 * p.bobStrength;
    }
    this.shakeT = Math.max(0, this.shakeT - dt);
    const sh = this.shakeT * this.shakeT * 0.35;
    this.camera.position.set(
      eye.x + (Math.random() - 0.5) * sh,
      eye.y + bobY + (Math.random() - 0.5) * sh,
      eye.z + (Math.random() - 0.5) * sh
    );
    this.camera.rotation.set(p.pitch, p.yaw, bobRoll);

    const targetFov = this.settings.fov * (p.sprinting ? (p.flying ? 1.18 : 1.12) : 1);
    this.fovCurrent += (targetFov - this.fovCurrent) * Math.min(1, 10 * dt);
    if (Math.abs(this.fovCurrent - this.camera.fov) > 0.05) {
      this.camera.fov = this.fovCurrent;
      this.camera.updateProjectionMatrix();
    }

    // ---- environment ----
    this.sky.setUnderwater(p.headInWater);
    if (this.ui) this.ui.underwater.style.opacity = p.headInWater ? '1' : '0';
    this.sky.update(dt, this.camera.position);
    const tSec = performance.now() / 1000;
    this.waterTex.offset.x = (tSec * 0.018) % 1;
    this.waterTex.offset.y = (tSec * 0.011) % 1;

    this.updateHand(dt);

    if (this.ui) {
      this.ui.coords.textContent = Math.floor(p.pos.x) + ', ' + Math.floor(p.pos.y) + ', ' + Math.floor(p.pos.z) + (p.flying ? '  FLY' : '');
    }

    this.autosaveTimer += dt;
    if (this.autosaveTimer > 6) {
      this.autosaveTimer = 0;
      this.saveWorld();
    }
  },

  updateHand: function(dt) {
    const id = this.hotbar[this.selected];
    if (!this.heldMesh || this.heldId !== id) {
      if (this.heldMesh) this.handGroup.remove(this.heldMesh);
      this.heldMesh = new THREE.Mesh(this.heldGeometry(id), this.materials.solid);
      this.heldMesh.scale.setScalar(0.4);
      this.handGroup.add(this.heldMesh);
      this.heldId = id;
    }

    this.swingT = Math.min(1, this.swingT + dt / 0.26);

      const cx = lane.x + this.laneWidth / 2;
      const grow = lp > 0.5 ? S : 0;
      PIX.draw(ctx, this.arrowSprite(idx, lane.color, 'receptor'), cx, this.hitLineY, as + (grow ? 0.5 : 0), { alpha: 0.75 + lp * 0.25 });
      PIX.text(ctx, ["L", "U", "D", "R"][idx], cx, this.hitLineY + as * 7 + 14, 2, "#8a8fb0");
    });

    if (this.combo > 3 && this.gameState === "playing") {
      const cs = Math.max(4, Math.min(8, Math.floor(W / 80)));
      PIX.text(ctx, String(this.combo), W / 2, H * 0.4, cs, "#FFFFFF", { shadow: "#4a2f9a", outline: "#140a2a" });
      PIX.text(ctx, "COMBO", W / 2, H * 0.4 + cs * 5 + 8, 2, "#B39BFF", { shadow: "#140a2a" });
    }

    // Notes: shaded pixel arrows with a soft lane-colored glow
    for (let i = 0; i < this.notes.length; i++) {
      const note = this.notes[i];
      if (note.hit || note.missed) continue;
      if (note.y < top - 40 || note.y > H + 40) continue;
      const lane = this.lanes[note.lane];
      const cx = lane.x + this.laneWidth / 2;
      PIX.drawGlow(ctx, cx, note.y, as * 10, lane.color, 0.45);
      PIX.draw(ctx, this.arrowSprite(note.lane, lane.color, 'note'), cx, note.y, as);
    }

    for (let i = 0; i < this.particles.length; i++) {
      const p = this.particles[i];
      ctx.globalAlpha = Math.max(0, p.life / 700);
      PIX.rect(ctx, Math.round(p.x / S) * S, Math.round(p.y / S) * S, S * 2, S * 2, p.color);
    }
    ctx.globalAlpha = 1;

    drawHUDChips(ctx, [
      { label: "Score", value: Math.floor(this.score) },
      { label: "Combo", value: this.combo + "x", color: "#8C63FF" },
      { label: "Mult", value: "x" + this.multiplier, color: "#FFD740" }
    ]);

    // Health: centered pixel segments under the lanes, clear of the home indicator
    const hpY = H - 22 - SAFE.bottom;
    const segs = 20, segW = Math.max(4, Math.min(9, Math.floor((Math.min(W, 300) - 60) / segs)));
    const total = segs * (segW + 2);
    const hx = Math.round((W - total) / 2 + 14);
    const filled = Math.ceil(this.health / 100 * segs);
    const hpColor = this.health > 55 ? "#34D399" : this.health > 28 ? "#FBBF24" : "#F87171";
    PIX.text(ctx, "HP", hx - 8, hpY + 4, 2, "#AEB4CC", { align: 'right' });
    for (let i = 0; i < segs; i++) {
      PIX.rect(ctx, hx + i * (segW + 2), hpY, segW, 8, i < filled ? hpColor : "rgba(255,255,255,0.12)");
      if (i < filled) PIX.rect(ctx, hx + i * (segW + 2), hpY, segW, 2, "rgba(255,255,255,0.45)");
    }

    if (this.songLength > 0 && this.gameState === "playing") {
      const prog = Math.max(0, Math.min(1, this.songTime / this.songLength));
      ctx.fillStyle = "rgba(255,255,255,0.12)";
      ctx.fillRect(0, 0, W, 4);
      ctx.fillStyle = "#8C63FF";
      ctx.fillRect(0, 0, W * prog, 4);
    }

    if (this.hitTexts.length > 0) {
      const last = this.hitTexts[this.hitTexts.length - 1];
      const R = PIX.ramp(last.color);
      PIX.text(ctx, last.text, W / 2, Math.max(96, SAFE.top + 90), Math.max(3, Math.min(5, Math.floor(W / 120))), last.color,
        { shadow: R.d, outline: R.o, alpha: Math.max(0.2, Math.min(1, last.life / 520)) });
    }

    if (this.gameState === "over" || this.gameState === "win") {
      drawGameOverScreen(ctx, {
        title: this.gameState === "win" ? "STAGE CLEARED" : "FAILED",
        titleColor: this.gameState === "win" ? "#FFD54F" : "#FF6B6B",
        score: Math.floor(this.score),
        lines: ["Max Combo: " + this.maxCombo]
      });
    }
  },

  keyDown: function(e) {
    if ((this.gameState === "over" || this.gameState === "win") && (e.key === " " || e.key === "Enter")) {
      this.init();
    }
  },
  keyUp: function(e) {},
  end: function() {
    this.finished = true;
    this.prevKeys = {};
    audioManager.stopMusic();
  }
};
  const stackGame = {
  score: 0,
  highScore: 0,
  gameState: "playing",
  tower: [],
  moving: null,
  debris: [],
  sparks: [],
  popup: null,
  scroll: 0,
  blockH: 38,
  baseHue: 200,
  combo: 0,
  speed: 3,
  playLeft: 0,
  playRight: 0,

  init: function() {
    audioManager.playMusic('stack', true);
    this.score = 0;
    this.gameState = "playing";
    this.tower = [];
    this.debris = [];
    this.sparks = [];
    this.popup = null;
    this.scroll = 0;
    this.combo = 0;
    this.baseHue = 190 + Math.floor(Math.random() * 80);
    this.S = PIX.scaleFor();
    this.blockH = (this.S === 3 ? 13 : 19) * this.S;
    this.layout();

    const baseW = (this.playRight - this.playLeft) * 0.62;
    const baseX = (this.playLeft + this.playRight) / 2 - baseW / 2;
    this.tower.push({ x: baseX, w: baseW, hue: this.baseHue });
    this.spawnMoving();
  },

  onResize: function() {
    this.layout();
  },

  layout: function() {
    this.playLeft = canvas.width * 0.14;
    this.playRight = canvas.width * 0.86;
  },

  baseY: function() { return canvas.height - 10 - SAFE.bottom; },
  levelTopY: function(level) { return this.baseY() - (level + 1) * this.blockH; },

  spawnMoving: function() {
    const top = this.tower[this.tower.length - 1];
    const dir = this.tower.length % 2 === 0 ? 1 : -1;
    const w = top.w;
    const x = dir === 1 ? this.playLeft : (this.playRight - w);
    this.speed = Math.min(9.5, 3 + this.tower.length * 0.13);
    this.moving = { x: x, w: w, dir: dir, hue: (this.baseHue + this.tower.length * 7) % 360 };
  },

  drop: function() {
    if (this.gameState !== "playing" || !this.moving) return;
    const top = this.tower[this.tower.length - 1];
    const m = this.moving;
    const level = this.tower.length;
    const yTop = this.levelTopY(level);

    const overlapL = Math.max(m.x, top.x);
    const overlapR = Math.min(m.x + m.w, top.x + top.w);
    const overlapW = overlapR - overlapL;

    if (overlapW <= 0) {
      this.debris.push({ x: m.x, w: m.w, y: yTop, vx: m.dir * 0.6, vy: 0, hue: m.hue });
      this.moving = null;
      this.gameOver();
      return;
    }

    const perfect = Math.abs(m.x - top.x) < 5 && Math.abs(m.w - top.w) < 5;
    let newX, newW;

    if (perfect) {
      newW = Math.min(top.w + 6, this.playRight - this.playLeft);
      newX = top.x - (newW - top.w) / 2;
      newX = Math.max(this.playLeft, Math.min(newX, this.playRight - newW));
      this.combo++;
      this.score += 2 + this.combo;
      this.popup = { text: "PERFECT" + (this.combo > 1 ? "  x" + this.combo : ""), life: 720 };
      audioManager.playTone(523.25 + Math.min(8, this.combo) * 45, 'sine', 0.09, 0.26);
      audioManager.playTone(784 + Math.min(8, this.combo) * 45, 'sine', 0.07, 0.16);
      for (let i = 0; i < 14; i++) {
        this.sparks.push({ x: newX + Math.random() * newW, y: yTop, vx: (Math.random() - 0.5) * 5, vy: -Math.random() * 4 - 1, life: 520, hue: m.hue });
      }
    } else {
      this.combo = 0;
      this.score += 1;
      newX = overlapL;
      newW = overlapW;
      const sliceW = m.w - overlapW;
      const sliceX = (m.x < top.x) ? m.x : overlapR;
      this.debris.push({ x: sliceX, w: sliceW, y: yTop, vx: (m.x < top.x ? -1 : 1) * 0.8, vy: 0, hue: m.hue });
      audioManager.playTone(300, 'square', 0.05, 0.2);
    }

    this.tower.push({ x: newX, w: newW, hue: m.hue });
    if (this.score > this.highScore) this.highScore = this.score;
    this.spawnMoving();
  },

  gameOver: function() {
    this.gameState = "over";
    if (this.score > this.highScore) this.highScore = this.score;
    StorageManager.saveScore('stack', this.score);
    if (this.score >= 1000) AchievementManager.unlock('score_1000');
    audioManager.playSFX('gameover');
  },

  update: function(delta) {
    const dt = Math.min(2.5, delta / 16.67);

    if (this.gameState === "playing" && this.moving) {
      const m = this.moving;
      m.x += m.dir * this.speed * dt;
      if (m.x < this.playLeft) { m.x = this.playLeft; m.dir = 1; }
      if (m.x + m.w > this.playRight) { m.x = this.playRight - m.w; m.dir = -1; }
    }

    for (let i = this.debris.length - 1; i >= 0; i--) {
      const d = this.debris[i];
      d.vy += 0.6 * dt;
      d.y += d.vy * dt;
      d.x += d.vx * dt;
      if (this.levelToScreenRaw(d.y) > canvas.height + 120) this.debris.splice(i, 1);
    }

    for (let i = this.sparks.length - 1; i >= 0; i--) {
      const s = this.sparks[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vy += 0.25 * dt;
      s.life -= delta;
      if (s.life <= 0) this.sparks.splice(i, 1);
    }

    if (this.popup) {
      this.popup.life -= delta;
      if (this.popup.life <= 0) this.popup = null;
    }

    const target = Math.max(0, (this.tower.length + 1) * this.blockH - canvas.height * 0.62);
    this.scroll += (target - this.scroll) * Math.min(1, 0.1 * dt);
  },

  levelToScreenRaw: function(worldY) { return worldY + this.scroll; },

  // Pseudo-3D slab: lit top face, grooved front face, hue-shifted shading
  slabSprite: function(hue, w, h) {
    const hq = Math.round(hue) % 360;
    return PIX.get('stack-slab:' + hq + ':' + w + 'x' + h, () => {
      const R = PIX.ramp(hslToHex(hq, 62, 56));
      return PIX.paint(w, h, (x, y) => {
        const corner = (x === 0 || x === w - 1) && (y === 0 || y === h - 1);
        if (corner) return null;
        if (x === 0 || x === w - 1 || y === 0 || y === h - 1) return R.o;
        if (y === 1) return R.h;
        if (y <= 3) return x === 1 ? R.h : R.l;
        if (y === 4) return R.h;
        if (y === h - 2) return R.d;
        if (x === 1) return R.l;
        if (x === w - 2) return R.d;
        // Grooves every 8 px with a lit left lip
        const gx = (x - 3) % 8;
        if (gx === 0 && y > 5 && y < h - 3) return R.d;
        if (gx === 1 && y > 5 && y < h - 3) return R.l;
        if (y === 6 && (x * 5) % 13 === 0) return R.h;
        return R.b;
      });
    });
  },

  drawBlock: function(ctx, x, sy, w, hue, glow) {
    const S = this.S || 2;
    const h = this.blockH - 2;
    const wa = Math.max(3, Math.round(w / S)), ha = Math.max(5, Math.round(h / S));
    if (glow) PIX.drawGlow(ctx, x + w / 2, sy + h / 2, Math.max(w, h) * 0.7, hslToHex(Math.round(hue) % 360, 80, 60), 0.4);
    PIX.draw(ctx, this.slabSprite(hue, wa, ha), x, sy, S, { ax: 0, ay: 0 });
  },

  draw: function(ctx) {
    const w = canvas.width, h = canvas.height;
    const S = this.S || 2;
    const topHue = (this.baseHue + this.tower.length * 7) % 360;
    // Background re-bakes in 15-degree hue steps so the cache stays small
    const hb = Math.round(topHue / 15) * 15;
    const sky = PIX.skyGradient('stack' + hb, w, h, [[0, hslToHex(hb, 34, 13)], [0.6, hslToHex((hb + 20) % 360, 36, 9)], [1, hslToHex((hb + 40) % 360, 38, 5)]], S);
    ctx.drawImage(sky, 0, 0, sky.width * S, sky.height * S);
    const stars = getEvenStarfield('stack-stars', 40, w, h, 77);
    const now = performance.now();
    for (const st of stars) {
      const y = (st.y + this.scroll * 0.2) % h;
      ctx.globalAlpha = 0.2 + 0.3 * (0.5 + 0.5 * Math.sin(now / 900 + st.phase));
      PIX.rect(ctx, Math.floor(st.x / S) * S, Math.floor(y / S) * S, S, S, '#FFFFFF');
    }
    ctx.globalAlpha = 1;

    // Ground plinth under the first slab
    const gy = this.baseY() + this.scroll;
    if (gy < h + 40) {
      PIX.rect(ctx, 0, gy, w, h - gy + 40, hslToHex(hb, 30, 8));
      PIX.rect(ctx, 0, gy, w, S, hslToHex(hb, 40, 30));
    }

    for (let i = 0; i < this.tower.length; i++) {
      const b = this.tower[i];
      const sy = this.levelTopY(i) + this.scroll;
      if (sy > h + 40 || sy < -40) continue;
      this.drawBlock(ctx, b.x, sy, b.w, b.hue, false);
    }

    for (let i = 0; i < this.debris.length; i++) {
      const d = this.debris[i];
      const sy = d.y + this.scroll;
      ctx.globalAlpha = 0.85;
      this.drawBlock(ctx, d.x, sy, d.w, d.hue, false);
      ctx.globalAlpha = 1;
    }

    if (this.moving) {
      const sy = this.levelTopY(this.tower.length) + this.scroll;
      this.drawBlock(ctx, this.moving.x, sy, this.moving.w, this.moving.hue, true);
    }

    for (let i = 0; i < this.sparks.length; i++) {
      const sp = this.sparks[i];
      const sy = sp.y + this.scroll;
      ctx.globalAlpha = Math.max(0, sp.life / 520);
      PIX.rect(ctx, Math.round(sp.x / S) * S, Math.round(sy / S) * S, S, S, hslToHex(Math.round(sp.hue) % 360, 80, 72));
    }
    ctx.globalAlpha = 1;

    drawHUDChips(ctx, [
      { label: "Score", value: this.score },
      { label: "Best", value: this.highScore, color: "#F06292" }
    ]);
    ctx.textAlign = "center";

    if (this.popup) {
      const pop = 1 + Math.max(0, (this.popup.life - 560) / 160) * 0.3;
      PIX.text(ctx, this.popup.text, w / 2, Math.max(150, SAFE.top + 130), Math.round(3 * pop), "#FFE082",
        { shadow: "#8a4b00", outline: "#2a1600", alpha: Math.max(0, Math.min(1, this.popup.life / 720)) });
    }

    if (this.gameState === "playing" && this.tower.length <= 1) {
      PIX.text(ctx, TouchControls.enabled ? "TAP TO DROP" : "SPACE TO DROP", w / 2, h * 0.5, 3, "#FFFFFF",
        { shadow: "#000000", alpha: 0.55 + 0.35 * Math.sin(now / 300) });
    }

    if (this.gameState === "over") {
      drawGameOverScreen(ctx, {
        title: "TOPPLED",
        score: this.score,
        scoreLabel: "Height",
        isNewBest: this.score === this.highScore && this.score > 0
      });
    }
  },

  keyDown: function(e) {
    if (e && e.repeat) return;
    if (this.gameState === "over") {
      if (e.key === " " || e.key === "Enter") this.init();
      return;
    }
    if (e.key === " " || e.key === "Enter" || e.key === "ArrowUp" || e.key === "ArrowDown") this.drop();
  },
  keyUp: function(e) {},
  end: function() {}
};

// 18. Crew (Among-us style task run)
const listnrGame = {
  tracks: [
    { key: 'midnight', title: 'Midnight Arcade', sub: 'Swung, smoky, A minor', bpm: 102, color: '#8C63FF' },
    { key: 'bandit', title: 'Bass Bandit', sub: 'Greasy funk, D minor', bpm: 97, color: '#FFAB40' },
    { key: 'chase', title: 'Neon Chase', sub: 'Full throttle, E minor', bpm: 128, color: '#18FFFF' },
    { key: 'velvet', title: 'Velvet Hours', sub: 'Late night keys, G minor', bpm: 84, color: '#F06292' }
  ],
  gameState: 'playing',
  score: 0,
  sel: 0,
  playing: -1,
  t: 0,
  _rects: [],

  init: function() {
    this.gameState = 'playing';
    this.sel = 0;
    this.playing = -1;
    this.t = 0;
    this._rects = [];
    this._down = (e) => {
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX - r.left) * (canvas.width / r.width);
      const y = (e.clientY - r.top) * (canvas.height / r.height);
      for (let i = 0; i < this._rects.length; i++) {
        const c = this._rects[i];
        if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
          this.sel = i;
          this.toggle(i);
          return;
        }
      }
    };
    canvas.addEventListener('pointerdown', this._down);
  },

  end: function() {
    audioManager.stopMusic();
    if (this._down) canvas.removeEventListener('pointerdown', this._down);
    this._down = null;
  },

  toggle: function(i) {
    if (this.playing === i) {
      audioManager.stopMusic();
      this.playing = -1;
    } else {
      audioManager.playMusic(this.tracks[i].key, true);
      this.playing = i;
    }
  },

  keyDown: function(e) {
    const k = e.key;
    if (k === 'ArrowUp') {
      this.sel = (this.sel + this.tracks.length - 1) % this.tracks.length;
      audioManager.playTone(660, 'sine', 0.04, 0.15);
    } else if (k === 'ArrowDown') {
      this.sel = (this.sel + 1) % this.tracks.length;
      audioManager.playTone(560, 'sine', 0.04, 0.15);
    } else if (k === ' ' || k === 'Enter') {
      this.toggle(this.sel);
    }
  },

  update: function(delta) {
    this.t += delta / 1000;
    const el = audioManager.activeAudioElement;
    if (this.playing >= 0 && (!el || el.paused) && this.t > 1 && !audioManager.muted) {
      if (audioManager.currentMusic !== this.tracks[this.playing].key) this.playing = -1;
    }
  },

  _bar: function(i, beat) {
    const seed = Math.sin(i * 127.1 + Math.floor(beat) * 311.7) * 43758.5453;
    return seed - Math.floor(seed);
  },

  draw: function(ctx) {
    const W = canvas.width, H = canvas.height;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#101018');
    g.addColorStop(1, '#0A0A10');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const cur = this.playing >= 0 ? this.tracks[this.playing] : null;
    const beat = cur ? this.t * cur.bpm / 60 : this.t * 0.8;
    const pulse = cur ? Math.exp(-(beat % 1) * 4) : 0;

    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.font = '900 34px Inter';
    ctx.fillStyle = '#69F0AE';
    ctx.fillText("Listn'r", 24, 52);
    ctx.font = '600 13px Inter';
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText(cur ? 'NOW PLAYING  ' + cur.title.toUpperCase() : '4 ORIGINALS, PICK YOUR POISON', 24, 74);

    const vizH = Math.min(150, H * 0.24);
    const listTop = 92;
    const listBottom = H - vizH - 24;
    const cardH = Math.min(72, (listBottom - listTop) / 4 - 8);
    const cardW = Math.min(W - 48, 560);
    const cx = (W - cardW) / 2;
    this._rects = [];

    for (let i = 0; i < this.tracks.length; i++) {
      const tr = this.tracks[i];
      const y = listTop + i * (cardH + 8);
      const isSel = i === this.sel;
      const isPlay = i === this.playing;
      this._rects.push({ x: cx, y: y, w: cardW, h: cardH });

      ctx.beginPath();
      ctx.roundRect(cx, y, cardW, cardH, 14);
      ctx.fillStyle = isPlay ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.05)';
      ctx.fill();
      ctx.lineWidth = isSel ? 2 : 1;
      ctx.strokeStyle = isSel ? tr.color : 'rgba(255,255,255,0.10)';
      ctx.stroke();

      ctx.fillStyle = tr.color;
      ctx.beginPath();
      ctx.roundRect(cx + 10, y + 12, 4, cardH - 24, 2);
      ctx.fill();

      ctx.font = '800 17px Inter';
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(tr.title, cx + 28, y + cardH / 2 - 3);
      ctx.font = '600 12px Inter';
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fillText(tr.sub + '  |  ' + tr.bpm + ' BPM', cx + 28, y + cardH / 2 + 16);

      const ix = cx + cardW - 38, iy = y + cardH / 2;
      if (isPlay) {
        for (let b = 0; b < 3; b++) {
          const hgt = 6 + (0.4 + 0.6 * this._bar(b + 9, beat)) * 14 * (0.35 + pulse);
          ctx.fillStyle = tr.color;
          ctx.fillRect(ix + b * 7 - 2, iy + 11 - hgt, 4, hgt);
        }
        const el = audioManager.activeAudioElement;
        if (el && el.duration > 0) {
          const p = el.currentTime / el.duration;
          ctx.fillStyle = 'rgba(255,255,255,0.12)';
          ctx.fillRect(cx + 14, y + cardH - 7, cardW - 28, 3);
          ctx.fillStyle = tr.color;
          ctx.fillRect(cx + 14, y + cardH - 7, (cardW - 28) * p, 3);
        }
      } else {
        ctx.fillStyle = isSel ? tr.color : 'rgba(255,255,255,0.35)';
        ctx.beginPath();
        ctx.moveTo(ix, iy - 9);
        ctx.lineTo(ix, iy + 9);
        ctx.lineTo(ix + 14, iy);
        ctx.closePath();
        ctx.fill();
      }
    }

    const bars = Math.max(24, Math.min(64, Math.floor(W / 16)));
    const bw = W / bars;
    const base = H - 20;
    for (let i = 0; i < bars; i++) {
      let h;
      if (cur) {
        const r = this._bar(i, beat);
        const swell = 0.25 + 0.75 * r;
        h = 6 + swell * (vizH - 20) * (0.3 + pulse * 0.9);
      } else {
        h = 8 + Math.sin(this.t * 1.4 + i * 0.55) * 5 + 6;
      }
      const col = cur ? cur.color : '#69F0AE';
      ctx.globalAlpha = cur ? 0.85 : 0.3;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.roundRect(i * bw + 2, base - h, bw - 4, h, 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
};

    const gp = GamepadManager.latest;

    const imp = this.imp;

    const distToPlayer = Math.hypot(pl.x - imp.x, pl.y - imp.y);
    const los = this.hasLOS(imp.x, imp.y, pl.x, pl.y);
    const dark = this.sabotage && this.sabotage.type.key === "lights";

        });

    }

    if (imp.mode === "patrol" && imp.emerge <= 0) {

          }

        if (target) {
          this.burst(imp.x, imp.y, 12, "#9AA8C0", 0.28, 420, "puff", 5);

          this.patrol.forEach((wpt, i) => {

    let tx, ty, ispd;

      const wpt = this.patrol[imp.wp];

    if (imp.emerge > 0) ispd = 0;

    if (imp.mode === "patrol" && imp.emerge <= 0 && imp.killCd <= 0 && imp.kills < this.bots.length - 1) {
      for (const b of this.bots) {

          b.alive = false;

          imp.killCd = 14000;
          this.bodies.push({ x: b.x, y: b.y, color: b.color, reported: false });

          audioManager.playTone(120, 'sawtooth', 0.18, 0.18, -60);
          break;
        }
      }
    }

    if (distToPlayer < imp.r + pl.r + 4 && imp.emerge <= 0) {
      this.gameState = "over";
      this.sabotage = null;
      imp.lunge = 360;
      this.overFlash = 650;
      this.shake = 20;
      if (this.score > this.highScore) this.highScore = this.score;
      GamepadManager.rumble(240, 0.85, 0.55);
      audioManager.playSFX('explosion');
      audioManager.playSFX('gameover');
      this.burst(pl.x, pl.y, 26, "#44E0DC", 0.45, 760, "spark", 4);
      this.burst(pl.x, pl.y, 12, "#FF1744", 0.4, 620, "spark", 4);
      return;
    }

    for (const bd of this.bodies) {
      if (!bd.reported && Math.hypot(pl.x - bd.x, pl.y - bd.y) < 34) {
        bd.reported = true;
        this.reported++;
        this.score += 50;
        imp.alert = Math.max(imp.alert, 700);
        this.flash("BODY REPORTED  +50", "#FF8A65");
        this.shake = Math.min(8, this.shake + 4);
        audioManager.playTone(440, 'square', 0.12, 0.18);
        setTimeout(() => audioManager.playTone(330, 'square', 0.16, 0.18), 110);
      }
    }

    for (const b of this.bots) {
      if (!b.alive) continue;
      if (b.pause > 0) { b.pause -= delta; continue; }
      const wpt = this.patrol[b.wp];
      const d = Math.hypot(wpt.x - b.x, wpt.y - b.y);
      if (d < 14) {
        b.wp = (b.wp + 1) % this.patrol.length;
        if (Math.random() < 0.3) b.pause = 800 + Math.random() * 1500;
        continue;
      }
      const a = Math.atan2(wpt.y - b.y, wpt.x - b.x);
      this.moveActor(b, Math.cos(a) * b.speed * delta, Math.sin(a) * b.speed * delta);
      if (Math.abs(Math.cos(a)) > 0.05) b.facing = Math.cos(a) > 0 ? 1 : -1;
      b.phase += delta * 0.014;
    }

    const cw = canvas.width, ch = canvas.height;
    const tX = cw >= this.world.w ? (this.world.w - cw) / 2 : Math.max(0, Math.min(this.world.w - cw, pl.x - cw / 2));
    const tY = ch >= this.world.h ? (this.world.h - ch) / 2 : Math.max(0, Math.min(this.world.h - ch, pl.y - ch / 2));
    this.camX += (tX - this.camX) * Math.min(1, delta * 0.008);
    this.camY += (tY - this.camY) * Math.min(1, delta * 0.008);
  },

  shade: function(hex, amt) {
    const num = parseInt(hex.slice(1), 16);
    const r = Math.max(0, Math.min(255, (num >> 16) + amt));
    const g = Math.max(0, Math.min(255, ((num >> 8) & 255) + amt));
    const b = Math.max(0, Math.min(255, (num & 255) + amt));
    return "#" + (r << 16 | g << 8 | b).toString(16).padStart(6, "0");
  },

  drawRoomProps: function(ctx) {
    const t = performance.now();
    const flick = (this.sabotage && this.sabotage.type.key === "lights") ? (Math.sin(t / 70) > 0.3 ? 1 : 0.25) : 1;
    for (const f of this.floors) {
      if (!f.name) continue;
      const cx = f.x + f.w / 2, cy = f.y + f.h / 2;
      if (f.name === "CAFETERIA") {
        for (const off of [[-110, 30], [110, 30]]) {
          const tx = cx + off[0], ty = cy + off[1];
          ctx.fillStyle = "#2E3A52";
          for (let i = 0; i < 4; i++) {
            const a = i * Math.PI / 2 + Math.PI / 4;
            ctx.beginPath();
            ctx.arc(tx + Math.cos(a) * 46, ty + Math.sin(a) * 46, 8, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.beginPath(); ctx.arc(tx, ty, 34, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#4A5B7A";
          ctx.beginPath(); ctx.arc(tx, ty, 27, 0, Math.PI * 2); ctx.fill();
        }
      } else if (f.name === "REACTOR") {
        const pulse = 0.5 + 0.5 * Math.sin(t / 400);
        ctx.strokeStyle = "rgba(124, 252, 142, " + (0.25 + pulse * 0.3 * flick).toFixed(3) + ")";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(cx, cy + 20, 30, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = "rgba(124, 252, 142, " + (0.18 + pulse * 0.25 * flick).toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(cx, cy + 20, 16 + pulse * 4, 0, Math.PI * 2); ctx.fill();
      } else if (f.name === "ELECTRICAL") {
        for (const ox of [-72, 12]) {
          ctx.fillStyle = "#2A3349";
          ctx.beginPath(); ctx.roundRect(cx + ox, f.y + 34, 54, 34, 4); ctx.fill();
          for (let i = 0; i < 3; i++) {
            const on = Math.floor(t / 450 + i + ox) % 3 === 0;
            ctx.fillStyle = on ? "rgba(255,215,64," + flick.toFixed(2) + ")" : "rgba(255,255,255,0.15)";
            ctx.fillRect(cx + ox + 9 + i * 14, f.y + 42, 7, 7);
          }
        }
      } else if (f.name === "STORAGE") {
        for (const c of [[-90, 30, 34], [-44, 38, 26], [60, 26, 40]]) {
          ctx.fillStyle = "#54493A";
          ctx.beginPath(); ctx.roundRect(cx + c[0], cy + c[1] - c[2], c[2], c[2], 4); ctx.fill();
          ctx.strokeStyle = "rgba(255, 209, 84, 0.35)";
          ctx.lineWidth = 2;
          ctx.strokeRect(cx + c[0] + 4, cy + c[1] - c[2] + 4, c[2] - 8, c[2] - 8);
        }
      } else if (f.name === "NAVIGATION") {
        ctx.fillStyle = "#2A3349";
        ctx.beginPath(); ctx.roundRect(cx - 40, f.y + 30, 80, 26, 6); ctx.fill();
        ctx.strokeStyle = "rgba(64, 196, 255, 0.35)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(cx - 36, f.y + 34, 72, 18);
        const scan = (t / 14) % 64;
        ctx.fillStyle = "rgba(64, 196, 255, " + (0.5 * flick).toFixed(2) + ")";
        ctx.fillRect(cx - 34 + scan, f.y + 36, 5, 14);
      } else if (f.name === "SHIELDS") {
        const pulse = 0.5 + 0.5 * Math.sin(t / 500);
        ctx.strokeStyle = "rgba(64, 156, 255, " + (0.3 + pulse * 0.3 * flick).toFixed(3) + ")";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (let i = 0; i <= 6; i++) {
          const a = i * Math.PI / 3 - Math.PI / 2;
          const px = cx + Math.cos(a) * 30, py = cy + 24 + Math.sin(a) * 30;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
    }
  },

  drawVent: function(ctx, v, near) {
    ctx.save();
    ctx.translate(v.x, v.y);
    ctx.fillStyle = "#161B28";
    ctx.beginPath(); ctx.roundRect(-13, -10, 26, 20, 4); ctx.fill();
    ctx.strokeStyle = near ? "rgba(150,180,210,0.7)" : "rgba(120,140,170,0.3)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.strokeStyle = "rgba(150,170,200,0.4)";
    ctx.lineWidth = 2;
    for (let i = -6; i <= 6; i += 4) {
      ctx.beginPath(); ctx.moveTo(-9, i); ctx.lineTo(9, i); ctx.stroke();
    }
    ctx.restore();
  },

  drawBody: function(ctx, b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.fillStyle = "rgba(120,20,24,0.4)";
    ctx.beginPath(); ctx.ellipse(2, 6, 20, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(Math.PI / 2);
    ctx.fillStyle = this.shade(b.color, -30);
    ctx.beginPath(); ctx.roundRect(-2, -10, 7, 14, 3); ctx.fill();
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.roundRect(-11, -10, 20, 22, 9); ctx.fill();
    ctx.fillStyle = "#3A4252";
    ctx.beginPath(); ctx.roundRect(2, -6, 9, 7, 3); ctx.fill();
    ctx.restore();
    if (!b.reported) {
      const pulse = 0.4 + 0.4 * Math.sin(performance.now() / 260);
      ctx.fillStyle = "rgba(255,82,82," + pulse.toFixed(3) + ")";
      ctx.font = "900 20px Inter";
      ctx.textAlign = "center";
      ctx.fillText("!", b.x, b.y - 22);
    }
  },

  drawCrewmate: function(ctx, x, y, color, facing, phase, moving, glow, darkVisor, scale, emerge) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "rgba(0,0,0,0.32)";
    ctx.beginPath();
    ctx.ellipse(0, 17, 13, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    const bob = moving ? Math.sin(phase * 6) * 1.4 : Math.sin(performance.now() / 600) * 0.6;
    ctx.translate(0, bob);
    let sc = scale || 1;
    if (emerge && emerge > 0) { const k = 1 - emerge / 520; ctx.globalAlpha = k; sc *= 0.5 + k * 0.5; }
    if (sc !== 1) ctx.scale(sc, sc);
    ctx.scale(facing, 1);
    if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 16; }
    const legSwing = moving ? Math.sin(phase * 6) * 4 : 0;
    ctx.fillStyle = this.shade(color, -55);
    ctx.beginPath();
    ctx.roundRect(-8, 6, 7, 9 + legSwing, 3);
    ctx.fill();
    ctx.beginPath();
    ctx.roundRect(1, 6, 7, 9 - legSwing, 3);
    ctx.fill();
    ctx.fillStyle = this.shade(color, -30);
    ctx.beginPath();
    ctx.roundRect(-15, -10, 7, 14, 3);
    ctx.fill();
    const body = ctx.createLinearGradient(-10, -18, 9, 8);
    body.addColorStop(0, this.shade(color, 28));
    body.addColorStop(0.55, color);
    body.addColorStop(1, this.shade(color, -34));
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.roundRect(-10, -18, 19, 26, 9);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,0.28)";
    ctx.beginPath();
    ctx.roundRect(-8, -17, 14, 6, 5);
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.3)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(-10, -18, 19, 26, 9);
    ctx.stroke();
    const visor = ctx.createLinearGradient(0, -14, 11, -6);
    if (darkVisor) { visor.addColorStop(0, "#5A161A"); visor.addColorStop(1, "#2A0A0C"); }
    else { visor.addColorStop(0, "#CDEBF6"); visor.addColorStop(1, "#7FB6CC"); }
    ctx.fillStyle = visor;
    ctx.beginPath();
    ctx.roundRect(0, -14, 11, 8, 4);
    ctx.fill();
    ctx.fillStyle = darkVisor ? "rgba(255,90,80,0.6)" : "rgba(255,255,255,0.85)";
    ctx.beginPath();
    ctx.roundRect(3, -13, 6, 3, 1.5);
    ctx.fill();
    ctx.restore();
  },

  // World renders into a low-res buffer blown up with hard pixels (a
  // cohesive pixel-art station); vision, overlays and HUD stay sharp on top
  draw: function(ctx) {
    const w = canvas.width, h = canvas.height;
    const S = PIX.scaleFor();
    const bw = Math.ceil(w / S), bh = Math.ceil(h / S);
    if (!this._lo || this._lo.width !== bw || this._lo.height !== bh) {
      this._lo = document.createElement('canvas');
      this._lo.width = bw; this._lo.height = bh;
      this._loCtx = this._lo.getContext('2d', { alpha: false });
    }
    const sx = (Math.random() - 0.5) * this.shake;
    const sy = (Math.random() - 0.5) * this.shake;
    const g = this._loCtx;
    g.setTransform(1 / S, 0, 0, 1 / S, 0, 0);
    g.imageSmoothingEnabled = true;
    this.drawWorld(g, w, h, sx, sy);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this._lo, 0, 0, bw * S, bh * S);
    this.drawOverlay(ctx, w, h, sx, sy);
  },

  drawWorld: function(ctx, w, h, sx, sy) {
    const tnow = performance.now();

    ctx.fillStyle = "#04050A";
    ctx.fillRect(0, 0, w, h);
    const neb = ctx.createRadialGradient(w * 0.72, h * 0.2, 30, w * 0.72, h * 0.2, h * 0.95);
    neb.addColorStop(0, "rgba(64,196,255,0.07)");
    neb.addColorStop(1, "rgba(64,196,255,0)");
    ctx.fillStyle = neb;
    ctx.fillRect(0, 0, w, h);
    const neb2 = ctx.createRadialGradient(w * 0.2, h * 0.85, 20, w * 0.2, h * 0.85, h * 0.8);
    neb2.addColorStop(0, "rgba(124,90,220,0.06)");
    neb2.addColorStop(1, "rgba(124,90,220,0)");
    ctx.fillStyle = neb2;
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.translate(-this.camX + sx, -this.camY + sy);

    const stars = getEvenStarfield('crew-stars', 90, this.world.w, this.world.h, 51);
    for (let i = 0; i < stars.length; i++) {
      const st = stars[i];
      const tw = 0.3 + 0.5 * (0.5 + 0.5 * Math.sin(tnow / 700 + st.phase));
      ctx.fillStyle = "rgba(255,255,255," + tw.toFixed(3) + ")";
      ctx.fillRect(st.x, st.y, st.size, st.size);
    }

    for (const f of this.floors) {
      ctx.fillStyle = "#0C111C";
      ctx.beginPath();
      ctx.roundRect(f.x - 12, f.y - 12, f.w + 24, f.h + 24, 13);
      ctx.fill();
      ctx.fillStyle = "#141B2A";
      ctx.beginPath();
      ctx.roundRect(f.x - 6, f.y - 6, f.w + 12, f.h + 12, 9);
      ctx.fill();
    }
    for (const f of this.floors) {
      const fg = ctx.createLinearGradient(f.x, f.y, f.x, f.y + f.h);
      fg.addColorStop(0, "#1B2740");
      fg.addColorStop(1, "#0F1726");
      ctx.fillStyle = fg;
      ctx.fillRect(f.x, f.y, f.w, f.h);
      const accent = f.name && this.roomAccent[f.name];
      if (accent) {
        const glow = ctx.createRadialGradient(f.x + f.w / 2, f.y + f.h / 2, 8, f.x + f.w / 2, f.y + f.h / 2, Math.max(f.w, f.h) * 0.66);
        glow.addColorStop(0, this.hexA(accent, 0.13));
        glow.addColorStop(1, this.hexA(accent, 0));
        ctx.fillStyle = glow;
        ctx.fillRect(f.x, f.y, f.w, f.h);
      }
      ctx.fillStyle = "rgba(255,255,255,0.05)";
      ctx.fillRect(f.x, f.y, f.w, 4);
    }
    for (const f of this.floors) {
      const accent = (f.name && this.roomAccent[f.name]) || "#2C6A8C";
      ctx.strokeStyle = this.hexA(accent, 0.1);
      ctx.lineWidth = 1;
      for (let gx = f.x + 40 - (f.x % 40); gx < f.x + f.w; gx += 40) {
        ctx.beginPath(); ctx.moveTo(gx, f.y); ctx.lineTo(gx, f.y + f.h); ctx.stroke();
      }
      for (let gy = f.y + 40 - (f.y % 40); gy < f.y + f.h; gy += 40) {
        ctx.beginPath(); ctx.moveTo(f.x, gy); ctx.lineTo(f.x + f.w, gy); ctx.stroke();
      }
    }
    ctx.save();
    for (const f of this.floors) {
      const named = f.name && this.roomAccent[f.name];
      const accent = named || "#3C7FA6";
      ctx.shadowBlur = named ? 13 : 6;
      ctx.shadowColor = accent;
      ctx.strokeStyle = this.hexA(accent, named ? 0.9 : 0.5);
      ctx.lineWidth = named ? 2.2 : 1.4;
      ctx.strokeRect(f.x + 0.5, f.y + 0.5, f.w - 1, f.h - 1);
    }
    ctx.restore();
    for (const f of this.floors) {
      ctx.fillStyle = "rgba(255,255,255,0.16)";
      for (const cnr of [[f.x + 6, f.y + 6], [f.x + f.w - 6, f.y + 6], [f.x + 6, f.y + f.h - 6], [f.x + f.w - 6, f.y + f.h - 6]]) {
        ctx.beginPath(); ctx.arc(cnr[0], cnr[1], 1.8, 0, Math.PI * 2); ctx.fill();
      }
    }
    this.drawRoomProps(ctx);
    ctx.textAlign = "center";

    for (const v of this.vents) {
      const near = Math.hypot(this.imp.x - v.x, this.imp.y - v.y) < 40;
      this.drawVent(ctx, v, near);
    }

    if (this.sabotage) {
      const st = this.sabotage.type;
      const onPanel = Math.hypot(this.player.x - st.fx, this.player.y - st.fy) < 52;
      const pl2 = 0.4 + 0.6 * Math.abs(Math.sin(tnow / 200));
      ctx.fillStyle = "#161C2A";
      ctx.beginPath(); ctx.roundRect(st.fx - 19, st.fy - 17, 38, 32, 6); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255," + (0.2 + pl2 * 0.5).toFixed(3) + ")";
      ctx.lineWidth = 2; ctx.stroke();
      ctx.save();
      ctx.shadowBlur = 12; ctx.shadowColor = st.color;
      ctx.fillStyle = this.hexA(st.color, 0.5 + pl2 * 0.5);
      ctx.beginPath(); ctx.roundRect(st.fx - 12, st.fy - 9, 24, 7, 2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = "rgba(255,255,255,0.22)";
      ctx.fillRect(st.fx - 12, st.fy + 2, 24, 6);
      if (onPanel && this.fixProgress > 0) {
        ctx.strokeStyle = st.color;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(st.fx, st.fy - 34, 13, -Math.PI / 2, -Math.PI / 2 + (this.fixProgress / 1100) * Math.PI * 2);
        ctx.stroke();
      }
    }

    for (const t of this.tasks) {
      const isActive = this.activeTask === t;
      const accent = this.roomAccent[t.room] || "#FFD740";
      if (!t.done) {
        const pulse = 0.5 + 0.5 * Math.sin(tnow / 300);
        const beam = ctx.createLinearGradient(0, t.y - 74, 0, t.y);
        beam.addColorStop(0, this.hexA(accent, 0));
        beam.addColorStop(1, this.hexA(accent, 0.1 + pulse * 0.12));
        ctx.fillStyle = beam;
        ctx.beginPath();
        ctx.moveTo(t.x - 4, t.y);
        ctx.lineTo(t.x + 4, t.y);
        ctx.lineTo(t.x + 12, t.y - 74);
        ctx.lineTo(t.x - 12, t.y - 74);
        ctx.closePath();
        ctx.fill();
        ctx.save();
        ctx.shadowBlur = 9; ctx.shadowColor = accent;
        ctx.fillStyle = this.hexA(accent, 0.65 + pulse * 0.35);
        ctx.beginPath(); ctx.arc(t.x, t.y - 74, 2 + pulse * 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = "#1B2233";
      ctx.fillRect(t.x - 3, t.y + 6, 6, 9);
      ctx.fillStyle = "#222A3C";
      ctx.beginPath();
      ctx.roundRect(t.x - 15, t.y - 13, 30, 22, 5);
      ctx.fill();
      ctx.strokeStyle = isActive ? this.hexA(accent, 0.9) : "rgba(255,255,255,0.1)";
      ctx.lineWidth = isActive ? 2 : 1;
      ctx.stroke();
      if (t.done) {
        ctx.fillStyle = "#163A24";
        ctx.fillRect(t.x - 10, t.y - 8, 20, 12);
        ctx.strokeStyle = "#37D67A";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(t.x - 4, t.y - 2);
        ctx.lineTo(t.x - 1, t.y + 1);
        ctx.lineTo(t.x + 5, t.y - 5);
        ctx.stroke();
      } else {
        const pulse = 0.5 + 0.5 * Math.sin(tnow / 300);
        ctx.fillStyle = this.hexA(accent, 0.35 + pulse * 0.5);
        ctx.fillRect(t.x - 10, t.y - 8, 20, 12);
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        ctx.fillRect(t.x - 10, t.y - 8 + ((tnow / 120) % 12), 20, 1.5);
        // Label is drawn sharp in the overlay pass
      }
    }

    for (const bd of this.bodies) this.drawBody(ctx, bd);

    for (const p of this.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      if (p.type === "puff") {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
      }
    }
    ctx.globalAlpha = 1;

    for (const b of this.bots) if (b.alive) this.drawCrewmate(ctx, b.x, b.y, b.color, b.facing, b.phase, b.pause <= 0, this.hexA(b.color, 0.55));
    if (this.gameState !== "over") this.drawCrewmate(ctx, this.player.x, this.player.y, "#44E0DC", this.player.facing, this.player.phase, this.player.moving, "rgba(68,224,220,0.7)");
    const impGlow = this.imp.mode === "chase" ? "rgba(255,23,68,0.9)" : "rgba(255,23,68,0.45)";
    const lungeScale = this.imp.lunge > 0 ? 1 + (1 - this.imp.lunge / 360) * 0.55 : 1;
    this.drawCrewmate(ctx, this.imp.x, this.imp.y, "#E03A30", this.imp.facing, this.imp.phase, true, this.imp.lunge > 0 ? "rgba(255,23,68,1)" : impGlow, true, lungeScale, this.imp.emerge);
    if (this.imp.alert > 0 && this.imp.emerge <= 0) {
      ctx.fillStyle = "rgba(255, 82, 82, " + Math.min(1, this.imp.alert / 400).toFixed(3) + ")";
      ctx.font = "900 24px Inter";
      ctx.textAlign = "center";
      ctx.fillText("!", this.imp.x, this.imp.y - 32);
    }

    if (this.activeTask && this.taskHold > 0) {
      const ac = this.roomAccent[this.activeTask.room] || "#7CFC8E";
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(this.player.x, this.player.y - 36, 13, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = ac;
      ctx.beginPath();
      ctx.arc(this.player.x, this.player.y - 36, 13, -Math.PI / 2, -Math.PI / 2 + (this.taskHold / 1800) * Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  },

  drawOverlay: function(ctx, w, h, sx, sy) {
    const tnow = performance.now();
    // World text, sharp: room names and open task labels in the pixel font
    const toX = (x) => x - this.camX + sx, toY = (y) => y - this.camY + sy;
    for (const f of this.floors) {
      if (!f.name) continue;
      const x = toX(f.x + f.w / 2), y = toY(f.y + 20);
      if (x < -120 || x > w + 120 || y < -20 || y > h + 20) continue;
      PIX.text(ctx, f.name, x, y, 2, this.roomAccent[f.name] || "#FFFFFF", { shadow: "#05070d", alpha: 0.85 * this.lightsLevel + 0.15 });
    }
    for (const t of this.tasks) {
      if (t.done) continue;
      const x = toX(t.x), y = toY(t.y + 26);
      if (x < -120 || x > w + 120 || y < -20 || y > h + 20) continue;
      ctx.font = "600 11px Inter";
      ctx.textAlign = "center";
      ctx.fillStyle = this.hexA(this.roomAccent[t.room] || "#FFD740", 0.9);
      ctx.fillText(t.label, x, y);
    }

    if (this.gameState === "playing") {
      const px = this.player.x - this.camX + sx, py = this.player.y - this.camY + sy;
      const innerR = 70 + this.lightsLevel * 80;
      const outerR = 152 + this.lightsLevel * 240;
      const vis = ctx.createRadialGradient(px, py, innerR, px, py, outerR);
      vis.addColorStop(0, "rgba(5,7,12,0)");
      vis.addColorStop(1, "rgba(5,7,12,0.82)");
      ctx.fillStyle = vis;
      ctx.fillRect(0, 0, w, h);
      if (this.lightsLevel < 0.97) {
        ctx.fillStyle = "rgba(3,5,11," + ((1 - this.lightsLevel) * 0.5).toFixed(3) + ")";
        ctx.fillRect(0, 0, w, h);
      }

      const impDist = Math.hypot(this.player.x - this.imp.x, this.player.y - this.imp.y);
      if (impDist < 320) {
        const danger = 1 - impDist / 320;
        const chasing = this.imp.mode === "chase";
        const col = chasing ? "224, 58, 48" : "255, 168, 64";
        const beat = 0.5 + 0.5 * Math.sin(tnow / (chasing ? 110 : 240));
        const dg = ctx.createRadialGradient(w / 2, h / 2, h * 0.32, w / 2, h / 2, h * 0.74);
        dg.addColorStop(0, "rgba(" + col + ", 0)");
        dg.addColorStop(1, "rgba(" + col + ", " + (0.05 + danger * (chasing ? 0.22 : 0.13) * beat).toFixed(3) + ")");
        ctx.fillStyle = dg;
        ctx.fillRect(0, 0, w, h);
      }
    }

    if (this.sabotage) {
      const st = this.sabotage.type;
      const ap = 0.22 + 0.32 * Math.abs(Math.sin(tnow / 240));
      ctx.fillStyle = this.hexA(st.color, ap);
      ctx.fillRect(0, 0, w, 4);
      ctx.fillRect(0, h - 4, w, 4);
      ctx.font = "800 15px Inter";
      const label = st.msg;
      const bw = ctx.measureText(label).width + 56;
      const bx = w / 2 - bw / 2, by = 68;
      ctx.fillStyle = "rgba(12,15,22,0.85)";
      ctx.beginPath(); ctx.roundRect(bx, by, bw, 34, 17); ctx.fill();
      ctx.strokeStyle = this.hexA(st.color, 0.5 + ap);
      ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = st.color;
      ctx.shadowBlur = 9; ctx.shadowColor = st.color;
      ctx.beginPath(); ctx.arc(bx + 23, by + 17, 5, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#fff";
      ctx.textAlign = "left";
      ctx.fillText(label, bx + 40, by + 22);
      if (st.fatal) {
        const left = Math.max(0, 1 - this.sabotage.t / this.sabotage.dur);
        ctx.fillStyle = "rgba(255,255,255,0.16)";
        ctx.beginPath(); ctx.roundRect(bx + 14, by + 27, bw - 28, 3, 2); ctx.fill();
        ctx.fillStyle = st.color;
        ctx.beginPath(); ctx.roundRect(bx + 14, by + 27, (bw - 28) * left, 3, 2); ctx.fill();
      }
    }

    if (this.overFlash > 0) {
      const melt = this.sabotage && this.sabotage.meltdown;
      ctx.fillStyle = (melt ? "rgba(255,138,28," : "rgba(224,30,30,") + (this.overFlash / 700 * 0.55).toFixed(3) + ")";
      ctx.fillRect(0, 0, w, h);
    }

    const chip = drawHUDChips(ctx, [
      { label: "Score", value: this.score },
      { label: "Best", value: this.highScore, color: "#44E0DC" }
    ]);
    this.drawTaskPanel(ctx, chip);

    this.drawMinimap(ctx, w, h);

    for (const fl of this.flashes) {
      const R = PIX.ramp(fl.color);
      const fs = fl.big ? (w < 500 ? 3 : 4) : (w < 500 ? 2 : 3);
      PIX.text(ctx, fl.text, w / 2, h * 0.32 + fl.y, fs, fl.color, { shadow: R.d, outline: R.o, alpha: Math.max(0, Math.min(1, fl.life / 600)) });
    }
    ctx.globalAlpha = 1;

    if (this.activeTask && this.gameState === "playing") {
      const txt = (TouchControls.enabled ? "Hold A: " : "Hold SPACE: ") + this.activeTask.label;
      const ac = this.roomAccent[this.activeTask.room] || "#7CFC8E";
      ctx.font = "600 15px Inter";
      const pw = ctx.measureText(txt).width + 46;
      // Sits above the minimap when the screen is too narrow for both
      const lift = Math.max(hudBottomInset(), SAFE.bottom);
      const mmW = Math.min(158, Math.floor(w * 0.4));
      const narrow = w / 2 + pw / 2 > w - mmW - 26;
      const pxp = w / 2 - pw / 2, pyp = narrow ? h - lift - Math.round(mmW * 0.5625) - 72 : h - 56 - lift;
      ctx.fillStyle = "rgba(12,15,22,0.82)";
      ctx.beginPath(); ctx.roundRect(pxp, pyp, pw, 32, 16); ctx.fill();
      ctx.strokeStyle = this.hexA(ac, 0.55);
      ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = ac;
      ctx.shadowBlur = 8; ctx.shadowColor = ac;
      ctx.beginPath(); ctx.arc(pxp + 19, pyp + 16, 4, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#fff";
      ctx.textAlign = "left";
      ctx.fillText(txt, pxp + 31, pyp + 21);
    }

    if (this.introT > 0 && this.gameState === "playing") {
      ctx.globalAlpha = Math.min(1, this.introT / 600);
      ctx.textAlign = "center";
      ctx.fillStyle = "#44E0DC";
      ctx.font = "800 13px Inter";
      ctx.fillText("FINISH ALL TASKS, AVOID THE IMPOSTOR", w / 2, h * 0.5);
      ctx.globalAlpha = 1;
    }

    if (this.gameState === "over") {
      const melt = this.sabotage && this.sabotage.meltdown;
      drawGameOverScreen(ctx, {
        title: melt ? "MELTDOWN" : "CAUGHT",
        titleColor: melt ? "#FF8A1C" : "#E03A30",
        score: this.score,
        isNewBest: this.score === this.highScore && this.score > 0,
        lines: [melt ? "The reactor blew" : (this.tasks.filter(t => t.done).length + " of " + this.tasks.length + " tasks done")]
      });
    } else if (this.gameState === "win") {
      drawGameOverScreen(ctx, {
        title: "VICTORY",
        titleColor: "#37D67A",
        score: this.score,
        isNewBest: this.score === this.highScore && this.score > 0,
        lines: ["All tasks complete"]
      });
    }
  },

  drawTaskPanel: function(ctx, chip) {
    const tasksDone = this.tasks.filter(t => t.done).length;
    const x = hudLeft(), pw = Math.min(234, canvas.width - x - 14), ph = 50;
    const y = chip && x + pw + 8 > chip.x ? chip.y + chip.h + 8 : 14;
    ctx.fillStyle = "rgba(10,12,18,0.66)";
    ctx.beginPath(); ctx.roundRect(x, y, pw, ph, 12); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.14)";
    ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.font = "700 10px Inter";
    ctx.textAlign = "left";
    ctx.fillText("TASKS", x + 14, y + 16);
    ctx.fillStyle = "#fff";
    ctx.font = "800 13px Inter";
    ctx.textAlign = "right";
    ctx.fillText(tasksDone + " / " + this.tasks.length, x + pw - 14, y + 17);
    const bx = x + 14, by = y + 28, bw = pw - 28, bh = 9;
    ctx.fillStyle = "rgba(255,255,255,0.13)";
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 5); ctx.fill();
    if (tasksDone > 0) {
      const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      g.addColorStop(0, "#37D67A");
      g.addColorStop(1, "#7CFC8E");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.roundRect(bx, by, bw * tasksDone / this.tasks.length, bh, 5); ctx.fill();
    }
    const segW = bw / this.tasks.length;
    for (let i = 1; i < this.tasks.length; i++) {
      ctx.fillStyle = "rgba(12,15,22,0.7)";
      ctx.fillRect(bx + segW * i - 0.5, by, 1.4, bh);
    }
  },

  drawMinimap: function(ctx, w, h) {
    const mw = Math.min(158, Math.floor(w * 0.4)), mh = Math.round(mw * 0.5625), pad = 14;
    const mx = w - mw - pad, my = h - mh - pad - Math.max(hudBottomInset(), SAFE.bottom);
    const sc = mw / this.world.w;
    ctx.save();
    ctx.fillStyle = "rgba(10,12,18,0.66)";
    ctx.beginPath(); ctx.roundRect(mx - 6, my - 6, mw + 12, mh + 12, 10); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.14)";
    ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.font = "700 8px Inter"; ctx.textAlign = "left";
    ctx.fillText("MAP", mx, my - 9);
    ctx.beginPath(); ctx.roundRect(mx, my, mw, mh, 5); ctx.clip();
    ctx.fillStyle = "rgba(30,38,54,0.55)";
    ctx.fillRect(mx, my, mw, mh);
    if (this.sabotage && this.sabotage.type.key === "comms") {
      ctx.fillStyle = "rgba(24,32,46,0.95)";
      ctx.fillRect(mx, my, mw, mh);
      for (let i = 0; i < 64; i++) {
        ctx.fillStyle = "rgba(120,180,220," + (0.08 + Math.random() * 0.3).toFixed(2) + ")";
        ctx.fillRect(mx + Math.random() * mw, my + Math.random() * mh, 2, 1.5);
      }
      ctx.fillStyle = "#40C4FF";
      ctx.font = "700 9px Inter"; ctx.textAlign = "center";
      ctx.fillText("SIGNAL LOST", mx + mw / 2, my + mh / 2 + 3);
      ctx.restore();
      return;
    }
    for (const f of this.floors) {
      const accent = f.name && this.roomAccent[f.name];
      ctx.fillStyle = accent ? this.hexA(accent, 0.3) : "rgba(96,114,150,0.5)";
      ctx.fillRect(mx + f.x * sc, my + f.y * sc, f.w * sc, f.h * sc);
    }
    for (const bd of this.bodies) {
      if (bd.reported) continue;
      ctx.strokeStyle = "rgba(255,82,82,0.85)"; ctx.lineWidth = 1.2;
      const bxp = mx + bd.x * sc, byp = my + bd.y * sc;
      ctx.beginPath(); ctx.moveTo(bxp - 2, byp - 2); ctx.lineTo(bxp + 2, byp + 2);
      ctx.moveTo(bxp + 2, byp - 2); ctx.lineTo(bxp - 2, byp + 2); ctx.stroke();
    }
    for (const t of this.tasks) {
      if (t.done) ctx.fillStyle = "#37D67A";
      else ctx.fillStyle = 0.5 + 0.5 * Math.sin(performance.now() / 300) > 0.5 ? (this.roomAccent[t.room] || "#FFD740") : "rgba(255,255,255,0.3)";
      ctx.beginPath(); ctx.arc(mx + t.x * sc, my + t.y * sc, 2.3, 0, Math.PI * 2); ctx.fill();
    }
    const showImp = this.imp.alert > 0 || (this.sabotage && this.sabotage.type.key === "lights") || Math.hypot(this.player.x - this.imp.x, this.player.y - this.imp.y) < 340;
    if (showImp && this.gameState !== "win") {
      ctx.fillStyle = "#FF1744";
      ctx.shadowBlur = 6; ctx.shadowColor = "#FF1744";
      ctx.beginPath(); ctx.arc(mx + this.imp.x * sc, my + this.imp.y * sc, 3, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
    if (this.gameState !== "over") {
      const pp = 0.5 + 0.4 * Math.sin(performance.now() / 250);
      ctx.fillStyle = "#44E0DC";
      ctx.shadowBlur = 6; ctx.shadowColor = "#44E0DC";
      ctx.beginPath(); ctx.arc(mx + this.player.x * sc, my + this.player.y * sc, 2.4 + pp, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  },

  keyDown: function(e) {
    if ((this.gameState === "over" || this.gameState === "win") && (e.key === " " || e.key === "Enter")) {
      this.init();
    }
  },
  keyUp: function(e) {},
  end: function() {}
};

  </script>

</body></html>
