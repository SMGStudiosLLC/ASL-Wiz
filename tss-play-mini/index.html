          const g0 = Math.floor(H * 0.38), g1 = Math.ceil(H * 0.62);
          return PIX.paint(W, H, (x, y) => {
            const end = y === 0 || y === H - 1;
            if (end && (x === 0 || x === W - 1)) return null;
            if (x === 0 || x === W - 1 || end) return R.o;
            if (y <= 2 || y >= H - 3) return x === 1 ? R.h : x === 3 ? R.l : R.h;
            // Grip band in the middle
            if (y >= g0 && y <= g1) return (y % 2) ? (x === 2 ? R.d : R.b) : (x === 1 ? R.l : R.b);
            if (x === 1) return R.l;
            if (x === 3) return R.d;
            return (y === 3 || y === H - 4) ? R.l : R.b;
          });
        });
      },
      draw: function(ctx) {
        const W = canvas.width, H = canvas.height;
        const sx = this.shake > 0 ? (Math.random() - 0.5) * this.shake * 0.03 : 0;
        const sy = this.shake > 0 ? (Math.random() - 0.5) * this.shake * 0.03 : 0;
        ctx.save();
        ctx.translate(sx, sy);

        // Court: night-blue floor with a dithered vignette and pixel lines
        const bg = PIX.skyGradient('pong', W, H, [[0, '#0b0d1f'], [0.5, '#070814'], [1, '#0b0d1f']], 4);
        ctx.drawImage(bg, -4, -4, W + 8, H + 8);
        if (this.goalFlash > 0) {
          ctx.fillStyle = (this.goalSide > 0 ? "rgba(125,249,255," : "rgba(255,138,128,") + (this.goalFlash / 420 * 0.16).toFixed(3) + ")";
          ctx.fillRect(0, 0, W, H);
        }
        PIX.rect(ctx, 0, 0, W, 4, "#1d2150");
        PIX.rect(ctx, 0, 4, W, 2, "#11132e");
        PIX.rect(ctx, 0, H - 4, W, 4, "#1d2150");
        PIX.rect(ctx, 0, H - 6, W, 2, "#11132e");
        for (let y = 12; y < H - 12; y += 20) PIX.rect(ctx, W / 2 - 2, y, 4, 10, "#262b5e");

        // Big dim pixel scoreboard
        const ds = Math.max(5, Math.min(9, Math.floor(W / 70)));
        const sy0 = Math.max(W < 700 ? 110 : 116, SAFE.top + 100);
        PIX.text(ctx, String(this.score.player), W / 2 - 18 - ds * 2.5, sy0, ds, "#3a3f86", { align: 'right', shadow: "#14163a" });
        PIX.text(ctx, String(this.score.ai), W / 2 + 18 + ds * 2.5, sy0, ds, "#5a2f4a", { align: 'left', shadow: "#14163a" });

        // Paddles (flash bright on contact)
        const S = this.S;
        const ph = this.paddleHeight, pw = this.paddleWidth;
        PIX.drawGlow(ctx, this.p1.x + pw / 2, this.p1.y + ph / 2, ph * 0.5, "#00E5FF", 0.35 + this.p1.flash / 140 * 0.4);
        PIX.drawGlow(ctx, this.p2.x + pw / 2, this.p2.y + ph / 2, ph * 0.5, "#FF5252", 0.35 + this.p2.flash / 140 * 0.4);
        PIX.draw(ctx, this.paddleSprite(this.p1.flash > 0 ? "#B8FBFF" : "#18D8F0"), this.p1.x, this.p1.y, S, { ax: 0, ay: 0 });
        PIX.draw(ctx, this.paddleSprite(this.p2.flash > 0 ? "#FFD0CC" : "#FF5A64"), this.p2.x, this.p2.y, S, { ax: 0, ay: 0 });

        // Ball trail: shrinking pixel squares
        for (let i = 0; i < this.trail.length; i++) {
          const t = this.trail[i];
          const k = (i + 1) / this.trail.length;
          const sz = Math.max(1, Math.round(k * this.ballRadius * 0.7 / S)) * S;
          ctx.globalAlpha = k * 0.4;
          PIX.rect(ctx, t.x - sz / 2, t.y - sz / 2, sz, sz, "#C5CAFF");
        }
        ctx.globalAlpha = 1;
        if (this.gameState === "playing" && (this.serveDelay <= 0 || Math.floor(this.serveDelay / 100) % 2 === 0)) {
          PIX.drawGlow(ctx, this.ball.x, this.ball.y, this.ballRadius * 3.6, "#FFFFFF", 0.35);
          PIX.draw(ctx, PIX.orb(Math.round(this.ballRadius * 2 / S), "#EEF0FF"), this.ball.x, this.ball.y, S);
        }

        for (const s of this.sparks) {
          ctx.globalAlpha = Math.max(0, Math.min(1, s.life / 260));
          PIX.rect(ctx, s.x, s.y, S * 2, S * 2, s.color);
        }
        ctx.globalAlpha = 1;
        ctx.restore();

        drawHUDChips(ctx, [
          { label: "You", value: this.score.player, color: "#7DF9FF" },
          { label: "AI", value: this.score.ai, color: "#FF8A80" },
          { label: "Goal", value: this.maxScore, color: "#FFD740" }
        ]);

        // Game over
        if (this.gameState === "over") {
          const won = this.score.player >= this.maxScore;
          drawGameOverScreen(ctx, {
            title: won ? "YOU WIN!" : "AI WINS!",
            titleColor: won ? "#FFD54F" : "#FF6B6B",
            score: this.score.player + " - " + this.score.ai,
            scoreLabel: "Final"
          });
        }
      },
      keyDown: function(e) {
        if (e.key === " " && this.gameState === "over") {
          this.init();
        }
      },
      keyUp: function(e) {},
      end: function() {}
    };

    // 2. Breakout (Fixed collision detection)
    const breakoutGame = {
      paddleWidth: 80, paddleHeight: 10,
      basePaddleWidth: 80,
      ballRadius: 7,
      level: 1,
      score: 0,
      lives: 3,
      gameState: "playing",
      powerups: [],
      activePowerup: null,
      powerupTimer: 0,
      brickColors: ['#FF4D6D', '#FF8A5C', '#FFD166', '#5FE3A1', '#4CC9F0', '#9D7BFF', '#F072B6'],
      init: function() {
        const S = PIX.scaleFor();
        this.S = S;
        this.basePaddleWidth = (S === 3 ? 30 : 40) * S;
        this.paddleWidth = this.basePaddleWidth;
        this.paddleHeight = 5 * S;
        this.ballRadius = (S === 3 ? 6 : 7) * S / 2;
        this.paddle = { x: canvas.width/2 - this.paddleWidth/2, y: this.paddleY(), speed: 0.72 };
        this.balls = [this.newBall()];
        this.particles = [];
        this.score = 0;
        this.lives = 3;
        this.level = 1;
        this.gameState = "playing";
        this.powerups = [];
        this.activePowerup = null;
        this.powerupTimer = 0;
        this.ballSpeedMult = 1;
        this.shake = 0;
        this.levelBanner = 1400;
        // Space held from the restart press mustn't launch the new ball
        this.launchArmed = false;
        this.createBricks();
      },
      paddleY: function() {
        return canvas.height - 30 - SAFE.bottom - this.paddleHeight;
      },
      onResize: function() {
        if (!this.paddle) return;
        this.paddle.y = this.paddleY();
        this.paddle.x = Math.max(0, Math.min(canvas.width - this.paddleWidth, this.paddle.x));
        // Rebuild the wall at the new width, keeping broken bricks broken
        const broken = this.bricks.map(b => b.status === 0);
        this.createBricks();
        this.bricks.forEach((b, i) => { if (broken[i]) b.status = 0; });
      },
      createBricks: function() {
        this.bricks = [];
        const rows = Math.min(5, 2 + Math.floor(this.level / 2));
        const cols = 10;
        const S = this.S;
        const brickWidth = canvas.width / cols;
        const brickHeight = (S === 3 ? 7 : 9) * S + 2;
        const top = Math.max(50, SAFE.top + 56);

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            this.bricks.push({
              x: c * brickWidth,
              y: r * brickHeight + top,
              width: brickWidth - 2,
              height: brickHeight - 2,
              status: 1,
              color: this.brickColors[(r + this.level - 1) % this.brickColors.length],
              points: (rows - r) * 10,
              hitT: 0
            });
          }
        }
      },
      newBall: function() {
        return { x: canvas.width / 2, y: this.paddleY() - this.ballRadius, vx: 0.38, vy: -0.38, attached: true };
      },
      splitBalls: function() {
        const extra = [];
        for (const b of this.balls) {
          if (b.attached) continue;
          const speed = Math.max(0.3, Math.sqrt(b.vx * b.vx + b.vy * b.vy));
          for (const off of [-0.6, 0.6]) {
            if (this.balls.length + extra.length >= 6) break;
            const ang = Math.atan2(b.vy, b.vx) + off;
            extra.push({ x: b.x, y: b.y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, attached: false });
          }
        }
        this.balls.push(...extra);
      },
      spawnPowerup: function(x, y) {
        // 20% chance to spawn powerup when brick breaks
        if (Math.random() > 0.2) return;
        const types = ["wide", "slow", "multi"];
        const type = types[Math.floor(Math.random() * types.length)];
        const colors = { wide: "#4CAF50", slow: "#2196F3", multi: "#FF9800" };
        this.powerups.push({ x: x, y: y, type: type, color: colors[type], vy: 0.15 });
      },
      burst: function(x, y, color, n) {
        for (let pi = 0; pi < n; pi++) {
          this.particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.7) * 0.35,
            color: color, life: 380 + Math.random() * 200
          });
        }
        if (this.particles.length > MAX_PARTICLES) this.particles.splice(0, this.particles.length - MAX_PARTICLES);
      },
      update: function(delta) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx * delta;
          p.y += p.vy * delta;
          p.vy += 0.0009 * delta;
          p.life -= delta;
          if (p.life <= 0) this.particles.splice(i, 1);
        }
        this.shake = Math.max(0, this.shake - delta);
        if (this.levelBanner > 0) this.levelBanner -= delta;
        if (this.gameState !== "playing") return;
        if (!keysDown[" "]) this.launchArmed = true;

        // Powerup timer
        if (this.activePowerup) {
          this.powerupTimer -= delta;
          if (this.powerupTimer <= 0) {
            // Reset powerup effects (shrink around the paddle's center)
            if (this.activePowerup === "wide") {
              const cx = this.paddle.x + this.paddleWidth / 2;
              this.paddleWidth = this.basePaddleWidth;
              this.paddle.x = cx - this.paddleWidth / 2;
            }
            if (this.activePowerup === "slow") this.ballSpeedMult = 1;
            this.activePowerup = null;
          }
        }

        // Update powerups and check collection against the paddle's top band
        const capH = 9 * this.S;
        for (let i = this.powerups.length - 1; i >= 0; i--) {
          const p = this.powerups[i];
          p.y += p.vy * delta;
          if (p.y - capH / 2 > canvas.height) {
            this.powerups.splice(i, 1);
          } else if (p.y + capH / 2 > this.paddle.y && p.y - capH / 2 < this.paddle.y + this.paddleHeight &&
                     p.x > this.paddle.x - 12 && p.x < this.paddle.x + this.paddleWidth + 12) {
            // Collected!
            audioManager.playSFX('powerup');
            this.burst(p.x, this.paddle.y, p.color, 10);
            if (p.type === "wide") {
              if (this.activePowerup === "slow") this.ballSpeedMult = 1;
              const cx = this.paddle.x + this.paddleWidth / 2;
              this.activePowerup = "wide"; this.powerupTimer = 8000; this.paddleWidth = this.basePaddleWidth * 1.5;
              this.paddle.x = cx - this.paddleWidth / 2;
            } else if (p.type === "slow") {
              if (this.activePowerup === "wide") this.paddleWidth = this.basePaddleWidth;
              this.activePowerup = "slow"; this.powerupTimer = 8000; this.ballSpeedMult = 0.6;
            } else if (p.type === "multi") {
              if (this.balls.every(b => b.attached)) this.balls.forEach(b => this.launch(b));
              this.splitBalls();
            }
            this.powerups.splice(i, 1);
          }
        }

        // Paddle movement
        if (keysDown["ArrowLeft"]) {
          this.paddle.x -= this.paddle.speed * delta;
        }
        if (keysDown["ArrowRight"]) {
          this.paddle.x += this.paddle.speed * delta;
        }
        this.paddle.x = Math.max(0, Math.min(canvas.width - this.paddleWidth, this.paddle.x));

        // Balls (attached launch, movement, collisions)
        for (let bi = this.balls.length - 1; bi >= 0; bi--) {
          const ball = this.balls[bi];

          if (ball.attached) {
            ball.x = this.paddle.x + this.paddleWidth / 2;
            ball.y = this.paddle.y - this.ballRadius;
            if (keysDown[" "] && this.launchArmed) this.launch(ball);
            continue;
          }

          // Sub-steps keep a fast ball from skipping through bricks or the paddle
          const travel = Math.hypot(ball.vx, ball.vy) * delta * this.ballSpeedMult;
          const steps = Math.max(1, Math.ceil(travel / (this.ballRadius * 0.8)));
          for (let st = 0; st < steps; st++) this.stepBall(ball, delta / steps);

          if (ball.y > canvas.height + this.ballRadius) {
            this.balls.splice(bi, 1);
          }
        }

        // Level completed
        if (this.bricks.every(b => b.status === 0)) {
          this.level++;
          audioManager.playSFX('win');
          this.powerups = [];
          this.balls = [this.newBall()];
          this.launchArmed = false;
          this.levelBanner = 1400;
          this.createBricks();
          return;
        }

        // All balls lost
        if (this.balls.length === 0) {
          this.lives--;
          this.shake = 280;
          audioManager.playSFX('explosion');
          GamepadManager.rumble(160, 0.6, 0.4);
          if (this.lives <= 0) {
            this.gameState = "over";
            audioManager.playSFX('gameover');
          } else {
            this.balls = [this.newBall()];
            this.launchArmed = false;
          }
        }
      },
      launch: function(ball) {
        ball.attached = false;
        ball.vy = -Math.abs(ball.vy);
        ball.vx = (keysDown["ArrowLeft"] ? -0.2 : (keysDown["ArrowRight"] ? 0.2 : 0.1));
        audioManager.playSFX('shoot');
      },
      stepBall: function(ball, h) {
        const r = this.ballRadius;
        ball.x += ball.vx * h * this.ballSpeedMult;
        ball.y += ball.vy * h * this.ballSpeedMult;

        if (ball.x < r || ball.x > canvas.width - r) {
          ball.x = Math.max(r, Math.min(canvas.width - r, ball.x));
          ball.vx = (ball.x <= r ? 1 : -1) * Math.abs(ball.vx);
          audioManager.playTone(200, 'square', 0.05, 0.5);
        }
        if (ball.y < r) {
          ball.vy = Math.abs(ball.vy);
          ball.y = r;
          audioManager.playTone(200, 'square', 0.05, 0.5);
        }

        if (ball.vy > 0 &&
            ball.y + r > this.paddle.y &&
            ball.y - r < this.paddle.y + this.paddleHeight &&
            ball.x > this.paddle.x - r * 0.5 &&
            ball.x < this.paddle.x + this.paddleWidth + r * 0.5) {
          audioManager.playSFX('hit');
          const hitPos = Math.max(-1, Math.min(1, (ball.x - (this.paddle.x + this.paddleWidth / 2)) / (this.paddleWidth / 2)));
          const angle = hitPos * Math.PI / 3;
          const speed = Math.max(0.3, Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy));
          ball.vx = speed * Math.sin(angle);
          ball.vy = -Math.abs(speed * Math.cos(angle));
          ball.y = this.paddle.y - r;
          this.paddleFlash = 120;
        }

        for (let brick of this.bricks) {
          if (!brick.status) continue;
          const nx = Math.max(brick.x, Math.min(ball.x, brick.x + brick.width));
          const ny = Math.max(brick.y, Math.min(ball.y, brick.y + brick.height));
          const dx = ball.x - nx, dy = ball.y - ny;
          if (dx * dx + dy * dy > r * r) continue;

          // Resolve along the shallower overlap and only reflect when moving
          // into the brick, so a ball can't double-bounce through a row
          const overlapX = Math.min(ball.x + r - brick.x, brick.x + brick.width - (ball.x - r));
          const overlapY = Math.min(ball.y + r - brick.y, brick.y + brick.height - (ball.y - r));
          if (overlapX < overlapY) {
            const left = ball.x < brick.x + brick.width / 2;
            if ((left && ball.vx > 0) || (!left && ball.vx < 0)) ball.vx = -ball.vx;
            ball.x = left ? brick.x - r : brick.x + brick.width + r;
          } else {
            const above = ball.y < brick.y + brick.height / 2;
            if ((above && ball.vy > 0) || (!above && ball.vy < 0)) ball.vy = -ball.vy;
            ball.y = above ? brick.y - r : brick.y + brick.height + r;
          }

          audioManager.playTone(300 + Math.random() * 200, 'square', 0.05, 0.4);
          brick.status = 0;
          this.score += brick.points;
          this.spawnPowerup(brick.x + brick.width / 2, brick.y + brick.height / 2);
          this.burst(brick.x + brick.width / 2, brick.y + brick.height / 2, brick.color, 8);
          this.shake = Math.max(this.shake, 60);

          const maxSpeed = 0.95;
          const currentSpeed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
          if (currentSpeed < maxSpeed) {
            ball.vx *= 1.015;
            ball.vy *= 1.015;
          }
          break;
        }
      },
      brickSprite: function(color, w, h) {
        return PIX.get('bo-brick:' + color + ':' + w + 'x' + h, () => {
          const R = PIX.ramp(color);
          return PIX.paint(w, h, (x, y) => {
            const edgeX = x === 0 || x === w - 1, edgeY = y === 0 || y === h - 1;
            if (edgeX && edgeY) return null;
            if (edgeX || edgeY) return R.o;
            if (y === 1) return x === 1 ? R.h : R.l;
            if (y === h - 2) return R.d;
            if (x === 1) return R.l;
            if (x === w - 2) return R.d;
            // Specular glint top-left, a scuff bottom-right
            if (y === 2 && (x === 2 || x === 3)) return R.h;
            if (y === h - 3 && (x === w - 4)) return R.d;
            return R.b;
          });
        });
      },
      paddleSprite: function(w, h, glow) {
        return PIX.get('bo-paddle:' + w + 'x' + h + ':' + (glow ? 1 : 0), () => {
          const M = PIX.ramp(glow ? "#9FFFE0" : "#C9D2E8");
          const C = PIX.ramp("#FF4D6D");
          return PIX.paint(w, h, (x, y) => {
            const cap = x < 3 || x > w - 4;
            const corner = (x === 0 || x === w - 1) && (y === 0 || y === h - 1);
            if (corner) return null;
            const R = cap ? C : M;
            if (x === 0 || x === w - 1 || y === 0 || y === h - 1) return R.o;
            if (x === 3 || x === w - 4) return M.o;
            if (y === 1) return R.h;
            if (y === h - 2) return R.d;
            if (!cap && y === Math.floor(h / 2) && x % 4 === 0) return M.d;
            return R.b;
          });
        });
      },
      capsuleSprite: function(type, color) {
        return PIX.get('bo-cap:' + type, () => {
          const R = PIX.ramp(color);
          const L = {
            wide: ['#.#', '#.#', '###', '###', '#.#'],
            slow: ['###', '#..', '###', '..#', '###'],
            multi: ['#.#', '###', '###', '#.#', '#.#']
          }[type];
          const w = 13, h = 9;
          return PIX.paint(w, h, (x, y) => {
            const rx = x < 2 ? 2 - x : x > w - 3 ? x - (w - 3) : 0;
            if ((y === 0 || y === h - 1) && rx > 0) return null;
            if (rx === 2 && (y === 1 || y === h - 2)) return null;
            if (y === 0 || y === h - 1 || (rx === 2) || (rx === 1 && (y === 1 || y === h - 2))) return R.o;
            const lx = x - 5, ly = y - 2;
            if (lx >= 0 && lx < 3 && ly >= 0 && ly < 5 && L[ly][lx] === '#') return '#FFFFFF';
            if (y === 1) return R.h;
            if (y === h - 2) return R.d;
            return R.b;
          });
        });
      },
      background: function(W, H) {
        const S = this.S;
        const lw = Math.ceil(W / S), lh = Math.ceil(H / S);
        return PIX.get('bo-bg:' + lw + 'x' + lh, () => PIX.paint(lw, lh, (x, y) => {
          const t = y / lh;
          const base = PIX.mix('#141a3c', '#070915', Math.min(1, t * 1.2));
          const tx = x % 16, ty = y % 16;
          if (tx === 0 || ty === 0) return PIX.mix(base, '#000000', 0.35);
          if (tx === 1 || ty === 1) return PIX.mix(base, '#3a4a9a', 0.12);
          if (tx === 8 && ty === 8) return PIX.mix(base, '#6a7cff', 0.18);
          const d = PIX.BAYER[(y & 3) * 4 + (x & 3)] / 16;
          return d < t * 0.5 ? PIX.mix(base, '#000000', 0.18) : base;
        }));
      },
      draw: function(ctx) {
        const W = canvas.width, H = canvas.height, S = this.S;
        ctx.save();
        if (this.shake > 0) ctx.translate((Math.random() - 0.5) * this.shake * 0.02, (Math.random() - 0.5) * this.shake * 0.02);

        ctx.drawImage(this.background(W, H), 0, 0, Math.ceil(W / S) * S, Math.ceil(H / S) * S);

        // Bricks
        for (let brick of this.bricks) {
          if (!brick.status) continue;
          const bw = Math.max(4, Math.round(brick.width / S)), bh = Math.max(4, Math.round(brick.height / S));
          PIX.draw(ctx, this.brickSprite(brick.color, bw, bh), brick.x + 1, brick.y + 1, S, { ax: 0, ay: 0 });
        }

        // Paddle
        const wide = this.activePowerup === "wide";
        const pw = Math.round(this.paddleWidth / S), ph = Math.round(this.paddleHeight / S);
        PIX.drawGlow(ctx, this.paddle.x + this.paddleWidth / 2, this.paddle.y + this.paddleHeight / 2, this.paddleWidth * 0.7, wide ? "#7CFFCB" : "#8FA8FF", 0.35);
        PIX.draw(ctx, this.paddleSprite(pw, ph, wide), this.paddle.x, this.paddle.y, S, { ax: 0, ay: 0 });

        // Balls
        const slow = this.activePowerup === "slow";
        const bd = Math.round(this.ballRadius * 2 / S);
        for (const ball of this.balls) {
          PIX.drawGlow(ctx, ball.x, ball.y, this.ballRadius * 3.4, slow ? "#4CC9F0" : "#FFFFFF", 0.3);
          PIX.draw(ctx, PIX.orb(bd, slow ? "#7FDBFF" : "#F2F4FF"), ball.x, ball.y, S);
        }

        // Spark particles
        for (const p of this.particles) {
          ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 300));
          PIX.rect(ctx, p.x, p.y, S * 2, S * 2, p.color);
        }
        ctx.globalAlpha = 1;

        // Powerups
        const bob = Math.sin(performance.now() / 160) * S * 0.5;
        for (let p of this.powerups) {
          PIX.drawGlow(ctx, p.x, p.y, 13 * S, p.color, 0.4);
          PIX.draw(ctx, this.capsuleSprite(p.type, p.color), p.x, p.y + bob, S);
        }
        ctx.restore();

        // HUD
        const chip = drawHUDChips(ctx, [
          { label: "Score", value: this.score },
          { label: "Level", value: this.level, color: "#4CC9F0" },
          { label: "Lives", value: this.lives, color: "#7CFFCB" }
        ]);

        // Active powerup indicator (drops below the chips if they'd collide)
        if (this.activePowerup) {
          const col = this.activePowerup === "wide" ? "#7CFFCB" : "#4CC9F0";
          const label = (this.activePowerup === "wide" ? "WIDE " : "SLOW ") + Math.ceil(this.powerupTimer / 1000) + "S";
          const lx = hudLeft() + 2;
          const tw = PIX.textWidth(label, 2);
          const ly = lx + tw + 12 > chip.x ? chip.y + chip.h + 16 : chip.y + chip.h / 2;
          PIX.text(ctx, label, lx, ly, 2, col, { align: 'left', shadow: '#0a0c1a' });
        }

        if (this.levelBanner > 0 && this.gameState === "playing") {
          const a = Math.min(1, this.levelBanner / 300);
          PIX.text(ctx, "LEVEL " + this.level, W / 2, H * 0.52, Math.max(3, Math.min(6, Math.floor(W / 90))), "#FFFFFF", { shadow: "#3a4a9a", alpha: a });
        }

        // Game over
        if (this.gameState === "over") {
          drawGameOverScreen(ctx, { title: "GAME OVER", score: this.score, lines: ["Level " + this.level] });
        }
      },
      keyDown: function(e) {
        if (e.key === " " && this.gameState === "over") {
          this.init();
        }
      },
      keyUp: function(e) {},
      end: function() {}
    };

    // 3. Invader (Improved balance)
    const invaderGame = {
      player: null,
      aliens: [],
      bullets: [],
      particles: [],
      score: 0,
      lives: 3,
      level: 1,
      gameState: "playing",
      animTimer: 0,
      animFrame: 0,
      hitFlash: 0,
      // Interior art only: the kit adds a hue-shifted outline.
      // l light, b base, d dark, h gloss, w eye white, k pupil
      art: {
        red: [
          ["..l.....l..", "...l...l...", "..lhlllll..", ".llwkllwkl.", "bbbbbbbbbbb", "b.bbbbbbb.b", "d.d.....d.d", "...dd.dd..."],
          ["..l.....l..", "l..l...l..l", "l.lhlllll.l", "lllwkllwkll", "bbbbbbbbbbb", ".bbbbbbbbb.", "..d.....d..", ".d.......d."]
        ],
        green: [
          ["...ll...", "..lhll..", ".llllll.", "lwkllwkl", "bbbbbbbb", "..b..b..", ".b.bb.b.", "d.d..d.d"],
          ["...ll...", "..lhll..", ".llllll.", "lwkllwkl", "bbbbbbbb", ".b.bb.b.", "b......b", ".d....d."]
        ],
        blue: [
          ["....llll....", ".lhlllllllll", "llllllllllll", "lllwkllwklll", "bbbbbbbbbbbb", "...bb..bb...", "..bb.dd.bb..", "dd........dd"],
          ["....llll....", ".lhlllllllll", "llllllllllll", "lllwkllwklll", "bbbbbbbbbbbb", "..bbb..bbb..", ".bb..dd..bb.", "..dd....dd.."]
        ],
        ship: [
          ".......l.......",
          "......lhl......",
          "......lbl......",
          ".....lcccl.....",
          ".....bcCcb.....",
          "..l.lbbbbbl.l..",
          ".lbllbbbbbllbl.",
          "lbbbbbbbbbbbbbl",
          "bbbdbbbbbbbdbbb",
          ".dd.ddd.ddd.dd."
        ]
      },
      colors: { red: "#FF5A6E", green: "#57F287", blue: "#5AA9FF" },
      alienSprite: function(type, frame, flash) {
        return PIX.get('inv:' + type + ':' + frame + ':' + (flash ? 1 : 0), () => {
          const R = PIX.ramp(flash ? "#FFFFFF" : this.colors[type]);
          return PIX.fromRows(this.art[type][frame], { l: R.l, b: R.b, d: R.d, h: R.h, w: "#FFFFFF", k: "#1a1033" }, { outline: R.o });
        });
      },
      shipSprite: function() {
        return PIX.get('inv:ship', () => {
          const R = PIX.ramp("#2EE6A0");
          return PIX.fromRows(this.art.ship, { l: R.l, b: R.b, d: R.d, h: R.h, c: "#5ED8FF", C: "#FFFFFF" }, { outline: R.o });
        });
      },
      createExplosion: function(x, y, color, big) {
        this.booms.push({ x: x, y: y, t: 0, d: big ? 22 : 16 });
        for (let i = 0; i < 10; i++) {
          this.particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 0.35,
            vy: (Math.random() - 0.5) * 0.35,
            color: color,
            life: 400 + Math.random() * 200
          });
        }
        if (this.particles.length > MAX_PARTICLES) {
          this.particles.splice(0, this.particles.length - MAX_PARTICLES);
        }
      },
      init: function() {
        const S = PIX.scaleFor();
        this.S = S;
        this.player = {
          x: canvas.width / 2 - 7.5 * S,
          y: this.playerY(),
          width: 15 * S,
          height: 10 * S,
          speed: 0.4
        };
        this.bullets = [];
        this.particles = [];
        this.booms = [];
        this.score = 0;
        this.lives = 3;
        this.level = 1;
        this.gameState = "playing";
        this.animTimer = 0;
        this.animFrame = 0;
        this.hitFlash = 0;
        this.shootCooldown = 0;
        this.alienDirection = 1;
        this.alienSpeed = 0.05;
        this.alienShootInterval = 2000;
        this.alienShootTimer = 1200;
        this.waveBanner = 1300;
        this.setupAliens();
      },
      playerY: function() {
        return canvas.height - 16 * this.S - 14 - SAFE.bottom;
      },
      onResize: function() {
        if (!this.player) return;
        this.player.y = this.playerY();
        this.player.x = Math.max(0, Math.min(canvas.width - this.player.width, this.player.x));
        // Pull the formation back on screen if the window shrank
        const alive = this.aliens.filter(a => a.status);
        if (alive.length) {
          const minX = Math.min(...alive.map(a => a.x)), maxX = Math.max(...alive.map(a => a.x + a.width));
          if (maxX - minX < canvas.width) {
            const shift = maxX > canvas.width ? canvas.width - maxX - 4 : minX < 0 ? -minX + 4 : 0;
            for (const a of this.aliens) a.x += shift;
          }
        }
      },
      setupAliens: function() {
        this.aliens = [];
        const S = this.S;
        const rows = Math.min(5, 3 + Math.floor(this.level / 4));
        const w = 12 * S, h = 8 * S;
        const gapX = 6 * S, gapY = 5 * S;
        // Fit the formation to the screen (a phone can't take 8 columns at
        // desktop spacing; the old fixed layout ended the game instantly)
        const usable = canvas.width - 24;
        const cols = Math.max(4, Math.min(8, Math.floor((usable * 0.78 + gapX) / (w + gapX))));
        const total = cols * w + (cols - 1) * gapX;
        const startX = Math.round((canvas.width - total) / 2);
        const startY = Math.max(56, SAFE.top + 56);
        const alienTypes = ["red", "green", "blue"];

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            this.aliens.push({
              x: startX + c * (w + gapX),
              y: startY + r * (h + gapY),
              width: w,
              height: h,
              status: 1,
              col: c,
              type: alienTypes[r % alienTypes.length],
              points: (rows - r) * 20,
              hitT: 0
            });
          }
        }
        this.cols = cols;
        this.alienTotal = this.aliens.length;
        this.alienDropY = 5 * S;
      },
      update: function(delta) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx * delta;
          p.y += p.vy * delta;
          p.life -= delta;
          if (p.life <= 0) this.particles.splice(i, 1);
        }
        for (let i = this.booms.length - 1; i >= 0; i--) {
          this.booms[i].t += delta / 520;
          if (this.booms[i].t >= 1) this.booms.splice(i, 1);
        }
        if (this.waveBanner > 0) this.waveBanner -= delta;
        if (this.gameState !== "playing") return;

        this.animTimer += delta;
        if (this.animTimer > 380) { this.animTimer = 0; this.animFrame = 1 - this.animFrame; }
        this.hitFlash = Math.max(0, this.hitFlash - delta);

        // Move player
        if (keysDown["ArrowLeft"] || keysDown["a"] || keysDown["A"]) {
          this.player.x -= this.player.speed * delta;
        }
        if (keysDown["ArrowRight"] || keysDown["d"] || keysDown["D"]) {
          this.player.x += this.player.speed * delta;
        }
        this.player.x = Math.max(0, Math.min(canvas.width - this.player.width, this.player.x));

        // Player shooting
        this.shootCooldown -= delta;
        if ((keysDown[" "] || keysDown["w"] || keysDown["W"] || keysDown["ArrowUp"]) && this.shootCooldown <= 0) {
          // Fire bullet upward
          audioManager.playSFX('shoot');
          this.bullets.push({
            x: this.player.x + this.player.width/2,
            y: this.player.y,
            width: 2 * this.S,
            height: 6 * this.S,
            vy: 0.6,
            fromPlayer: true
          });
          this.shootCooldown = 300; // ms
          this.muzzle = 70;
        }
        if (this.muzzle > 0) this.muzzle -= delta;

        // Move bullets
        for (let bullet of this.bullets) {
          bullet.y += bullet.fromPlayer ? -bullet.vy * delta : bullet.vy * delta;
        }

        // Remove bullets that are off-screen
        this.bullets = this.bullets.filter(b => b.y > -b.height && b.y < canvas.height + b.height);

        // Move aliens in formation with edge detection
        let aliensAlive = 0;
        for (let alien of this.aliens) if (alien.status) aliensAlive++;

        // If no aliens alive, next level
        if (aliensAlive === 0) {
          this.level++;
          audioManager.playSFX('win');
          this.alienSpeed = Math.min(0.15, this.alienSpeed + 0.01);
          this.bullets = [];
          this.waveBanner = 1300;
          this.setupAliens();
          return;
        }

        // The swarm speeds up as it thins out, classic-style
        const thin = 1 - aliensAlive / this.alienTotal;
        const speed = this.alienSpeed * (1 + thin * 1.6);
        let hitEdge = false;
        for (let alien of this.aliens) {
          if (!alien.status) continue;
          alien.x += this.alienDirection * speed * delta;
          if ((this.alienDirection < 0 && alien.x < 4) || (this.alienDirection > 0 && alien.x + alien.width > canvas.width - 4)) {
            hitEdge = true;
          }
        }

        // Change direction and move down when aliens hit edge
        if (hitEdge) {
          this.alienDirection *= -1;
          for (let alien of this.aliens) {
            if (alien.status) alien.y += this.alienDropY;
          }
        }

        // Alien shooting
        this.alienShootTimer -= delta;
        if (this.alienShootTimer <= 0) {
          this.alienShootTimer = Math.max(1000, this.alienShootInterval - (this.level * 100));

          // Bottom-most living alien in each column (columns are fixed at spawn)
          const bottom = {};
          for (const a of this.aliens) {
            if (a.status && (!bottom[a.col] || a.y > bottom[a.col].y)) bottom[a.col] = a;
          }
          const shooters = Object.values(bottom);
          if (shooters.length > 0) {
            const shooter = shooters[Math.floor(Math.random() * shooters.length)];
            this.bullets.push({
              x: shooter.x + shooter.width/2,
              y: shooter.y + shooter.height,
              width: 3 * this.S,
              height: 6 * this.S,
              vy: 0.3,
              fromPlayer: false
            });
          }
        }

        // Collisions: player bullet vs alien
        for (let bullet of this.bullets) {
          if (bullet.fromPlayer) {
            for (let alien of this.aliens) {
              if (alien.status &&
                  bullet.x > alien.x && bullet.x < alien.x + alien.width &&
                  bullet.y < alien.y + alien.height && bullet.y + bullet.height > alien.y) {
                alien.status = 0;
                bullet.y = -1000; // remove bullet
                this.score += alien.points;
                this.createExplosion(alien.x + alien.width / 2, alien.y + alien.height / 2, this.colors[alien.type]);
                audioManager.playTone(100 + Math.random()*200, 'sawtooth', 0.1, 0.4);
                break;
              }
            }
          } else if (this.hitFlash <= 0) {
            // Alien bullet vs player (brief invulnerability after a hit)
            if (bullet.x > this.player.x && bullet.x < this.player.x + this.player.width &&
                bullet.y + bullet.height > this.player.y && bullet.y < this.player.y + this.player.height) {
              bullet.y = canvas.height + 1000; // remove bullet
              this.lives--;
              GamepadManager.rumble(160, 0.7, 0.45);
              this.hitFlash = 1200;
              this.createExplosion(this.player.x + this.player.width / 2, this.player.y + this.player.height / 2, "#2EE6A0", true);
              audioManager.playSFX('explosion');

              if (this.lives <= 0) {
                this.gameState = "over";
                audioManager.playSFX('gameover');
              }
            }
          }
        }

        // Check if any aliens have reached the bottom - game over
        for (let alien of this.aliens) {
          if (alien.status && alien.y + alien.height > this.player.y - 6) {
            this.gameState = "over";
            this.createExplosion(this.player.x + this.player.width / 2, this.player.y + this.player.height / 2, "#2EE6A0", true);
            audioManager.playSFX('gameover');
            break;
          }
        }
      },
      background: function(W, H) {
        const S = this.S;
        const lw = Math.ceil(W / S), lh = Math.ceil(H / S);
        return PIX.get('inv-bg:' + lw + 'x' + lh, () => {
          const c = PIX.paint(lw, lh, (x, y) => {
            const t = y / lh;
            const base = t < 0.6 ? PIX.mix('#03030c', '#0b0a24', t / 0.6) : PIX.mix('#0b0a24', '#1a1240', (t - 0.6) / 0.4);
            // Static dim stars
            const n = ((x * 2654435761) ^ (y * 40503)) >>> 0;
            if (n % 997 === 0 && t < 0.85) return (n % 3) ? '#6a6f9a' : '#a8b0e0';
            return base;
          });
          const g = c.getContext('2d');
          // Ringed planet, top right
          const pr = Math.max(10, Math.round(Math.min(lw, lh) * 0.09));
          const px = Math.round(lw * 0.82), py = Math.round(lh * 0.2);
          // Ring: back half first, then the planet, then the front half
          const ring = (front) => {
            const rx = pr * 1.7, ry = pr * 0.42, tilt = -0.32;
            for (let a = 0; a < Math.PI * 2; a += 0.02) {
              const isFront = Math.sin(a) > 0;
              if (isFront !== front) continue;
              const ex = Math.cos(a) * rx, ey = Math.sin(a) * ry;
              const x = Math.round(px + ex * Math.cos(tilt) - ey * Math.sin(tilt));
              const y = Math.round(py + ex * Math.sin(tilt) + ey * Math.cos(tilt));
              g.fillStyle = front ? '#d9ccff' : '#6d5aa8';
              g.fillRect(x, y, 1, 1);
              g.fillStyle = front ? '#9f88e8' : '#4a3d80';
              g.fillRect(x, y + 1, 1, 1);
            }
          };
          g.globalAlpha = 0.9;
          ring(false);
          g.drawImage(PIX.orb(pr * 2, '#7a4fd6', { spec: false }), px - pr, py - pr);
          ring(true);
          g.globalAlpha = 1;
          // Rolling hills along the bottom
          for (let x = 0; x < lw; x++) {
            const hh = Math.round(7 + Math.sin(x * 0.05) * 3 + Math.sin(x * 0.13 + 1) * 2);
            for (let y = lh - hh; y < lh; y++) {
              const d = y - (lh - hh);
              g.fillStyle = d === 0 ? '#3fa36a' : d < 2 ? '#24704a' : ((x + y) % 7 === 0 ? '#1d4a36' : '#163a2c');
              g.fillRect(x, y, 1, 1);
            }
          }
          return c;
        });
      },
      draw: function(ctx) {
        const W = canvas.width, H = canvas.height, S = this.S;
        ctx.drawImage(this.background(W, H), 0, 0, Math.ceil(W / S) * S, Math.ceil(H / S) * S);

        // Twinkling stars on top of the baked sky
        const time = performance.now();
        const stars = getEvenStarfield('invader-twinkle', 26, W, H * 0.8, 17);
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const tw = 0.5 + 0.5 * Math.sin(time / 500 + st.phase);
          if (tw < 0.25) continue;
          const c = tw > 0.85 ? '#FFFFFF' : '#9aa4dd';
          const x = Math.floor(st.x / S) * S, y = Math.floor(st.y / S) * S;
          PIX.rect(ctx, x, y, S, S, c);
          if (tw > 0.85) {
            ctx.globalAlpha = 0.5;
            PIX.rect(ctx, x - S, y, S, S, c); PIX.rect(ctx, x + S, y, S, S, c);
            PIX.rect(ctx, x, y - S, S, S, c); PIX.rect(ctx, x, y + S, S, S, c);
            ctx.globalAlpha = 1;
          }
        }

        // Player ship (flashes while recently hit)
        const shipVisible = this.hitFlash <= 0 || Math.floor(this.hitFlash / 90) % 2 === 0;
        if (shipVisible && this.gameState === "playing") {
          const p = this.player;
          const cx = p.x + p.width / 2;
          PIX.drawGlow(ctx, cx, p.y + p.height * 0.6, p.width * 0.9, "#2EE6A0", 0.28);
          // Twin thrusters flicker under the hull
          const fl = Math.floor(time / 60) % 2;
          PIX.rect(ctx, cx - 5 * S, p.y + p.height + S, S, (fl ? 2 : 1) * S, "#FFD54F");
          PIX.rect(ctx, cx + 4 * S, p.y + p.height + S, S, (fl ? 1 : 2) * S, "#FFD54F");
          PIX.rect(ctx, cx - 5 * S, p.y + p.height, S, S, "#FFFFFF");
          PIX.rect(ctx, cx + 4 * S, p.y + p.height, S, S, "#FFFFFF");
          PIX.draw(ctx, this.shipSprite(), cx, p.y + p.height / 2, S);
          if (this.muzzle > 0) PIX.rect(ctx, cx - S, p.y - 2 * S, 2 * S, 2 * S, "#FFFFFF");
        }

        // Aliens (animated pixel sprites)
        for (let alien of this.aliens) {
          if (!alien.status) continue;
          PIX.draw(ctx, this.alienSprite(alien.type, this.animFrame), alien.x + alien.width / 2, alien.y + alien.height / 2, S);
        }

        // Explosions + debris
        for (const b of this.booms) PIX.draw(ctx, PIX.boom(b.d, b.t), b.x, b.y, S);
        for (let p of this.particles) {
          ctx.globalAlpha = Math.min(1, p.life / 300);
          PIX.rect(ctx, p.x, p.y, S, S, p.color);
        }
        ctx.globalAlpha = 1;

        // Bullets: player laser bolt, alien zig-zag plasma
        const zig = Math.floor(time / 90) % 2;
        for (let bullet of this.bullets) {
          if (bullet.fromPlayer) {
            PIX.rect(ctx, bullet.x - S, bullet.y, 2 * S, bullet.height, "#FFE082");
            PIX.rect(ctx, bullet.x - S, bullet.y, 2 * S, 2 * S, "#FFFFFF");
          } else {
            for (let k = 0; k < 6; k++) {
              const off = ((k + zig) % 2) ? -S : 0;
              PIX.rect(ctx, bullet.x + off, bullet.y + k * S, S, S, k % 2 ? "#FFD54F" : "#FF5A3D");
            }
          }
        }

        // HUD - top right
        drawHUDChips(ctx, [
          { label: "Score", value: this.score },
          { label: "Lives", value: this.lives, color: "#69F0AE" },
          { label: "Wave", value: this.level, color: "#FFD740" }
        ]);

        if (this.waveBanner > 0 && this.gameState === "playing") {
          PIX.text(ctx, "WAVE " + this.level, W / 2, H * 0.55, Math.max(3, Math.min(6, Math.floor(W / 90))), "#FFFFFF", { shadow: "#3d2a8a", alpha: Math.min(1, this.waveBanner / 300) });
        }

        // Game over screen
        if (this.gameState === "over") {
          drawGameOverScreen(ctx, { title: "GAME OVER", score: this.score, lines: ["Wave " + this.level] });
        }
      },
      keyDown: function(e) {
        if (e.key === " " && this.gameState === "over") {
          this.init();
        }
      },
      keyUp: function(e) {},
      end: function() {}
    };

    // 4. Jump
    const jumpGame = {
      player: null,
      platforms: [],
      fallingPlats: [],
      particles: [],
      score: 0,
      highScore: 0,
      gameState: "playing",
      // KiroFlow Algorithm v3 - Bag system + dynamic reachability
      _kiroFlowSeed: 0,
      _lastZone: -1,
      _typeBag: [],
      bunnyArt: {
        up: [".hl....lh.", ".lb....bl.", ".lb....bl.", ".lb....bl.", ".lbbbbbbl.", "lbbbbbbbbl", "lbwkbbwkbl", "lbbbbbbbbl", "lbpbbbbpbd", ".bbbbbbbd.", ".dbbbbbdd.", "..d....d.."],
        down: ["..........", "hl......lh", ".lb....bl.", "..lb..bl..", ".lbbbbbbl.", "lbbbbbbbbl", "lbwkbbwkbl", "lbbbbbbbbl", "lbpbbbbpbd", ".bbbbbbbd.", ".dbbbbbdd.", ".dd....dd."]
      },
      bunny: function(frame, lookLeft) {
        return PIX.get('jump-bunny:' + frame + ':' + (lookLeft ? 1 : 0), () => {
          const R = PIX.ramp("#64FFDA");
          let rows = this.bunnyArt[frame];
          if (lookLeft) rows = rows.map(r => r.replace(/wk/g, 'kw'));
          return PIX.fromRows(rows, { h: R.h, l: R.l, b: R.b, d: R.d, w: "#FFFFFF", k: "#08302c", p: "#FF8FB1" }, { outline: R.o });
        });
      },
      platSprite: function(type, w, h) {
        return PIX.get('jump-plat:' + type + ':' + w + 'x' + h, () => {
          const base = { normal: "#8EC8FF", bounce: "#FFA53D", moving: "#6FD68A", ghost: "#FF7CC4" }[type];
          const R = PIX.ramp(base);
          return PIX.paint(w, h, (x, y) => {
            const corner = (x === 0 || x === w - 1) && (y === 0 || y === h - 1);
            if (type === "ghost") {
              // Puffy cloud: bumpy top, dithered translucency
              const bump = (Math.sin(x * 1.3) > 0.3) ? 0 : 1;
              if (y < bump || corner) return null;
              if (y === bump || x === 0 || x === w - 1 || y === h - 1) return PIX.alpha(R.o, 0.85);
              if (PIX.BAYER[(y & 3) * 4 + (x & 3)] < 5) return PIX.alpha(R.l, 0.55);
              return PIX.alpha(y === bump + 1 ? R.h : R.b, 0.78);
            }
            if (corner) return null;
            if (x === 0 || x === w - 1 || y === 0 || y === h - 1) return R.o;
            if (y === 1) return x % 5 === 2 ? "#FFFFFF" : R.h;
            if (y === h - 2) return R.d;
            if (type === "moving") {
              // Chevrons and running lights
              const m = (x - 2) % 6;
              if (y >= 2 && y <= h - 3 && (m === 0 || m === 1)) return R.d;
              if (y === 2 && x % 6 === 4) return "#FFF59D";
              return R.b;
            }
            if (type === "bounce") return (x + y) % 4 === 0 ? R.l : R.b;
            // Ice crystal slab with glints
            if ((x * 7 + y * 3) % 11 === 0) return R.l;
            return R.b;
          });
        });
      },
      springSprite: function(compressed) {
        return PIX.get('jump-spring:' + (compressed ? 1 : 0), () => PIX.fromRows(
          compressed ? ["hhhhh", "d.d.d", ".l.l."] : ["hhhhh", ".l.l.", "l.l.l", ".l.l.", "d.d.d"],
          { h: "#FFF3D0", l: "#C9CED9", d: "#6E7487" }, { outline: "#2a2440" }));
      },
      cloudSprite: function(variant) {
        return PIX.get('jump-cloud:' + variant, () => {
          const w = 34 + variant * 8, h = 10 + variant * 2;
          const blobs = [];
          for (let i = 0; i < 4 + variant; i++) blobs.push({ x: 5 + (i * (w - 10)) / (3 + variant), y: h * 0.62 - (i % 2) * 2, r: 4 + ((i * 7) % 3) + variant });
          return PIX.paint(w, h, (x, y) => {
            let inside = false, top = false;
            for (const b of blobs) {
              const d = Math.hypot(x - b.x, (y - b.y) * 1.2);
              if (d < b.r) { inside = true; if (y < b.y - b.r * 0.4) top = true; }
            }
            if (!inside || y > h - 2) return null;
            return top ? '#34408a' : ((x + y) % 2 ? '#262f6e' : '#2a3476');
          });
        });
      },
      init: function() {
        const S = PIX.scaleFor();
        this.S = S;
        this.player = {
          x: canvas.width/2,
          y: canvas.height - 50 - SAFE.bottom,
          vy: 0,
          width: 8 * S,
          height: 10 * S,
          onPlatform: false,
          jumpStrength: 0.75,
          lookLeft: false,
          squash: 0
        };
        this.platH = 5 * S;
        this.platforms = [];
        this.fallingPlats = [];
        this.particles = [];
        this.score = 0;
        this.scroll = 0;
        this.gameState = "playing";
        this._kiroFlowSeed = Date.now();
        this._lastZone = -1;
        this._typeBag = [];

        // Starting platform
        this.platforms.push({
          x: canvas.width/2 - 50,
          y: canvas.height - 20 - SAFE.bottom,
          width: 100,
          height: this.platH,
          type: "normal"
        });
        this._chainTop = this.platforms[0];

        this.generateInitialPlatforms();
      },
      // KiroFlow: seeded pseudo-random
      _kiroRand: function() {
        this._kiroFlowSeed = (this._kiroFlowSeed * 1103515245 + 12345) & 0x7fffffff;
        return (this._kiroFlowSeed % 1000) / 1000;
      },
      // Bag system: 3 normal, 1 bounce, 1 moving, 1 ghost (after score threshold)
      _pullFromBag: function() {
        if (this._typeBag.length === 0) {
          this._typeBag = ["normal", "normal", "normal", "bounce", "moving"];
          if (this.score > 300) this._typeBag.push("ghost");
          // Shuffle
          for (let i = this._typeBag.length - 1; i > 0; i--) {
            const j = Math.floor(this._kiroRand() * (i + 1));
            [this._typeBag[i], this._typeBag[j]] = [this._typeBag[j], this._typeBag[i]];
          }
        }
        return this._typeBag.pop();
      },
      generateReachablePlatform: function(prevPlat) {
        // KiroFlow v3: Dynamic gap based on horizontal distance
        const width = 60 + this._kiroRand() * 30;

        // Bounded horizontal reach so every hop is physically possible
        const reach = 210;
        const prevCenterX = prevPlat.x + prevPlat.width / 2;
        const dir = this._kiroRand() > 0.5 ? 1 : -1;
        const span = (40 + this._kiroRand() * (reach - 40)) * dir;
        let x = prevCenterX + span - width / 2;
        if (x < 8 || x > canvas.width - width - 8) {
          x = prevCenterX - span - width / 2;
        }
        x = Math.max(8, Math.min(canvas.width - width - 8, x));

        // Calculate horizontal distance to adjust vertical gap
        const prevCenter = prevPlat.x + prevPlat.width / 2;
        const newCenter = x + width / 2;
        const horizDist = Math.abs(newCenter - prevCenter);

        // Wide spread, capped by jump physics (apex ~140px) so the chain stays beatable
        const baseGap = 68;
        const gapReduction = Math.min(26, horizDist / 9);
        const vertGap = baseGap + this._kiroRand() * 42 - gapReduction;
        const y = prevPlat.y - Math.max(52, Math.min(106, vertGap));

        const type = this._pullFromBag();

        return {
          x: x, y: y, width: width, height: this.platH, type: type,
          direction: this._kiroRand() > 0.5 ? 1 : -1,
          baseSpeed: 0.025 + this._kiroRand() * 0.02,
          alpha: 1
        };
      },
      addPlatformRow: function() {
        const newPlat = this.generateReachablePlatform(this._chainTop);
        this.platforms.push(newPlat);
        this._chainTop = newPlat;
        if (this._kiroRand() < 0.4) {
          const w = 55 + this._kiroRand() * 25;
          const side = newPlat.x + newPlat.width / 2 < canvas.width / 2 ? 1 : -1;
          const dx = (90 + this._kiroRand() * 150) * side;
          const x = Math.max(8, Math.min(canvas.width - w - 8, newPlat.x + dx));
          if (Math.abs(x - newPlat.x) > 60) {
            this.platforms.push({
              x: x, y: newPlat.y - 14 - this._kiroRand() * 22, width: w, height: this.platH,
              type: this._kiroRand() < 0.25 ? "bounce" : "normal",
              direction: this._kiroRand() > 0.5 ? 1 : -1,
              baseSpeed: 0.025 + this._kiroRand() * 0.02,
              alpha: 1
            });
          }
        }
      },
      generateInitialPlatforms: function() {
        while (this._chainTop.y > -50) {
          this.addPlatformRow();
        }
      },
      update: function(delta) {
        // Particles keep falling on the game-over screen too
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx * delta;
          p.y += p.vy * delta;
          p.vy += 0.001 * delta; // gravity
          p.life -= delta;
          if (p.life <= 0) this.particles.splice(i, 1);
        }
        if (this.gameState !== "playing") return;
        // Fixed steps: jump height no longer depends on the frame rate
        let left = delta;
        while (left > 0 && this.gameState === "playing") {
          const h = Math.min(16, left);
          this.step(h);
          left -= h;
        }
      },
      step: function(delta) {
        const p = this.player;
        // Horizontal movement
        if (keysDown["ArrowLeft"] || keysDown["a"] || keysDown["A"]) {
          p.x -= 0.3 * delta; p.lookLeft = true;
        }
        if (keysDown["ArrowRight"] || keysDown["d"] || keysDown["D"]) {
          p.x += 0.3 * delta; p.lookLeft = false;
        }
        p.squash = Math.max(0, p.squash - delta);

        // Screen wrapping
        if (p.x < -p.width) {
          p.x = canvas.width;
        } else if (p.x > canvas.width) {
          p.x = -p.width;
        }

        // Apply gravity
        const prevBottom = p.y + p.height;
        p.vy += 0.002 * delta;
        p.y += p.vy * delta;
        p.onPlatform = false;

        // Move moving platforms (speed increases slightly with distance from player)
        for (let plat of this.platforms) {
          if (plat.type === "moving") {
            const dist = Math.abs(plat.y - p.y);
            const speedMult = 1 + dist / 800; // Slightly faster when far
            plat.x += plat.direction * plat.baseSpeed * speedMult * delta;
            if (plat.x < 0) { plat.x = 0; plat.direction = 1; }
            if (plat.x + plat.width > canvas.width) { plat.x = canvas.width - plat.width; plat.direction = -1; }
          }
        }

        // Update falling ghost platforms
        for (let i = this.fallingPlats.length - 1; i >= 0; i--) {
          const fp = this.fallingPlats[i];
          fp.vy += 0.003 * delta;
          fp.y += fp.vy * delta;
          fp.alpha -= 0.002 * delta;
          fp.rotation += 0.005 * delta;
          if (fp.y > canvas.height + 50 || fp.alpha <= 0) {
            this.fallingPlats.splice(i, 1);
          }
        }

        // Shift camera if above mid-screen
        let shifted = 0;
        if (p.y < canvas.height/2) {
          shifted = canvas.height/2 - p.y;
          p.y = canvas.height/2;
          for (let plat of this.platforms) plat.y += shifted;
          for (let fp of this.fallingPlats) fp.y += shifted;
          for (let pt of this.particles) pt.y += shifted;
          this.score += Math.floor(shifted);
          this.scroll = (this.scroll || 0) + shifted;
        }

        // Remove old platforms
        this.platforms = this.platforms.filter(plat => plat.y < canvas.height + 20);

        // KiroFlow: keep extending the guaranteed chain above the screen
        while (this._chainTop.y > -60) {
          this.addPlatformRow();
        }

        // Platform collision: swept, so a fast fall can't pass through
        if (p.vy > 0) {
          const bottom = p.y + p.height;
          for (let i = this.platforms.length - 1; i >= 0; i--) {
            const plat = this.platforms[i];
            if (p.x + p.width > plat.x &&
                p.x < plat.x + plat.width &&
                bottom >= plat.y &&
                prevBottom + shifted <= plat.y + plat.height * 0.6) {

              // Different platform types - particles match tile color
              if (plat.type === "bounce") {
                p.vy = -p.jumpStrength * 1.5;
                plat.sprung = 160;
                audioManager.playTone(300, 'square', 0.1, 0.4, 300);
                this.createJumpParticles(p.x + p.width/2, plat.y, "#FFD180");
              } else if (plat.type === "ghost") {
                p.vy = -p.jumpStrength;
                audioManager.playSFX('jump');
                this.createJumpParticles(p.x + p.width/2, plat.y, "#FFB6C1");
                // Ghost falls away
                this.fallingPlats.push({
                  x: plat.x, y: plat.y, width: plat.width, height: plat.height,
                  vy: 0.05, alpha: 0.8, rotation: 0
                });
                this.platforms.splice(i, 1);
              } else if (plat.type === "moving") {
                p.vy = -p.jumpStrength;
                audioManager.playSFX('jump');
                this.createJumpParticles(p.x + p.width/2, plat.y, "#A5D6A7");
              } else {
                p.vy = -p.jumpStrength;
                audioManager.playSFX('jump');
                this.createJumpParticles(p.x + p.width/2, plat.y, "#BBDEFB");
              }

              p.y = plat.y - p.height;
              p.onPlatform = true;
              p.squash = 140;
              break;
            }
          }
        }
        for (const plat of this.platforms) if (plat.sprung > 0) plat.sprung -= delta;

        // Reset if off bottom of screen
        if (p.y > canvas.height) {
          if (this.score > this.highScore) {
            this.highScore = this.score;
          }
          this.gameState = "over";
          audioManager.playSFX('gameover');
        }
      },
      createJumpParticles: function(x, y, color) {
        for (let i = 0; i < 10; i++) {
          this.particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 0.2,
            vy: -(Math.random() * 0.2 + 0.1),
            color: color,
            life: 500 + Math.random() * 200
          });
        }
        // Enforce particle limit
        if (this.particles.length > MAX_PARTICLES) {
          this.particles.splice(0, this.particles.length - MAX_PARTICLES);
        }
      },
      draw: function(ctx) {
        const W = canvas.width, H = canvas.height, S = this.S;
        const scroll = this.scroll || 0;

        // Dithered night sky
        const sky = PIX.skyGradient('jump', W, H, [[0, '#0d1240'], [0.55, '#1a237e'], [1, '#3949ab']], S);
        ctx.drawImage(sky, 0, 0, sky.width * S, sky.height * S);

        // Crisp stars on three parallax layers
        const time = performance.now();
        for (let layer = 0; layer < 3; layer++) {
          const parallaxOffset = (scroll * (0.05 + layer * 0.06)) % H;
          const stars = getEvenStarfield(`jump-stars-layer-${layer}`, 28, W, H, 90 + layer * 17);
          for (let i = 0; i < stars.length; i++) {
            const star = stars[i];
            const y = (star.y + parallaxOffset) % H;
            const twinkle = Math.sin(time / 800 + star.phase) * 0.25 + 0.75;
            ctx.globalAlpha = (0.35 + layer * 0.2) * twinkle;
            const sz = layer === 2 && star.size > 1.6 ? 2 * S : S;
            PIX.rect(ctx, Math.floor(star.x / S) * S, Math.floor(y / S) * S, sz, sz, layer === 2 ? "#FFF8E1" : "#C5CAE9");
          }
        }
        ctx.globalAlpha = 1;

        // Moon and drifting clouds
        const moonY = H * 0.16 + ((scroll * 0.02) % (H * 0.6));
        PIX.drawGlow(ctx, W * 0.8, moonY, 26 * S, "#FFF3C4", 0.3);
        PIX.draw(ctx, PIX.orb(22, "#F3E9C6", { spec: false }), W * 0.8, moonY, S);
        for (let i = 0; i < 4; i++) {
          const variant = i % 3;
          const cw = (34 + variant * 8) * S;
          const cx = ((i * 0.31 * W + time * (0.004 + i * 0.002)) % (W + cw)) - cw / 2;
          const cy = ((i * 0.27 * H + scroll * (0.15 + i * 0.05)) % (H + 60)) - 30;
          PIX.draw(ctx, this.cloudSprite(variant), Math.floor(cx / S) * S, Math.floor(cy / S) * S, S, { ax: 0, ay: 0 });
        }

        // Particles
        for (let p of this.particles) {
          ctx.globalAlpha = Math.min(1, p.life / 300);
          PIX.rect(ctx, Math.floor(p.x / S) * S, Math.floor(p.y / S) * S, S, S, p.color);
        }
        ctx.globalAlpha = 1;

        // Platforms
        for (let plat of this.platforms) {
          const pw = Math.max(4, Math.round(plat.width / S)), ph = Math.max(3, Math.round(plat.height / S));
          PIX.draw(ctx, this.platSprite(plat.type, pw, ph), plat.x, plat.y, S, { ax: 0, ay: 0 });
          if (plat.type === "bounce") {
            PIX.draw(ctx, this.springSprite(plat.sprung > 0), plat.x + plat.width / 2, plat.y + S, S, { ay: 1 });
          }
        }

        // Falling ghost platforms
        for (let fp of this.fallingPlats) {
          const pw = Math.max(4, Math.round(fp.width / S)), ph = Math.max(3, Math.round(fp.height / S));
          PIX.draw(ctx, this.platSprite("ghost", pw, ph), fp.x + fp.width / 2, fp.y + fp.height / 2, S, { rot: fp.rotation, alpha: Math.max(0, fp.alpha) });
        }

        // Player: stretched rising, flared falling, squashed on landing
        const p = this.player;
        const frame = p.vy < -0.15 ? "up" : "down";
        const img = this.bunny(frame, p.lookLeft);
        const cx = p.x + p.width / 2, by = p.y + p.height + S;
        const sq = p.squash > 0 ? p.squash / 140 : 0;
        if (sq > 0) {
          ctx.save();
          ctx.translate(cx, by);
          ctx.scale(1 + sq * 0.25, 1 - sq * 0.2);
          PIX.draw(ctx, img, 0, 0, S, { ay: 1, snap: false });
          ctx.restore();
        } else {
          PIX.draw(ctx, img, cx, by, S, { ay: 1 });
        }

        drawHUDChips(ctx, [
          { label: "Score", value: this.score },
          { label: "Best", value: this.highScore, color: "#64FFDA" }
        ]);

        // Game over screen
        if (this.gameState === "over") {
          drawGameOverScreen(ctx, {
            title: "GAME OVER",
            score: this.score,
            isNewBest: this.score === this.highScore && this.score > 0
          });
        }
      },
      keyDown: function(e) {
        if (e.key === " " && this.gameState === "over") {
          this.init();
        }
      },
      keyUp: function(e) {},
      end: function() {}
    };

    // 5. Fall
    const fallGame = {
      lines: [],
      player: null,
      lineSpeed: 0.2,
      spawnTimer: 0,
      spawnInterval: 1500,
      score: 0,
      highScore: 0,
      gameState: "playing",
      init: function() {
        const S = PIX.scaleFor();
        this.S = S;
        const d = Math.round(20 / S);
        this.player = {
          x: canvas.width/2,
          y: canvas.height - 60 - SAFE.bottom,
          radius: d * S / 2,
          d: d,
          trail: []
        };
        this.barH = 4 * S;
        this.lines = [];
        this.lineSpeed = 0.2;
        this.spawnTimer = 0;
        this.spawnInterval = 1500;
        this.score = 0;
        this.elapsed = 0;
        this.trailTimer = 0;
        this.lastGapCenter = canvas.width / 2;
        this.gameState = "playing";
        this.burst = [];
      },
      onResize: function() {
        if (!this.player) return;
        this.player.y = canvas.height - 60 - SAFE.bottom;
        this.player.x = Math.max(this.player.radius, Math.min(canvas.width - this.player.radius, this.player.x));
      },
      update: function(delta) {
        for (let i = this.burst.length - 1; i >= 0; i--) {
          const b = this.burst[i];
          b.x += b.vx * delta; b.y += b.vy * delta; b.vy += 0.0008 * delta; b.life -= delta;
          if (b.life <= 0) this.burst.splice(i, 1);
        }
        if (this.gameState !== "playing") return;
        const p = this.player;

        // Move player horizontally
        if (keysDown["ArrowLeft"] || keysDown["a"] || keysDown["A"]) {
          p.x -= 0.3 * delta;
        }
        if (keysDown["ArrowRight"] || keysDown["d"] || keysDown["D"]) {
          p.x += 0.3 * delta;
        }

        // Clamp player position to screen
        p.x = Math.max(p.radius, Math.min(canvas.width - p.radius, p.x));

        // Trail sampled on a clock so it looks the same at 30, 60 or 120 Hz
        this.trailTimer += delta;
        while (this.trailTimer >= 16) {
          this.trailTimer -= 16;
          p.trail.push({ x: p.x, y: p.y, age: 0 });
        }
        for (const t of p.trail) t.age += delta;
        while (p.trail.length > 14 || (p.trail.length && p.trail[0].age > 240)) p.trail.shift();

        // Spawn lines
        this.spawnTimer += delta;
        if (this.spawnTimer > this.spawnInterval) {
          this.spawnTimer = 0;

          // Gradually decrease spawn interval for difficulty
          this.spawnInterval = Math.max(760, this.spawnInterval - 10);

          // Gap shrinks with score, but the next gap is always reachable:
          // the player covers 0.3 px/ms, so cap the shift between gaps by travel time
          const gapWidth = 110 - Math.min(28, Math.floor(this.score / 60));
          const reach = 0.3 * this.spawnInterval * 0.72;
          const minC = Math.max(gapWidth / 2 + 6, this.lastGapCenter - reach);
          const maxC = Math.min(canvas.width - gapWidth / 2 - 6, this.lastGapCenter + reach);
          const center = minC + Math.random() * Math.max(0, maxC - minC);
          this.lastGapCenter = center;

          this.lines.push({
            y: -this.barH,
            gapX: center - gapWidth / 2,
            gapWidth: gapWidth,
            color: randomColor(),
            passed: false
          });
        }

        // Move lines downward; collide if a bar swept across the player's row
        // this frame (a fast bar used to skip right over the hit window)
        const half = this.barH / 2;
        for (let line of this.lines) {
          const prevY = line.y;
          line.y += this.lineSpeed * delta;
          if (line.passed) continue;
          const top = Math.min(prevY, line.y) - half, bottom = Math.max(prevY, line.y) + half;
          if (bottom > p.y - p.radius * 0.85 && top < p.y + p.radius * 0.85) {
            if (p.x - p.radius * 0.85 < line.gapX || p.x + p.radius * 0.85 > line.gapX + line.gapWidth) {
              this.crash(line);
              return;
            }
          }
          // Mark lines as passed once they're below the player
          if (line.y - half > p.y + p.radius) {
            line.passed = true;
            this.score += 10;
            audioManager.playTone(400 + Math.min(400, this.score), 'sine', 0.05, 0.2);
          }
        }

        // Remove off-screen lines
        this.lines = this.lines.filter(line => line.y < canvas.height + 20);

        // Increase score over time
        this.score += 0.01 * delta;
        this.elapsed += delta;

        const rampT = Math.max(0, this.elapsed - 5000);
        this.lineSpeed = Math.min(0.82, 0.2 + rampT * 0.0000118 + Math.min(0.06, this.score / 6000));
      },
      crash: function(line) {
        if (this.score > this.highScore) this.highScore = this.score;
        this.gameState = "over";
        this.hitLine = line;
        GamepadManager.rumble(180, 0.7, 0.5);
        audioManager.playSFX('explosion');
        setTimeout(() => { if (currentGame === this && this.gameState === "over") audioManager.playSFX('gameover'); }, 500);
        for (let i = 0; i < 24; i++) {
          const a = Math.random() * Math.PI * 2, sp = 0.1 + Math.random() * 0.3;
          this.burst.push({ x: this.player.x, y: this.player.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.1, life: 500 + Math.random() * 400, color: i % 3 ? "#64FFDA" : "#FFFFFF" });
        }
      },
      drawBar: function(ctx, x0, x1, y, R, capLeft, capRight) {
        const S = this.S, h = this.barH;
        if (x1 - x0 < S) return;
        const top = Math.round((y - h / 2) / S) * S;
        PIX.rect(ctx, x0, top, x1 - x0, h, R.o);
        PIX.rect(ctx, x0, top + S, x1 - x0, h - 2 * S, R.b);
        PIX.rect(ctx, x0, top + S, x1 - x0, S, R.l);
        if (h >= 4 * S) PIX.rect(ctx, x0, top + h - 2 * S, x1 - x0, S, R.d);
        // Rivets every few art pixels, anchored to the screen so they don't swim
        const step = 8 * S;
        for (let rx = Math.ceil(x0 / step) * step + 3 * S; rx < x1 - S; rx += step) {
          PIX.rect(ctx, rx, top + S, S, S, R.h);
        }
        // Glowing end caps at the gap
        if (capRight) { PIX.rect(ctx, x1 - 2 * S, top, 2 * S, h, R.h); PIX.drawGlow(ctx, x1, y, h * 2.6, R.b, 0.6); }
        if (capLeft) { PIX.rect(ctx, x0, top, 2 * S, h, R.h); PIX.drawGlow(ctx, x0, y, h * 2.6, R.b, 0.6); }
      },
      draw: function(ctx) {
        const W = canvas.width, H = canvas.height, S = this.S;
        const sky = PIX.skyGradient('fall', W, H, [[0, '#2a1680'], [0.55, '#140a3a'], [1, '#05030c']], S);
        ctx.drawImage(sky, 0, 0, sky.width * S, sky.height * S);

        // Scrolling pixel grid: dots at intersections, faint lines between
        const cell = 16 * S;
        const off = (this.gameState === "playing" ? (performance.now() * this.lineSpeed * 0.25) : 0) % cell;
        this.gridOff = this.gameState === "playing" ? off : (this.gridOff || 0);
        ctx.globalAlpha = 0.5;
        for (let y = -cell + this.gridOff; y < H; y += cell) {
          PIX.rect(ctx, 0, Math.floor(y / S) * S, W, S, "#2b1f6b");
        }
        for (let x = 0; x < W; x += cell) {
          PIX.rect(ctx, x, 0, S, H, "#221858");
        }
        ctx.globalAlpha = 1;

        // Bars with a gap
        for (let line of this.lines) {
          const R = PIX.ramp(line.color);
          const hit = this.gameState === "over" && this.hitLine === line;
          const RR = hit ? PIX.ramp("#FF4D6D") : R;
          this.drawBar(ctx, 0, line.gapX, line.y, RR, false, true);
          this.drawBar(ctx, line.gapX + line.gapWidth, W, line.y, RR, true, false);
        }

        // Player trail: shrinking squares
        const p = this.player;
        for (let i = 0; i < p.trail.length; i++) {
          const t = p.trail[i];
          const k = 1 - t.age / 240;
          if (k <= 0) continue;
          const sz = Math.max(1, Math.round(p.d * 0.6 * k)) * S;
          ctx.globalAlpha = k * 0.45;
          PIX.rect(ctx, Math.round((t.x - sz / 2) / S) * S, Math.round((t.y - (p.trail.length - i) * S * 1.2 - sz / 2) / S) * S, sz, sz, "#64FFDA");
        }
        ctx.globalAlpha = 1;

        // Player orb
        if (this.gameState === "playing") {
          PIX.drawGlow(ctx, p.x, p.y, p.radius * 3.4, "#64FFDA", 0.5);
          PIX.draw(ctx, PIX.orb(p.d, "#64FFDA"), p.x, p.y, S);
        }
        for (const b of this.burst) {
          ctx.globalAlpha = Math.max(0, Math.min(1, b.life / 400));
          PIX.rect(ctx, b.x, b.y, S, S, b.color);
        }
        ctx.globalAlpha = 1;

        drawHUDChips(ctx, [
          { label: "Score", value: Math.floor(this.score) },
          { label: "Best", value: Math.floor(this.highScore), color: "#B388FF" }
        ]);

        // Game over overlay
        if (this.gameState === "over") {
          drawGameOverScreen(ctx, {
            title: "GAME OVER",
            score: Math.floor(this.score),
            isNewBest: this.score === this.highScore && this.score > 0
          });
        }
      },
      keyDown: function(e) {
        if (e.key === " " && this.gameState === "over") {
          this.init();
        }
      },
      keyUp: function(e) {},
      end: function() {}
    };

    // 6. Drop
    const dropGame = {
      fallingBall: null,
      stationaryBalls: [],
      baseRadius: 20,
      gameState: "playing",
      score: 0,
      highScore: 0,
      particles: [],
      comboEffect: null,
      gravity: 0.0008,
      dangerY: 100,
      levelColors: ["#FF5252", "#FF9800", "#FFEB3B", "#8BC34A", "#26C6DA", "#536DFE", "#AB47BC", "#FF4081", "#FFD740", "#64FFDA"],
      colorForLevel: function(level) {
        return this.levelColors[(level - 1) % this.levelColors.length];
      },
      init: function() {
        audioManager.playMusic('drop', true);
        this.S = PIX.scaleFor();
        this.stationaryBalls = [];
        this.particles = [];
        this.rings = [];
        this.comboEffect = null;
        this.comboCount = 0;
        this.comboTimer = 0;
        this.dangerTime = 0;
        this.spawnDelay = 0;
        this.score = 0;
        this.gameState = "playing";
        this.dangerY = Math.max(100, SAFE.top + 70);
        this.nextPhase = "drop"; // drop or wait
        this.spawnFallingBall();
      },
      spawnFallingBall: function() {
        let level = 1;
        if (this.score > 150 && Math.random() < 0.3) level = 2;
        if (this.score > 500 && Math.random() < 0.15) level = 3;

        this.fallingBall = {
          x: this.fallingBall ? this.fallingBall.x : canvas.width / 2,
          y: this.dangerY - 50,
          radius: this.baseRadius + (level - 1) * 5,
          vy: 0.2,
          vx: 0,
          level: level,
          color: this.colorForLevel(level)
        };

        this.nextPhase = "drop";
      },
      applyPhysics: function(delta) {
        const maxVel = 0.5;
        const H = canvas.height - SAFE.bottom;
        // Apply gravity and physics to all stationary balls
        for (let ball of this.stationaryBalls) {
          if (!ball.vy) ball.vy = 0;
          if (!ball.vx) ball.vx = 0;
          ball.age = (ball.age || 0) + delta;

          // Apply gravity
          ball.vy += this.gravity * delta;

          // Clamp velocities
          ball.vx = Math.max(-maxVel, Math.min(maxVel, ball.vx));
          ball.vy = Math.max(-maxVel, Math.min(maxVel, ball.vy));

          // Apply velocity
          ball.y += ball.vy * delta;
          ball.x += ball.vx * delta;

          // Ground collision
          if (ball.y + ball.radius >= H) {
            ball.y = H - ball.radius;
            ball.vy = -ball.vy * 0.3; // Bounce with damping
            if (Math.abs(ball.vy) < 0.01) ball.vy = 0;
          }

          // Wall collisions
          if (ball.x - ball.radius < 0) {
            ball.x = ball.radius;
            ball.vx = -ball.vx * 0.5;
          }
          if (ball.x + ball.radius > canvas.width) {
            ball.x = canvas.width - ball.radius;
            ball.vx = -ball.vx * 0.5;
          }

          // Friction
          ball.vx *= Math.pow(0.995, delta / 16.67);

          // Landing squash relaxes back to round
          if (ball.squash) {
            ball.squash = Math.max(0, ball.squash - 0.0035 * delta);
          }
        }

        // Ball-to-ball collisions
        for (let i = 0; i < this.stationaryBalls.length; i++) {
          for (let j = i + 1; j < this.stationaryBalls.length; j++) {
            const b1 = this.stationaryBalls[i];
            const b2 = this.stationaryBalls[j];

            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const minDist = b1.radius + b2.radius;

            if (dist < minDist && dist > 0) {
              // Separate balls
              const overlap = (minDist - dist) / 2;
              const nx = dx / dist;
              const ny = dy / dist;

              b1.x -= overlap * nx;
              b1.y -= overlap * ny;
              b2.x += overlap * nx;
              b2.y += overlap * ny;

              // Exchange velocities (simplified elastic collision)
              const dvx = b1.vx - b2.vx;
              const dvy = b1.vy - b2.vy;
              const dot = dvx * nx + dvy * ny;

              if (dot > 0) {
                const restitution = 0.4;
                b1.vx -= dot * nx * restitution;
                b1.vy -= dot * ny * restitution;
                b2.vx += dot * nx * restitution;
                b2.vy += dot * ny * restitution;
              }
            }
          }
        }
      },
      // Matching neighbours merge whenever they touch, not only on the frame a
      // ball lands (balls that rolled together later used to sit there forever)
      checkMerges: function() {
        let merged = false;
        for (let i = 0; i < this.stationaryBalls.length && !merged; i++) {
          for (let j = i + 1; j < this.stationaryBalls.length; j++) {
            const b1 = this.stationaryBalls[i];
            const b2 = this.stationaryBalls[j];
            if (b1.level !== b2.level) continue;
            const dx = b1.x - b2.x, dy = b1.y - b2.y;
            if (Math.sqrt(dx * dx + dy * dy) >= b1.radius + b2.radius + 2) continue;

            const midX = (b1.x + b2.x) / 2;
            const midY = (b1.y + b2.y) / 2;
            const newLevel = b1.level + 1;
            const newRadius = this.baseRadius + (newLevel - 1) * 5;

            this.createMergeParticles(midX, midY, b1.color);
            this.rings.push({ x: midX, y: midY, r: newRadius * 0.6, max: newRadius * 2.4, life: 380, color: this.colorForLevel(newLevel) });
            audioManager.playTone(300 + newLevel * 50, 'sine', 0.1, 0.3);
            this.score += newLevel * 10;

            this.stationaryBalls.splice(j, 1);
            this.stationaryBalls.splice(i, 1);
            this.stationaryBalls.push({
              x: midX, y: midY, radius: newRadius, level: newLevel,
              color: this.colorForLevel(newLevel),
              vy: -0.1, vx: (Math.random() - 0.5) * 0.05, squash: 0.9, age: 0
            });

            this.comboCount = this.comboTimer > 0 ? this.comboCount + 1 : 1;
            this.comboTimer = 700;
            if (this.comboCount > 1) {
              audioManager.playSFX('powerup');
              this.score += 50;
              this.comboEffect = { text: this.comboCount + "x COMBO!", x: canvas.width / 2, y: canvas.height / 2, life: 1000 };
            }
            merged = true;
            break;
          }
        }
        return merged;
      },
      update: function(delta) {
        // Particles and rings settle on the game-over screen too
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx * delta;
          p.y += p.vy * delta;
          p.life -= delta;
          if (p.life <= 0) this.particles.splice(i, 1);
        }
        for (let i = this.rings.length - 1; i >= 0; i--) {
          const r = this.rings[i];
          r.life -= delta;
          r.r += 0.08 * delta;
          if (r.life <= 0 || r.r > r.max) this.rings.splice(i, 1);
        }
        if (this.comboEffect) {
          this.comboEffect.life -= delta;
          if (this.comboEffect.life <= 0) this.comboEffect = null;
        }
        if (this.gameState !== "playing") return;
        if (this.comboTimer > 0) this.comboTimer -= delta;

        // Physics in small steps so stacked balls can't tunnel on a slow frame
        let left = delta;
        while (left > 0) {
          const h = Math.min(8, left);
          this.applyPhysics(h);
          left -= h;
        }
        let guard = 0;
        while (this.checkMerges() && guard++ < 8) {}

        if (this.nextPhase === "drop") {
          const fb = this.fallingBall;
          // Horizontal control
          if (keysDown["ArrowLeft"] || keysDown["a"] || keysDown["A"]) fb.x -= 0.3 * delta;
          if (keysDown["ArrowRight"] || keysDown["d"] || keysDown["D"]) fb.x += 0.3 * delta;
          // Down drops faster
          const fast = keysDown["ArrowDown"] || keysDown["s"] || keysDown["S"];
          fb.x = Math.max(fb.radius, Math.min(canvas.width - fb.radius, fb.x));

          // Fall (sub-stepped against the pile)
          const H = canvas.height - SAFE.bottom;
          let travel = fb.vy * delta * (fast ? 3 : 1);
          let landed = false;
          while (travel > 0 && !landed) {
            const stepY = Math.min(4, travel);
            fb.y += stepY;
            travel -= stepY;
            if (fb.y + fb.radius >= H) {
              fb.y = H - fb.radius;
              fb.vy = 0;
              this.stationaryBalls.push({ ...fb, squash: 0.7, age: 0 });
              landed = true;
              break;
            }
            for (let ball of this.stationaryBalls) {
              const dx = fb.x - ball.x, dy = fb.y - ball.y;
              if (Math.sqrt(dx * dx + dy * dy) < fb.radius + ball.radius) {
                fb.vy = 0.1;
                this.stationaryBalls.push({ ...fb, squash: 0.5, age: 0 });
                landed = true;
                break;
              }
            }
          }
          if (landed) {
            audioManager.playTone(180, 'sine', 0.06, 0.25);
            this.nextPhase = "wait";
            this.spawnDelay = 260;
          }
        } else {
          this.spawnDelay -= delta;
          if (this.spawnDelay <= 0) this.spawnFallingBall();
        }

        // Game over once the pile rests above the line for a moment (a ball
        // bouncing through the line on landing no longer ends the run)
        let over = false;
        for (const b of this.stationaryBalls) {
          if (b.age > 500 && b.y - b.radius < this.dangerY) { over = true; break; }
        }
        this.dangerTime = over ? this.dangerTime + delta : Math.max(0, this.dangerTime - delta * 2);
        if (this.dangerTime > 1100) {
          if (this.score > this.highScore) this.highScore = this.score;
          this.gameState = "over";
          audioManager.stopMusic();
          audioManager.playSFX('gameover');
        }
      },
      createMergeParticles: function(x, y, color) {
        for (let i = 0; i < 20; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.1 + Math.random() * 0.2;
          this.particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: color,
            life: 500 + Math.random() * 500
          });
        }
        if (this.particles.length > MAX_PARTICLES) {
          this.particles.splice(0, this.particles.length - MAX_PARTICLES);
        }
      },
      // Each level is its own little planet: shading plus a surface pattern
      planet: function(level, d) {
        const color = this.colorForLevel(level);
        return PIX.get('drop-planet:' + level + ':' + d, () => {
