<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <script src="./assets/vendor/lucide.min.js"></script>
  <script src="./assets/vendor/three.min.js"></script>
  <title>TSS Play Mini</title>
  
  <!-- PWA & iOS Support -->
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TSS Play Mini">
  <meta name="theme-color" content="#000000">
  
  <!-- Icons -->
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="apple-touch-startup-image" href="./assets/icons/icon-512.png">

  <style>
    @font-face {
      font-family: 'Inter';
      src: url('./assets/fonts/Inter-Variable.ttf') format('truetype');
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      --primary-color: #ffffff;
      --secondary-color: #e8e8f0;
      --background-color: #121212;
      --surface-color: #1e1e1e;
      --text-primary: rgba(255, 255, 255, 0.9);
      --text-secondary: rgba(255, 255, 255, 0.6);
      --font-family: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box; margin: 0; padding: 0;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    *::selection { background: transparent; }
    button { outline: none; }
    button:focus { outline: none; }
    button:focus-visible { outline: 2px solid rgba(255,255,255,0.7); outline-offset: 2px; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      margin: 0; padding: 0;
      position: fixed; inset: 0; /* Force full viewport filling for AirPlay/iOS */
      touch-action: manipulation;
      overscroll-behavior: none;
      background: #000; color: var(--text-primary);
      font-family: var(--font-family);
    }

    /* CRT Overlay */
    .crt-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none; z-index: 9999;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
      animation: flicker 0.15s infinite;
    }
    @keyframes flicker {
      0% { opacity: 0.97; } 100% { opacity: 1; }
    }

    /* XMB Menu */
    #menu {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center;
      background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
      z-index: 2000; overflow: hidden;
    }

    .xmb-track {
      display: flex; align-items: center;
      padding-left: 50%; /* Center start */
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .xmb-item {
      --accent: #ffffff;
      flex: 0 0 auto; width: 200px; height: 140px; margin: 0 20px;
      background: #232328; border-radius: 16px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease, background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      opacity: 0.45; transform: scale(0.82);
      border: 2px solid rgba(255, 255, 255, 0.04);
      position: relative; cursor: pointer;
    }

    .xmb-item.active {
      opacity: 1; transform: scale(1.1);
      background: linear-gradient(165deg, #34343c 0%, #232328 100%);
      border-color: var(--accent);
      box-shadow: 0 0 26px color-mix(in srgb, var(--accent) 38%, transparent), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .xmb-item:active { transform: scale(1.04); }

    .xmb-icon { margin-bottom: 12px; color: rgba(255,255,255,0.75); transition: color 0.3s ease; }
    .xmb-icon svg { width: 44px; height: 44px; stroke-width: 1.75; }
    .xmb-item.active .xmb-icon { color: var(--accent); filter: drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 60%, transparent)); }
    .xmb-title { font-weight: 700; font-size: 1.05rem; letter-spacing: 0.02em; }
    .xmb-best {
      position: absolute; bottom: 10px; font-size: 0.62rem; font-weight: 600;
      letter-spacing: 0.08em; color: rgba(255,255,255,0.35);
      opacity: 0; transition: opacity 0.3s ease;
    }
    .xmb-item.active .xmb-best { opacity: 1; }

    .menu-header {
      position: absolute; top: 10%; left: 0; width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 18px;
    }
    .menu-header img {
      height: 19px; width: auto;
      filter: drop-shadow(0 2px 10px rgba(255,255,255,0.18));
    }
    .menu-header span {
      text-transform: uppercase; letter-spacing: 7px; font-weight: 300; font-size: 1rem;
      line-height: 1; color: var(--text-secondary); transform: translateY(1px);
    }

    /* Game Canvas */
    #game-container { position: relative; width: 100%; height: 100%; }
    #gameCanvas { display: none; width: 100%; height: 100%; }

    #gameCanvas, #webglCanvas { touch-action: none; }

    /* HUD Elements */
    #controls {
      position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom));
      display: none; align-items: end; justify-content: space-between;
      padding: 0 max(16px, env(safe-area-inset-left)) 0 max(16px, env(safe-area-inset-right));
      z-index: 2100; pointer-events: none;
    }
    #controls.active { display: flex; }
    .control-pad {
      display: grid;
      grid-template-columns: 62px 62px 62px;
      grid-template-rows: 62px 62px;
      gap: 10px;
      pointer-events: none;
    }
    .control-actions {
      display: grid;
      grid-template-columns: 62px 62px;
      gap: 10px;
      pointer-events: none;
    }
    .control-btn {
      pointer-events: auto;
      position: relative;
      width: 62px; height: 62px; border-radius: 20px;
      background: rgba(16, 16, 20, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: rgba(255, 255, 255, 0.92); font-size: 22px; font-weight: 700;
      font-family: var(--font-family);
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 8px 20px rgba(0,0,0,0.4);
      touch-action: none;
      transition: background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
    }
    .control-btn[data-pressed="true"],
    .control-btn:active {
      background: rgba(255, 255, 255, 0.92);
      border-color: rgba(255, 255, 255, 0.95);
      color: #000;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.45), inset 0 1px 0 rgba(255,255,255,0.3);
      transform: scale(0.95);
    }
    .control-btn::before {
      content: ""; position: absolute; inset: -5px; border-radius: 24px;
    }
    .control-btn svg {
      width: 27px; height: 27px; stroke-width: 2.6;
      pointer-events: none;
    }
    .control-btn.action-btn {
      font-size: 27px; font-weight: 900; font-style: italic;
      letter-spacing: -0.03em;
      padding-right: 3px;
      border-color: rgba(255, 255, 255, 0.26);
    }
    @media (max-width: 820px) {
      .control-pad { grid-template-columns: 56px 56px 56px; grid-template-rows: 56px 56px; gap: 8px; }
      .control-actions { grid-template-columns: 56px 56px; gap: 8px; }
      .control-btn { width: 56px; height: 56px; font-size: 20px; border-radius: 16px; }
    }

    /* Achievements */
    #achievement-area {
      position: fixed; top: 20px; right: 20px; width: 300px;
      display: flex; flex-direction: column; gap: 10px; z-index: 10000;
    }
    .achievement {
      background: rgba(16, 16, 20, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 13px 16px; color: #fff;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.07);
      animation: toastIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) forwards, toastOut 0.4s ease-in 3.4s forwards;
      display: flex; align-items: center; gap: 13px;
    }
    @keyframes toastIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes toastOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(30px); opacity: 0; } }
    .achievement .toast-icon {
      flex: 0 0 auto; width: 38px; height: 38px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255, 215, 64, 0.12); color: #FFD740;
    }
    .achievement .toast-icon svg { width: 21px; height: 21px; stroke-width: 2; }
    .achievement .toast-title { font-weight: 700; font-size: 0.92rem; letter-spacing: 0.01em; }
    .achievement .toast-desc { font-size: 0.78rem; color: rgba(255, 255, 255, 0.6); margin-top: 2px; }

    /* Attract Mode */
    #attract-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4); z-index: 5000;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; pointer-events: none;
    }
    .blink-text { animation: blink 1s infinite; font-size: 2rem; font-weight: 900; letter-spacing: 5px; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Instructions */
    #instructions {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 20px;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    #instructions.active { opacity: 1; }

    /* High Scores */
    #highscore-display {
      position: absolute; bottom: 15%; width: 100%; text-align: center;
      font-size: 0.9rem; color: #aaa;
    }

    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; display: flex; align-items: center; justify-content: center;
      z-index: 3000; transition: opacity 0.3s; opacity: 0; pointer-events: none;
    }
    #loading.active { opacity: 1; pointer-events: all; }

    /* Touch: back to menu (there is no Escape key on a phone) */
    #backButton {
      position: fixed; z-index: 2200; display: none;
      top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left));
      width: 40px; height: 40px; border-radius: 14px; padding: 0;
      background: rgba(16, 16, 20, 0.62); color: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 8px 20px rgba(0,0,0,0.4);
      align-items: center; justify-content: center; touch-action: none;
      transition: background 0.1s ease, transform 0.1s ease;
    }
    #backButton:active { background: rgba(255, 255, 255, 0.92); color: #000; transform: scale(0.94); }
    #backButton svg { width: 22px; height: 22px; display: block; margin: auto; }

    /* Per-game touch layouts: gesture-native games hide the pad so it never covers play */
    #controls[data-layout="none"] .control-pad,
    #controls[data-layout="none"] .control-actions,
    #controls[data-layout="action"] .control-pad { visibility: hidden; }
    #controls[data-layout="action"] .control-btn[data-control="b"],
    #controls[data-layout="full"] .control-btn[data-control="b"] { display: none; }
    #controls[data-layout="action"] .control-actions,
    #controls[data-layout="full"] .control-actions { grid-template-columns: auto; }

    @media (max-width: 700px) {
      #instructions {
        top: max(58px, calc(env(safe-area-inset-top) + 50px));
        max-width: calc(100% - 32px); text-align: center; font-size: 0.86rem; line-height: 1.35;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .crt-overlay { animation: none; }
      .xmb-track, .xmb-item { transition-duration: 0.01s; }
    }
  </style>
</head>
<body>
  <div class="crt-overlay"></div>
  <div id="achievement-area"></div>
  
  <div id="app-container">
    <!-- Menu -->
    <section id="menu" style="display: flex;">
      <div class="menu-header"><img src="./assets/logo/tss-logo-white.png" alt="TSS"><span>Play Mini</span></div>
      <div class="xmb-track" id="xmb-track" style="transform: translateX(0px);"></div>
      <div id="highscore-display">HIGH SCORE: 0</div>
      <footer style="position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 0.7rem; color: #444;">
        © 2026 Tobias Schmidt Services LLC • PRESS ENTER / A TO START
      </footer>
    </section>

    <!-- Game -->
    <main id="game-container">
      <canvas id="gameCanvas" width="765" height="697" style="display: none;"></canvas>
      <canvas id="webglCanvas" style="display: none; width: 100%; height: 100%;"></canvas>
      <div id="mindcraft-ui" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px;">
          <div style="position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: rgba(255,255,255,0.8);"></div>
          <div style="position: absolute; left: 50%; top: 0; width: 2px; height: 100%; background: rgba(255,255,255,0.8);"></div>
        </div>
        <div id="mindcraft-hotbar" style="position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; background: rgba(12, 12, 12, 0.55); padding: 4px; border-radius: 4px; border: 2px solid rgba(0, 0, 0, 0.7); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);">
        </div>
      </div>
      <div id="instructions" class="">Up/Down to move. First to 5.</div>
      <div id="attract-overlay" style="display: none;">
        <div class="blink-text">PRESS START</div>
      </div>
    </main>

    <!-- Controls -->
    <div id="controls">
      <!-- Touch controls generated if needed -->
    </div>
    
    <div id="loading" class=""><div class="spinner" style="width:40px;height:40px;border:4px solid #333;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite"></div></div>
  </div>

  <button id="backButton" type="button" aria-label="Back to menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>

  <script>
    // Constants & Config
    const FEATURES = { listnr: false };
    const GAMES = [
      { id: 'pong', name: 'Pong', icon: 'move-vertical', color: '#E0E0E0' },
      { id: 'breakout', name: 'Breakout', icon: 'grid-3x3', color: '#448AFF' },
      { id: 'invader', name: 'Invader', icon: 'rocket', color: '#69F0AE' },
      { id: 'jump', name: 'Jump', icon: 'rabbit', color: '#64FFDA' },
      { id: 'fall', name: 'Fall', icon: 'arrow-down-circle', color: '#B388FF' },
      { id: 'drop', name: 'Drop', icon: 'citrus', color: '#FFD740' },
      { id: 'tetris', name: 'Tetris', icon: 'layout-grid', color: '#40C4FF' },
      { id: 'dino', name: 'Run', icon: 'footprints', color: '#4ECDC4' },
      { id: 'crossy', name: 'Crossy', icon: 'turtle', color: '#81C784' },
      { id: 'shooter', name: 'Shooter', icon: 'crosshair', color: '#FFAB40' },
      { id: 'survivor', name: 'Survivor', icon: 'swords', color: '#FF5252' },
      { id: 'drift', name: 'Drift', icon: 'car-front', color: '#18FFFF' },
      { id: 'ghost', name: 'Ghost', icon: 'ghost', color: '#FFEB3B' },
      { id: 'snake', name: 'Snake', icon: 'worm', color: '#76FF03' },
      { id: 'mindcraft', name: 'Blocks', icon: 'pickaxe', color: '#A1887F' },
      { id: 'groove', name: 'Groove', icon: 'audio-lines', color: '#8C63FF' },
      { id: 'stack', name: 'Stack', icon: 'layers', color: '#F06292' },
      { id: 'crew', name: 'Crew', icon: 'users', color: '#FF5252' },
      { id: 'listnr', name: "Listn'r", icon: 'headphones', color: '#69F0AE', flag: 'listnr' }
    ].filter(g => !g.flag || FEATURES[g.flag]);
    
    // ------------------------------------------------
    // Core Systems (Storage, Gamepad, Achievements)
    // ------------------------------------------------
    
    const StorageManager = {
      saveScore: function(game, score) {
        const key = `tss_mini_${game}_hiscore`;
        const current = this.getScore(game);
        if (score > current) {
          localStorage.setItem(key, score);
          return true; // New record
        }
        return false;
      },
      getScore: function(game) {
        return parseInt(localStorage.getItem(`tss_mini_${game}_hiscore`)) || 0;
      }
    };

    const AchievementManager = {
      unlocked: new Set(JSON.parse(localStorage.getItem('tss_mini_achievements')) || []),
      achievements: {
        'first_win': { title: 'First Blood', desc: 'Win your first game' },
        'tetris_master': { title: 'Tetris Master', desc: 'Clear 4 lines at once' },
        'survivor_5': { title: 'Survivor', desc: 'Reach Wave 5' },
        'score_1000': { title: 'High Roller', desc: 'Score 1000+ points' }
      },
      unlock: function(id) {
        if (this.unlocked.has(id)) return;
        this.unlocked.add(id);
        localStorage.setItem('tss_mini_achievements', JSON.stringify([...this.unlocked]));
        this.showPopup(id);
        audioManager.playSFX('powerup');
      },
      showPopup: function(id) {
        const data = this.achievements[id];
        if (!data) return;
        const div = document.createElement('div');
        div.className = 'achievement';
        div.innerHTML = `<div class="toast-icon"><i data-lucide="trophy"></i></div><div><div class="toast-title">${data.title}</div><div class="toast-desc">${data.desc}</div></div>`;
        document.getElementById('achievement-area').appendChild(div);
        if (window.lucide) lucide.createIcons();
        setTimeout(() => div.remove(), 4000);
      }
    };

    const GamepadManager = {
      connected: false,
      prevButtons: {},
      deadzone: 0.2,
      latest: null,
      lastPadIndex: null,
      
      init: function() {
        window.addEventListener("gamepadconnected", (e) => {
          this.connected = true;
          this.lastPadIndex = e.gamepad.index;
          console.log("Gamepad connected:", e.gamepad.id);
        });
        window.addEventListener("gamepaddisconnected", (e) => {
          if (this.lastPadIndex === e.gamepad.index) this.lastPadIndex = null;
          this.connected = false;
        });
      },

      getActivePad: function() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        if (!gamepads) return null;

        if (this.lastPadIndex !== null) {
          const previous = gamepads[this.lastPadIndex];
          if (previous && previous.connected) return previous;
        }

        for (let i = 0; i < gamepads.length; i++) {
          if (gamepads[i] && gamepads[i].connected) {
            this.lastPadIndex = gamepads[i].index;
            return gamepads[i];
          }
        }
        return null;
      },
      
      poll: function() {
        const gp = this.getActivePad();
        this.connected = !!gp;
        if (!gp || !gp.buttons) {
          this.latest = null;
          this.prevButtons = {};
          return null;
        }

        const btn = (i) => gp.buttons[i] ? gp.buttons[i].pressed : false;
        const btnVal = (i) => gp.buttons[i] ? (typeof gp.buttons[i].value === 'number' ? gp.buttons[i].value : (gp.buttons[i].pressed ? 1 : 0)) : 0;
        const rawAxis = (i) => gp.axes && typeof gp.axes[i] === 'number' ? gp.axes[i] : 0;
        // Radial deadzone per stick so diagonals feel the same as cardinals
        const stick = (ix, iy) => {
          let x = rawAxis(ix), y = rawAxis(iy);
          const mag = Math.hypot(x, y);
          if (mag < this.deadzone) return [0, 0];
          const s = Math.min(1, (mag - this.deadzone) / (1 - this.deadzone)) / mag;
          return [x * s, y * s];
        };
        const [lsx, lsy] = stick(0, 1);
        const [rsx, rsy] = stick(2, 3);

        // D-pad: standard mapping buttons 12-15, with a DirectInput hat-switch
        // fallback (many generic/older pads report the d-pad as one axis)
        let dUp = btn(12), dDown = btn(13), dLeft = btn(14), dRight = btn(15);
        if (gp.mapping !== 'standard' && !dUp && !dDown && !dLeft && !dRight && gp.axes) {
          const hat = gp.axes[9];
          if (typeof hat === 'number' && hat >= -1 && hat <= 1) {
            const v = Math.round((hat + 1) / 2 * 7);
            dUp = v === 7 || v === 0 || v === 1;
            dRight = v >= 1 && v <= 3;
            dDown = v >= 3 && v <= 5;
            dLeft = v >= 5 && v <= 7;
          }
        }

        // Triggers: analog value when exposed, else digital press (Safari /
        // DirectInput pads sometimes only report pressed booleans)
        const trigL = Math.max(btnVal(6), btn(6) ? 1 : 0);
        const trigR = Math.max(btnVal(7), btn(7) ? 1 : 0);

        const state = {
          up: dUp || lsy < -0.5,
          down: dDown || lsy > 0.5,
          left: dLeft || lsx < -0.5,
          right: dRight || lsx > 0.5,
          a: btn(0) || btn(2),
          b: btn(1) || btn(8),
          x: btn(2),
          y: btn(3),
          // Raw face buttons for games that give each one its own job (Groove)
          cross: btn(0), circle: btn(1), square: btn(2), triangle: btn(3),
          l1: btn(4), r1: btn(5),
          l2: btn(6), r2: btn(7),
          l3: btn(10), r3: btn(11),
          start: btn(9),
          select: btn(8),
          axes: [lsx, lsy, rsx, rsy],
          triggers: [trigL, trigR]
        };
        
        const justPressed = {};
        for (let k in state) {
          justPressed[k] = state[k] && !this.prevButtons[k];
        }
        
        this.prevButtons = { ...state };
        this.latest = { state, justPressed, index: gp.index };
        return this.latest;
      },

      rumble: function(duration = 60, strong = 0.25, weak = 0.2) {
        const gp = this.getActivePad();
        if (!gp) return;
        try {
          if (gp.vibrationActuator && gp.vibrationActuator.playEffect) {
            gp.vibrationActuator.playEffect("dual-rumble", {
              duration: duration,
              strongMagnitude: strong,
              weakMagnitude: weak
            }).catch(() => {});
            return;
          }
          if (gp.hapticActuators && gp.hapticActuators[0] && gp.hapticActuators[0].pulse) {
            gp.hapticActuators[0].pulse(Math.max(strong, weak), duration).catch(() => {});
          }
        } catch (_) {}
      }

      init: function() {

        this.ctx = new AudioContext();
        this.masterGain = this.ctx.createGain();

      toggleMute: function() {
        this.muted = !this.muted;
        if (this.masterGain) this.masterGain.gain.value = this.muted ? 0 : 0.3;
        if (this.activeAudioElement) this.activeAudioElement.volume = this.muted ? 0 : 0.4;
        return this.muted;
      },

      playTone: function(freq, type, duration, vol = 1, slide = 0) {
        if (!this.ctx || this.muted) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          if (slide !== 0) {
              osc.frequency.linearRampToValueAtTime(freq + slide, this.ctx.currentTime + duration);
          }
          
          // Lower SFX volume slightly as requested
          gain.gain.setValueAtTime(vol * 0.7, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
          
          osc.connect(gain);
          gain.connect(this.masterGain);
          
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) { console.error("Audio error", e); }
      },

      playNoise: function(duration, vol = 1) {
        if (!this.ctx || this.muted) return;
        try {
          const bufferSize = this.ctx.sampleRate * duration;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          
          const gain = this.ctx.createGain();
          // Lower noise volume slightly
          gain.gain.setValueAtTime(vol * 0.6, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
          
          noise.connect(gain);
          gain.connect(this.masterGain);
          
          noise.start();
        } catch(e) {}
      },

      playSFX: function(name) {
        if (!this.ctx) this.init(); // Auto-init if needed

        switch (name) {
          case 'select':

            break;
          case 'start':
            this.playTone(440, 'square', 0.1, 0.5);
            setTimeout(() => this.playTone(660, 'square', 0.2, 0.5), 100);
            break;
          case 'jump':
            this.playTone(150, 'square', 0.2, 0.4, 300);
            break;
          case 'shoot':
            this.playTone(880, 'square', 0.1, 0.3, -600);
            break;
          case 'hit':
            this.playNoise(0.1, 0.5);
            break;
          case 'explosion':
            this.playNoise(0.3, 0.6);
            break;
          case 'score':
            this.playTone(1000, 'square', 0.1, 0.3);
            setTimeout(() => this.playTone(1500, 'square', 0.2, 0.3), 80);
            break;
           case 'powerup':
            this.playTone(600, 'sine', 0.1, 0.4, 200);
            setTimeout(() => this.playTone(900, 'sine', 0.1, 0.4, 200), 100);
            setTimeout(() => this.playTone(1200, 'sine', 0.2, 0.4, 200), 200);
            break;
          case 'gameover':
            this.playTone(300, 'sawtooth', 0.3, 0.5, -100);
            setTimeout(() => this.playTone(200, 'sawtooth', 0.3, 0.5, -50), 250);
            setTimeout(() => this.playTone(100, 'sawtooth', 0.6, 0.5, -20), 500);
            break;
          case 'win':
             this.playTone(523.25, 'triangle', 0.1, 0.5);
             setTimeout(() => this.playTone(659.25, 'triangle', 0.1, 0.5), 100);
             setTimeout(() => this.playTone(783.99, 'triangle', 0.1, 0.5), 200);
             setTimeout(() => this.playTone(1046.50, 'triangle', 0.4, 0.5), 300);
             break;
        }
      },
      
      stopMusic: function() {
        // Stop oscillator music
        if (this.bgmInterval) {
            clearInterval(this.bgmInterval);
            this.bgmInterval = null;
        }
        // Stop HTML5 audio
        if (this.activeAudioElement) {
          this.activeAudioElement.pause();
          this.activeAudioElement.currentTime = 0;
          this.activeAudioElement = null;
        }
        this.currentMusic = null;
      },
      
      playMusic: function(type, force = false) {
         if (this.muted) return;
         if (!this.ctx && !force) return;
         if (this.currentMusic === type && !force && this.activeAudioElement && !this.activeAudioElement.paused) return;
         
         this.stopMusic();
         this.currentMusic = type;
         
         // Check if we have an MP3 for this type
         if (this.tracks[type]) {
           try {
             const audio = new Audio(this.tracks[type]);
             audio.loop = true;
             audio.volume = 0.4;
             audio.preload = 'auto';
             audio.playsInline = true;
             audio.addEventListener('ended', () => {
               if (this.activeAudioElement === audio) audio.currentTime = 0;
             });
             
             const promise = audio.play();
             if (promise) {
               promise.catch(e => console.log("Audio play failed (interaction needed):", e));
             }
             this.activeAudioElement = audio;
           } catch (e) {
             console.error("Audio setup error:", e);
             this.currentMusic = null;
           }
           return;
         }
         
         // Fallback to oscillator music for others
         if (!this.ctx) return;
         
         let note = 0;
         const patterns = {
             'menu': {
               speed: 280,
               mel: [440, 0, 523.25, 0, 659.25, 0, 523.25, 0, 440, 0, 392, 0, 329.63, 0, 392, 0],
               bass: [110, 0, 0, 0, 130.81, 0, 0, 0, 110, 0, 0, 0, 98, 0, 0, 0]
             },
             'action': {
               speed: 140,
               mel: [330, 0, 392, 440, 0, 392, 0, 330, 294, 0, 330, 392, 0, 440, 494, 0],
               bass: [110, 110, 0, 110, 87.31, 87.31, 0, 87.31, 98, 98, 0, 98, 110, 110, 0, 110]
             },
             'calm': {
               speed: 460,
               mel: [329.63, 0, 392, 0, 0, 0, 293.66, 0, 329.63, 0, 261.63, 0, 0, 0, 246.94, 0],
               bass: [130.81, 0, 0, 0, 98, 0, 0, 0, 110, 0, 0, 0, 98, 0, 0, 0]
             }
         };
         const pat = patterns[type] || patterns['menu'];

         this.bgmInterval = setInterval(() => {
             if (!document.hidden && !this.muted) {
                 const m = pat.mel[note % pat.mel.length];
                 const b = pat.bass[note % pat.bass.length];
                 if (m > 0) this.playTone(m, 'triangle', 0.13, 0.045);
                 if (b > 0) this.playTone(b, 'sine', 0.2, 0.06);
                 if (type === 'action' && note % 4 === 2) this.playNoise(0.015, 0.04);
                 note = (note + 1) % pat.mel.length;
             }
         }, pat.speed);
      }

    const canvas = document.getElementById("gameCanvas");

    // HiDPI: every game draws in CSS pixels (canvas.width/height report the
    // CSS size) while the backing store runs at device resolution, capped at
    // 2x. Pixel art and text stay sharp on Retina screens. A light governor
    // steps the resolution down if a device can't keep its frame rate.
    const VIEW = { dpr: 1, cap: 2, maxCap: 2, best: 1000, winT: 0, winN: 0, winSum: 0, slowFor: 0, graceMs: 0 };
    (function installHiDPI() {
      const proto = HTMLCanvasElement.prototype;
      const wd = Object.getOwnPropertyDescriptor(proto, 'width');
      const hd = Object.getOwnPropertyDescriptor(proto, 'height');
      if (!wd || !hd || !wd.set || !hd.set) return;
      let lw = canvas.width, lh = canvas.height;
      const sync = () => {
        ctx.setTransform(VIEW.dpr, 0, 0, VIEW.dpr, 0, 0);
        ctx.imageSmoothingEnabled = false;
      };
      Object.defineProperty(canvas, 'width', {
        configurable: true,
        get() { return lw; },
        set(v) { lw = Math.max(1, Math.round(v)); wd.set.call(canvas, Math.max(1, Math.round(lw * VIEW.dpr))); sync(); }
      });
      Object.defineProperty(canvas, 'height', {
        configurable: true,
        get() { return lh; },
        set(v) { lh = Math.max(1, Math.round(v)); hd.set.call(canvas, Math.max(1, Math.round(lh * VIEW.dpr))); sync(); }
      });
    })();

    // Feeds the governor with real frame intervals. Only a sustained drop well
    // below what this device managed earlier (menu, previous games) counts, so
    // a 30 Hz Low Power Mode phone isn't punished for being 30 Hz.
    function trackFramePacing(interval) {
      if (document.hidden || interval <= 0 || interval > 250) return;
      VIEW.winSum += interval; VIEW.winN++; VIEW.winT += interval;
      if (VIEW.winT < 1000) return;
      const avg = VIEW.winSum / VIEW.winN;
      VIEW.winT = 0; VIEW.winSum = 0; VIEW.winN = 0;
      VIEW.best = Math.max(6, Math.min(VIEW.best, avg));
      const active = currentGame && currentGameType !== 'mindcraft' && canvas.style.display !== 'none';
      if (!active || VIEW.graceMs > 0) { VIEW.slowFor = 0; return; }
      // Slow means both well under this device's best and under ~50 fps:
      // a 120 Hz screen settling at a smooth 60 isn't a reason to blur it
      if (avg > Math.max(VIEW.best * 1.35, 20) && VIEW.cap > 1) {
        VIEW.slowFor++;
        if (VIEW.slowFor >= 2) {
          VIEW.slowFor = 0;
          VIEW.cap = Math.max(1, VIEW.cap - 0.5);
          if (Math.min(window.devicePixelRatio || 1, VIEW.cap) !== VIEW.dpr) resizeCanvas();
        }
      } else {
        VIEW.slowFor = 0;
      }
    }

    const MenuManager = {

          if (!this.active || this.swipePointer !== e.pointerId || this.swipeStartX === null) return;

            if (dx < 0) this.navigate(1);

          this.swipePointer = null;

        const items = document.querySelectorAll('.xmb-item');

          el.className = `xmb-item ${i === this.selectedIndex ? 'active' : ''}`;

    function isStandaloneMode() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    function isMobileLike() {
      if (navigator.userAgentData && typeof navigator.userAgentData.mobile === 'boolean') {
        if (navigator.userAgentData.mobile) return true;
      }

      const ua = navigator.userAgent || '';
      if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua)) {
        return true;
      }

      // iPadOS desktop-class UA reports "MacIntel" but still has touch points.
      if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) {
        return true;
      }

      const hasTouch = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
      const coarsePointer = window.matchMedia('(pointer: coarse)').matches || window.matchMedia('(any-pointer: coarse)').matches;
      const desktopLikeUA = /Windows NT|Macintosh|X11|CrOS|Linux x86_64/i.test(ua);
      return hasTouch && coarsePointer && !desktopLikeUA;

    function drawGameOverScreen(ctx, o) {
      ctx.save();
      ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      const cx = canvas.width / 2, cy = canvas.height / 2;
      const accent = o.titleColor || "#FF6B6B";
      // Chunky pixel-font title with a hue-shifted drop shadow
      const title = o.title || "GAME OVER";
      const ps = Math.max(3, Math.min(7, Math.floor((canvas.width * 0.88) / (title.length * 6 + 2))));
      const R = PIX.ramp(accent);
      const ty = cy - 30 - ps * 5;
      PIX.drawGlow(ctx, cx, ty, Math.min(canvas.width * 0.45, title.length * 6 * ps * 0.6), accent, 0.28);
      PIX.text(ctx, title, cx, ty, ps, accent, { shadow: R.d, outline: R.o });
      let y = cy + 4;
      if (o.score !== undefined) {
        ctx.fillStyle = "#fff";
        ctx.font = "700 24px Inter";
        ctx.fillText((o.scoreLabel || "Score") + ": " + o.score, cx, y);
        y += 32;
      }
      ctx.font = "600 18px Inter";
      // Games pass isNewBest to opt in; the shell knows the real answer
      // (stored best captured before this run's score was saved).
      const newBest = o.isNewBest !== undefined &&
        (currentGame && currentGame._newBest !== undefined ? currentGame._newBest : o.isNewBest);
      if (newBest) {
        const t = performance.now();
        PIX.text(ctx, "NEW HIGH SCORE!", cx, y - 6, 3, (Math.floor(t / 180) % 2) ? "#FFD740" : "#FFF3B0", { shadow: "#7a4a00" });
        y += 30;
      }
      if (o.lines) {
        ctx.fillStyle = "rgba(255,255,255,0.85)";
        for (const line of o.lines) { ctx.fillText(line, cx, y); y += 28; }
      }
      ctx.fillStyle = "rgba(255,255,255,0.92)";
      ctx.font = "500 17px Inter";
      ctx.fillText(o.prompt || getReplayPromptText(), cx, y + 12);
      ctx.restore();
    }

    function drawHUDChips(ctx, chips, opts) {
      opts = opts || {};
      ctx.save();
      ctx.textBaseline = "middle";
      const padX = 14, gap = 16, h = 34;
      const labelFont = "700 11px Inter";
      const valueFont = "800 15px Inter";
      let total = padX * 2 + gap * (chips.length - 1);
      const parts = chips.map(c => {
        ctx.font = labelFont;
        const lw = c.label ? ctx.measureText(String(c.label).toUpperCase()).width + 7 : 0;
        ctx.font = valueFont;
        const vw = ctx.measureText(String(c.value)).width;
        total += lw + vw;
        return { lw, vw };
      });
      const x = opts.x !== undefined ? opts.x : canvas.width - total - 14;
      const y = opts.y !== undefined ? opts.y : 14;
      ctx.fillStyle = "rgba(10, 12, 18, 0.66)";
      ctx.beginPath();
      ctx.roundRect(x, y, total, h, 12);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.14)";
      ctx.lineWidth = 1;
      ctx.stroke();
      let cx = x + padX;
      const cy = y + h / 2 + 1;
      ctx.textAlign = "left";
      for (let i = 0; i < chips.length; i++) {
        const c = chips[i];
        if (c.label) {
          ctx.font = labelFont;
          ctx.fillStyle = "rgba(255,255,255,0.48)";
          ctx.fillText(String(c.label).toUpperCase(), cx, cy);
          cx += parts[i].lw;
        }
        ctx.font = valueFont;
        ctx.fillStyle = c.color || "#fff";
        ctx.fillText(String(c.value), cx, cy);
        cx += parts[i].vw + gap;
      }
      ctx.restore();
      return { x: x, y: y, w: total, h: h };
    }

    function drawPixmap(ctx, rows, palette, x, y, px) {
      for (let r = 0; r < rows.length; r++) {
        const row = rows[r];
        for (let c = 0; c < row.length; c++) {
          const col = palette[row[c]];
          if (col) { ctx.fillStyle = col; ctx.fillRect(x + c * px, y + r * px, px + 0.5, px + 0.5); }
        }
      }
    }

    // ------------------------------------------------
    // Pixel art kit
    // Sprites are authored as rows of palette letters, baked once into tiny
    // canvases and drawn scaled with smoothing off. Shading ramps shift hue
    // (cool shadows, warm lights) the way hand-made pixel art does.
    // ------------------------------------------------
    const PIX = (() => {
      const cache = new Map();
      const rgbCache = new Map();
      const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

      function rgba(hex) {
        let v = rgbCache.get(hex);
        if (v) return v;
        let h = hex.charAt(0) === '#' ? hex.slice(1) : hex;
        if (h.length === 3 || h.length === 4) h = h.split('').map(c => c + c).join('');
        const n = parseInt(h.slice(0, 6), 16);
        v = [(n >> 16) & 255, (n >> 8) & 255, n & 255, h.length === 8 ? parseInt(h.slice(6, 8), 16) : 255];
        rgbCache.set(hex, v);
        return v;
      }
      const hex = (r, g, b) => '#' + [r, g, b].map(c => Math.max(0, Math.min(255, Math.round(c))).toString(16).padStart(2, '0')).join('');
      function mix(a, b, t) {
        const A = rgba(a), B = rgba(b);
        return hex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);

          'right': 'ArrowRight',
          'enter': ' ', 
          'esc': 'Escape'

            // Trigger game's specific keyDown handler if it exists

          btn.textContent = cfg.label;
          btn.classList.add('action-btn');
        }
        btn.type = 'button';
        btn.dataset.control = cfg.id;

        const down = (e) => {
          if (!this.enabled) return;
          e.preventDefault();
          e.stopPropagation();
          const pointerId = e.pointerId || -1;
          this.press(cfg, pointerId);
          if (btn.setPointerCapture && e.pointerId !== undefined) btn.setPointerCapture(e.pointerId);
        };
        const up = (e) => {
          e.preventDefault();
          e.stopPropagation();
          this.release(e.pointerId || -1);
        };

        btn.addEventListener('pointerdown', down, { passive: false });
        btn.addEventListener('pointerup', up, { passive: false });
        btn.addEventListener('pointercancel', up, { passive: false });
        btn.addEventListener('lostpointercapture', up, { passive: false });

        this.buttons.set(cfg.id, { cfg, el: btn });
        return btn;
      },

      press: function(cfg, pointerId) {
        if (this.pointerMap[pointerId]) this.release(pointerId);
        this.pointerMap[pointerId] = cfg.id;
        const ref = this.buttons.get(cfg.id);
        if (ref) ref.el.dataset.pressed = 'true';
        this.activate(cfg, true);
      },

      release: function(pointerId) {
        const id = this.pointerMap[pointerId];
        if (!id) return;
        const ref = this.buttons.get(id);
        if (ref) {
          ref.el.dataset.pressed = 'false';
          this.activate(ref.cfg, false);
        }
        delete this.pointerMap[pointerId];
      },

      activate: function(cfg, isDown) {
        if (MenuManager.active) {
          if (isDown && cfg.action) handleInput(cfg.action, true);
          return;
        }

        if (cfg.id === 'b') {
          if (isDown) handleInput('esc', true);
          return;
        }

        if (currentGameType === 'groove' && cfg.lane !== undefined) {
          if (isDown) this.laneHits.push(cfg.lane);
          return;
        }

        if (cfg.key) setVirtualKey(cfg.key, isDown, 'touch');
      },

      consumeLaneHits: function() {
        if (!this.laneHits.length) return [];
        const hits = this.laneHits.slice();
        this.laneHits.length = 0;
        return hits;
      },

      clearState: function() {
        for (let pointerId in this.pointerMap) {
          this.release(Number(pointerId));
        }
        this.laneHits.length = 0;
      },

      // Gesture-native games hide the pad entirely so it never covers the
      // playfield; these games still need on-screen buttons
      layouts: { drift: 'full', mindcraft: 'full', snake: 'action', crew: 'action' },
      bottomInset: 0,

      refresh: function() {
        const controls = document.getElementById('controls');
        if (!controls) return;
        // The menu is swipe/tap-native (tap a card to select, tap again to
        // start), so the pad stays hidden there instead of covering the footer
        const layout = MenuManager.active ? 'none' : (this.layouts[currentGameType] || 'none');
        const show = this.enabled && !!currentGame && layout !== 'none';
        controls.dataset.layout = layout;
        controls.classList.toggle('active', show);
        if (!show) this.clearState();
        updateBackButtonVisibility();
        this.bottomInset = 0;
        if (show && !MenuManager.active) {
          requestAnimationFrame(() => {
            const r = controls.getBoundingClientRect();
            if (controls.classList.contains('active') && r.height > 0) {
              this.bottomInset = Math.max(0, Math.round(window.innerHeight - r.top + 10));
            }
          });
        }
      }
    };

    // Direct canvas gestures: every game is natively touch-playable.
    // dragX/Y/XY chase the finger, swipe sends discrete arrows, tap sends an action.
    const CanvasTouch = {
      profiles: {
        pong:     { type: 'dragY', dead: 20, get: () => pongGame.p1.y + pongGame.paddleHeight / 2 },
        breakout: { type: 'dragX', dead: 16, tapKey: ' ', get: () => breakoutGame.paddle.x + breakoutGame.paddleWidth / 2 },
        invader:  { type: 'dragX', dead: 14, holdKey: ' ', get: () => invaderGame.player.x + invaderGame.player.width / 2 },
        shooter:  { type: 'dragXY', dead: 16, holdKey: ' ', get: () => ({ x: shooterGame.player.x + shooterGame.player.width / 2, y: shooterGame.player.y + shooterGame.player.height / 2 }) },
        jump:     { type: 'dragX', dead: 14, get: () => jumpGame.player.x + jumpGame.player.width / 2 },
        fall:     { type: 'dragX', dead: 12, get: () => fallGame.player.x },
        drop:     { type: 'dragX', dead: 10, get: () => dropGame.fallingBall ? dropGame.fallingBall.x : null },
        dino:     { type: 'runner', tapKey: ' ' },
        groove:   { type: 'lanes' },
        stack:    { type: 'tap', tapKey: ' ' },
        crossy:   { type: 'swipe', tapKey: 'ArrowUp' },
        ghost:    { type: 'swipe', swipeDist: 22 },
        tetris:   { type: 'tetris' },
        survivor: { type: 'dragXY', dead: 36, get: () => ({ x: canvas.width / 2, y: canvas.height / 2 }) },
        crew:     { type: 'dragXY', dead: 30, holdKeyWhenIdle: ' ', get: () => ({ x: crewGame.player.x - crewGame.camX, y: crewGame.player.y - crewGame.camY }) },
        drift:    { type: 'zones' }
      },
      touch: null,
      held: new Set(),

      init: function() {
        const opts = { passive: false };
        canvas.addEventListener('pointerdown', (e) => {
          if (e.pointerType === 'mouse') return;
          if (!currentGame || !this.profiles[currentGameType]) return;
          e.preventDefault();
          // Rhythm lanes: every finger counts, straight to the lane under it
          if (this.profiles[currentGameType].type === 'lanes') {
            const lane = currentGame.laneAt ? currentGame.laneAt(e.clientX, e.clientY) : -1;
            if (lane >= 0) TouchControls.laneHits.push(lane);
            else if (currentGame.gameState !== 'playing' && currentGame.keyDown) currentGame.keyDown({ key: ' ' });
            return;
          }
          this.touch = { id: e.pointerId, x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY, startT: performance.now(), moved: false };
        }, opts);
        canvas.addEventListener('pointermove', (e) => {
          if (!this.touch || e.pointerId !== this.touch.id) return;
          e.preventDefault();
          const t = this.touch;
          t.x = e.clientX; t.y = e.clientY;
          if (Math.hypot(t.x - t.startX, t.y - t.startY) > 12) t.moved = true;
          const p = currentGame ? this.profiles[currentGameType] : null;
          if (p && (p.type === 'swipe' || p.type === 'tetris')) this.checkSwipe(p);
        }, opts);
        const up = (e) => {
          if (!this.touch || e.pointerId !== this.touch.id) return;
          const t = this.touch;
          const p = currentGame ? this.profiles[currentGameType] : null;
          if (p && !t.moved && t.startT > 0 && performance.now() - t.startT < 320) {
            if (p.type === 'tetris') this.pulse('ArrowUp');
            else if (p.tapKey) this.pulse(p.tapKey);
          }
          this.touch = null;
          this.releaseAll();
        };
        canvas.addEventListener('pointerup', up, opts);
        canvas.addEventListener('pointercancel', up, opts);
      },

      checkSwipe: function(p) {
        const t = this.touch;
        const dx = t.x - t.startX, dy = t.y - t.startY;
        const need = p.swipeDist || 30;
        if (Math.abs(dx) < need && Math.abs(dy) < need) return;
        let key;
        if (Math.abs(dx) > Math.abs(dy)) key = dx > 0 ? 'ArrowRight' : 'ArrowLeft';
        else key = dy > 0 ? 'ArrowDown' : 'ArrowUp';
        if (p.type === 'tetris' && key === 'ArrowDown') key = ' ';
        this.pulse(key);
        t.startX = t.x;
        t.startY = t.y;
        t.startT = 0;
      },

      pulse: function(key) {
        setVirtualKey(key, true, 'gesture');
        setTimeout(() => setVirtualKey(key, false, 'gesture'), 60);
      },

      hold: function(key, on) {
        if (on) {
          if (!this.held.has(key)) { this.held.add(key); setVirtualKey(key, true, 'gesture'); }
        } else {
          if (this.held.has(key)) { this.held.delete(key); setVirtualKey(key, false, 'gesture'); }
        }
      },

      releaseAll: function() {
        for (const k of [...this.held]) this.hold(k, false);
      },

      update: function() {
        const p = currentGame ? this.profiles[currentGameType] : null;
        if (!p || !this.touch) {
          if (this.held.size) this.releaseAll();
          return;
        }
        const t = this.touch;
        if (p.type === 'dragX') {
          const cur = p.get();
          if (cur === null || cur === undefined) { this.releaseAll(); return; }
          const diff = t.x - cur;
          this.hold('ArrowLeft', diff < -p.dead);
          this.hold('ArrowRight', diff > p.dead);
          if (p.holdKey) this.hold(p.holdKey, true);
        } else if (p.type === 'dragY') {
          const diff = t.y - p.get();
          this.hold('ArrowUp', diff < -p.dead);
          this.hold('ArrowDown', diff > p.dead);
        } else if (p.type === 'dragXY') {
          const cur = p.get();
          const dx = t.x - cur.x, dy = t.y - cur.y;
          this.hold('ArrowLeft', dx < -p.dead);
          this.hold('ArrowRight', dx > p.dead);
          this.hold('ArrowUp', dy < -p.dead);
          this.hold('ArrowDown', dy > p.dead);
          if (p.holdKey) this.hold(p.holdKey, true);
          if (p.holdKeyWhenIdle) this.hold(p.holdKeyWhenIdle, Math.hypot(dx, dy) <= p.dead);
        } else if (p.type === 'runner') {
          // Tap jumps (on release); dragging down ducks for as long as it's held
          this.hold('ArrowDown', t.y - t.startY > 26);
        } else if (p.type === 'zones') {
          this.hold('ArrowLeft', t.x < canvas.width * 0.45);
          this.hold('ArrowRight', t.x > canvas.width * 0.55);
          this.hold('ArrowUp', t.y < canvas.height * 0.3);
          this.hold('ArrowDown', t.y > canvas.height * 0.7);
        }
      }
    };

    // Initialization
    MenuManager.init();
    audioManager.init(); // Pre-init audio context (browser might block until interaction)
    TouchControls.init();
    CanvasTouch.init();
    if (TouchControls.enabled) {
      const footer = document.querySelector('#menu footer');
      if (footer) footer.textContent = footer.textContent.replace('PRESS ENTER / A TO START', 'TAP A CARD TO START');
    }

    // Kill iOS double-tap / pinch zoom everywhere (canvases handle their own gestures)
    let lastTouchEndTime = 0;
    document.addEventListener('touchend', (e) => {
      const t = e.target;
      if (t && t.closest && t.closest('#gameCanvas, #webglCanvas')) return;
      const now = performance.now();
      if (now - lastTouchEndTime < 350) e.preventDefault();
      lastTouchEndTime = now;
    }, { passive: false, capture: true });
    document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
      document.addEventListener(ev, (e) => e.preventDefault(), { passive: false })
    );

    // Tap-to-restart on game-over screens (sends space key to the game)
    canvas.addEventListener('click', () => {
      if (currentGame && (currentGame.gameState === 'over' || currentGame.gameState === 'win')) {
        if (currentGame.keyDown) currentGame.keyDown({ key: ' ' });
      }
    });

    window.addEventListener('mousedown', e => {
      if (currentGameType === 'mindcraft') {
        if (mindcraftGame.pickerOpen) return;
        if (!document.pointerLockElement) {
          if (mindcraftGame.state === 'playing') document.getElementById('webglCanvas').requestPointerLock();
        } else {
          if (e.button === 1) e.preventDefault();
          mindcraftGame.onMouseDown(e.button);
        }
      }
    });

    window.addEventListener('mouseup', e => {
      if (currentGameType === 'mindcraft') mindcraftGame.onMouseUp(e.button);
    });

    window.addEventListener('mousemove', e => {
      if (currentGameType === 'mindcraft' && document.pointerLockElement) {
        mindcraftGame.onLook(e.movementX, e.movementY);
      }
    });

    window.addEventListener('wheel', e => {
      if (currentGameType === 'mindcraft' && document.pointerLockElement) {
        mindcraftGame.cycleSlot(e.deltaY > 0 ? 1 : -1);
      }
    }, { passive: true });

    window.addEventListener('contextmenu', e => {
      if (currentGameType === 'mindcraft') e.preventDefault();
    });

    if (backButtonEl) {
      backButtonEl.addEventListener('click', (e) => {
        e.preventDefault();
        handleInput('esc', true);
      });
    }

    // Keyboard Listeners
    const navigationKeys = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Spacebar', 'Escape', 'Enter', 'Tab']);
    window.addEventListener('keydown', e => {
      if (navigationKeys.has(e.key)) e.preventDefault();

      AttractMode.reset();
      // Initialize audio on first user interaction
      if (audioManager.ctx && audioManager.ctx.state === 'suspended') audioManager.ctx.resume();
      
      if (MenuManager.active) {
        if (e.key === 'ArrowLeft') MenuManager.navigate(-1);
        if (e.key === 'ArrowRight') MenuManager.navigate(1);
        if (e.key === 'Enter' || e.key === ' ') MenuManager.select();
      } else if (e.key === 'Escape') {
        requestExit();
        realKeyboardState[e.key] = true;
        return;
      }
      retryBlockedMusic();

      if (e.key === 'm' || e.key === 'M') {
        const muted = audioManager.toggleMute();
        const el = document.getElementById('instructions');
        el.textContent = muted ? 'Sound off (M to unmute)' : 'Sound on';
        el.className = 'active';
        clearTimeout(window.__muteToastTimer);
        window.__muteToastTimer = setTimeout(() => el.className = '', 1500);
      }
      
      realKeyboardState[e.key] = true;
      const onEndScreen = currentGame && (currentGame.gameState === 'over' || currentGame.gameState === 'win');
      if (currentGame && currentGame.keyDown && !(e.repeat && onEndScreen)) currentGame.keyDown(e);
    });

    window.addEventListener('keyup', e => {
      if (navigationKeys.has(e.key)) e.preventDefault();
      delete realKeyboardState[e.key];
      // Shift/Caps can change e.key between press and release ("a" vs "A")
      if (e.key && e.key.length === 1) {
        delete realKeyboardState[e.key.toLowerCase()];
        delete realKeyboardState[e.key.toUpperCase()];
      }
      if (currentGame && currentGame.keyUp) currentGame.keyUp(e);
    });

    // A track blocked by the autoplay policy starts on the next real input
    function retryBlockedMusic() {
      const el = audioManager.activeAudioElement;
      if (!el || !el.paused || el.ended || document.hidden || audioManager.muted) return;
      if (!currentGame || currentGame.manageOwnAudio) return;
      el.play().catch(() => {});
    }
    window.addEventListener('pointerdown', retryBlockedMusic, { passive: true });

    window.addEventListener('blur', () => {
      for (let k in realKeyboardState) delete realKeyboardState[k];
      clearVirtualKeys();
      TouchControls.clearState();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        for (let k in realKeyboardState) delete realKeyboardState[k];
        clearVirtualKeys();
        TouchControls.clearState();
        if (audioManager.activeAudioElement) audioManager.activeAudioElement.pause();
      } else if (audioManager.activeAudioElement && currentGame) {
        audioManager.activeAudioElement.play().catch(() => {});
      }
    });

    // Main Loop
    function gameLoop(time) {
      const rawDelta = time - lastTime;
      const delta = Math.max(0, Math.min(rawDelta, 100));
      lastTime = time;
      trackFramePacing(rawDelta);
      if (VIEW.graceMs > 0) VIEW.graceMs -= delta;

      try {
        // Poll Gamepad & Sync Inputs
        const gp = GamepadManager.poll();

        // FORCE AUDIO RESUME: Attempt to resume AudioContext on any gamepad interaction
        // This is critical for iOS/Safari where audio is blocked until user interaction
        if (gp && audioManager.ctx) {
           const active = gp.state.up || gp.state.down || gp.state.left || gp.state.right ||
             gp.state.a || gp.state.b || gp.state.x || gp.state.y ||
             gp.state.l1 || gp.state.r1 || gp.state.l2 || gp.state.r2 ||
             gp.state.start || gp.state.select ||
             gp.state.triggers[0] > 0.01 || gp.state.triggers[1] > 0.01 ||
             Math.abs(gp.state.axes[0]) > 0 || Math.abs(gp.state.axes[1]) > 0 ||
             Math.abs(gp.state.axes[2]) > 0 || Math.abs(gp.state.axes[3]) > 0;
           if (active) {
             if (audioManager.ctx.state === 'suspended') {
                audioManager.ctx.resume().catch(e => console.warn("Audio resume failed:", e));
             }
             // Retry music if it failed to start (Autoplay policy)
             if (audioManager.activeAudioElement && audioManager.activeAudioElement.paused) {
                audioManager.activeAudioElement.play().catch(e => {});
             }
           }
        }
        
        // Canvas gestures feed virtual keys before the merge below
        CanvasTouch.update();

        // 1. Reset keysDown to match physical keyboard state
        for (let k in keysDown) delete keysDown[k];
        for (let k in realKeyboardState) keysDown[k] = true;
        for (let k in virtualKeyboardState) keysDown[k] = true;
        
        // 2. Merge Gamepad State
        if (gp) {
          // Games that read the pad directly (Blocks) opt out of the generic
          // shoulder/trigger aliases so R2/L2/R1/L1 don't leak into ArrowUp
          const aliasUp = !(currentGame && currentGame.rawGamepad);
          if (gp.justPressed.left) handleInput('left', true);
          if (gp.justPressed.right) handleInput('right', true);
          // Map Up, Triangle, and Shoulder buttons to 'up' (Rotate/Shoot)
          if (gp.justPressed.up || (aliasUp && (gp.justPressed.y || gp.justPressed.r1 || gp.justPressed.r2 || gp.justPressed.l1 || gp.justPressed.l2))) handleInput('up', true);
          if (gp.justPressed.down) handleInput('down', true);
          if (gp.justPressed.a || gp.justPressed.start) handleInput('enter', true);
          // Games that use Circle/B as a play button leave Back on Share/View
          const bIsBack = !(currentGame && currentGame.padFaceButtons);
          if ((bIsBack && gp.justPressed.b) || gp.justPressed.select) handleInput('esc', true);

          // Continuous state (Union with keyboard)
          if (gp.state.left) keysDown['ArrowLeft'] = true;
          if (gp.state.right) keysDown['ArrowRight'] = true;
          if (gp.state.up || (aliasUp && (gp.state.y || gp.state.r1 || gp.state.r2 || gp.state.l1 || gp.state.l2))) keysDown['ArrowUp'] = true;
          if (gp.state.down) keysDown['ArrowDown'] = true;
          if (gp.state.a) keysDown[' '] = true;
        }
        
        AttractMode.update(delta);

        if (currentGame && currentGame.update && currentGame.draw) {
          const game = currentGame;
          // Compare with the state seen last frame, so a game that ends from
          // a key handler (Stack's drop) is caught as well as one ending in update()
          const ended = (st) => st === "over" || st === "win";
          const wasPlaying = game._seenState === undefined ? !ended(game.gameState) : !ended(game._seenState);
          game.update(delta);
          // update() may have ended the game (or a handler may have left it)
          if (currentGame === game) {
            // Auto-persist score the moment a game ends
            if (wasPlaying && ended(game.gameState)) autoSaveScore();
            game._seenState = game.gameState;
            ctx.imageSmoothingEnabled = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            game.draw(ctx);
          }
        }
      } catch (e) {
        console.error("Game Loop Error:", e);
        // Emergency exit to menu to prevent browser freeze
        cleanupCurrentGame();
        currentGame = null;
        currentGameType = null;
        launchToken++;
        if (exitTimer) { clearTimeout(exitTimer); exitTimer = null; }
        MenuManager.active = true;
        document.getElementById("menu").style.display = "flex";
        document.getElementById("loading").className = "";
        canvas.style.display = "none";
        document.getElementById("webglCanvas").style.display = "none";
        document.getElementById("mindcraft-ui").style.display = "none";
        updateBackButtonVisibility();
        TouchControls.refresh();
        MenuManager.updateSelection();
        audioManager.playMusic('menu');
        console.error("Game Error:", e.message);
      }
      
      animFrameId = requestAnimationFrame(gameLoop);
    }
    animFrameId = requestAnimationFrame(gameLoop);

    // Helpers
    function resizeCanvas() {
      VIEW.dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, VIEW.cap));
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const webgl = document.getElementById("webglCanvas");
      if (webgl) {
        webgl.width = window.innerWidth;
        webgl.height = window.innerHeight;
      }

    window.addEventListener('resize', () => { resizeCanvas(); TouchControls.refresh(); });
    // iOS reports rotation before the new viewport settles
    window.addEventListener('orientationchange', () => setTimeout(() => { resizeCanvas(); TouchControls.refresh(); }, 250));

    function showInstructions(gameMode) {
      const texts = {
        pong: "Up/Down to move. First to 5.",
        breakout: "Left/Right to move. Destroy bricks.",
        invader: "Left/Right move, Space shoot.",
        jump: "Left/Right to move. Jump high!",
        fall: "Avoid obstacles. Left/Right.",
        drop: "Steer and merge matching numbers.",
        tetris: "Arrows move/rotate. Space drop.",
        dino: "Space jump, Down duck.",
        crossy: "Arrows to hop. Cross safely.",
        shooter: "Arrows move, Space shoot.",
        survivor: "WASD move. Auto-attack.",
        drift: "Outrun the heat! Down/L2 drifts, Up/R2 nitro.",
        ghost: "Swipe or Arrows to steer. Eat all pellets.",
        snake: "LS/Arrows to steer. Cross/Space to Boost!",
        mindcraft: "Tap place, hold mine. E picks blocks. Pad: R2 mine, L2 place, R1/L1 slots",
        groove: "Arrows/Face Buttons to hit notes on beat!",
        stack: "Tap Space / A to drop. Stack perfectly for combos!",
        crew: "Finish all tasks. Avoid the Impostor!",
        listnr: "Tap a track. Up/Down + Space works too."
      };
      // Touch players never see a keyboard, so they get gesture instructions
      const touchTexts = {
        pong: "Drag to move your paddle. First to 5.",
        breakout: "Drag to move. Tap to launch.",
        invader: "Drag to move. Hold to fire.",
        jump: "Drag left or right to steer.",
        fall: "Drag to slip through the gaps.",
        drop: "Drag to aim. Merge matching numbers.",
        tetris: "Swipe to move, tap to rotate, swipe down to drop.",
        dino: "Tap to jump. Drag down to duck.",
        crossy: "Tap to hop. Swipe to change direction.",
        shooter: "Drag to fly. Hold to fire.",
        survivor: "Drag to move. Attacks are automatic.",
        drift: "Pad steers. Up for nitro, Down to drift.",
        ghost: "Swipe to steer. Eat every pellet.",
        snake: "Drag to steer. Hold A to boost.",
        mindcraft: "Drag to look. Tap to place, hold to mine.",
        groove: "Tap the lanes on the beat.",
        stack: "Tap to drop. Line them up perfectly.",
        crew: "Drag to move. Hold A at a task."

      el.className = "active";
      clearTimeout(window.__instructionTimer);
      window.__instructionTimer = setTimeout(() => el.className = "", 4000);
    }

    function cleanupCurrentGame() {
      clearVirtualKeys();
      TouchControls.clearState();
      if (currentGame && currentGame.end) {
        try { currentGame.end(); } catch (e) { console.warn("Game cleanup failed:", e); }
      }
      if (document.pointerLockElement && document.exitPointerLock) {
        document.exitPointerLock();
      }
    }

    // Bumped whenever a launch should be abandoned (Back pressed while loading)
    let launchToken = 0;
    let exitTimer = null;
    // Stored best for the running game, captured before this run's score is
    // saved, so "NEW HIGH SCORE" means it and ties don't count
    let runBest = 0;

    function startGame(gameMode) {
      if (exitTimer) { clearTimeout(exitTimer); exitTimer = null; }
      AttractMode.reset();
      const loading = document.getElementById("loading");
      loading.className = "active";
      
      MenuManager.active = false;
      document.getElementById("menu").style.display = "none";
      
      const targetCanvas = gameMode === 'mindcraft' ? document.getElementById("webglCanvas") : canvas;
      targetCanvas.style.display = "block";
      if (gameMode === 'mindcraft') document.getElementById("mindcraft-ui").style.display = "block";
      // Each game starts at full resolution; the governor re-learns per game
      VIEW.cap = VIEW.maxCap;
      VIEW.graceMs = 2000;
      resizeCanvas();
      
      audioManager.playSFX('start');
      
      // Clear any previous game state
      cleanupCurrentGame();
      currentGame = null;
      currentGameType = gameMode;
      updateBackButtonVisibility();
      TouchControls.refresh();
      const token = ++launchToken;
      
      setTimeout(() => {
        if (token !== launchToken || currentGameType !== gameMode) return; // cancelled
        resizeCanvas(); // Ensure size is correct after display block
        
        // Initialize game instance
        const map = {
          pong: pongGame, breakout: breakoutGame, invader: invaderGame,
          jump: jumpGame, fall: fallGame, drop: dropGame,
          tetris: tetrisGame, dino: dinoGame, crossy: crossyGame,
          shooter: shooterGame, survivor: survivorGame,
          drift: driftGame, ghost: ghostGame, snake: snakeGame, mindcraft: mindcraftGame,
          groove: grooveGame, stack: stackGame, crew: crewGame, listnr: listnrGame
        };
        
        const game = map[gameMode];
        if (game) {
          try {
            game._newBest = undefined;
            game._seenState = undefined;
            game.init();
            runBest = StorageManager.getScore(gameMode);
            // Load persisted high score so in-game "Best:" display is accurate
            if ('highScore' in game) game.highScore = Math.max(game.highScore, runBest);
            currentGame = game;

            // Music logic
            try {
              if (game.manageOwnAudio) {
                // Game drives its own synced audio inside init()
              } else if (audioManager.tracks[gameMode]) {
                 audioManager.playMusic(gameMode);
              } else {
                 audioManager.playMusic(gameMode === 'fall' ? 'calm' : 'action');
              }
            } catch (err) { console.error("Music start error:", err); }
            updateBackButtonVisibility();
            TouchControls.refresh();
          } catch (e) {
            console.error("Init failed:", e);
            currentGame = game; // so endGame() runs its teardown
            endGame();
            return;
          }
        }
        
        showInstructions(gameMode);
        loading.className = "";
      }, 500);
    }

    function endGame() {
      if (!currentGame && !currentGameType) return;
      if (exitTimer) return; // already leaving
      launchToken++; // abandon a launch that hasn't finished loading
      
      const loading = document.getElementById("loading");
      loading.className = "active";
      
      // Auto-save score for any game that exposes a numeric .score
      if (currentGame && currentGameType) {
        const s = typeof currentGame.score === 'object' ? (currentGame.score.player || 0) : (currentGame.score || 0);
        if (s > 0) StorageManager.saveScore(currentGameType, Math.floor(s));
      }
      cleanupCurrentGame();
      // Stop driving the game now: its teardown may have released what
      // update() needs. The last frame stays on screen under the fade.
      currentGame = null;
      TouchControls.refresh();
      
      exitTimer = setTimeout(() => {
        exitTimer = null;
        currentGame = null;
        currentGameType = null;
        
        canvas.style.display = "none";
        document.getElementById("webglCanvas").style.display = "none";
        document.getElementById("mindcraft-ui").style.display = "none";
        document.getElementById("menu").style.display = "flex";
        
        MenuManager.active = true;
        MenuManager.updateSelection(); // Refresh high score display
        updateBackButtonVisibility();
        TouchControls.refresh();
        
        audioManager.playMusic('menu');
        loading.className = "";
      }, 300);
    }

    // Auto-save score for the current game (call from game-over states)
    function autoSaveScore() {
      if (!currentGame || !currentGameType) return;
      const s = typeof currentGame.score === 'object' ? (currentGame.score.player || 0) : (currentGame.score || 0);
      const floorS = Math.floor(s);
      currentGame._newBest = floorS > 0 && floorS > runBest;
      if (floorS > runBest) runBest = floorS;
      if (floorS > 0) {
        StorageManager.saveScore(currentGameType, floorS);
        if ('highScore' in currentGame) currentGame.highScore = Math.max(currentGame.highScore, floorS);
      }
      // Trigger achievements for any game
      if (currentGame.gameState === 'win' || (typeof currentGame.score === 'object' && currentGame.score.player >= currentGame.maxScore)) {
        AchievementManager.unlock('first_win');
      }
      if (floorS >= 1000) AchievementManager.unlock('score_1000');
    }

    const MAX_PARTICLES = 200;

    // Utility function for random colors
    function randomColor() {
      const h = Math.floor(Math.random() * 360);
      const s = 70 + Math.floor(Math.random() * 30);
      const l = 55 + Math.floor(Math.random() * 25);
      return hslToHex(h, s, l);
    }

    // Hex keeps colors usable by the pixel kit (ramps, sprite palettes)
    function hslToHex(h, s, l) {
      s /= 100; l /= 100;
      const k = (n) => (n + h / 30) % 12;
      const a = s * Math.min(l, 1 - l);
      const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
      return '#' + [f(0), f(8), f(4)].map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join('');
    }

    const STARFIELD_CACHE = new Map();
    function seededUnit(index, seed) {
      const x = Math.sin((index + 1) * 12.9898 + seed * 78.233) * 43758.5453123;
      return x - Math.floor(x);
    }

    function getEvenStarfield(cacheId, count, width, height, seed = 1) {
      const w = Math.max(1, Math.floor(width));
      const h = Math.max(1, Math.floor(height));
      const key = `${cacheId}:${count}:${w}x${h}:${seed}`;
      if (STARFIELD_CACHE.has(key)) return STARFIELD_CACHE.get(key);

      const aspect = w / h;
      const cols = Math.max(1, Math.ceil(Math.sqrt(count * aspect)));
      const rows = Math.max(1, Math.ceil(count / cols));
      const cellW = w / cols;
      const cellH = h / rows;
      const stars = [];

      for (let row = 0; row < rows && stars.length < count; row++) {
        for (let col = 0; col < cols && stars.length < count; col++) {
          const idx = row * cols + col;
          const jitterX = (seededUnit(idx, seed) - 0.5) * 0.86;
          const jitterY = (seededUnit(idx, seed + 13) - 0.5) * 0.86;
          stars.push({
            x: (col + 0.5 + jitterX) * cellW,
            y: (row + 0.5 + jitterY) * cellH,
            size: 0.7 + seededUnit(idx, seed + 29) * 1.6,
            phase: seededUnit(idx, seed + 41) * Math.PI * 2
          });
        }
      }

      if (STARFIELD_CACHE.size > 64) STARFIELD_CACHE.clear();
      STARFIELD_CACHE.set(key, stars);
      return stars;
    }

    // ------------------------------------------------
    // Game Implementations (Enhanced with fixes)
    // ------------------------------------------------
    
    // 1. Classic Ping Pong (Enhanced with win condition)
    const pongGame = {
      paddleWidth: 10, paddleHeight: 100,
      ballRadius: 7,
      score: { player: 0, ai: 0 },
      maxScore: 5,
      gameState: "playing",
      init: function() {
        const S = PIX.scaleFor();
        this.S = S;
        this.paddleWidth = 5 * S;
        this.paddleHeight = Math.round(100 / S) * S;
        this.ballRadius = S === 3 ? 9 : 7;
        this.p1 = { x: 10, y: canvas.height/2 - this.paddleHeight/2, speed: 0.5, flash: 0 };
        this.p2 = { x: canvas.width - 10 - this.paddleWidth, y: canvas.height/2 - this.paddleHeight/2, speed: 0.4, flash: 0 };
        this.ball = { x: canvas.width/2, y: canvas.height/2, vx: 0.3, vy: 0.3 };
        this.score = { player: 0, ai: 0 };
        this.gameState = "playing";
        this.trail = [];
        this.sparks = [];
        this.shake = 0;
        this.serveDelay = 600;
        this.goalFlash = 0;
      },
      onResize: function() {
        if (!this.p1) return;
        this.p2.x = canvas.width - 10 - this.paddleWidth;
        this.p1.y = Math.max(0, Math.min(canvas.height - this.paddleHeight, this.p1.y));
        this.p2.y = Math.max(0, Math.min(canvas.height - this.paddleHeight, this.p2.y));
        this.ball.x = Math.max(this.ballRadius, Math.min(canvas.width - this.ballRadius, this.ball.x));
        this.ball.y = Math.max(this.ballRadius, Math.min(canvas.height - this.ballRadius, this.ball.y));
      },
      spark: function(x, y, dir, color, n) {
        for (let i = 0; i < n; i++) {
          this.sparks.push({
            x: x, y: y,
            vx: dir * (0.08 + Math.random() * 0.25), vy: (Math.random() - 0.5) * 0.4,
            life: 260 + Math.random() * 200, color: color
          });
        }
        if (this.sparks.length > 120) this.sparks.splice(0, this.sparks.length - 120);
      },
      update: function(delta) {
        for (let i = this.sparks.length - 1; i >= 0; i--) {
          const s = this.sparks[i];
          s.x += s.vx * delta; s.y += s.vy * delta; s.life -= delta;
          if (s.life <= 0) this.sparks.splice(i, 1);
        }
        this.shake = Math.max(0, this.shake - delta);
        this.goalFlash = Math.max(0, this.goalFlash - delta);
        this.p1.flash = Math.max(0, this.p1.flash - delta);
        this.p2.flash = Math.max(0, this.p2.flash - delta);
        if (this.gameState !== "playing") return;

        // Player paddle movement
        if (keysDown["w"] || keysDown["W"] || keysDown["ArrowUp"]) {
          this.p1.y -= this.p1.speed * delta;
        }
        if (keysDown["s"] || keysDown["S"] || keysDown["ArrowDown"]) {
          this.p1.y += this.p1.speed * delta;
        }
        this.p1.y = Math.max(0, Math.min(canvas.height - this.paddleHeight, this.p1.y));

        // AI tracks the ball only while it approaches, drifts to center otherwise
        const aiTargetY = (this.ball.vx > 0 ? this.ball.y : canvas.height / 2) - this.paddleHeight / 2;
        const aiDiff = aiTargetY - this.p2.y;
        const aiEffort = this.ball.vx > 0 ? 1 : 0.45;
        if (Math.abs(aiDiff) > 6) {
          this.p2.y += Math.sign(aiDiff) * Math.min(Math.abs(aiDiff), this.p2.speed * aiEffort * delta);
        }
        this.p2.y = Math.max(0, Math.min(canvas.height - this.paddleHeight, this.p2.y));

        // Short pause after each serve so the ball doesn't fire off-screen instantly
        if (this.serveDelay > 0) { this.serveDelay -= delta; return; }

        // Ball movement (with speed clamp)
        const maxSpeed = 1.5;
        const curSpeed = Math.sqrt(this.ball.vx * this.ball.vx + this.ball.vy * this.ball.vy);
        if (curSpeed > maxSpeed) {
          this.ball.vx = (this.ball.vx / curSpeed) * maxSpeed;
          this.ball.vy = (this.ball.vy / curSpeed) * maxSpeed;
        }

        // Sub-step so a fast ball can never tunnel through a paddle
        const travel = Math.hypot(this.ball.vx, this.ball.vy) * delta;
        const steps = Math.max(1, Math.ceil(travel / 4));
        const h = delta / steps;
        for (let st = 0; st < steps; st++) {
          if (this.stepBall(h)) return;
        }

        this.trail.push({ x: this.ball.x, y: this.ball.y });
        if (this.trail.length > 7) this.trail.shift();
      },
      // Returns true when a point ended the rally
      stepBall: function(h) {
        const b = this.ball, r = this.ballRadius;
        b.x += b.vx * h;
        b.y += b.vy * h;

        // Wall collisions (top/bottom): reflect and push back inside
        if (b.y < r || b.y > canvas.height - r) {
          b.y = b.y < r ? r : canvas.height - r;
          b.vy = (b.y === r ? 1 : -1) * Math.abs(b.vy);
          // Slight randomization prevents endless identical loops
          b.vy += (Math.random() - 0.5) * 0.01;
          audioManager.playTone(200, 'square', 0.05, 0.5);
          this.spark(b.x, b.y, Math.sign(b.vx) || 1, "#9FA8FF", 4);
        }

        // Paddle collisions (only when moving toward the paddle)
        const p1 = this.p1, p2 = this.p2;
        if (b.vx < 0 &&
            b.x - r < p1.x + this.paddleWidth && b.x + r > p1.x &&
            b.y + r * 0.6 > p1.y && b.y - r * 0.6 < p1.y + this.paddleHeight) {
          audioManager.playSFX('hit');
          GamepadManager.rumble(40, 0.2, 0.2);
          const hitPos = Math.max(0, Math.min(1, (b.y - p1.y) / this.paddleHeight));
          const angle = (hitPos - 0.5) * Math.PI / 3; // -π/6 to π/6 radians
          const speed = Math.hypot(b.vx, b.vy) * 1.05; // Speed up slightly
          b.vx = Math.cos(angle) * speed;
          b.vy = Math.sin(angle) * speed;
          b.x = p1.x + this.paddleWidth + r; // Prevent sticking
          p1.flash = 140;
          this.spark(b.x - r, b.y, 1, "#7DF9FF", 8);
        }
        if (b.vx > 0 &&
            b.x + r > p2.x && b.x - r < p2.x + this.paddleWidth &&
            b.y + r * 0.6 > p2.y && b.y - r * 0.6 < p2.y + this.paddleHeight) {
          audioManager.playSFX('hit');
          const hitPos = Math.max(0, Math.min(1, (b.y - p2.y) / this.paddleHeight));
          const angle = Math.PI - (hitPos - 0.5) * Math.PI / 3; // 5π/6 to 7π/6 radians
          const speed = Math.hypot(b.vx, b.vy) * 1.05;
          b.vx = Math.cos(angle) * speed;
          b.vy = Math.sin(angle) * speed;
          b.x = p2.x - r; // Prevent sticking
          p2.flash = 140;
          this.spark(b.x + r, b.y, -1, "#FF8A80", 8);
        }

        // Scoring and ball reset
        if (b.x < -r) {
          this.score.ai++;
          this.goal(-1);
          return true;
        } else if (b.x > canvas.width + r) {
          this.score.player++;
          this.goal(1);
          return true;
        }
        return false;
      },
      goal: function(side) {
        audioManager.playSFX('score');
        this.shake = 260;
        this.goalFlash = 420;
        this.goalSide = side;
        this.trail = [];
        if (this.score.player >= this.maxScore || this.score.ai >= this.maxScore) {
          this.gameState = "over";
          audioManager.playSFX(this.score.player >= this.maxScore ? 'win' : 'gameover');
          return;
        }
        this.resetBall(side);
      },
      resetBall: function(direction) {
        this.ball.x = canvas.width/2;
        this.ball.y = canvas.height/2;
        this.ball.vx = 0.3 * direction;
        this.ball.vy = 0.3 * (Math.random() > 0.5 ? 1 : -1);
        this.serveDelay = 500;
      },
      paddleSprite: function(color) {
        const H = Math.round(this.paddleHeight / this.S);
        return PIX.get('pong-paddle:' + color + ':' + H, () => {
          const R = PIX.ramp(color);
          const W = 5;
