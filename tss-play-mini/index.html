          const R = PIX.ramp(color);
          const steps = [R.o, R.d, R.b, R.l];
          const rad = d / 2;
          const kind = (level - 1) % 5;
          const L = [-0.5, -0.6, 0.62];
          return PIX.paint(d, d, (x, y) => {
            const nx = (x + 0.5 - rad) / rad, ny = (y + 0.5 - rad) / rad;
            const r2 = nx * nx + ny * ny;
            if (r2 > 1) return null;
            if (Math.sqrt(r2) > 1 - 1.2 / rad) return R.o;
            const nz = Math.sqrt(1 - r2);
            let lit = nx * L[0] + ny * L[1] + nz * L[2];
            let mod = 0;
            if (kind === 1) { // craters
              const cs = [[-0.3, 0.25, 0.22], [0.35, -0.1, 0.16], [0.1, 0.5, 0.12], [-0.2, -0.45, 0.1]];
              for (const c of cs) { const dd = Math.hypot(nx - c[0], ny - c[1]); if (dd < c[2]) mod = dd > c[2] * 0.6 ? 0.35 : -0.45; }
            } else if (kind === 2) { // bands
              mod = (Math.floor((ny + 1) * 3.5) % 2) ? -0.3 : 0.1;
            } else if (kind === 3) { // swirl
              mod = Math.sin(Math.atan2(ny, nx) * 3 + Math.hypot(nx, ny) * 6) * 0.3;
            } else if (kind === 4) { // gem facets
              mod = ((Math.floor((nx + 1) * 3) + Math.floor((ny + 1) * 3)) % 2) ? 0.25 : -0.15;
            }
            lit += mod;
            if (lit > 1.0 && d >= 8) return R.h;
            const t = Math.max(0, Math.min(1, lit * 0.5 + 0.5)) * 3 + (PIX.BAYER[(y & 3) * 4 + (x & 3)] / 16 - 0.5) * 0.9;
            return steps[Math.max(1, Math.min(3, Math.round(t)))];
          });
        });
      },
      drawBall: function(ctx, ball, glow) {
        const S = this.S;
        const d = Math.max(6, Math.round(ball.radius * 2 / S));
        const img = this.planet(ball.level, d);
        const sq = ball.squash || 0;
        if (glow) PIX.drawGlow(ctx, ball.x, ball.y, ball.radius * 2.2, ball.color, 0.45);
        // Contact shadow
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.fillRect(Math.round(ball.x - ball.radius * 0.7), Math.round(ball.y + ball.radius - S), Math.round(ball.radius * 1.4), S * 2);
        if (sq > 0.02) {
          ctx.save();
          ctx.translate(ball.x, ball.y + ball.radius * sq * 0.12);
          ctx.scale(1 + sq * 0.22, 1 - sq * 0.25);
          PIX.draw(ctx, img, 0, 0, S, { snap: false });
          ctx.restore();
        } else {
          PIX.draw(ctx, img, ball.x, ball.y, S);
        }
        const R = PIX.ramp(ball.color);
        PIX.text(ctx, String(ball.level), ball.x, ball.y, S === 3 ? 2 : 2, "#FFFFFF", { outline: R.o });
      },
      draw: function(ctx) {
        const w = canvas.width, h = canvas.height, S = this.S;
        const t = performance.now();
        const sky = PIX.skyGradient('drop', w, h, [[0, '#04050d'], [0.6, '#0a0e22'], [1, '#121a38']], S);
        ctx.drawImage(sky, 0, 0, sky.width * S, sky.height * S);

        const stars = getEvenStarfield('drop-stars', 60, w, h, 23);
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          const tw = 0.5 + 0.5 * Math.sin(t / 700 + s.phase);
          ctx.globalAlpha = 0.18 + 0.45 * tw;
          PIX.rect(ctx, Math.floor(s.x / S) * S, Math.floor(s.y / S) * S, S, S, "#DDE6FF");
        }
        ctx.globalAlpha = 1;

        // Glass tank: pixel walls and floor
        const floorY = h - SAFE.bottom;
        PIX.rect(ctx, 0, 0, S, h, "#0e4a5c");
        PIX.rect(ctx, S, 0, S, h, "#26C6DA");
        PIX.rect(ctx, w - 2 * S, 0, S, h, "#26C6DA");
        PIX.rect(ctx, w - S, 0, S, h, "#0e4a5c");
        PIX.rect(ctx, 0, floorY - 2 * S, w, S, "#26C6DA");
        PIX.rect(ctx, 0, floorY - S, w, S + SAFE.bottom, "#0e4a5c");

        for (let p of this.particles) {
          ctx.globalAlpha = Math.min(1, p.life / 300);
          PIX.rect(ctx, Math.floor(p.x / S) * S, Math.floor(p.y / S) * S, S * 2, S * 2, p.color);
        }
        ctx.globalAlpha = 1;

        for (let ball of this.stationaryBalls) this.drawBall(ctx, ball, false);

        if (this.fallingBall && this.nextPhase === "drop") {
          const fb = this.fallingBall;
          // Dotted drop guide and landing marker
          ctx.globalAlpha = 0.45;
          for (let y = fb.y + fb.radius + 4 * S; y < floorY - 3 * S; y += 6 * S) {
            PIX.rect(ctx, Math.round(fb.x / S) * S - S / 2, Math.round(y / S) * S, S, 3 * S, fb.color);
          }
          ctx.globalAlpha = 0.6;
          PIX.rect(ctx, fb.x - fb.radius, floorY - 4 * S, fb.radius * 2, S, fb.color);
          ctx.globalAlpha = 1;
          this.drawBall(ctx, fb, true);
        }

        // Merge pop rings, drawn as pixel dots on a circle
        for (const r of this.rings) {
          ctx.globalAlpha = Math.max(0, r.life / 380) * 0.85;
          const n = Math.max(12, Math.floor(r.r / S));
          for (let i = 0; i < n; i++) {
            const a = (i / n) * Math.PI * 2;
            PIX.rect(ctx, Math.round((r.x + Math.cos(a) * r.r) / S) * S, Math.round((r.y + Math.sin(a) * r.r) / S) * S, S, S, r.color);
          }
        }
        ctx.globalAlpha = 1;

        if (this.comboEffect) {
          const pop = 1 + Math.max(0, (this.comboEffect.life - 800) / 200);
          PIX.text(ctx, this.comboEffect.text, this.comboEffect.x, this.comboEffect.y, Math.round(Math.max(3, Math.min(6, w / 110)) * pop), "#FFEB3B",
            { shadow: "#8a5a00", alpha: Math.min(1, this.comboEffect.life / 300) });
        }

        // Danger line: pulses harder as the pile closes in or overstays
        let highest = h;
        for (const b of this.stationaryBalls) highest = Math.min(highest, b.y - b.radius);
        const danger = Math.max(this.dangerTime / 1100, Math.max(0, Math.min(1, (280 - (highest - this.dangerY)) / 280)));
        const dpulse = 0.5 + 0.5 * Math.sin(t / 130);
        if (danger > 0.05) {
          const g = ctx.createLinearGradient(0, 0, 0, this.dangerY);
          g.addColorStop(0, "rgba(255,40,60," + (0.04 + danger * 0.22 * dpulse).toFixed(3) + ")");
          g.addColorStop(1, "rgba(255,40,60,0)");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, w, this.dangerY);
        }
        ctx.globalAlpha = 0.35 + danger * 0.6 * dpulse;
        const dash = 8 * S;
        const shift = Math.floor(t / 60) % 2 ? S * 2 : 0;
        for (let x = -dash + shift; x < w; x += dash) PIX.rect(ctx, x, this.dangerY, dash / 2, S, "#FF3D5A");
        ctx.globalAlpha = 1;

        drawHUDChips(ctx, [
          { label: "Score", value: Math.floor(this.score) },
          { label: "Best", value: Math.floor(this.highScore), color: "#FFD740" }
        ]);

        if (this.gameState === "over") {
          drawGameOverScreen(ctx, {
            title: "GAME OVER",
            score: Math.floor(this.score),
            isNewBest: this.score === this.highScore && this.score > 0
          });
        }
      },
  keyDown: function(e) {
    if (e.key === " " && this.gameState === "over") {
      this.init();
    }
  },
  keyUp: function(e) {},
  end: function() {}
};

// 7. Tetris
const tetrisGame = {
  grid: [],
  cols: 10,
  rows: 20,
  currentPiece: null,
  nextPiece: null,
  dropInterval: 1000,
  dropTimer: 0,
  score: 0,
  level: 1,
  linesCleared: 0,
  gameState: "playing",
  // DAS (Delayed Auto Shift) variables
  dasDelay: 200,
  dasRate: 50,
  dasTimer: 0,
  lastMoveDir: 0,
  // Lock delay: a grounded piece can still slide/rotate briefly
  lockDelay: 450,

  shapes: [
    [[1,1,1,1]],               // I
    [[1,1],[1,1]],             // O
    [[0,1,0],[1,1,1]],         // T
    [[1,0,0],[1,1,1]],         // L
    [[0,0,1],[1,1,1]],         // J
    [[1,1,0],[0,1,1]],         // S
    [[0,1,1],[1,1,0]]          // Z
  ],
  pieceColors: [
    "#3FE0F0",    // I - Cyan
    "#FFD54A",    // O - Yellow
    "#B35CFF",    // T - Purple
    "#FF9A3C",    // L - Orange
    "#4C7DFF",    // J - Blue
    "#4CDB6A",    // S - Green
    "#FF4D6A"     // Z - Red
  ],
  init: function() {
    audioManager.playMusic('tetris', true);
    this.grid = [];
    for (let r = 0; r < this.rows; r++) {
      this.grid[r] = new Array(this.cols).fill(0);
    }
    this.score = 0;
    this.level = 1;
    this.linesCleared = 0;
    this.gameState = "playing";
    this.dropInterval = 1000;
    this.dropTimer = 0;
    this.lockTimer = 0;
    this.lockResets = 0;
    this.clearFlash = null;
    this.lockFlash = null;
    this.particles = [];
    this.banner = null;
    this.shake = 0;
    this.shakeMag = 0;
    this.pieceBag = [];
    this.generateNextPiece();
    this.newPiece();
  },
  boardMetrics: function() {
    const topPad = Math.max(56, SAFE.top + 52);
    const bottomPad = 14 + SAFE.bottom;
    const blockSize = Math.max(8, Math.min(
      Math.floor(canvas.width / (this.cols + 6)),
      Math.floor((canvas.height - topPad - bottomPad) / this.rows)
    ));
    const boardWidth = this.cols * blockSize;
    const boardHeight = this.rows * blockSize;
    // Side panel for NEXT; slide the board left when the panel wouldn't fit
    const pb = Math.max(6, Math.floor(blockSize * 0.62));
    const panelW = pb * 5 + 12;
    let offsetX = Math.floor((canvas.width - boardWidth) / 2);
    offsetX = Math.max(6, Math.min(offsetX, canvas.width - boardWidth - panelW - 14));
    return {
      blockSize: blockSize,
      boardWidth: boardWidth,
      boardHeight: boardHeight,
      offsetX: offsetX,
      offsetY: Math.floor(topPad + (canvas.height - topPad - bottomPad - boardHeight) / 2),
      pb: pb,
      panelX: offsetX + boardWidth + 10,
      panelW: panelW
    };
  },
  refillBag: function() {
    this.pieceBag = [0, 1, 2, 3, 4, 5, 6];
    for (let i = this.pieceBag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [this.pieceBag[i], this.pieceBag[j]] = [this.pieceBag[j], this.pieceBag[i]];
    }
  },
  generateNextPiece: function() {
    if (!this.pieceBag || this.pieceBag.length === 0) this.refillBag();
    const index = this.pieceBag.pop();
    const shape = this.shapes[index];
    this.nextPiece = {
      shape: shape,
      colorIndex: index,
      x: Math.floor((this.cols - shape[0].length) / 2),
      y: 0
    };
  },
  newPiece: function() {
    // Use the next piece as current
    this.currentPiece = {...this.nextPiece};
    this.lockTimer = 0;
    this.lockResets = 0;

    // Generate a new next piece
    this.generateNextPiece();

    // Game over check - if new piece immediately collides
    if (this.collides(this.currentPiece.shape, this.currentPiece.x, this.currentPiece.y)) {
      this.gameState = "over";
      audioManager.stopMusic();
      audioManager.playSFX('gameover');
    }
  },
  grounded: function() {
    const p = this.currentPiece;
    return !!p && this.collides(p.shape, p.x, p.y + 1);
  },
  // Moving or rotating a grounded piece buys it a little more time
  touchLock: function() {
    if (this.grounded() && this.lockResets < 15) { this.lockTimer = 0; this.lockResets++; }
  },
  lockPiece: function() {
    this.merge();
    this.clearLines();
    this.newPiece();
  },
  update: function(delta) {
    // Effects keep animating on the game-over screen
    if (this.clearFlash) {
      this.clearFlash.life -= delta;
      if (this.clearFlash.life <= 0) this.clearFlash = null;
    }
    if (this.lockFlash) {
      this.lockFlash.life -= delta;
      if (this.lockFlash.life <= 0) this.lockFlash = null;
    }
    if (this.shake > 0) this.shake -= delta;
    if (this.banner) { this.banner.life -= delta; if (this.banner.life <= 0) this.banner = null; }
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.x += pt.vx * delta;
      pt.y += pt.vy * delta;
      pt.vy += 0.0008 * delta;
      pt.life -= delta;
      if (pt.life <= 0) this.particles.splice(i, 1);
    }
    if (this.gameState !== "playing") return;

    // Handle DAS (Continuous Movement)
    let moveDir = 0;
    if (keysDown["ArrowLeft"]) moveDir = -1;
    if (keysDown["ArrowRight"]) moveDir = 1;

    if (moveDir !== 0) {
      if (moveDir !== this.lastMoveDir) {
        // First press handled by keyDown, just reset timer
        this.lastMoveDir = moveDir;
        this.dasTimer = 0;
      } else {
        // Holding same direction
        this.dasTimer += delta;
        if (this.dasTimer > this.dasDelay) {
          // Trigger repeat
          if ((this.dasTimer - this.dasDelay) % this.dasRate < delta) {
             if (this.move(moveDir, 0)) audioManager.playTone(300, 'square', 0.05, 0.05);
          }
        }
      }
    } else {
      this.lastMoveDir = 0;
      this.dasTimer = 0;
    }

    // Soft drop while holding Down
    const soft = keysDown["ArrowDown"];
    if (soft) this.dropTimer += delta * 6;

    // Gravity
    this.dropTimer += delta;
    if (this.dropTimer > this.dropInterval) {
      this.dropTimer = 0;
      if (!this.grounded()) this.move(0, 1);
    }

    // Lock once the piece has rested long enough (soft drop locks at once)
    if (this.grounded()) {
      this.lockTimer += delta;
      if (this.lockTimer >= this.lockDelay || (soft && this.lockTimer > 60)) this.lockPiece();
    } else {
      this.lockTimer = 0;
    }
  },
  move: function(dx, dy) {
    if (this.gameState !== "playing") return;

    if (!this.collides(this.currentPiece.shape, this.currentPiece.x + dx, this.currentPiece.y + dy)) {
      this.currentPiece.x += dx;
      this.currentPiece.y += dy;
      if (dx !== 0) this.touchLock();
      return true;
    }
    return false;
  },
  hardDrop: function() {
    if (this.gameState !== "playing") return;

    const piece = this.currentPiece;
    const shape = piece.shape;
    let ghostY = piece.y;
    while (!this.collides(shape, piece.x, ghostY + 1)) ghostY++;
    const distance = ghostY - piece.y;
    const m = this.boardMetrics();
    const color = this.pieceColors[piece.colorIndex];

    piece.y = ghostY;
    this.score += distance * 2;

    // Impact feedback: shake scales with fall distance, dust at the landing edge
    this.shake = Math.min(180, 70 + distance * 8);
    this.shakeMag = Math.min(7, 1.5 + distance * 0.3);
    for (let c = 0; c < shape[0].length; c++) {
      let bottom = -1;
      for (let r = shape.length - 1; r >= 0; r--) {
        if (shape[r][c]) { bottom = r; break; }
      }
      if (bottom < 0) continue;
      const px = m.offsetX + (piece.x + c + 0.5) * m.blockSize;
      const py = m.offsetY + (ghostY + bottom + 1) * m.blockSize;
      for (let i = 0; i < 3; i++) {
        this.particles.push({
          x: px + (Math.random() - 0.5) * m.blockSize,
          y: py,
          vx: (Math.random() - 0.5) * 0.18,
          vy: -(0.05 + Math.random() * 0.16),
          color: color,
          life: 320 + Math.random() * 220
        });
      }
    }
    if (this.particles.length > MAX_PARTICLES) {
      this.particles.splice(0, this.particles.length - MAX_PARTICLES);
    }
    GamepadManager.rumble(70, 0.4, 0.25);
    audioManager.playTone(95, 'square', 0.12, 0.45, -40);
    audioManager.playNoise(0.07, 0.22);
    this.lockPiece();
  },
  collides: function(shape, offsetX, offsetY) {
    if (!shape || !shape.length) return true;
    for (let r = 0; r < shape.length; r++) {
      if (!shape[r]) continue;
      for (let c = 0; c < shape[r].length; c++) {
        if (shape[r][c]) {
          let x = offsetX + c;
          let y = offsetY + r;

          // Collision with walls or bottom
          if (x < 0 || x >= this.cols || y >= this.rows) {
            return true;
          }

          // Skip if above the top of the grid
          if (y < 0) continue;

          // Collision with placed blocks
          if (this.grid[y] && this.grid[y][x] !== 0) {
            return true;
          }
        }
      }
    }
    return false;
  },
  merge: function() {
    const shape = this.currentPiece.shape;
    const cells = [];
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (shape[r][c]) {
          let x = this.currentPiece.x + c;
          let y = this.currentPiece.y + r;

          // Only merge if within grid bounds
          if (y >= 0 && y < this.rows && x >= 0 && x < this.cols) {
            this.grid[y][x] = this.currentPiece.colorIndex + 1;
            cells.push({ x: x, y: y });
          }
        }
      }
    }
    this.lockFlash = { cells: cells, life: 170 };
    audioManager.playTone(150, 'square', 0.05, 0.3);
  },
  clearLines: function() {
    const fullRows = [];
    for (let y = 0; y < this.rows; y++) {
      if (this.grid[y].every(cell => cell !== 0)) fullRows.push(y);
    }
    const linesCleared = fullRows.length;

    // Burst of pixels from every cleared cell
    if (linesCleared > 0) {
      const m = this.boardMetrics();
      for (const y of fullRows) {
        for (let x = 0; x < this.cols; x++) {
          const col = this.pieceColors[(this.grid[y][x] || 1) - 1];
          this.particles.push({
            x: m.offsetX + (x + 0.5) * m.blockSize, y: m.offsetY + (y + 0.5) * m.blockSize,
            vx: (Math.random() - 0.5) * 0.3, vy: -(0.05 + Math.random() * 0.25),
            color: col, life: 380 + Math.random() * 260
          });
        }
      }
      if (this.particles.length > MAX_PARTICLES) this.particles.splice(0, this.particles.length - MAX_PARTICLES);
    }

    for (const y of fullRows) {
      this.grid.splice(y, 1);
      this.grid.unshift(new Array(this.cols).fill(0));
    }

    // Award points based on number of lines cleared at once
    if (linesCleared > 0) {
      this.clearFlash = { rows: fullRows, life: 280, count: linesCleared };
      const linePoints = [0, 100, 300, 500, 800]; // 0, 1, 2, 3, 4 lines
      this.score += linePoints[linesCleared] * this.level;
      this.linesCleared += linesCleared;

      audioManager.playSFX('score');
      GamepadManager.rumble(70 + linesCleared * 35, 0.25 + linesCleared * 0.13, 0.25);
      if (linesCleared >= 4) {
        audioManager.playSFX('powerup'); // Tetris!
        AchievementManager.unlock('tetris_master');
        this.banner = { text: "TETRIS!", life: 1100 };
      }

      // Level up every 10 lines
      const prevLevel = this.level;
      this.level = Math.floor(this.linesCleared / 10) + 1;
      if (this.level > prevLevel && !this.banner) this.banner = { text: "LEVEL " + this.level, life: 1100 };
      // Speed up drop interval with level
      this.dropInterval = Math.max(100, 1000 - (this.level - 1) * 100);
    }
  },
  rotate: function() {
    if (this.gameState !== "playing") return;

    const p = this.currentPiece;
    const shape = p.shape;
    const rotated = [];

    // Create rotated shape matrix
    for (let c = 0; c < shape[0].length; c++) {
      rotated[c] = [];
      for (let r = shape.length - 1; r >= 0; r--) {
        rotated[c].push(shape[r][c]);
      }
    }
    // Pivot around the piece's center instead of its top-left corner
    const baseX = p.x + Math.trunc((shape[0].length - rotated[0].length) / 2);
    const baseY = p.y + Math.trunc((shape.length - rotated.length) / 2);

    // Wall kicks: try in place, then nudges sideways, then up
    const kicks = [[0, 0], [-1, 0], [1, 0], [-2, 0], [2, 0], [0, -1]];
    for (const k of kicks) {
      if (!this.collides(rotated, baseX + k[0], baseY + k[1])) {
        p.shape = rotated;
        p.x = baseX + k[0];
        p.y = baseY + k[1];
        audioManager.playTone(400, 'square', 0.05, 0.1);
        this.touchLock();
        return;
      }
    }
  },
  keyDown: function(e) {
    if (this.gameState === "over" && e.key === " ") {
      this.init();
      return;
    }

    if (this.gameState !== "playing") return;

    switch (e.key) {
      case "ArrowLeft":
        if (this.move(-1, 0)) audioManager.playTone(300, 'square', 0.05, 0.05);
        break;
      case "ArrowRight":
        if (this.move(1, 0)) audioManager.playTone(300, 'square', 0.05, 0.05);
        break;
      case "ArrowDown":
        if (this.move(0, 1)) audioManager.playTone(300, 'square', 0.05, 0.05);
        break;
      case "ArrowUp":
        this.rotate();
        break;
      case " ":
        if (!e.repeat) this.hardDrop();
        break;
    }
  },
  // 8x8 bevelled jewel tile per color
  blockTile: function(color, ghost) {
    return PIX.get('tet-tile:' + color + ':' + (ghost ? 1 : 0), () => {
      const R = PIX.ramp(color);
      return PIX.paint(8, 8, (x, y) => {
        const edge = x === 0 || y === 0 || x === 7 || y === 7;
        if (ghost) {
          if (!edge) return null;
          return ((x + y) % 2 === 0) ? PIX.alpha(R.l, 0.9) : PIX.alpha(R.b, 0.5);
        }
        if (edge) return R.o;
        if (y === 1 || x === 1) return (x === 6 || y === 6) ? R.b : R.h;
        if (y === 6 || x === 6) return R.d;
        if ((x === 2 && y === 2)) return R.h;
        if ((x === 3 && y === 2) || (x === 2 && y === 3)) return R.l;
        if (x === 5 && y === 5) return R.d;
        return R.b;
      });
    });
  },
  wellImage: function(m) {
    const key = 'tet-well:' + m.blockSize;
    return PIX.get(key, () => {
      // Built at 8 art px per cell, drawn scaled to the block size
      const w = this.cols * 8, h = this.rows * 8;
      return PIX.paint(w, h, (x, y) => {
        const cx = x % 8, cy = y % 8;
        const row = Math.floor(y / 8);
        const base = PIX.mix('#0b0d1c', '#121632', row / this.rows);
        if (cx === 0 || cy === 0) return '#070812';
        if (cx === 1 && cy === 1) return '#1c2142';
        return base;
      });
    });
  },
  drawBlock: function(ctx, x, y, size, color, ghost) {
    PIX.draw(ctx, this.blockTile(color, ghost), x, y, size / 8, { ax: 0, ay: 0 });
  },
  drawFrame: function(ctx, x, y, w, h, b) {
    const t = Math.max(2, Math.round(b / 8));
    PIX.rect(ctx, x - 3 * t, y - 3 * t, w + 6 * t, h + 6 * t, '#2c3466');
    PIX.rect(ctx, x - 3 * t, y - 3 * t, w + 6 * t, t, '#5a67b8');
    PIX.rect(ctx, x - 3 * t, y - 3 * t, t, h + 6 * t, '#4a56a0');
    PIX.rect(ctx, x - 3 * t, y + h + 2 * t, w + 6 * t, t, '#161b3a');
    PIX.rect(ctx, x + w + 2 * t, y - 3 * t, t, h + 6 * t, '#161b3a');
    PIX.rect(ctx, x - t, y - t, w + 2 * t, h + 2 * t, '#05060e');
  },
  draw: function(ctx) {
    const m = this.boardMetrics();
    const blockSize = m.blockSize;
    const boardWidth = m.boardWidth;
    const boardHeight = m.boardHeight;
    const offsetX = m.offsetX;
    const offsetY = m.offsetY;
    const W = canvas.width, H = canvas.height;

    // Background: dithered dusk with drifting pixel stars
    const S = PIX.scaleFor();
    const sky = PIX.skyGradient('tetris', W, H, [[0, '#05060f'], [0.7, '#0c0f26'], [1, '#1a1440']], S);
    ctx.drawImage(sky, 0, 0, sky.width * S, sky.height * S);
    const stars = getEvenStarfield('tetris-stars', 50, W, H, 61);
    const now = performance.now();
    for (const st of stars) {
      ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(now / 900 + st.phase));
      PIX.rect(ctx, Math.floor(st.x / S) * S, Math.floor(st.y / S) * S, S, S, '#AFC0FF');
    }
    ctx.globalAlpha = 1;

    // Impact shake
    ctx.save();
    if (this.shake > 0) {
      const mag = this.shakeMag * (this.shake / 180);
      ctx.translate((Math.random() - 0.5) * mag * 2, Math.random() * mag * 1.6);
    }

    this.drawFrame(ctx, offsetX, offsetY, boardWidth, boardHeight, blockSize);
    ctx.drawImage(this.wellImage(m), offsetX, offsetY, boardWidth, boardHeight);

    // Draw existing blocks
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        const cellValue = this.grid[r][c];
        if (cellValue !== 0) {
          this.drawBlock(ctx, offsetX + c * blockSize, offsetY + r * blockSize, blockSize, this.pieceColors[cellValue - 1]);
        }
      }
    }

    if (this.currentPiece && this.gameState === "playing") {
      const shape = this.currentPiece.shape;
      const color = this.pieceColors[this.currentPiece.colorIndex];

      // Ghost first, so the live piece always draws on top of it
      let ghostY = this.currentPiece.y;
      while (!this.collides(shape, this.currentPiece.x, ghostY + 1)) ghostY++;
      if (ghostY !== this.currentPiece.y) {
        for (let r = 0; r < shape.length; r++) {
          for (let c = 0; c < shape[r].length; c++) {
            if (shape[r][c] && ghostY + r >= 0) {
              this.drawBlock(ctx, offsetX + (this.currentPiece.x + c) * blockSize, offsetY + (ghostY + r) * blockSize, blockSize, color, true);
            }
          }
        }
      }

      // Current piece (pulses slightly while it waits to lock)
      const lockGlow = this.grounded() ? Math.min(1, this.lockTimer / this.lockDelay) : 0;
      for (let r = 0; r < shape.length; r++) {
        for (let c = 0; c < shape[r].length; c++) {
          if (shape[r][c]) {
            const x = this.currentPiece.x + c;
            const y = this.currentPiece.y + r;
            if (y >= 0) {
              this.drawBlock(ctx, offsetX + x * blockSize, offsetY + y * blockSize, blockSize, color);
              if (lockGlow > 0) {
                ctx.fillStyle = "rgba(255,255,255," + (lockGlow * 0.28).toFixed(3) + ")";
                ctx.fillRect(offsetX + x * blockSize, offsetY + y * blockSize, blockSize, blockSize);
              }
            }
          }
        }
      }
    }

    // Lock flash on freshly placed cells
    if (this.lockFlash) {
      ctx.fillStyle = "rgba(255, 255, 255, " + (this.lockFlash.life / 170 * 0.45).toFixed(3) + ")";
      for (const cell of this.lockFlash.cells) {
        ctx.fillRect(offsetX + cell.x * blockSize, offsetY + cell.y * blockSize, blockSize, blockSize);
      }
    }

    // Line clear flash: bright scan bands
    if (this.clearFlash) {
      const a = this.clearFlash.life / 280;
      for (const r of this.clearFlash.rows) {
        ctx.fillStyle = "rgba(255, 255, 255, " + (a * 0.75).toFixed(3) + ")";
        ctx.fillRect(offsetX, offsetY + r * blockSize, boardWidth, blockSize);
        const band = Math.floor((1 - a) * boardWidth);
        ctx.fillStyle = "rgba(255, 240, 160, " + (a * 0.9).toFixed(3) + ")";
        ctx.fillRect(offsetX + boardWidth / 2 - band / 2, offsetY + r * blockSize + blockSize * 0.4, band, Math.max(2, blockSize * 0.2));
      }
    }

    // Impact dust
    const ps = Math.max(2, Math.round(blockSize / 8)) * 2;
    for (const pt of this.particles) {
      ctx.globalAlpha = Math.min(1, pt.life / 250);
      PIX.rect(ctx, pt.x, pt.y, ps, ps, pt.color);
    }
    ctx.globalAlpha = 1;

    // NEXT panel, sized to fit beside the board on any screen
    if (this.nextPiece) {
      const pb = m.pb;
      const px = m.panelX, py = offsetY;
      const pw = m.panelW, ph = pb * 4 + 34;
      ctx.fillStyle = "rgba(10, 12, 26, 0.85)";
      ctx.fillRect(px, py, pw, ph);
      PIX.rect(ctx, px, py, pw, 2, '#5a67b8');
      PIX.rect(ctx, px, py + ph - 2, pw, 2, '#161b3a');
      PIX.text(ctx, "NEXT", px + pw / 2, py + 13, 2, "#C5CCFF", { shadow: '#20264f' });
      const shape = this.nextPiece.shape;
      const color = this.pieceColors[this.nextPiece.colorIndex];
      const cx = px + (pw - shape[0].length * pb) / 2;
      const cy = py + 26 + (pb * 4 - shape.length * pb) / 2;
      for (let r = 0; r < shape.length; r++) {
        for (let c = 0; c < shape[r].length; c++) {
          if (shape[r][c]) this.drawBlock(ctx, cx + c * pb, cy + r * pb, pb, color);
        }
      }
    }

    ctx.restore();

    if (this.banner) {
      PIX.text(ctx, this.banner.text, offsetX + boardWidth / 2, offsetY + boardHeight * 0.4, Math.max(3, Math.floor(boardWidth / 50)), "#FFE082", { shadow: '#8a4b00', outline: '#2a1600', alpha: Math.min(1, this.banner.life / 300) });
    }

    drawHUDChips(ctx, [
      { label: "Score", value: this.score },
      { label: "Level", value: this.level, color: "#40C4FF" },
      { label: "Lines", value: this.linesCleared, color: "#FFD740" }
    ]);

    // Game over overlay
    if (this.gameState === "over") {
      drawGameOverScreen(ctx, { title: "GAME OVER", score: this.score, lines: ["Level " + this.level + "  •  " + this.linesCleared + " lines"] });
    }
  },
  keyUp: function(e) {},
  end: function() {}
};

// 8. Dino (Neon Runner - Retro Arcade Style)
const dinoGame = {
  player: null,
  obstacles: [],
  particles: [],
  score: 0,
  highScore: 0,
  speed: 0.3,
  gameState: "playing",
  groundY: 0,
  ducking: false,
  art: {
    top: [
      "...hhhhh...",
      "..hlllllb..",
      ".hlllllllb.",
      ".lvvvvgvlb.",
      ".lvvvvvvlb.",
      ".bllllllbd.",
      "rr.bbbbbd..",
      ".rrlllllb..",
      "...lbbbbd..",
      "..dlbbbbdd.",
      "...bbbbbd.."
    ],
    legs: [
      ["...bd.bd...", "..bd...bd..", ".bd.....bd.", ".dd.....dd."],
      ["...bd.bd...", "...bd.bd...", "...bd..bd..", "...dd..dd.."],
      ["...bd.bd...", "..bd..bd...", ".bd...bd...", ".dd....dd.."],
      ["...bd.bd...", "...bd.bd...", "..bd..bd...", "..dd..dd..."]
    ],
    jumpLegs: ["..bbbbbd...", ".bd...bd...", ".dd...dd...", "..........."],
    duck: [
      ".....hhhhh.....",
      "....hlllllbb...",
      "...hlvvvvgvlb..",
      "rr.llvvvvvvlb..",
      ".rrbllllllbbd..",
      "..bbbbbbbbbbbd.",
      "..lbbbbbbbbbd..",
      "..bd.bd.bd.bd..",
      "..dd.dd.dd.dd.."
    ],
    spike: [
      "....h....", "....lh...", "...lbh...", "...lbd...", "..lbbbd..", "..lbbbd..",
      ".lbbbbbd.", ".lbbbbbd.", "lbbbbbbbd", "lbbbbbbbd", "ddddddddd"
    ]
  },
  runnerSprite: function(kind, frame) {
    return PIX.get('dino-run:' + kind + ':' + frame, () => {
      const R = PIX.ramp("#4ECDC4");
      const pal = { h: R.h, l: R.l, b: R.b, d: R.d, v: "#14163a", g: "#BFF8FF", r: "#FF5A6E" };
      let rows;
      if (kind === 'duck') rows = this.art.duck;
      else if (kind === 'jump') rows = this.art.top.concat(this.art.jumpLegs);
      else rows = this.art.top.concat(this.art.legs[frame % 4]);
      // Scarf flutters
      if (frame % 2 && kind !== 'duck') rows = rows.map((r, i) => i === 6 ? "r" + r.slice(1).replace(/^r/, ".") : i === 7 ? r.replace(".rr", "rr.") : r);
      return PIX.fromRows(rows, pal, { outline: R.o });
    });
  },
  spikeSprite: function() {
    return PIX.get('dino-spike', () => {
      const R = PIX.ramp("#7C8CFF");
      return PIX.fromRows(this.art.spike, { h: R.h, l: R.l, b: R.b, d: R.d }, { outline: R.o });
    });
  },
  sawSprite: function(d, frame) {
    return PIX.get('dino-saw:' + d + ':' + frame, () => {
      const R = PIX.ramp("#FF6B6B");
      const M = PIX.ramp("#C9CED9");
      const rad = d / 2;
      return PIX.paint(d, d, (x, y) => {
        const dx = x + 0.5 - rad, dy = y + 0.5 - rad;
        const r = Math.hypot(dx, dy) / rad;
        const a = Math.atan2(dy, dx) / (Math.PI * 2) + frame / 32;
        const tooth = ((a * 8) % 1 + 1) % 1;
        const edge = 0.62 + (tooth < 0.5 ? tooth : 1 - tooth) * 0.76;
        if (r > Math.min(1, edge)) return null;
        if (r < 0.16) return "#14163a";
        if (r < 0.26) return M.l;
        if (r < 0.5) return dx + dy < 0 ? M.b : M.d;
        if (r > Math.min(1, edge) - 0.16) return R.o;
        return dx + dy < 0 ? R.l : R.b;
      });
    });
  },
  crateSprite: function(w, h) {
    return PIX.get('dino-crate:' + w + 'x' + h, () => {
      const N = PIX.ramp("#45B7D1");
      return PIX.paint(w, h, (x, y) => {
        const e = x === 0 || y === 0 || x === w - 1 || y === h - 1;
        if (e) return N.o;
        if (x === 1 || y === 1) return N.l;
        if (x === w - 2 || y === h - 2) return N.d;
        // Corner plates
        if ((x <= 3 || x >= w - 4) && (y <= 3 || y >= h - 4)) return N.b;
        // Glowing cross brace
        const u = (x - 2) / (w - 5), v = (y - 2) / (h - 5);
        if (Math.abs(u - v) < 0.09 || Math.abs(u + v - 1) < 0.09) return "#9FF3FF";
        return (x + y) % 2 ? "#0f2533" : "#132d3d";
      });
    });
  },
  // Tileable parallax strip (cached per height)
  layer: function(kind, h) {
    return PIX.get('dino-layer:' + kind + ':' + h, () => {
      const w = 256;
      return PIX.paint(w, h, (x, y) => {
        if (kind === 'city') {
          const col = Math.floor(x / 16);
          const bh = 12 + ((col * 37) % 23) + ((col * 13) % 7);
          if (y < h - bh) return null;
          const wx = x % 16, wy = (h - y);
          if (wx === 0 || wx === 15) return '#1a1236';
          if (wx > 2 && wx < 13 && wx % 3 === 0 && wy % 4 === 2 && ((col * 7 + wy) % 5) < 2) return '#ffb85c';
          return '#241a48';
        }
        // Rolling hills
        const hh = 10 + Math.round(Math.sin(x / w * Math.PI * 4) * 4 + Math.sin(x / w * Math.PI * 10 + 1) * 2);
        if (y < h - hh) return null;
        const d = y - (h - hh);
        if (d === 0) return '#3b2f7a';
        return (x + y) % 5 === 0 ? '#1b1640' : '#211a4c';
      });
    });
  },
  init: function() {
    audioManager.playMusic('dino', true);
    const S = PIX.scaleFor();
    this.S = S;
    this.standH = 17 * S; // art incl. outline
    this.duckH = 11 * S;
    this.groundSurface = canvas.height - Math.max(70, 40 + SAFE.bottom);
    this.groundY = this.groundSurface - this.standH;
    this.player = {
      x: Math.min(100, canvas.width * 0.18),
      y: this.groundY,
      width: 11 * S,
      height: this.standH,
      vy: 0,
      onGround: true
    };
    this.obstacles = [];
    this.particles = [];
    this.score = 0;
    this.speed = 0.3;
    this.dist = 0;
    this.runPhase = 0;
    this.jumpBuffer = 0;
    this.coyote = 0;
    this.gameState = "playing";
    this.spawnTimer = 0;
    this.spawnInterval = 1800;
    this.ducking = false;
    this.boomT = undefined;
  },
  onResize: function() {
    if (!this.player) return;
    const lift = this.groundSurface - (canvas.height - Math.max(70, 40 + SAFE.bottom));
    this.groundSurface -= lift;
    this.groundY -= lift;
    this.player.y -= lift;
    for (const o of this.obstacles) o.y -= lift;
  },
  update: function(delta) {
    if (this.gameState === "over" && this.boomT !== undefined) this.boomT = Math.min(1, this.boomT + delta / 650);
    // Particles keep moving on the game-over screen
    for (let p of this.particles) {
      p.x += p.vx * delta;
      p.y += p.vy * delta;
      p.life -= delta;
    }
    this.particles = this.particles.filter(p => p.life > 0);
    if (this.particles.length > MAX_PARTICLES) {
      this.particles.splice(0, this.particles.length - MAX_PARTICLES);
    }
    if (this.gameState !== "playing") return;
    const S = this.S, p = this.player;

    this.score += delta * 0.01;
    this.speed = 0.3 + Math.min(0.3, this.score / 700);
    this.dist += this.speed * delta;
    this.runPhase += delta * this.speed * 0.045;

    // Ducking
    this.ducking = !!(keysDown["ArrowDown"] || keysDown["s"] || keysDown["S"]);
    p.height = this.ducking ? this.duckH : this.standH;
    // Ducking in the air pulls you down faster (fast-fall)
    if (this.ducking && !p.onGround) p.vy += 0.004 * delta;
    if (p.onGround) p.y = this.groundSurface - p.height;

    // Gravity
    if (!p.onGround) {
      p.vy += 0.002 * delta;
      p.y += p.vy * delta;
    }

    // Ground collision
    if (p.y + p.height >= this.groundSurface) {
      if (!p.onGround) {
        for (let i = 0; i < 6; i++) this.particles.push({ x: p.x + p.width / 2, y: this.groundSurface - S, vx: (Math.random() - 0.5) * 0.2, vy: -Math.random() * 0.08, life: 300, color: "#4ECDC4" });
      }
      p.y = this.groundSurface - p.height;
      p.vy = 0;
      p.onGround = true;
      this.coyote = 90;
    } else if (p.onGround === false) {
      this.coyote = Math.max(0, this.coyote - delta);
    }

    // Buffered jump: a press just before landing still counts
    if (this.jumpBuffer > 0) {
      this.jumpBuffer -= delta;
      if (this.tryJump()) this.jumpBuffer = 0;
    }

    // Spawn obstacles
    this.spawnTimer += delta;
    if (this.spawnTimer > this.spawnInterval) {
      this.spawnTimer = 0;
      this.spawnInterval = Math.max(700, 1800 - this.score * 3);

      // Obstacle types: ground spikes/blocks (jump) or flying saw (duck or jump)
      const isFlying = this.score > 120 && Math.random() > 0.72;
      let type, w, h, y;
      if (isFlying) {
        type = "saw"; w = 13 * S; h = 13 * S;
        // Clears a ducking runner, hits a standing one
        y = this.groundSurface - this.duckH - h;
      } else if (Math.random() < 0.6) {
        type = "spike";
        const count = 1 + (Math.random() < 0.35 ? 1 : 0);
        w = 11 * S * count; h = 13 * S;
        y = this.groundSurface - h;
      } else {
        type = "block"; w = 12 * S; h = Math.round((11 + Math.random() * 7)) * S;
        y = this.groundSurface - h;
      }
      this.obstacles.push({ x: canvas.width + 50, y: y, width: w, height: h, type: type, isFlying: isFlying });
    }

    // Move obstacles
    for (let obs of this.obstacles) {
      obs.x -= this.speed * delta;
    }
    this.obstacles = this.obstacles.filter(o => o.x + o.width > -50);

    // Kicked-up dust while running
    if (p.onGround && Math.random() < 0.3) {
      this.particles.push({
        x: p.x + 2 * S, y: this.groundSurface - S,
        vx: -0.1 - Math.random() * 0.05, vy: -Math.random() * 0.04,
        life: 260, color: "#4ECDC4"
      });
    }

    // Collision (hitboxes trimmed so contact looks fair)
    const px = p.x + 2 * S, pw = p.width - 4 * S;
    const py = p.y + 2 * S, ph = p.height - 3 * S;
    for (let obs of this.obstacles) {
      const inset = obs.type === "spike" ? obs.width * 0.2 / (obs.width > 12 * S ? 2 : 1) : obs.type === "saw" ? 2 * S : S;
      const oTop = obs.y + (obs.type === "spike" ? obs.height * 0.3 : obs.type === "saw" ? 2 * S : S);
      const oBot = obs.y + obs.height - (obs.type === "saw" ? 2 * S : 0);
      if (px + pw > obs.x + inset && px < obs.x + obs.width - inset &&
          py + ph > oTop && py < oBot) {
        this.crash();
        break;
      }
    }
  },
  crash: function() {
    const p = this.player;
    if (this.score > this.highScore) this.highScore = this.score;
    this.gameState = "over";
    this.boomT = 0;
    GamepadManager.rumble(200, 0.8, 0.5);
    audioManager.stopMusic();
    audioManager.playSFX('explosion');
    audioManager.playSFX('gameover');
    for (let i = 0; i < 18; i++) {
      this.particles.push({
        x: p.x + p.width / 2, y: p.y + p.height / 2,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        life: 700,
        color: ["#FF6B6B", "#4ECDC4", "#FFD54F"][Math.floor(Math.random() * 3)]
      });
    }
  },
  tryJump: function() {
    const p = this.player;
    if ((p.onGround || this.coyote > 0) && !this.ducking) {
      p.vy = -0.6;
      p.onGround = false;
      this.coyote = 0;
      audioManager.playSFX('jump');
      return true;
    }
    return false;
  },
  jump: function() {
    if (!this.tryJump()) this.jumpBuffer = 120;
  },
  draw: function(ctx) {
    const W = canvas.width, H = canvas.height, S = this.S;
    const G = this.groundSurface;

    // Sky, stars, moon
    const sky = PIX.skyGradient('dino', W, H, [[0, '#0f0c29'], [0.55, '#302b63'], [1, '#24243e']], S);
    ctx.drawImage(sky, 0, 0, sky.width * S, sky.height * S);
    const stars = getEvenStarfield('dino-stars', 60, W, Math.max(40, G - 60), 133);
    const now = performance.now();
    for (const star of stars) {
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(now / 500 + star.phase);
      PIX.rect(ctx, Math.floor(star.x / S) * S, Math.floor(star.y / S) * S, S, S, "#E6E8FF");
    }
    ctx.globalAlpha = 1;
    PIX.drawGlow(ctx, W * 0.78, G * 0.28, 30 * S, "#FF8AD8", 0.25);
    PIX.draw(ctx, PIX.orb(26, "#FF9CC9", { spec: false }), W * 0.78, G * 0.28, S);

    // Parallax skyline and hills, tiled
    const lw = 256 * S;
    const drawLayer = (kind, h, speed, bottom) => {
      const img = this.layer(kind, h);
      const off = -((this.dist * speed) % lw);
      for (let x = Math.floor(off / S) * S - lw; x < W; x += lw) {
        ctx.drawImage(img, x, bottom - h * S, lw, h * S);
      }
    };
    drawLayer('city', 46, 0.12, G - 12 * S);
    drawLayer('hills', 22, 0.3, G);

    // Ground: neon edge + scrolling tiles
    PIX.rect(ctx, 0, G, W, H - G, "#14122a");
    PIX.rect(ctx, 0, G, W, S, "#7FF5EC");
    PIX.rect(ctx, 0, G + S, W, S, "#2a8f8a");
    const tile = 16 * S;
    const off = -(this.dist % tile);
    for (let x = Math.floor(off / S) * S; x < W; x += tile) {
      PIX.rect(ctx, x, G + 2 * S, S, H - G, "#1d1a3a");
      PIX.rect(ctx, x + 8 * S, G + 6 * S, S, S, "#2c2858");
      PIX.rect(ctx, x + 3 * S, G + 10 * S, 2 * S, S, "#221f44");
    }

    // Particles
    for (let p of this.particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 300));
      PIX.rect(ctx, Math.floor(p.x / S) * S, Math.floor(p.y / S) * S, S, S, p.color);
    }
    ctx.globalAlpha = 1;

    // Obstacles
    const sawFrame = Math.floor(now / 40) % 32;
    for (let obs of this.obstacles) {
      if (obs.type === "saw") {
        const cx = obs.x + obs.width / 2, cy = obs.y + obs.height / 2;
        PIX.drawGlow(ctx, cx, cy, obs.width * 1.1, "#FF6B6B", 0.45);
        PIX.draw(ctx, this.sawSprite(13, sawFrame % 4), cx, cy, S);
      } else if (obs.type === "spike") {
        const n = Math.max(1, Math.round(obs.width / (11 * S)));
        for (let i = 0; i < n; i++) {
          PIX.draw(ctx, this.spikeSprite(), obs.x + (i + 0.5) * (obs.width / n), obs.y + obs.height, S, { ay: 1 });
        }
      } else {
        PIX.drawGlow(ctx, obs.x + obs.width / 2, obs.y + obs.height / 2, obs.height, "#45B7D1", 0.25);
        PIX.draw(ctx, this.crateSprite(Math.round(obs.width / S), Math.round(obs.height / S)), obs.x, obs.y, S, { ax: 0, ay: 0 });
      }
    }

    // Runner
    const p = this.player;
    if (this.gameState === "playing") {
      let img;
      if (this.ducking && p.onGround) img = this.runnerSprite('duck', Math.floor(this.runPhase) % 2);
      else if (!p.onGround) img = this.runnerSprite('jump', 0);
      else img = this.runnerSprite('run', Math.floor(this.runPhase) % 4);
      PIX.drawGlow(ctx, p.x + p.width / 2, p.y + p.height / 2, p.height, "#4ECDC4", 0.25);
      PIX.draw(ctx, img, p.x + p.width / 2, p.y + p.height, S, { ay: 1 });
    } else if (this.boomT !== undefined) {
      if (this.boomT < 1) PIX.draw(ctx, PIX.boom(24, this.boomT), p.x + p.width / 2, p.y + p.height / 2, S);
    }

    // HUD - top right
    drawHUDChips(ctx, [
      { label: "Score", value: Math.floor(this.score) },
      { label: "Best", value: Math.floor(this.highScore), color: "#4ECDC4" }
    ]);

    // Game over
    if (this.gameState === "over") {
      drawGameOverScreen(ctx, {
        title: "GAME OVER",
        score: Math.floor(this.score),
        isNewBest: this.score === this.highScore && this.score > 0
      });
    }
  },
  keyDown: function(e) {
    if (this.gameState === "over" && e.key === " ") { this.init(); return; }
    if ((e.key === " " || e.key === "ArrowUp" || e.key === "w" || e.key === "W") && this.gameState === "playing") {
      this.jump();
    }
  },
  keyUp: function(e) {},
  end: function() {}
};

// 9. Crossy (Hop across lanes - avoid cars, ride logs)
const crossyGame = {
  player: null,
  lanes: [],
  particles: [],
  score: 0,
  highScore: 0,
  gameState: "playing",
  deathType: null,
  deathTimer: 0,
  laneHeight: 50,
  hopAnim: 0,
  init: function() {
    audioManager.playMusic('crossy', true);
    if (!this.character) this.character = "turtle";
    this.setup();
    this.gameState = "select";
  },
  baseY: function() {
    return canvas.height - SAFE.bottom;
  },
  setup: function() {
    const S = PIX.scaleFor();
    this.S = S;
    this.laneHeight = S === 3 ? 54 : 50;
    this.score = 0;
    this.deathType = null;
    this.deathTimer = 0;
    this.particles = [];
    this.hopAnim = 0;
    this.lanes = [];
    const base = this.baseY();
    // Safe ground fills everything below the start lane (home-indicator area)
    for (let y = base - this.laneHeight; y >= -this.laneHeight * 2; y -= this.laneHeight) {
      if (y >= base - this.laneHeight) {
        this.lanes.push({ y: y, type: "safe", items: [], speed: 0, variant: 0 });
      } else {
        this.lanes.push(this.createLane(y));
      }
    }
    for (let y = base; y < canvas.height; y += this.laneHeight) this.lanes.push({ y: y, type: "safe", items: [], speed: 0, variant: 1 });
    const size = 12 * S;
    const startY = base - this.laneHeight + (this.laneHeight - size) / 2;
    this.player = { x: canvas.width / 2 - size / 2, y: startY, targetX: canvas.width / 2 - size / 2, targetY: startY, size: size };
  },
  startPlay: function() {
    this.setup();
    this.gameState = "playing";
  },
  createLane: function(y) {
    const rand = Math.random();
    let type = rand < 0.35 ? "safe" : rand < 0.7 ? "road" : "river";
    const speed = (0.08 + Math.random() * 0.12) * (Math.random() > 0.5 ? 1 : -1);
    const lane = { y: y, type: type, items: [], speed: speed, variant: Math.floor(Math.random() * 3) };
    const S = this.S;

    if (type === "road") {
      const numCars = 2 + Math.floor(Math.random() * 2);
      const gap = canvas.width / numCars;
      const kinds = ["compact", "sedan", "sedan", "truck"];
      for (let i = 0; i < numCars; i++) {
        const kind = kinds[Math.floor(Math.random() * kinds.length)];
        const artW = kind === "truck" ? 34 : kind === "sedan" ? 26 : 21;
        lane.items.push({
          x: gap * i + Math.random() * (gap * 0.5),
          width: artW * S,
          kind: kind,
          color: ["#FF6B6B", "#4ECDC4", "#45B7D1", "#FFD166", "#C77DFF", "#F4F4F4"][Math.floor(Math.random() * 6)]
        });
      }
    } else if (type === "river") {
      const numLogs = 2 + Math.floor(Math.random() * 2);
      const gap = canvas.width / numLogs;
      for (let i = 0; i < numLogs; i++) {
        lane.items.push({ x: gap * i + Math.random() * (gap * 0.3), width: Math.round((70 + Math.random() * 40) / S) * S });
      }
    }
    return lane;
  },
  update: function(delta) {
    // Death animation
    if (this.gameState === "dying") {
      this.deathTimer -= delta;
      for (let p of this.particles) {
        p.x += p.vx * delta;
        p.y += p.vy * delta;
        p.vy += 0.001 * delta;
        p.life -= delta;
      }
      this.particles = this.particles.filter(p => p.life > 0);
      if (this.deathTimer <= 0) {
        this.gameState = "over";
      }
      return;
    }
    if (this.gameState !== "playing") return;

    // Smooth hop animation (frame-rate independent easing)
    this.hopAnim *= Math.pow(0.85, delta / 16.67);
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * delta;
      p.y += p.vy * delta;
      p.life -= delta;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
    const ease = 1 - Math.pow(0.75, delta / 16.67);
    this.player.x += (this.player.targetX - this.player.x) * ease;
    this.player.y += (this.player.targetY - this.player.y) * ease;

    // Move lane items
    for (let lane of this.lanes) {
      for (let item of lane.items) {
        item.x += lane.speed * delta;
        if (lane.speed > 0 && item.x > canvas.width + 50) item.x = -item.width - 30;
        if (lane.speed < 0 && item.x + item.width < -50) item.x = canvas.width + 30;
      }
    }

    // Find current lane based on targetY
    const currentLane = this.lanes.find(l => Math.abs(l.y + this.laneHeight / 2 - this.player.targetY - this.player.size / 2) < this.laneHeight / 2);

    if (currentLane) {
      const pad = this.player.size * 0.2;
      if (currentLane.type === "road") {
        // Car collision
        for (let car of currentLane.items) {
          if (this.player.targetX + this.player.size - pad > car.x + 4 && this.player.targetX + pad < car.x + car.width - 4) {
            this.die("hit");
            return;
          }
        }
      } else if (currentLane.type === "river") {
        // Must be on a log (ride only one, even where two overlap)
        let onLog = false;
        for (let log of currentLane.items) {
          if (this.player.targetX + this.player.size > log.x + 5 && this.player.targetX < log.x + log.width - 5) {
            onLog = true;
            this.player.targetX += currentLane.speed * delta;
            this.player.x += currentLane.speed * delta;
            break;
          }
        }
        if (!onLog) {
          this.die("drown");
          return;
        }
      }
    }

    // Keep in bounds
    this.player.targetX = Math.max(0, Math.min(canvas.width - this.player.size, this.player.targetX));
    this.player.x = Math.max(0, Math.min(canvas.width - this.player.size, this.player.x));

    // Scroll when near top
    if (this.player.targetY < canvas.height / 3) {
      const shift = this.laneHeight;
      this.player.targetY += shift;
      this.player.y += shift;
      for (let lane of this.lanes) lane.y += shift;
      for (let pt of this.particles) pt.y += shift;
      this.lanes = this.lanes.filter(l => l.y < canvas.height + this.laneHeight);
      while (Math.min(...this.lanes.map(l => l.y)) > -this.laneHeight * 2) {
        const topY = Math.min(...this.lanes.map(l => l.y)) - this.laneHeight;
        this.lanes.push(this.createLane(topY));
      }
      this.score++;
      audioManager.playSFX('score');
    }
  },
  die: function(type) {
    this.deathType = type;
    this.gameState = "dying";
    this.deathTimer = 800;
    this.deathX = this.player.x + this.player.size / 2;
    this.deathY = this.player.y + this.player.size / 2;
    GamepadManager.rumble(180, 0.7, 0.5);
    audioManager.stopMusic();
    audioManager.playSFX('explosion');
    audioManager.playSFX('gameover');
    if (this.score > this.highScore) this.highScore = this.score;
    // Create particles
    const colors = type === "drown" ? ["#4ECDC4", "#9BE7FF", "#fff"] : ["#FF6B6B", "#FFEAA7", "#fff"];
    for (let i = 0; i < 16; i++) {
      this.particles.push({
        x: this.deathX,
        y: this.deathY,
        vx: (Math.random() - 0.5) * 0.3,
        vy: type === "drown" ? -Math.random() * 0.2 : (Math.random() - 0.5) * 0.3,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 600
      });
    }
    if (this.particles.length > MAX_PARTICLES) {
      this.particles.splice(0, this.particles.length - MAX_PARTICLES);
    }
  },
  hop: function(dir) {
    if (this.gameState !== "playing") return;
    this.hopAnim = 1;
    if (dir === "left") this.facing = -1;
    if (dir === "right") this.facing = 1;
    for (let i = 0; i < 4; i++) {
      this.particles.push({
        x: this.player.x + this.player.size / 2 + (Math.random() - 0.5) * 12,
        y: this.player.y + this.player.size,
        vx: (Math.random() - 0.5) * 0.08,
        vy: 0.02 + Math.random() * 0.04,
        color: "#FFFFFF",
        life: 280
      });
    }
    audioManager.playTone(400, 'square', 0.05, 0.2);
    const step = Math.round(40 / this.S) * this.S;
    const bottomY = this.baseY() - this.laneHeight + (this.laneHeight - this.player.size) / 2;
    if (dir === "up") this.player.targetY -= this.laneHeight;
    else if (dir === "down") this.player.targetY = Math.min(bottomY, this.player.targetY + this.laneHeight);
    else if (dir === "left") this.player.targetX = Math.max(0, this.player.targetX - step);
    else if (dir === "right") this.player.targetX = Math.min(canvas.width - this.player.size, this.player.targetX + step);
  },
  character: "turtle",
  turtle: [
    "......kk......",
    ".....khhk.....",
    ".....heeh.....",
    "..ff.kkkk.ff..",
    "..ffkggggkff..",
    "...kglllgk....",

    "..ffkggggkff..",
    "..ff.kkkk.ff..",
    "......kk......",

  ],
  turtlePal: { k: "#234D24", g: "#43A047", l: "#86D67A", h: "#62B36A", e: "#10210F", f: "#5BA862" },
  chicken: [
    "......rr......",
    ".....rrrr.....",
    "....rrrrrr....",
    "...kwwwwwwk...",
    "..kwwwwwwwwk..",
    "..kweewweewk..",

    "..kwwwyywwwk..",
    ".kwwwwwwwwwwk.",

    ".kwWWwwwwWWwk.",
