  ],
  chickenPal: { r: "#E53935", k: "#2A2622", w: "#F4F4F4", W: "#FFFFFF", e: "#141414", y: "#FB8C00" },
  charSprite: function(which) {
    const spr = which === "chicken" ? this.chicken : this.turtle;
    const pal = which === "chicken" ? this.chickenPal : this.turtlePal;
    return PIX.sprite('crossy-char:' + which, spr, pal, { outline: "#0d1a10" });
  },
  // Top-down vehicle, facing right
  carSprite: function(kind, color, w, h) {
    return PIX.get('crossy-car:' + kind + ':' + color + ':' + w + 'x' + h, () => {
      const R = PIX.ramp(color);
      const C = PIX.ramp("#FFB74D");
      const glass = "#9FD8FF", glassD = "#3A5A80";
      const truck = kind === "truck";
      const cabX = Math.floor(w * 0.7);
      return PIX.paint(w, h, (x, y) => {
        const corner = (x <= 1 || x >= w - 2) && (y === 0 || y === h - 1);
        if (corner || ((x === 0 || x === w - 1) && (y === 1 || y === h - 2))) return null;
        // Tyres peek out above and below the body
        const wheel = (x >= Math.floor(w * 0.14) && x <= Math.floor(w * 0.14) + 3) || (x >= Math.floor(w * 0.72) && x <= Math.floor(w * 0.72) + 3);
        if ((y === 0 || y === h - 1)) return wheel ? "#14151b" : R.o;
        if (x === 0 || x === w - 1) return R.o;
        // Lights
        if (x === w - 2 && (y === 2 || y === h - 3)) return "#FFF6C4";
        if (x === 1 && (y === 2 || y === h - 3)) return "#FF4D4D";
        if (truck) {
          if (x >= cabX - 1 && x <= cabX) return R.o;
          if (x > cabX) {
            if (x >= w - 5 && x <= w - 4 && y >= 2 && y <= h - 3) return y < h / 2 ? glass : glassD;
            return y === 1 ? R.h : y === h - 2 ? R.d : R.b;
          }
          // Cargo box with ribs
          if (y === 1) return "#FFFFFF";
          if (y === h - 2) return "#9AA1B3";
          return (x % 4 === 0) ? "#C9CED9" : "#E8EBF2";
        }
        const fw0 = Math.floor(w * 0.62), fw1 = Math.floor(w * 0.76);
        const rw0 = Math.floor(w * 0.16), rw1 = Math.floor(w * 0.26);
        const inset = y >= 2 && y <= h - 3;
        if (inset && x >= fw0 && x <= fw1) return y < h / 2 ? glass : glassD;
        if (inset && x >= rw0 && x <= rw1) return y < h / 2 ? glassD : "#2a4466";
        if (inset && x > rw1 && x < fw0) return (y === 2) ? R.h : R.l; // roof
        if (y === 1) return R.h;
        if (y === h - 2) return R.d;
        if (kind === "compact" && y === Math.floor(h / 2) && x > fw1) return C.b;
        return R.b;
      });
    });
  },
  logSprite: function(w, h) {
    return PIX.get('crossy-log:' + w + 'x' + h, () => {
      const B = PIX.ramp("#8A6044");
      const T = PIX.ramp("#D9A86C");
      return PIX.paint(w, h, (x, y) => {
        if ((x === 0 || x === w - 1) && (y === 0 || y === h - 1)) return null;
        if (y === 0 || y === h - 1) return B.o;
        // End caps show rings
        const ex = Math.min(x, w - 1 - x);
        if (ex <= 2) {
          if (ex === 0) return B.o;
          const ring = Math.abs(y - (h - 1) / 2);
          return ring < 1 ? T.d : (Math.floor(ring) % 2 ? T.b : T.l);
        }
        if (y === 1) return B.l;
        if (y === h - 2) return B.d;
        // Bark grain
        if ((y + Math.floor(x / 7)) % 3 === 0 && (x * 5 + y) % 9 > 2) return B.d;
        if ((x * 3 + y * 7) % 17 === 0) return B.h;
        return B.b;
      });
    });
  },
  // Whole-width lane strips baked per type/variant (animated water uses frames)
  laneStrip: function(type, variant, frame, wArt, hArt) {
    return PIX.get('crossy-lane:' + type + ':' + variant + ':' + frame + ':' + wArt + 'x' + hArt, () => PIX.paint(wArt, hArt, (x, y) => {
      const n = ((x * 2654435761) ^ (y * 40503) ^ (variant * 977)) >>> 0;
      if (type === "safe") {
        if (y === 0) return "#2f7d38";
        const base = ((Math.floor(x / 4) + Math.floor(y / 4) + variant) % 2) ? "#45a84f" : "#3d9a46";
        if (n % 61 === 0) return "#7ddc6e";
        if (n % 97 === 0 && y > 2) return ["#FFE066", "#FF8FB1", "#FFFFFF"][n % 3];
        if (y === hArt - 1) return "#2f7d38";
        return base;
      }
      if (type === "road") {
        if (y === 0 || y === hArt - 1) return "#8c8f9c"; // curb
        if (y === 1 || y === hArt - 2) return "#5d606c";
        const mid = Math.floor(hArt / 2);
        if ((y === mid || y === mid - 1) && x % 16 < 8) return "#FFE05A";
        if (n % 23 === 0) return "#31343f";
        if (n % 29 === 0) return "#23252d";
        return "#2B2F38";
      }
      // River: two ripple frames
      if (y === 0) return "#0f4c8f";
      const ripple = ((x + frame * 3 + Math.floor(y / 3) * 5) % 14);
      if ((y % 6 === 2) && ripple < 3) return "#6fb6ff";
      if ((y % 6 === 5) && ripple > 9) return "#3d8ee0";
      return y < 3 ? "#1559a6" : "#1763B6";
    }));
  },
  draw: function(ctx) {
    const W = canvas.width, H = canvas.height, lh = this.laneHeight, S = this.S;
    const t = performance.now();
    ctx.fillStyle = "#0E1326";
    ctx.fillRect(0, 0, W, H);
    const wArt = Math.ceil(W / S), hArt = Math.round(lh / S);
    const waterFrame = Math.floor(t / 260) % 4;

    for (const lane of this.lanes) {
      const y = lane.y;
      if (y > H || y + lh < 0) continue;
      const strip = this.laneStrip(lane.type, lane.variant || 0, lane.type === "river" ? waterFrame : 0, wArt, hArt);
      ctx.drawImage(strip, 0, y, wArt * S, hArt * S);
      if (lane.type === "road") {
        const ch = hArt - 8;
        for (const car of lane.items) {
          const img = this.carSprite(car.kind || "sedan", car.color, Math.round(car.width / S), ch);
          PIX.rect(ctx, car.x + S, y + 5 * S, car.width, ch * S, "rgba(0,0,0,0.3)");
          PIX.draw(ctx, img, car.x, y + 4 * S, S, { ax: 0, ay: 0, flip: lane.speed < 0 ? true : false });
          // Headlight cone
          ctx.globalAlpha = 0.18;
          const fx = lane.speed >= 0 ? car.x + car.width : car.x - 10 * S;
          PIX.rect(ctx, fx, y + 5 * S, 10 * S, (ch - 2) * S, "#FFF3B0");
          ctx.globalAlpha = 1;
        }
      } else if (lane.type === "river") {
        const lgH = hArt - 10;
        for (const log of lane.items) {
          PIX.rect(ctx, log.x + S, y + 6 * S, log.width, lgH * S, "rgba(5,30,70,0.35)");
          PIX.draw(ctx, this.logSprite(Math.round(log.width / S), lgH), log.x, y + 5 * S, S, { ax: 0, ay: 0 });
        }
      }
    }

    for (const p of this.particles) {
      ctx.globalAlpha = Math.max(0, p.life / 600);
      PIX.rect(ctx, Math.floor(p.x / S) * S, Math.floor(p.y / S) * S, S * 2, S * 2, p.color);
    }
    ctx.globalAlpha = 1;

    if (this.gameState !== "over" && this.gameState !== "dying") {
      const ps = this.player.size;
      const cx = this.player.x + ps / 2;
      const hop = this.hopAnim;
      const cy = this.player.y + ps / 2 - hop * 12;
      // Ground shadow shrinks while airborne
      ctx.globalAlpha = 0.35;
      PIX.rect(ctx, cx - ps * 0.45 * (1 - hop * 0.3), this.player.y + ps - S, ps * 0.9 * (1 - hop * 0.3), 2 * S, "#000000");
      ctx.globalAlpha = 1;
      const img = this.charSprite(this.character);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(1 - hop * 0.14, 1 + hop * 0.24);
      PIX.draw(ctx, img, 0, 0, S, { snap: false });
      ctx.restore();
    } else if (this.gameState === "dying" && this.deathType === "hit") {
      PIX.draw(ctx, PIX.boom(20, 1 - this.deathTimer / 800), this.deathX, this.deathY, S);
    } else if (this.gameState === "dying") {
      // Splash rings
      const k = 1 - this.deathTimer / 800;
      ctx.globalAlpha = 1 - k;
      const n = 16, r = 6 * S + k * 16 * S;
      for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2;
        PIX.rect(ctx, Math.round((this.deathX + Math.cos(a) * r) / S) * S, Math.round((this.deathY + Math.sin(a) * r * 0.5) / S) * S, S, S, "#BFE9FF");
      }
      ctx.globalAlpha = 1;
    }

    PIX.vignette(ctx, W, H, 0.34, 0.82, "8,10,20", 0.42);

    drawHUDChips(ctx, [
      { label: "Score", value: this.score },
      { label: "Best", value: this.highScore, color: "#81C784" }
    ]);

    if (this.gameState === "dying") {
      const R = PIX.ramp(this.deathType === "drown" ? "#29b6f6" : "#ff5252");
      PIX.text(ctx, this.deathType === "drown" ? "SPLASH!" : "SQUISH!", W / 2, H / 2 - 40, Math.max(3, Math.min(6, Math.floor(W / 90))), R.b, { shadow: R.d, outline: R.o });
    }
    if (this.gameState === "over") {
      drawGameOverScreen(ctx, {
        title: this.deathType === "drown" ? "SPLASH!" : "SQUISH!",
        titleColor: this.deathType === "drown" ? "#29b6f6" : "#ff5252",
        score: this.score,
        isNewBest: this.score === this.highScore && this.score > 0
      });
    }
    if (this.gameState === "select") this.drawSelect(ctx, W, H);
  },
  drawSelect: function(ctx, W, H) {
    ctx.fillStyle = "rgba(6,9,18,0.84)";
    ctx.fillRect(0, 0, W, H);
    const ts = Math.max(3, Math.min(5, Math.floor(W / 120)));
    PIX.text(ctx, "CHOOSE YOUR CROSSER", W / 2, H * 0.27, ts, "#FFFFFF", { shadow: "#2f7d38", outline: "#0d1a10" });
    const half = Math.min(92, W * 0.22);
    const opts = [
      { key: "turtle", label: "TURTLE", glow: "#81C784", x: W / 2 - half },
      { key: "chicken", label: "CHICKEN", glow: "#FFFFFF", x: W / 2 + half }
    ];
    const cy = H * 0.47;
    const bob = Math.sin(performance.now() / 220) * 3;
    for (const o of opts) {
      const sel = this.character === o.key;
      ctx.fillStyle = sel ? "rgba(129,199,132,0.16)" : "rgba(255,255,255,0.05)";
      ctx.beginPath(); ctx.roundRect(o.x - 58, cy - 60, 116, 128, 16); ctx.fill();
      ctx.strokeStyle = sel ? o.glow : "rgba(255,255,255,0.16)";
      ctx.lineWidth = sel ? 3 : 1.5;
      if (sel) { ctx.shadowColor = o.glow; ctx.shadowBlur = 18; }
      ctx.stroke();
      ctx.shadowBlur = 0;
      PIX.draw(ctx, this.charSprite(o.key), o.x, cy - 6 + (sel ? bob : 0), 4);
      PIX.text(ctx, o.label, o.x, cy + 48, 2, sel ? "#FFFFFF" : "#8a8f9c", { shadow: "#000000" });
      if (o.key === "turtle") {
        ctx.textAlign = "center";
        ctx.fillStyle = sel ? "rgba(129,199,132,0.9)" : "rgba(255,255,255,0.4)";
        ctx.font = "700 9px Inter";
        ctx.fillText("DEFAULT", o.x, cy + 67);
      }
    }
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.font = "600 15px Inter";
    ctx.fillText(TouchControls.enabled ? "Swipe to choose   Tap to start" : "Arrows to choose   Space to start", W / 2, H * 0.74);
  },

  roundRect: function(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  },
  darkenColor: function(hex, amt) {
    let c = hex.replace('#', '');
    let num = parseInt(c, 16);
    let r = Math.max(0, (num >> 16) - amt);
    let g = Math.max(0, ((num >> 8) & 0x00FF) - amt);
    let b = Math.max(0, (num & 0x0000FF) - amt);
    return '#' + (r << 16 | g << 8 | b).toString(16).padStart(6, '0');
  },
  keyDown: function(e) {
    if (this.gameState === "select") {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { this.character = "turtle"; audioManager.playSFX('select'); }
      else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { this.character = "chicken"; audioManager.playSFX('select'); }
      else if (e.key === " " || e.key === "Enter" || e.key === "ArrowUp" || e.key === "w" || e.key === "W") this.startPlay();
      return;
    }
    if (this.gameState === "over" && (e.key === " " || e.key === "Enter")) { this.startPlay(); return; }
    if (this.gameState !== "playing") return;
    if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") this.hop("up");
    else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") this.hop("down");
    else if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") this.hop("left");
    else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") this.hop("right");
  },
  keyUp: function(e) {},
  end: function() {}
};

// 10. Shooter
const shooterGame = {
  player: null,
  bullets: [],
  enemies: [],
  explosions: [],
  powerups: [],
  score: 0,
  lives: 3,
  level: 1,
  gameState: "playing",
  bulletCooldown: 0,
  enemySpawnTimer: 0,
  enemySpawnInterval: 1500,
  powerupTimer: 0,
  powerupInterval: 10000, // 10 seconds
  bulletType: "normal", // normal, double, triple
  bulletTimer: 0,
  stars: [],
  animTimer: 0,
  animFrame: 0,
  art: {
    ship: [
      "......h......",
      ".....lhl.....",
      ".....lcl.....",
      "....lcCcl....",
      "....bcccb....",
      "...lbbbbbl...",
      ".l.lbbabbl.l.",
      "lb.bbbabbb.bl",
      "lbbbbbabbbbbl",
      "bbbbbbbbbbbbb",
      "dbd.bdddb.dbd",
      ".d..d...d..d."
    ],
    basic: [
      ["l.l.....l.l", "lbb.....bbl", ".dlllhlllb.", "..blwkwlb..", ".dbbbbbbbd.", "dbbdbbbdbbd", "d..dbbbd..d", "....dbd....", ".....y....."],
      [".l.l...l.l.", ".lbb...bbl.", ".dlllhlllb.", "..blwkwlb..", ".dbbbbbbbd.", "dbbdbbbdbbd", ".d.dbbbd.d.", "....dbd....", "....y.y...."]
    ],
    fast: [
      ["l......l", "bl....lb", ".bl..lb.", ".bbbbbb.", "..bwwb..", "..bbbb..", "...bb...", "...dd..."],
      [".l....l.", ".bl..lb.", ".bl..lb.", ".bbbbbb.", "..bwwb..", "..bbbb..", "...bb...", "..d..d.."]
    ],
    tank: [
      ["...dddddddd...", "..dbbbbbbbbd..", ".dblllllllbbd.", "dbllhllllllbbd", "dbllllllllllbd", "dbbbbrrrrbbbbd", "dbbbbrRRrbbbbd", "dbbbbbrrbbbbbd", ".dbbbbbbbbbbd.", ".dd.dbbbbd.dd.", ".d...dbbd...d.", "......dd......"],
      ["...dddddddd...", "..dbbbbbbbbd..", ".dblllllllbbd.", "dbllhllllllbbd", "dbllllllllllbd", "dbbbbrrrrbbbbd", "dbbbbrRRrbbbbd", "dbbbbbrrbbbbbd", ".dbbbbbbbbbbd.", "..dd.dbbd.dd..", "..d..dbbd..d..", "......dd......"]
    ],
    heart: [".hh.hh.", "hllblld", "hlbbbbd", ".lbbbd.", "..bbd..", "...d..."]
  },
  colors: { basic: "#E8463A", fast: "#FFAB40", tank: "#8BC34A" },
  shipSprite: function(bank) {
    return PIX.get('shoot-ship:' + bank, () => {
      const R = PIX.ramp("#00BCD4");
      let rows = this.art.ship.slice();
      if (bank !== 0) {
        // Rolling: the far wing foreshortens, the near side catches light
        rows = rows.map((r, i) => {
          if (i < 5) return r;
          let a = r.split('');
          if (bank < 0) { a[0] = '.'; if (i >= 7) a[1] = a[1] === '.' ? '.' : 'd'; for (let k = 7; k < 13; k++) if (a[k] === 'b') a[k] = 'l'; }
          else { a[12] = '.'; if (i >= 7) a[11] = a[11] === '.' ? '.' : 'd'; for (let k = 0; k < 6; k++) if (a[k] === 'b') a[k] = 'l'; }
          return a.join('');
        });
      }
      return PIX.fromRows(rows, { h: R.h, l: R.l, b: R.b, d: R.d, c: "#5ED8FF", C: "#FFFFFF", a: "#FF9F43" }, { outline: R.o });
    });
  },
  enemySprite: function(type, frame, health, flash) {
    return PIX.get('shoot-en:' + type + ':' + frame + ':' + health + ':' + (flash ? 1 : 0), () => {
      const R = PIX.ramp(flash ? "#FFFFFF" : this.colors[type]);
      const core = health >= 3 ? "#7CFF6B" : health === 2 ? "#FFE066" : "#FF4D4D";
      return PIX.fromRows(this.art[type][frame], {
        h: R.h, l: R.l, b: R.b, d: R.d, w: "#FFFFFF", k: "#1a1033", y: "#FFE066",
        r: core, R: "#FFFFFF"
      }, { outline: R.o });
    });
  },
  nebula: function(variant) {
    return PIX.get('shoot-neb:' + variant, () => {
      const w = 72, h = 44;
      const hue = variant ? ['#3b1f7a', '#5a2c9a', '#8a4fd6'] : ['#1f2f7a', '#2c4a9a', '#4f86d6'];
      const blobs = [];
      for (let i = 0; i < 7; i++) blobs.push([10 + Math.random() * 52, 10 + Math.random() * 24, 7 + Math.random() * 10]);
      return PIX.paint(w, h, (x, y) => {
        let v = 0;
        for (const b of blobs) { const d = Math.hypot(x - b[0], (y - b[1]) * 1.4) / b[2]; if (d < 1) v += (1 - d); }
        const q = v * 1.6 + (PIX.BAYER[(y & 3) * 4 + (x & 3)] / 16 - 0.5);
        if (q < 0.6) return null;
        return PIX.alpha(q > 1.8 ? hue[2] : q > 1.1 ? hue[1] : hue[0], 0.55);
      });
    });
  },
  init: function() {
    audioManager.playMusic('shooter', true);
    const S = PIX.scaleFor();
    this.S = S;
    this.player = {
      x: canvas.width / 2 - 6.5 * S,
      y: canvas.height - 80 - SAFE.bottom,
      width: 13 * S,
      height: 12 * S,
      speed: 0.4,
      invulnerable: false,
      invulnerableTimer: 0,
      tilt: 0,
      targetTilt: 0
    };

    this.bullets = [];
    this.enemies = [];
    this.explosions = [];
    this.powerups = [];
    this.score = 0;
    this.lives = 3;
    this.level = 1;
    this.gameState = "playing";
    this.bulletCooldown = 0;
    this.enemySpawnTimer = 0;
    this.enemySpawnInterval = 1500;
    this.powerupTimer = 0;
    this.bulletType = "normal";
    this.bulletTimer = 0;
    this.makeStars();
    this.nebulae = [
      { x: canvas.width * 0.2, y: canvas.height * 0.25, v: 0, speed: 0.012 },
      { x: canvas.width * 0.7, y: -canvas.height * 0.3, v: 1, speed: 0.018 }
    ];
  },
  makeStars: function() {
    this.stars = [];
    for (let i = 0; i < 110; i++) {
      const layer = i % 3;
      this.stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        layer: layer,
        speed: [0.03, 0.07, 0.14][layer],
        phase: Math.random() * Math.PI * 2
      });
    }
    this.starSize = { w: canvas.width, h: canvas.height };
  },
  onResize: function() {
    if (!this.player) return;
    this.makeStars();
    this.player.x = Math.max(0, Math.min(canvas.width - this.player.width, this.player.x));
    this.player.y = Math.max(0, Math.min(canvas.height - this.player.height - SAFE.bottom, this.player.y));
  },
  update: function(delta) {
    // Effects finish on the game-over screen
    for (let explosion of this.explosions) {
      explosion.time += delta;
      if (explosion.time > 500) explosion.remove = true;
    }
    this.explosions = this.explosions.filter(e => !e.remove);
    if (this.gameState !== "playing") return;

    this.animTimer += delta;
    if (this.animTimer > 320) { this.animTimer = 0; this.animFrame = 1 - this.animFrame; }

    // Move stars for parallax effect
    for (let star of this.stars) {
      star.y += star.speed * delta;
      if (star.y > canvas.height) {
        star.y = 0;
        star.x = Math.random() * canvas.width;
      }
    }
    for (const n of this.nebulae) {
      n.y += n.speed * delta;
      if (n.y > canvas.height + 60) { n.y = -44 * this.S * 2 - Math.random() * 200; n.x = Math.random() * canvas.width; }
    }

    // Player movement with tilt
    this.player.targetTilt = 0;
    if (keysDown["ArrowLeft"] || keysDown["a"] || keysDown["A"]) {
      this.player.x -= this.player.speed * delta;
      this.player.targetTilt = -0.3; // Tilt left
    }
    if (keysDown["ArrowRight"] || keysDown["d"] || keysDown["D"]) {
      this.player.x += this.player.speed * delta;
      this.player.targetTilt = 0.3; // Tilt right
    }
    // Smooth tilt interpolation
    this.player.tilt += (this.player.targetTilt - this.player.tilt) * Math.min(1, 0.15 * delta / 16.67);

    if (keysDown["ArrowUp"] || keysDown["w"] || keysDown["W"]) {
      this.player.y -= this.player.speed * delta;
    }
    if (keysDown["ArrowDown"] || keysDown["s"] || keysDown["S"]) {
      this.player.y += this.player.speed * delta;
    }

    // Limit player to screen (clear of the home indicator)
    this.player.x = Math.max(0, Math.min(canvas.width - this.player.width, this.player.x));
    this.player.y = Math.max(0, Math.min(canvas.height - this.player.height - SAFE.bottom - 8, this.player.y));

    // Handle shooting cooldown
    this.bulletCooldown -= delta;

    // Shoot if space is pressed and cooldown is ready
    if (keysDown[" "] && this.bulletCooldown <= 0) {
      this.shoot();
      audioManager.playSFX('shoot');
      this.bulletCooldown = 300; // 300ms cooldown
      this.muzzle = 60;
    }
    if (this.muzzle > 0) this.muzzle -= delta;

    // Update powerup timer
    if (this.bulletType !== "normal") {
      this.bulletTimer -= delta;
      if (this.bulletTimer <= 0) {
        this.bulletType = "normal";
      }
    }

    // Player invulnerability after hit
    if (this.player.invulnerable) {
      this.player.invulnerableTimer -= delta;
      if (this.player.invulnerableTimer <= 0) {
        this.player.invulnerable = false;
      }
    }

    // Move bullets
    for (let bullet of this.bullets) {
      bullet.y -= bullet.speed * delta;
      if (bullet.vx) {
        bullet.x += bullet.vx * delta;
      }

      // Remove bullets that are off screen
      if (bullet.y + bullet.height < 0 || bullet.x < -20 || bullet.x > canvas.width + 20) {
        bullet.remove = true;
      }
    }

    // Spawn enemies
    this.enemySpawnTimer += delta;
    if (this.enemySpawnTimer > this.enemySpawnInterval) {
      this.enemySpawnTimer = 0;

      // Decrease spawn interval with level
      this.enemySpawnInterval = Math.max(500, 1500 - this.level * 100);

      // Random enemy type
      const enemyTypes = ["basic", "fast", "tank"];
      const enemyType = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
      const S = this.S;
      const dims = { basic: [11, 9], fast: [8, 8], tank: [14, 12] }[enemyType];

      let enemy = {
        x: 0,
        y: -40,
        width: dims[0] * S,
        height: dims[1] * S,
        type: enemyType,
        health: 1,
        score: 100,
        hitT: 0
      };
      enemy.x = Math.random() * (canvas.width - enemy.width);

      // Set properties based on type
      switch (enemyType) {
        case "basic":
          enemy.speed = 0.15;
          enemy.health = 1;
          enemy.score = 100;
          break;
        case "fast":
          enemy.speed = 0.3;
          enemy.health = 1;
          enemy.score = 150;
          break;
        case "tank":
          enemy.speed = 0.1;
          enemy.health = 3;
          enemy.score = 250;
          break;
      }
      enemy.color = this.colors[enemyType];

      this.enemies.push(enemy);
    }

    // Spawn powerups
    this.powerupTimer += delta;
    if (this.powerupTimer > this.powerupInterval) {
      this.powerupTimer = 0;

      // Add random powerup
      const powerupTypes = ["double", "triple", "health"];
      const type = powerupTypes[Math.floor(Math.random() * powerupTypes.length)];

      this.powerups.push({
        x: Math.random() * (canvas.width - 10 * this.S),
        y: -20,
        width: 10 * this.S,
        height: 10 * this.S,
        type: type,
        speed: 0.1,
        color: type === "health" ? "#4CAF50" : type === "double" ? "#29B6F6" : "#7C4DFF"
      });
    }

    // Move enemies
    for (let enemy of this.enemies) {
      enemy.y += enemy.speed * delta;
      if (enemy.hitT > 0) enemy.hitT -= delta;

      // Fast enemies home in on the player (time-based, kept on screen)
      if (enemy.type === "fast") {
        const dx = (this.player.x + this.player.width / 2) - (enemy.x + enemy.width / 2);
        enemy.x += Math.sign(dx) * Math.min(Math.abs(dx), 0.06 * delta);
        enemy.x = Math.max(0, Math.min(canvas.width - enemy.width, enemy.x));
      }

      // Remove enemies that are off screen
      if (enemy.y > canvas.height) {
        enemy.remove = true;
      }
    }

    // Move powerups
    for (let powerup of this.powerups) {
      powerup.y += powerup.speed * delta;

      // Remove powerups that are off screen
      if (powerup.y > canvas.height) {
        powerup.remove = true;
      }
    }

    // Collision: Bullets vs Enemies
    for (let bullet of this.bullets) {
      for (let enemy of this.enemies) {
        if (!bullet.remove && !enemy.remove &&
            bullet.x < enemy.x + enemy.width &&
            bullet.x + bullet.width > enemy.x &&
            bullet.y < enemy.y + enemy.height &&
            bullet.y + bullet.height > enemy.y) {

          enemy.health--;
          enemy.hitT = 90;
          bullet.remove = true;

          // Create hit effect
          this.explosions.push({
            x: bullet.x + bullet.width / 2,
            y: bullet.y,
            size: 8,
            time: 0,
            type: "hit"
          });
          audioManager.playTone(100, 'sawtooth', 0.05, 0.2);

          // Enemy destroyed
          if (enemy.health <= 0) {
            enemy.remove = true;
            this.score += enemy.score;
            audioManager.playSFX('explosion');

            // Create explosion
            this.explosions.push({
              x: enemy.x + enemy.width/2,
              y: enemy.y + enemy.height/2,
              size: Math.round(enemy.width / this.S * 1.5),
              time: 0,
              type: "explosion"
            });

            // Level up every 1000 points
            if (Math.floor(this.score / 1000) > this.level - 1) {
              this.level = Math.floor(this.score / 1000) + 1;
              audioManager.playSFX('win');
            }
          }
        }
      }
    }

    // Collision: Player vs Enemies (hitbox trimmed to the hull)
    if (!this.player.invulnerable) {
      const p = this.player, inset = 2 * this.S;
      for (let enemy of this.enemies) {
        if (!enemy.remove &&
            p.x + inset < enemy.x + enemy.width &&
            p.x + p.width - inset > enemy.x &&
            p.y + inset < enemy.y + enemy.height &&
            p.y + p.height - inset > enemy.y) {

          enemy.remove = true;
          this.lives--;
          audioManager.playSFX('explosion');
          GamepadManager.rumble(160, 0.7, 0.45);

          // Create explosion
          this.explosions.push({
            x: enemy.x + enemy.width/2,
            y: enemy.y + enemy.height/2,
            size: 22,
            time: 0,
            type: "explosion"
          });

          // Make player temporarily invulnerable
          p.invulnerable = true;
          p.invulnerableTimer = 2000; // 2 seconds

          // Game over check
          if (this.lives <= 0) {
            this.gameState = "over";
            this.explosions.push({ x: p.x + p.width / 2, y: p.y + p.height / 2, size: 28, time: 0, type: "explosion" });
            audioManager.stopMusic();
            audioManager.playSFX('gameover');
          }

          break;
        }
      }
    }

    // Collision: Player vs Powerups
    for (let powerup of this.powerups) {
      if (!powerup.remove &&
          this.player.x < powerup.x + powerup.width &&
          this.player.x + this.player.width > powerup.x &&
          this.player.y < powerup.y + powerup.height &&
          this.player.y + this.player.height > powerup.y) {

        powerup.remove = true;
        audioManager.playSFX('powerup');

        // Apply powerup effect
        switch (powerup.type) {
          case "double":
            this.bulletType = "double";
            this.bulletTimer = 10000; // 10 seconds
            break;
          case "triple":
            this.bulletType = "triple";
            this.bulletTimer = 10000; // 10 seconds
            break;
          case "health":
            this.lives = Math.min(5, this.lives + 1); // Max 5 lives
            break;
        }

        // Create pickup effect
        this.explosions.push({
          x: powerup.x + powerup.width/2,
          y: powerup.y + powerup.height/2,
          size: 20,
          time: 0,
          type: "powerup",
          color: powerup.color
        });
      }
    }

    // Remove items marked for removal
    this.bullets = this.bullets.filter(b => !b.remove);
    this.enemies = this.enemies.filter(e => !e.remove);
    this.powerups = this.powerups.filter(p => !p.remove);

    // Limit explosions to prevent memory issues
    if (this.explosions.length > 50) {
      this.explosions.splice(0, this.explosions.length - 50);
    }
  },
  shoot: function() {
    const S = this.S;
    const bulletWidth = 2 * S;
    const bulletHeight = 6 * S;
    const bulletSpeed = 0.8;
    const p = this.player;
    const mk = (fx, dy, speed, vx, color) => ({
      x: p.x + p.width * fx - bulletWidth / 2, y: p.y + dy,
      width: bulletWidth, height: bulletHeight, speed: speed, vx: vx, color: color
    });

    switch (this.bulletType) {
      case "normal":
        this.bullets.push(mk(0.5, 0, bulletSpeed, 0, "#FFEB3B"));
        break;
      case "double":
        this.bullets.push(mk(1 / 3, 0, bulletSpeed, 0, "#29B6F6"));
        this.bullets.push(mk(2 / 3, 0, bulletSpeed, 0, "#29B6F6"));
        break;
      case "triple":
        this.bullets.push(mk(0.5, 0, bulletSpeed, 0, "#B388FF"));
        this.bullets.push(mk(0.25, bulletHeight / 2, bulletSpeed * 0.8, -0.2, "#B388FF"));
        this.bullets.push(mk(0.75, bulletHeight / 2, bulletSpeed * 0.8, 0.2, "#B388FF"));
        break;
    }
  },
  draw: function(ctx) {
    const W = canvas.width, H = canvas.height, S = this.S;
    if (!this.starSize || this.starSize.w !== W || this.starSize.h !== H) this.makeStars();

    // Deep space backdrop with drifting nebulae
    const sky = PIX.skyGradient('shooter', W, H, [[0, '#000226'], [0.6, '#03031a'], [1, '#000000']], S);
    ctx.drawImage(sky, 0, 0, sky.width * S, sky.height * S);
    for (const n of this.nebulae) {
      const img = this.nebula(n.v);
      ctx.drawImage(img, Math.floor(n.x / S) * S, Math.floor(n.y / S) * S, img.width * S * 2, img.height * S * 2);
    }

    // Stars: three parallax layers, streaking slightly when close
    const starTime = performance.now();
    for (let star of this.stars) {
      const tw = 0.55 + 0.45 * Math.sin(starTime / 600 + star.phase);
      const x = Math.floor(star.x / S) * S, y = Math.floor(star.y / S) * S;
      ctx.globalAlpha = star.layer === 2 ? 0.9 : (0.35 + 0.3 * tw);
      PIX.rect(ctx, x, y, S, star.layer === 2 ? 2 * S : S, star.layer === 2 ? "#FFFFFF" : star.layer === 1 ? "#B8C2FF" : "#6c74b8");
    }
    ctx.globalAlpha = 1;

    // Powerups: heart for health, numbered core for weapons
    const bob = Math.sin(starTime / 180) * S;
    for (let powerup of this.powerups) {
      const cx = powerup.x + powerup.width / 2, cy = powerup.y + powerup.height / 2 + bob;
      PIX.drawGlow(ctx, cx, cy, powerup.width * 1.4, powerup.color, 0.55);
      if (powerup.type === "health") {
        const R = PIX.ramp("#FF6FAE");
        PIX.draw(ctx, PIX.sprite('shoot-heart', this.art.heart, { h: R.h, l: R.l, b: R.b, d: R.d }, { outline: R.o }), cx, cy, S);
      } else {
        PIX.draw(ctx, PIX.orb(10, powerup.color), cx, cy, S);
        PIX.text(ctx, powerup.type === "double" ? "2" : "3", cx, cy, 2, "#FFFFFF", { outline: "#1a1033" });
      }
    }

    // Bullets: hot core with a fading tail
    for (let bullet of this.bullets) {
      PIX.rect(ctx, bullet.x, bullet.y + bullet.height, bullet.width, S * 2, PIX.alpha(bullet.color, 0.35));
      PIX.rect(ctx, bullet.x, bullet.y, bullet.width, bullet.height, bullet.color);
      PIX.rect(ctx, bullet.x, bullet.y, bullet.width, S * 2, "#FFFFFF");
    }

    // Enemies (animated pixel sprites; flash white when hit)
    for (let enemy of this.enemies) {
      const img = this.enemySprite(enemy.type, this.animFrame, enemy.type === "tank" ? enemy.health : 3, enemy.hitT > 0);
      PIX.draw(ctx, img, enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, S);
    }

    // Player ship: banking frames instead of rotation
    const p = this.player;
    const blink = p.invulnerable && Math.floor(p.invulnerableTimer / 100) % 2 === 0;
    if (this.gameState === "playing" || p.invulnerable) {
      if (this.gameState === "playing") {
        const cx = p.x + p.width / 2;
        const bank = p.tilt < -0.12 ? -1 : p.tilt > 0.12 ? 1 : 0;
        const fl = Math.floor(starTime / 50) % 3;
        // Engine plume
        PIX.rect(ctx, cx - S, p.y + p.height, 2 * S, (2 + fl) * S, "#FF9800");
        PIX.rect(ctx, cx - S, p.y + p.height, 2 * S, S, "#FFF3B0");
        if (fl === 2) PIX.rect(ctx, cx - S, p.y + p.height + 4 * S, 2 * S, S, "#FF5722");
        PIX.drawGlow(ctx, cx, p.y + p.height, 7 * S, "#FF9800", 0.6);
        PIX.draw(ctx, this.shipSprite(bank), cx, p.y + p.height / 2, S, { alpha: blink ? 0.35 : 1 });
        if (this.muzzle > 0) PIX.rect(ctx, cx - S, p.y - S, 2 * S, 2 * S, "#FFFFFF");
      }
    }

    // Explosions
    for (let explosion of this.explosions) {
      const progress = explosion.time / 500; // 0 to 1
      if (explosion.type === "explosion") {
        PIX.draw(ctx, PIX.boom(explosion.size, progress), explosion.x, explosion.y, S);
      } else if (explosion.type === "hit") {
        PIX.draw(ctx, PIX.boom(explosion.size, Math.min(0.99, progress * 1.6), "#FFEB3B"), explosion.x, explosion.y, S);
      } else if (explosion.type === "powerup") {
        // Expanding pixel ring
        const r = explosion.size * (1 + progress * 1.5);
        ctx.globalAlpha = 1 - progress;
        const n = 18;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2;
          PIX.rect(ctx, Math.round((explosion.x + Math.cos(a) * r) / S) * S, Math.round((explosion.y + Math.sin(a) * r) / S) * S, S, S, explosion.color || "#29B6F6");
        }
        ctx.globalAlpha = 1;
      }
    }

    // Draw HUD - top right
    const chip = drawHUDChips(ctx, [
      { label: "Score", value: this.score },
      { label: "Lives", value: this.lives, color: "#FFAB40" },
      { label: "Level", value: this.level, color: "#29B6F6" }
    ]);

    // Powerup indicator - right aligned below the chips
    if (this.bulletType !== "normal") {
      const timeLeft = Math.ceil(this.bulletTimer / 1000);
      PIX.text(ctx, this.bulletType.toUpperCase() + " SHOT " + timeLeft + "S", W - 16, chip.y + chip.h + 16, 2,
        this.bulletType === "double" ? "#29B6F6" : "#B388FF", { align: 'right', shadow: '#05061a' });
    }

    // Game over message
    if (this.gameState === "over") {
      drawGameOverScreen(ctx, { title: "GAME OVER", score: this.score, lines: ["Level " + this.level] });
    }
  },
  keyDown: function(e) {
    if (this.gameState === "over" && e.key === " ") {
      this.init();
    }
  },
  keyUp: function(e) {},
  end: function() {}
};

// 11. Survivor (Wave-based auto-attack survival)
const survivorGame = {
  player: null, projectiles: [], enemies: [], particles: [], xpOrbs: [], chests: [],
  score: 0, highScore: 0, wave: 1, enemiesLeft: 0, gameState: "playing",
  lastShot: 0, upgradeChoices: [], selectedUpgrade: 0, stats: null,
  camX: 0, camY: 0, magnetActive: false, magnetTimer: 0,
  upgrades: [
    { id: 'damage', name: 'Power', desc: '+25% DMG' },
    { id: 'fireRate', name: 'Speed', desc: '-20% CD' },
    { id: 'range', name: 'Range', desc: '+40%' },
    { id: 'health', name: 'Heal', desc: '+25 MAX HP' },
    { id: 'speed', name: 'Swift', desc: '+20%' },
    { id: 'pierce', name: 'Pierce', desc: '+1' }
  ],
  art: {
    mage: [
      ["......pp..g.", ".....pPp.gGg", "....ppppp.w.", "..ppppppppw.", "...sssss..w.", "...sksks..w.", "..lbbbbbl.w.", ".lbbhbbbbsw.", ".lbbbbbbb.w.", "..bbbbbbb.w.", "..bbdbdbb.w.", "..dbbbbbd...", "...d...d....", "..dd...dd..."],
      ["......pp..g.", ".....pPp.gGg", "....ppppp.w.", "..ppppppppw.", "...sssss..w.", "...sksks..w.", "..lbbbbbl.w.", ".lbbhbbbbsw.", ".lbbbbbbb.w.", "..bbbbbbb.w.", "..bbdbdbb.w.", "..dbbbbbd...", "....d.d.....", "...dd.dd...."]
    ],
    slime: [
      ["...llll...", "..lhlllb..", ".llllllbb.", ".lwkllwkb.", "lbbbbbbbbd", "lbbbddbbbd", "bbbbbbbbbd", ".dddddddd."],
      ["..........", "...llll...", ".lhllllbb.", "llwkllwkbb", "lbbbbbbbbd", "bbbbddbbbd", "bbbbbbbbbd", "dddddddddd"]
    ],
    crown: ["y..y..y", "yy.y.yy", "yyyyyyy", "yrybyry"],
    gem: ["..h..", ".hlb.", "hllbd", ".lbd.", "..d.."],
    chest: [".oooooooooo.", "obbbbbbbbbbo", "obllllllllbo", "oddddyyddddo", "obbbbyybbbbo", "obbbbbbbbbbo", "obbbbbbbbbbo", "oddddddddddo", ".oooooooooo."]
  },
  sprite: function(kind, frame, flash) {
    return PIX.get('surv:' + kind + ':' + frame + ':' + (flash ? 1 : 0), () => {
      if (kind === 'mage') {
        const R = PIX.ramp(flash ? "#FFFFFF" : "#2EC9A6"), P = PIX.ramp("#7C4DFF");
        return PIX.fromRows(this.art.mage[frame], { l: R.l, b: R.b, h: R.h, d: R.d, p: P.b, P: P.h, s: "#FFD3A8", k: "#1a1033", w: "#8A6044", g: "#FFE066", G: "#FFFFFF" }, { outline: "#120a24" });
      }
      if (kind === 'slime' || kind === 'boss') {
        const R = PIX.ramp(flash ? "#FFFFFF" : kind === 'boss' ? "#B0203A" : "#E5484D");
        return PIX.fromRows(this.art.slime[frame], { l: R.l, b: R.b, h: R.h, d: R.d, w: "#FFFFFF", k: "#1a1033" }, { outline: R.o });
      }
      if (kind === 'crown') return PIX.fromRows(this.art.crown, { y: "#FFD54F", r: "#FF4D6D", b: "#4FC3F7" }, { outline: "#4a2a00" });
      if (kind === 'gem') {
        const R = PIX.ramp("#64FFDA");
        return PIX.fromRows(this.art.gem, { h: frame ? "#FFFFFF" : R.h, l: R.l, b: R.b, d: R.d }, { outline: R.o });
      }
      if (kind === 'chest' || kind === 'goldchest') {
        const R = PIX.ramp(kind === 'goldchest' ? "#E0A82E" : "#8B5A2B");
        return PIX.fromRows(this.art.chest, { o: R.o, b: R.b, l: R.l, d: R.d, y: kind === 'goldchest' ? "#FFFFFF" : "#FFD54F" });
      }
      return null;
    });
  },
  floorTile: function(v) {
    return PIX.get('surv-floor:' + v, () => PIX.paint(16, 16, (x, y) => {
      // Dungeon flagstones: bevelled edges, cracks, moss
      if (x === 0 || y === 0) return '#140c2a';
      if (x === 1 || y === 1) return '#2c1f52';
      if (x === 15 || y === 15) return '#1a1236';
      const n = ((x * 73856093) ^ (y * 19349663) ^ (v * 83492791)) >>> 0;
      if (v === 1 && ((x === y + 2 && x > 4 && x < 11) || (x === 10 && y > 9))) return '#120a24';
      if (v === 2 && n % 7 === 0 && y > 9) return '#2f6b4a';
      if (v === 3 && x > 6 && x < 9 && y > 6 && y < 9) return (x + y) % 2 ? '#FF8FB1' : '#7a3d8a';
      return n % 11 === 0 ? '#2a1d4d' : '#221842';
    }));
  },
  init: function() {
    audioManager.playMusic('survivor', true);
    const S = PIX.scaleFor();
    this.S = S;
    this.camX = 0; this.camY = 0;
    this.player = { x: 0, y: 0, size: 6 * S, speed: 3.5, health: 100, maxHealth: 100, xp: 0, level: 1, xpToLevel: 10, facing: 1, walk: 0, hurtT: 0 };
    this.stats = { damage: 15, fireRate: 700, projectileSpeed: 6, range: 200, projectileSize: 2 * S, pierce: 1 };
    this.projectiles = []; this.enemies = []; this.particles = []; this.xpOrbs = []; this.chests = [];
    this.score = 0; this.wave = 1; this.enemiesLeft = 0; this.gameState = "playing";
    this.lastShot = 0; this.upgradeChoices = []; this.selectedUpgrade = 0;
    this.magnetActive = false; this.magnetTimer = 0;
    this.spawnQueue = []; this.waveBanner = null; this._cardRects = null;
    if (!this._pointerHandler) {
      this._pointerHandler = (e) => this.handlePointer(e);
      canvas.addEventListener('pointerdown', this._pointerHandler);
    }
    this.startWave();
  },
  startWave: function() {
    const isBoss = this.wave % 3 === 0;
    this.enemiesLeft = isBoss ? 1 + this.wave : 8 + this.wave * 2;
    if (this.wave >= 5) AchievementManager.unlock('survivor_5');
    // Spawn via a queue drained in update() so enemies are never lost
    // while the level-up screen is open (which used to stall waves forever)
    this.spawnQueue = [];
    for (let i = 0; i < this.enemiesLeft; i++) {
      this.spawnQueue.push({ delay: i * Math.max(180, 400 - this.wave * 10), boss: isBoss && i === 0 });
    }
    this.waveBanner = { text: isBoss ? "BOSS WAVE " + this.wave : "WAVE " + this.wave, life: 1700, boss: isBoss };
    // Spawn chests at wave start; forget far-away unopened ones
    const p = this.player;
    this.chests = this.chests.filter(c => Math.hypot(c.x - p.x, c.y - p.y) < 1400).slice(-8);
    for (let i = 0; i < 2; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 200 + Math.random() * 150;
      this.chests.push({ x: p.x + Math.cos(angle) * dist, y: p.y + Math.sin(angle) * dist, opened: false });
    }
  },
  spawnEnemy: function(isBoss) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 350 + Math.random() * 100;
    const x = this.player.x + Math.cos(angle) * dist;
    const y = this.player.y + Math.sin(angle) * dist;
    // Endless scaling: ramps harder past wave 9 so deep runs stay dangerous
    let hpMult = 1 + (this.wave - 1) * 0.2;
    let speedBonus = 0;
    if (this.wave > 9) {
      hpMult *= 1 + (this.wave - 9) * 0.12;
      speedBonus = Math.min(0.9, (this.wave - 9) * 0.05);
    }
    const S = this.S;
    const health = isBoss ? 200 * (1 + this.wave * 0.4) * (this.wave > 9 ? 1 + (this.wave - 9) * 0.1 : 1) : 30 * hpMult;
    this.enemies.push({
      x, y, size: isBoss ? 13 * S : 5 * S,
      speed: Math.min(3.1, isBoss ? 1.0 + this.wave * 0.03 + speedBonus * 0.5 : 1.3 + Math.random() * 0.4 + this.wave * 0.05 + speedBonus),
      health: health,
      maxHealth: health,
      isBoss, xpValue: isBoss ? 8 : 1, stuckTimer: 0, hitT: 0, phase: Math.random() * 6
    });
  },
  handlePointer: function(e) {
    if (this.gameState !== "levelup" || !this._cardRects) return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    for (let i = 0; i < this._cardRects.length; i++) {
      const r = this._cardRects[i];
      if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
        if (this.selectedUpgrade === i) {
          this.applyUpgrade(this.upgradeChoices[i].id);
          this.gameState = "playing";
          audioManager.playSFX('powerup');
        } else {
          this.selectedUpgrade = i;
          audioManager.playSFX('select');
        }
        return;
      }
    }
  },
  createParticles: function(x, y, count, color) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      this.particles.push({ x, y, vx: Math.cos(angle) * (2 + Math.random() * 3), vy: Math.sin(angle) * (2 + Math.random() * 3), size: 2 + Math.random() * 3, life: 1, color: color || "#FF5252" });
    }
    // Enforce particle limit
    if (this.particles.length > MAX_PARTICLES) {
      this.particles.splice(0, this.particles.length - MAX_PARTICLES);
    }
  },
  applyUpgrade: function(id) {
    if (id === 'damage') this.stats.damage *= 1.25;
    else if (id === 'fireRate') this.stats.fireRate *= 0.8;
    else if (id === 'range') this.stats.range *= 1.4;
    else if (id === 'health') { this.player.maxHealth += 25; this.player.health = Math.min(this.player.health + 40, this.player.maxHealth); }
    else if (id === 'speed') this.player.speed *= 1.2;
    else if (id === 'pierce') this.stats.pierce += 1;
  },
  showLevelUp: function() {
    if (this.gameState === "levelup") return;
    this.gameState = "levelup";
    GamepadManager.rumble(130, 0.5, 0.4);
    audioManager.playSFX('win');
    this.upgradeChoices = [...this.upgrades].sort(() => Math.random() - 0.5).slice(0, 3);
    this.selectedUpgrade = 0;
  },
  gameOver: function() {
    if (this.gameState === "over") return;
    this.gameState = "over";
    audioManager.stopMusic();
    audioManager.playSFX('gameover');
    if (this.score > this.highScore) this.highScore = this.score;
    this.createParticles(this.player.x, this.player.y, 24, "#2EC9A6");
  },
  update: function(delta) {
    const dt = Math.min(2.5, delta / 16.67);
    // Particles keep fading behind the overlays
    this.particles = this.particles.filter(pt => { pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= 0.03 * dt; pt.size *= Math.pow(0.95, dt); return pt.life > 0; });
    if (this.gameState !== "playing") return;
    const now = performance.now();
    const p = this.player;

    if (this.spawnQueue.length) {
      for (const s of this.spawnQueue) s.delay -= delta;
      while (this.spawnQueue.length && this.spawnQueue[0].delay <= 0) {
        this.spawnEnemy(this.spawnQueue.shift().boss);
      }
    }
    if (this.waveBanner) {
      this.waveBanner.life -= delta;
      if (this.waveBanner.life <= 0) this.waveBanner = null;
    }
    if (p.hurtT > 0) p.hurtT -= delta;

    // Movement (infinite map)
    let dx = 0, dy = 0;
    if (keysDown['ArrowLeft'] || keysDown['a'] || keysDown['A']) dx -= 1;
    if (keysDown['ArrowRight'] || keysDown['d'] || keysDown['D']) dx += 1;
    if (keysDown['ArrowUp'] || keysDown['w'] || keysDown['W']) dy -= 1;
    if (keysDown['ArrowDown'] || keysDown['s'] || keysDown['S']) dy += 1;
    if (dx !== 0 || dy !== 0) {
      const mag = Math.sqrt(dx*dx + dy*dy);
      p.x += (dx/mag) * p.speed * dt; p.y += (dy/mag) * p.speed * dt;
      if (dx !== 0) p.facing = dx > 0 ? 1 : -1;
      p.walk += delta;
    }
    this.camX = p.x - canvas.width/2; this.camY = p.y - canvas.height/2;

    // Magnet timer
    if (this.magnetActive) { this.magnetTimer -= delta; if (this.magnetTimer <= 0) this.magnetActive = false; }

    // Auto-shoot
    if (now - this.lastShot > this.stats.fireRate && this.enemies.length > 0) {
      let nearest = null, nearestDist = Infinity;
      this.enemies.forEach(e => { const dist = Math.hypot(e.x - p.x, e.y - p.y); if (dist < this.stats.range && dist < nearestDist) { nearest = e; nearestDist = dist; } });
      if (nearest) {
        const angle = Math.atan2(nearest.y - p.y, nearest.x - p.x);
        this.projectiles.push({ x: p.x, y: p.y, vx: Math.cos(angle) * this.stats.projectileSpeed, vy: Math.sin(angle) * this.stats.projectileSpeed, size: this.stats.projectileSize, pierce: this.stats.pierce, damage: this.stats.damage, hits: new Set() });
        this.lastShot = now;
        if (nearest.x !== p.x) p.facing = nearest.x > p.x ? 1 : -1;
        audioManager.playTone(600, 'square', 0.05, 0.1);
      }
    }

    // Update projectiles
    this.projectiles = this.projectiles.filter(proj => { proj.x += proj.vx * dt; proj.y += proj.vy * dt; return Math.hypot(proj.x - p.x, proj.y - p.y) < 500 && proj.pierce > 0; });

    // Update enemies with anti-cheat (speed boost if too far/stuck)
