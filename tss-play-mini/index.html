      if (!c) { c = this.columnInfo(wx, wz); colCache.set(key, c); }
      return c;
    };

    // -------- base terrain --------
    let maxH = 0;
    for (let lz = 0; lz < CHUNK; lz++) {
      for (let lx = 0; lx < CHUNK; lx++) {
        const wx = x0 + lx, wz = z0 + lz;
        const info = col(wx, wz);
        const h = info.h;
        if (h > maxH) maxH = h;
        chunk.biomes[lx + lz * CHUNK] = info.biome;

        for (let y = 0; y <= h; y++) {
          let id;
          if (y === 0) id = B.BEDROCK;
          else if (y <= 2 && hf(hash3(wx, y, wz, seed ^ 0xbed)) < 0.55) id = B.BEDROCK;
          else if (y === h) id = info.surface;
          else if (y > h - 1 - info.fillerDepth) id = info.filler;
          else id = B.STONE;
          // desert sandstone shelf so sand doesn't float over caves
          if (id === B.STONE && info.biome === BIOME.DESERT && y > h - 8) id = B.SANDSTONE;
          blocks[idx(lx, y, lz)] = id;
        }
        // water
        if (h < SEA) {
          for (let y = h + 1; y <= SEA; y++) blocks[idx(lx, y, lz)] = B.WATER;
          if (info.biome === BIOME.SNOWY || (info.temp < -0.3 && info.biome === BIOME.OCEAN)) {
            blocks[idx(lx, SEA, lz)] = B.ICE;
          }
        }
      }
    }

    // -------- ore veins (chunk-seeded random walks) --------
    const oreTypes = [
      { id: B.COAL_ORE, tries: 14, min: 12, max: 92, size: [5, 13] },
      { id: B.IRON_ORE, tries: 9, min: 6, max: 54, size: [4, 8] },
      { id: B.GOLD_ORE, tries: 3, min: 4, max: 30, size: [3, 6] },
      { id: B.REDSTONE_ORE, tries: 5, min: 4, max: 16, size: [4, 7] },
      { id: B.DIAMOND_ORE, tries: 3, min: 4, max: 13, size: [3, 5] },
    ];
    let oreSeed = hash2(cx, cz, seed ^ 0x09e1);
    const oreRand = () => { oreSeed = hash2(oreSeed, 0x6b43, seed); return oreSeed / 4294967296; };
    for (const ore of oreTypes) {
      for (let t = 0; t < ore.tries; t++) {
        let x = (oreRand() * CHUNK) | 0;
        let z = (oreRand() * CHUNK) | 0;
        let y = ore.min + ((oreRand() * (ore.max - ore.min)) | 0);
        const n = ore.size[0] + ((oreRand() * (ore.size[1] - ore.size[0] + 1)) | 0);
        for (let k = 0; k < n; k++) {
          if (x >= 0 && x < CHUNK && z >= 0 && z < CHUNK && y > 2 && y < WORLD_H) {
            const i = idx(x, y, z);
            if (blocks[i] === B.STONE) blocks[i] = ore.id;
          }
          const dir = (oreRand() * 6) | 0;
          if (dir === 0) x++; else if (dir === 1) x--;
          else if (dir === 2) z++; else if (dir === 3) z--;
          else if (dir === 4) y++; else y--;
        }
      }
    }

    // -------- caves: trilinear-interpolated 3D noise --------
    // Sample noise on a 4x4x4 lattice, interpolate per block (the same
    // trick Minecraft uses) — ~15x fewer noise evaluations.
    const P = 4;
    const GX = CHUNK / P + 1, GZ = CHUNK / P + 1;
    const GY = Math.ceil((maxH + 2) / P) + 1;
    const gridA = new Float32Array(GX * GY * GZ);
    const gridB = new Float32Array(GX * GY * GZ);
    const gridC = new Float32Array(GX * GY * GZ);
    const gi = (gx, gy, gz) => gx + gz * GX + gy * GX * GZ;
    for (let gy = 0; gy < GY; gy++)
      for (let gz = 0; gz < GZ; gz++)
        for (let gx = 0; gx < GX; gx++) {
          const wx = x0 + gx * P, wy = gy * P, wz = z0 + gz * P;
          const g = gi(gx, gy, gz);
          gridA[g] = this.nCaveA.noise3(wx * 0.017, wy * 0.026, wz * 0.017);
          gridB[g] = this.nCaveB.noise3(wx * 0.017, wy * 0.026, wz * 0.017);
          gridC[g] = this.nCavern.noise3(wx * 0.009, wy * 0.015, wz * 0.009);
        }
    const lerp = (a, b, t) => a + (b - a) * t;
    const sampleGrid = (grid, x, y, z) => {
      const gx = x / P, gy = y / P, gz = z / P;
      const x1 = gx | 0, y1 = gy | 0, z1 = gz | 0;
      const fx = gx - x1, fy = gy - y1, fz = gz - z1;
      const c000 = grid[gi(x1, y1, z1)], c100 = grid[gi(x1 + 1, y1, z1)];
      const c010 = grid[gi(x1, y1 + 1, z1)], c110 = grid[gi(x1 + 1, y1 + 1, z1)];
      const c001 = grid[gi(x1, y1, z1 + 1)], c101 = grid[gi(x1 + 1, y1, z1 + 1)];
      const c011 = grid[gi(x1, y1 + 1, z1 + 1)], c111 = grid[gi(x1 + 1, y1 + 1, z1 + 1)];
      return lerp(
        lerp(lerp(c000, c100, fx), lerp(c001, c101, fx), fz),
        lerp(lerp(c010, c110, fx), lerp(c011, c111, fx), fz),
        fy,
      );
    };

    for (let lz = 0; lz < CHUNK; lz++) {
      for (let lx = 0; lx < CHUNK; lx++) {
        const info = col(x0 + lx, z0 + lz);
        const h = info.h;
        // don't pierce the floor of oceans/lakes
        const top = h <= SEA + 1 ? h - 4 : h;
        for (let y = 3; y <= top; y++) {
          const i = idx(lx, y, lz);
          const cur = blocks[i];
          if (cur === B.AIR || cur === B.WATER || cur === B.BEDROCK) continue;
          const a = sampleGrid(gridA, lx, y, lz);
          const b = sampleGrid(gridB, lx, y, lz);
          // "spaghetti" tunnels: both noises near zero
          const r = 0.0042 + (y < 24 ? 0.002 : 0);
          let carve = a * a + b * b < r;
          // big caverns deep down
          if (!carve && y < 40) carve = sampleGrid(gridC, lx, y, lz) < -0.74;
          if (carve) blocks[i] = B.AIR;
        }
      }
    }

    // -------- decorations (trees overlap chunk borders => margin scan) --------
    const set = (wx, wy, wz, id, replaceLeavesToo = false) => {
      const lx = wx - x0, lz = wz - z0;
      if (lx < 0 || lx >= CHUNK || lz < 0 || lz >= CHUNK || wy < 1 || wy >= WORLD_H) return;
      const i = idx(lx, wy, lz);
      const cur = blocks[i];
      if (cur === B.AIR || (replaceLeavesToo && (cur === B.LEAVES || cur === B.SPRUCE_LEAVES))) {
        blocks[i] = id;
      }
    };
    const getLocal = (wx, wy, wz) => {
      const lx = wx - x0, lz = wz - z0;
      if (lx < 0 || lx >= CHUNK || lz < 0 || lz >= CHUNK || wy < 0 || wy >= WORLD_H) return -1;
      return blocks[idx(lx, wy, lz)];
    };

    const M = 3; // margin for structures leaking across borders
    for (let wz = z0 - M; wz < z0 + CHUNK + M; wz++) {
      for (let wx = x0 - M; wx < x0 + CHUNK + M; wx++) {
        const info = col(wx, wz);
        const { h, biome } = info;
        if (h <= SEA) continue; // underwater columns: nothing to plant
        if (info.surface === B.SAND && biome !== BIOME.DESERT) continue; // bare beaches
        const rnd = hf(hash2(wx, wz, seed ^ 0x7ee5));

        // ---- trees ----
        const spruce = biome === BIOME.SNOWY || biome === BIOME.MOUNTAINS;
        let treeChance = 0;
        if (biome === BIOME.FOREST) treeChance = 0.042;
        else if (biome === BIOME.PLAINS) treeChance = 0.004;
        else if (biome === BIOME.SNOWY) treeChance = 0.018;
        else if (biome === BIOME.MOUNTAINS && info.surface === B.GRASS) treeChance = 0.01;
        if (treeChance > 0 && rnd < treeChance && (info.surface === B.GRASS || info.surface === B.SNOW_GRASS)) {
          const hb = hash2(wx, wz, seed ^ 0x73ee);
          if (spruce) {
            const th = 6 + (hb % 3);
            for (let k = 1; k <= th; k++) set(wx, h + k, wz, B.SPRUCE_LOG);
            for (let ly = 2; ly <= th + 1; ly++) {
              const d = th + 1 - ly;
              const r = d === 0 ? 0 : d === 1 ? 1 : (d % 2 === 0 ? 1 : 2);
              for (let dz = -r; dz <= r; dz++)
                for (let dx = -r; dx <= r; dx++) {
                  if (dx === 0 && dz === 0 && ly <= th) continue;
                  if (r === 2 && Math.abs(dx) === 2 && Math.abs(dz) === 2) continue;
                  set(wx + dx, h + ly, wz + dz, B.SPRUCE_LEAVES);
                }
            }
            set(wx, h + th + 1, wz, B.SPRUCE_LEAVES);
          } else {
            const th = 4 + (hb % 3);
            for (let k = 1; k <= th; k++) set(wx, h + k, wz, B.LOG);
            for (let ly = th - 2; ly <= th + 1; ly++) {
              const r = ly <= th - 1 ? 2 : 1;
              for (let dz = -r; dz <= r; dz++)
                for (let dx = -r; dx <= r; dx++) {
                  if (dx === 0 && dz === 0 && ly <= th) continue;
                  const corner = Math.abs(dx) === r && Math.abs(dz) === r;
                  if (corner && (r === 2 || ly === th + 1) && hash3(wx + dx, h + ly, wz + dz, seed) % 5 < 3) continue;
                  set(wx + dx, h + ly, wz + dz, B.LEAVES);
                }
            }
          }
          // dirt under the trunk
          const lxT = wx - x0, lzT = wz - z0;
          if (lxT >= 0 && lxT < CHUNK && lzT >= 0 && lzT < CHUNK) {
            blocks[idx(lxT, h, lzT)] = B.DIRT;
          }
          continue;
        }

        // ---- desert: cactus / dead bush ----
        if (biome === BIOME.DESERT) {
          if (rnd < 0.0045 && getLocal(wx, h, wz) === B.SAND) {
            const ch = 1 + (hash2(wx, wz, seed ^ 0xcac) % 3);
            for (let k = 1; k <= ch; k++) set(wx, h + k, wz, B.CACTUS);
          } else if (rnd > 0.994) {
            set(wx, h + 1, wz, B.DEADBUSH);
          }
          continue;
        }

        // ---- grass / flowers / pumpkins ----
        if (info.surface === B.GRASS) {
          if (rnd < (biome === BIOME.FOREST ? 0.06 : 0.045)) set(wx, h + 1, wz, B.TALLGRASS);
          else if (rnd < (biome === BIOME.FOREST ? 0.072 : 0.055)) {
            set(wx, h + 1, wz, hash2(wx, wz, seed ^ 0xf10) % 2 ? B.FLOWER_RED : B.FLOWER_YELLOW);
          } else if (biome === BIOME.PLAINS && rnd > 0.9991) {
            set(wx, h + 1, wz, B.PUMPKIN);
          }
        }
      }
    }

    // -------- skylight heightmap (terrain that casts darkness) --------
    this.computeHeights(chunk);
  }

  computeHeights(chunk) {
    const { blocks, heights } = chunk;
    for (let lz = 0; lz < CHUNK; lz++)
      for (let lx = 0; lx < CHUNK; lx++) {
        let y = WORLD_H - 1;
        for (; y > 0; y--) {
          if (COUNTS_HEIGHT[blocks[idx(lx, y, lz)]]) break;
        }
        heights[lx + lz * CHUNK] = y;
      }
  }
}

// ---- mesher.js ----
// ============================================================
// Chunk mesher.
// Converts a 16x128x16 voxel chunk into BufferGeometry with:
//   - hidden face culling (incl. same-type culling for water,
//     glass and leaves)
//   - per-vertex ambient occlusion (0fps algorithm) + quad
//     flipping to avoid the classic AO diagonal artifact
//   - Minecraft-style directional face shading
//   - smooth "skylight" (depth-below-terrain darkness, so caves
//     are dark) and torch light, baked into vertex colors:
//       color.r = skylight  (scaled by day/night uniform)
//       color.g = torchlight (warm, constant)
//   - liquids with lowered surface, cross-shaped plants, torches
// ============================================================





const AO_CURVE = [0.45, 0.64, 0.82, 1.0];
const FACE_SHADE = { px: 0.6, nx: 0.6, py: 1.0, ny: 0.5, pz: 0.8, nz: 0.8 };

// ------------------------------------------------------------
// Face table (generated programmatically, winding self-checked)
// ------------------------------------------------------------

const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

function makeFace(normal, t1, t2, key) {
  const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([s1, s2]) => {
    const pos = [
      0.5 + 0.5 * (normal[0] + s1 * t1[0] + s2 * t2[0]),
      0.5 + 0.5 * (normal[1] + s1 * t1[1] + s2 * t2[1]),
      0.5 + 0.5 * (normal[2] + s1 * t1[2] + s2 * t2[2]),
    ];
    let u, v;
    if (normal[1] !== 0) { u = pos[0]; v = pos[2]; }       // top/bottom: u=x, v=z
    else { v = pos[1]; u = normal[0] !== 0 ? pos[2] : pos[0]; } // sides: v follows world Y
    return { s1, s2, pos, u, v };
  });
  // enforce CCW winding viewed from outside
  const cr = cross(sub(corners[1].pos, corners[0].pos), sub(corners[3].pos, corners[0].pos));
  if (dot(cr, normal) < 0) corners.reverse();
  return { n: normal, t1, t2, key, corners };
}

const X = [1, 0, 0], Y = [0, 1, 0], Z = [0, 0, 1];
const FACES = [
  makeFace([1, 0, 0], Y, Z, 'px'),
  makeFace([-1, 0, 0], Z, Y, 'nx'),
  makeFace([0, 1, 0], Z, X, 'py'),
  makeFace([0, -1, 0], X, Z, 'ny'),
  makeFace([0, 0, 1], X, Y, 'pz'),
  makeFace([0, 0, -1], Y, X, 'nz'),
];

// cached uv rects
const UV_CACHE = new Map();
function uvRect(name) {
  let r = UV_CACHE.get(name);
  if (!r) { r = atlasUV(name); UV_CACHE.set(name, r); }
  return r;
}

const OCCLUDES = new Uint8Array(256);
const OPAQUE = new Uint8Array(256);
const CULL_SAME = new Uint8Array(256);
for (const d of BLOCKS) {
  if (!d) continue;
  OCCLUDES[d.id] = d.aoCast ? 1 : 0;
  OPAQUE[d.id] = d.opaque ? 1 : 0;
  CULL_SAME[d.id] = d.cullSame ? 1 : 0;
}

// ------------------------------------------------------------
// 3x3-chunk sampler (fast cross-border lookups during meshing)
// ------------------------------------------------------------

function makeSampler(world, cx, cz) {
  const blocksArr = [], heightsArr = [];
  for (let dz = -1; dz <= 1; dz++)
    for (let dx = -1; dx <= 1; dx++) {
      const ch = world.getChunk(cx + dx, cz + dz);
      blocksArr.push(ch && ch.blocks ? ch.blocks : null);
      heightsArr.push(ch && ch.heights ? ch.heights : null);
    }
  return {
    block(lx, y, lz) {
      if (y < 0 || y >= WORLD_H) return B.AIR;
      const ax = lx + 16, az = lz + 16;
      const arr = blocksArr[(az >> 4) * 3 + (ax >> 4)];
      return arr ? arr[(ax & 15) + ((az & 15) << 4) + (y << 8)] : B.AIR;
    },
    height(lx, lz) {
      const ax = lx + 16, az = lz + 16;
      const arr = heightsArr[(az >> 4) * 3 + (ax >> 4)];
      return arr ? arr[(ax & 15) + ((az & 15) << 4)] : 0;
    },
  };
}

// ------------------------------------------------------------
// Geometry builder helper
// ------------------------------------------------------------

class GeoBuf {
  constructor() {
    this.pos = [];
    this.uv = [];
    this.col = [];
    this.index = [];
  }
  /** verts: 4 x {x,y,z,u,v,r,g}; flip: alternate quad diagonal */
  quad(verts, flip = false) {
    const base = this.pos.length / 3;
    for (const v of verts) {
      this.pos.push(v.x, v.y, v.z);
      this.uv.push(v.u, v.v);
      this.col.push(v.r, v.g, 0);
    }
    if (flip) this.index.push(base + 1, base + 2, base + 3, base + 1, base + 3, base);
    else this.index.push(base, base + 1, base + 2, base, base + 2, base + 3);
  }
  build() {
    if (this.index.length === 0) return null;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(this.pos), 3));
    g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(this.uv), 2));
    g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(this.col), 3));
    g.setIndex(this.index); // three picks Uint16/Uint32 automatically
    g.boundingSphere = new THREE.Sphere(
      new THREE.Vector3(CHUNK / 2, WORLD_H / 2, CHUNK / 2),
      Math.sqrt(CHUNK * CHUNK / 2 + WORLD_H * WORLD_H / 4) + 2,
    );
    return g;
  }
}

// ------------------------------------------------------------
// Lighting helpers
// ------------------------------------------------------------

function skyLightAt(s, lx, y, lz, id) {
  const h = s.height(lx, lz);
  let v = y >= h ? 1 : Math.max(0.12, 1 - (h - y) * 0.1);
  if (id === B.WATER && y < SEA) {
    v *= Math.max(0.3, 1 - (SEA - y) * 0.07); // dimmer with water depth
  }
  return v;
}

function torchLightAt(torches, wx, wy, wz) {
  let v = 0;
  for (let i = 0; i < torches.length; i++) {
    const t = torches[i];
    const dx = wx - t[0], dy = wy - t[1], dz = wz - t[2];
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
    const l = 1 - d / 9;
    if (l > v) v = l;
  }
  return v;
}

// ------------------------------------------------------------
// Main entry
// ------------------------------------------------------------

/**
 * Build solid + water geometries for a chunk. All 8 neighbor chunks
 * must already be generated (the world guarantees this).
 * Returns { solid: BufferGeometry|null, water: BufferGeometry|null }
 */
function buildChunkGeometries(world, chunk, { smoothLighting = true } = {}) {
  const s = makeSampler(world, chunk.cx, chunk.cz);
  const torches = world.getTorchesNear(chunk.cx, chunk.cz);
  const hasTorches = torches.length > 0;
  const ox = chunk.cx * CHUNK, oz = chunk.cz * CHUNK;
  const solid = new GeoBuf();
  const water = new GeoBuf();
  const blocks = chunk.blocks;
  const biomes = chunk.biomes;

  const verts = [{}, {}, {}, {}].map(() => ({ x: 0, y: 0, z: 0, u: 0, v: 0, r: 0, g: 0 }));

  for (let y = 0; y < WORLD_H; y++) {
    for (let lz = 0; lz < CHUNK; lz++) {
      for (let lx = 0; lx < CHUNK; lx++) {
        const id = blocks[lx + (lz << 4) + (y << 8)];
        if (id === B.AIR) continue;
        const def = BLOCKS[id];
        const biome = biomes[lx + (lz << 4)];

        if (def.shape === 'cross') {
          emitCross(solid, s, torches, hasTorches, def, lx, y, lz, ox, oz);
          continue;
        }
        if (def.shape === 'torch') {
          emitTorch(solid, def, lx, y, lz);
          continue;
        }

        const isLiquid = def.shape === 'liquid';
        const buf = isLiquid ? water : solid;
        const aboveSame = isLiquid && s.block(lx, y + 1, lz) === id;

        for (let f = 0; f < 6; f++) {
          const face = FACES[f];
          const nIdx = s.block(lx + face.n[0], y + face.n[1], lz + face.n[2]);
          // visibility
          if (nIdx === id && CULL_SAME[id]) continue;
          if (nIdx !== B.AIR && OPAQUE[nIdx]) continue;
          if (isLiquid && nIdx === B.WATER) continue;

          // tile selection (biome-tinted grass tops in forests)
          let tile = def.tex[face.key];
          if (id === B.GRASS && face.key === 'py' && biome === BIOME.FOREST) tile = 'grass_top_forest';
          const rect = isLiquid ? null : uvRect(tile);

          const shade = FACE_SHADE[face.key];
          const cellX = lx + face.n[0], cellY = y + face.n[1], cellZ = lz + face.n[2];
          const aos = [3, 3, 3, 3];

          for (let ci = 0; ci < 4; ci++) {
            const c = face.corners[ci];
            const v = verts[ci];

            // ---- vertex position (liquid tops are lowered) ----
            let py = c.pos[1];
            if (isLiquid && !aboveSame && py === 1) py = 0.875;
            v.x = lx + c.pos[0];
            v.y = y + py;
            v.z = lz + c.pos[2];

            // ---- ambient occlusion + smooth sky light ----
            let ao = 3, sky;
            if (!isLiquid && smoothLighting) {
              const s1x = cellX + c.s1 * face.t1[0], s1y = cellY + c.s1 * face.t1[1], s1z = cellZ + c.s1 * face.t1[2];
              const s2x = cellX + c.s2 * face.t2[0], s2y = cellY + c.s2 * face.t2[1], s2z = cellZ + c.s2 * face.t2[2];
              const ccx = cellX + c.s1 * face.t1[0] + c.s2 * face.t2[0];
              const ccy = cellY + c.s1 * face.t1[1] + c.s2 * face.t2[1];
              const ccz = cellZ + c.s1 * face.t1[2] + c.s2 * face.t2[2];
              const id1 = s.block(s1x, s1y, s1z), id2 = s.block(s2x, s2y, s2z), idc = s.block(ccx, ccy, ccz);
              const o1 = OCCLUDES[id1], o2 = OCCLUDES[id2], oc = OCCLUDES[idc];
              ao = (o1 && o2) ? 0 : 3 - (o1 + o2 + oc);
              const cellId = s.block(cellX, cellY, cellZ);
              sky = skyLightAt(s, cellX, cellY, cellZ, cellId);
              let cnt = 1;
              if (!o1) { sky += skyLightAt(s, s1x, s1y, s1z, id1); cnt++; }
              if (!o2) { sky += skyLightAt(s, s2x, s2y, s2z, id2); cnt++; }
              if (!oc && !(o1 && o2)) { sky += skyLightAt(s, ccx, ccy, ccz, idc); cnt++; }
              sky /= cnt;
            } else {
              const cellId = s.block(cellX, cellY, cellZ);
              sky = skyLightAt(s, cellX, cellY, cellZ, cellId);
            }
            aos[ci] = ao;
            const aoB = AO_CURVE[ao];

            // ---- torch light ----
            let torch = 0;
            if (hasTorches) torch = torchLightAt(torches, ox + v.x, v.y, oz + v.z);

            v.r = sky * aoB * shade;
            v.g = torch * aoB * shade;

            // ---- uv ----
            if (isLiquid) {
              // world-tiled animated water texture (repeat-wrapped)
              if (face.key === 'py' || face.key === 'ny') {
                v.u = (ox + v.x) / 4; v.v = (oz + v.z) / 4;
              } else {
                v.u = (face.n[0] !== 0 ? oz + v.z : ox + v.x) / 4;
                v.v = v.y / 4;
              }
            } else {
              v.u = rect.u0 + (rect.u1 - rect.u0) * c.u;
              v.v = rect.v0 + (rect.v1 - rect.v0) * c.v;
            }
          }

          // flip quad diagonal when AO is asymmetric (kills seam artifacts)
          buf.quad(verts, aos[0] + aos[2] > aos[1] + aos[3]);
        }
      }
    }
  }

  return { solid: solid.build(), water: water.build() };
}

// ------------------------------------------------------------
// Cross-shaped blocks (flowers, tall grass, dead bushes)
// ------------------------------------------------------------

function emitCross(buf, s, torches, hasTorches, def, lx, y, lz, ox, oz) {
  const rect = uvRect(def.tex.py);
  const cellId = s.block(lx, y, lz);
  const sky = skyLightAt(s, lx, y, lz, cellId);
  const torch = hasTorches ? torchLightAt(torches, ox + lx + 0.5, y + 0.5, oz + lz + 0.5) : 0;

  // deterministic little offset, like Minecraft's plant jitter
  const hsh = ((lx * 73856093) ^ (lz * 19349663) ^ (y * 83492791)) >>> 0;
  const offX = ((hsh & 15) / 15 - 0.5) * 0.3;
  const offZ = (((hsh >> 4) & 15) / 15 - 0.5) * 0.3;

  const a = 0.15, b = 0.85;
  const planes = [
    [[a, a], [b, b]],
    [[a, b], [b, a]],
  ];
  for (const [[x0, z0], [x1, z1]] of planes) {
    for (const flip of [false, true]) {
      const corners = [
        { x: x0, z: z0, u: 0, vy: 0 },
        { x: x1, z: z1, u: 1, vy: 0 },
        { x: x1, z: z1, u: 1, vy: 1 },
        { x: x0, z: z0, u: 0, vy: 1 },
      ];
      const list = flip ? [...corners].reverse() : corners;
      buf.quad(list.map((c) => ({
        x: lx + c.x + offX,
        y: y + c.vy,
        z: lz + c.z + offZ,
        u: rect.u0 + (rect.u1 - rect.u0) * c.u,
        v: rect.v0 + (rect.v1 - rect.v0) * c.vy,
        r: sky,
        g: torch,
      })));
    }
  }
}

// ------------------------------------------------------------
// Torches (tiny 2px-wide post, always fullbright)
// ------------------------------------------------------------

function emitTorch(buf, def, lx, y, lz) {
  const rect = uvRect(def.tex.py);
  const uw = rect.u1 - rect.u0, vw = rect.v1 - rect.v0;
  const a = 7 / 16, b = 9 / 16, h = 10 / 16;
  const mapU = (t) => rect.u0 + uw * t;
  const mapV = (t) => rect.v0 + vw * t;
  const u0 = mapU(7 / 16), u1 = mapU(9 / 16), v0 = mapV(0), v1 = mapV(10 / 16);

  // each side: two bottom verts then two top verts, wound CCW from outside
  const sideQuad = (p0, p1) => {
    buf.quad([
      { x: lx + p0[0], y: y, z: lz + p0[1], u: u0, v: v0, r: 1, g: 1 },
      { x: lx + p1[0], y: y, z: lz + p1[1], u: u1, v: v0, r: 1, g: 1 },
      { x: lx + p1[0], y: y + h, z: lz + p1[1], u: u1, v: v1, r: 1, g: 1 },
      { x: lx + p0[0], y: y + h, z: lz + p0[1], u: u0, v: v1, r: 1, g: 1 },
    ]);
  };
  sideQuad([b, a], [a, a]); // faces -z
  sideQuad([a, b], [b, b]); // faces +z
  sideQuad([a, a], [a, b]); // faces -x
  sideQuad([b, b], [b, a]); // faces +x

  // top cap (samples the flame pixels), faces +y
  const cu0 = mapU(7 / 16), cu1 = mapU(9 / 16), cv0 = mapV(9 / 16), cv1 = mapV(11 / 16);
  buf.quad([
    { x: lx + a, y: y + h, z: lz + a, u: cu0, v: cv0, r: 1, g: 1 },
    { x: lx + a, y: y + h, z: lz + b, u: cu0, v: cv1, r: 1, g: 1 },
    { x: lx + b, y: y + h, z: lz + b, u: cu1, v: cv1, r: 1, g: 1 },
    { x: lx + b, y: y + h, z: lz + a, u: cu1, v: cv0, r: 1, g: 1 },
  ]);
}

// ------------------------------------------------------------
// Standalone block geometry (held item, falling blocks, icons)
// ------------------------------------------------------------

/** Unit cube (or cross) centered at origin with baked face shading. */
function buildBlockGeometry(id) {
  const def = BLOCKS[id];
  const buf = new GeoBuf();
  if (def.shape === 'cross') {
    const rect = uvRect(def.tex.py);
    const a = -0.35, b = 0.35;
    for (const [[x0, z0], [x1, z1]] of [[[a, a], [b, b]], [[a, b], [b, a]]]) {
      for (const flip of [false, true]) {
        const corners = [
          { x: x0, z: z0, u: 0, vy: 0 },
          { x: x1, z: z1, u: 1, vy: 0 },
          { x: x1, z: z1, u: 1, vy: 1 },
          { x: x0, z: z0, u: 0, vy: 1 },
        ];
        const list = flip ? [...corners].reverse() : corners;
        buf.quad(list.map((c) => ({
          x: c.x, y: c.vy - 0.5, z: c.z,
          u: rect.u0 + (rect.u1 - rect.u0) * c.u,
          v: rect.v0 + (rect.v1 - rect.v0) * c.vy,
          r: 1, g: 0,
        })));
      }
    }
  } else {
    for (const face of FACES) {
      const tile = def.tex[face.key];
      const rect = uvRect(tile === 'water_still' ? 'water_still' : tile);
      const shade = FACE_SHADE[face.key];
      buf.quad(face.corners.map((c) => ({
        x: c.pos[0] - 0.5, y: c.pos[1] - 0.5, z: c.pos[2] - 0.5,
        u: rect.u0 + (rect.u1 - rect.u0) * c.u,
        v: rect.v0 + (rect.v1 - rect.v0) * c.v,
        r: shade, g: 0,
      })));
    }
  }
  const g = buf.build();
  g.computeBoundingSphere();
  return g;
}

// ---- world.js ----
// ============================================================
// World — chunk storage, streaming (generate/mesh/unload with
// a per-frame time budget), block get/set with dirty-area
// remeshing, player edit persistence, torch tracking and
// skylight heightmap maintenance.
// ============================================================





const ckey = (cx, cz) => ((cx & 0xffff) << 16) | (cz & 0xffff);
const bidx = (lx, y, lz) => lx + (lz << 4) + (y << 8);

class Chunk {
  constructor(cx, cz) {
    this.cx = cx;
    this.cz = cz;
    this.blocks = null;     // Uint8Array(16*16*128)
    this.heights = null;    // Uint8Array(256) — skylight heightmap
    this.biomes = null;     // Uint8Array(256)
    this.torches = [];      // [x,y,z] world coords
    this.solidMesh = null;
    this.waterMesh = null;
    this.state = 'pending'; // pending -> generated -> ready
  }
}

class World {
  /**
   * @param {object} o
   * @param {number} o.seed
   * @param {THREE.Scene|object} o.scene       anything with add/remove
   * @param {object} o.materials               { solid, water }
   * @param {number} o.viewRadius              chunks
   * @param {boolean} o.smoothLighting
   */
  constructor({ seed, scene, materials, viewRadius = 7, smoothLighting = true }) {
    this.seed = seed >>> 0;
    this.gen = new WorldGen(this.seed);
    this.scene = scene;
    this.materials = materials;
    this.viewRadius = viewRadius;
    this.smoothLighting = smoothLighting;

    this.chunks = new Map();           // ckey -> Chunk
    this.editsByChunk = new Map();     // ckey -> Map(blockIdx -> id)
    this.editCount = 0;
    this.dirty = new Set();            // ckeys needing remesh
    this.supportChecks = [];           // cells to re-check after edits (sand, torches…)
    this.stats = { generated: 0, meshed: 0 };
  }

  // ----------------------------------------------------------
  // Access
  // ----------------------------------------------------------

  getChunk(cx, cz) { return this.chunks.get(ckey(cx, cz)); }

  getBlock(x, y, z) {
    if (y < 0 || y >= WORLD_H) return B.AIR;
    const c = this.chunks.get(ckey(Math.floor(x / CHUNK), Math.floor(z / CHUNK)));
    if (!c || !c.blocks) return B.AIR;
    return c.blocks[bidx(x & 15, y, z & 15)];
  }

  isLoaded(x, z) {
    const c = this.chunks.get(ckey(Math.floor(x / CHUNK), Math.floor(z / CHUNK)));
    return !!(c && c.blocks);
  }

  /** Highest skylight-blocking block of the column (0 if none). */
  surfaceHeight(x, z) {
    const c = this.chunks.get(ckey(Math.floor(x / CHUNK), Math.floor(z / CHUNK)));
    if (!c || !c.heights) return 0;
    return c.heights[(x & 15) + ((z & 15) << 4)];
  }

  biomeAt(x, z) {
    const c = this.chunks.get(ckey(Math.floor(x / CHUNK), Math.floor(z / CHUNK)));
    if (!c || !c.biomes) return this.gen.biomeAt(x, z);
    return c.biomes[(x & 15) + ((z & 15) << 4)];
  }

  getTorchesNear(cx, cz) {
    const out = [];
    for (let dz = -1; dz <= 1; dz++)
      for (let dx = -1; dx <= 1; dx++) {
        const c = this.chunks.get(ckey(cx + dx, cz + dz));
        if (c) for (const t of c.torches) out.push(t);
      }
    return out;
  }

  // ----------------------------------------------------------
  // Editing
  // ----------------------------------------------------------

  /**
   * Set a block. Records the edit (for persistence), maintains the
   * skylight heightmap + torch lists, marks affected chunks dirty and
   * queues gravity/support checks for the game loop.
   */
  setBlock(x, y, z, id, { record = true, silent = false } = {}) {
    if (y < 1 || y >= WORLD_H) return null;
    const cx = Math.floor(x / CHUNK), cz = Math.floor(z / CHUNK);
    const c = this.chunks.get(ckey(cx, cz));
    if (!c || !c.blocks) return null;

    const lx = x & 15, lz = z & 15;
    const i = bidx(lx, y, lz);
    const old = c.blocks[i];
    if (old === id) return null;
    c.blocks[i] = id;

    // --- torch list ---
    if (old === B.TORCH) {
      c.torches = c.torches.filter((t) => t[0] !== x || t[1] !== y || t[2] !== z);
    }
    if (id === B.TORCH) c.torches.push([x, y, z]);

    // --- skylight heightmap ---
    const hi = lx + (lz << 4);
    const hCur = c.heights[hi];
    if (COUNTS_HEIGHT[id]) {
      if (y > hCur) c.heights[hi] = y;
    } else if (y === hCur) {
      let yy = y - 1;
      while (yy > 0 && !COUNTS_HEIGHT[c.blocks[bidx(lx, yy, lz)]]) yy--;
      c.heights[hi] = yy;
    }

    // --- record edit for persistence ---
    if (record) {
      let m = this.editsByChunk.get(ckey(cx, cz));
      if (!m) { m = new Map(); this.editsByChunk.set(ckey(cx, cz), m); }
      if (!m.has(i)) this.editCount++;
      m.set(i, id);
    }

    // --- remesh area (torch placement/removal lights a big radius) ---
    const lightRadius = (old === B.TORCH || id === B.TORCH) ? 10 : 1;
    this.markDirtyArea(x, y, z, lightRadius);

    // --- queue support / gravity checks ---
    if (!silent) {
      this.supportChecks.push([x, y + 1, z]);
      if (id !== B.AIR) this.supportChecks.push([x, y, z]); // placed block may need support itself
    }

    return old;
  }

  markDirtyArea(x, y, z, r) {
    const cx0 = Math.floor((x - r) / CHUNK), cx1 = Math.floor((x + r) / CHUNK);
    const cz0 = Math.floor((z - r) / CHUNK), cz1 = Math.floor((z + r) / CHUNK);
    for (let cz = cz0; cz <= cz1; cz++)
      for (let cx = cx0; cx <= cx1; cx++) {
        const c = this.chunks.get(ckey(cx, cz));
        if (c && c.state === 'ready') this.dirty.add(ckey(cx, cz));
      }
  }

  // ----------------------------------------------------------
  // Persistence
  // ----------------------------------------------------------

  serializeEdits() {
    const out = [];
    for (const [key, m] of this.editsByChunk) {
      const cx = key >> 16;                 // sign-extends
      const cz = (key << 16) >> 16;
      for (const [i, id] of m) out.push([cx, cz, i, id]);
    }
    return out;
  }

  loadEdits(list) {
    if (!Array.isArray(list)) return;
    for (const [cx, cz, i, id] of list) {
      const key = ckey(cx, cz);
      let m = this.editsByChunk.get(key);
      if (!m) { m = new Map(); this.editsByChunk.set(key, m); }
      m.set(i, id);
      this.editCount++;
    }
  }

  applyEditsToChunk(c) {
    const m = this.editsByChunk.get(ckey(c.cx, c.cz));
    if (!m) return;
    for (const [i, id] of m) {
      c.blocks[i] = id;
      if (id === B.TORCH) {
        const lx = i & 15, lz = (i >> 4) & 15, y = i >> 8;
        c.torches.push([c.cx * CHUNK + lx, y, c.cz * CHUNK + lz]);
      }
    }
  }

  // ----------------------------------------------------------
  // Streaming
  // ----------------------------------------------------------

  /**
   * Stream chunks around (px, pz). Generates within viewRadius+1,
   * meshes within viewRadius, unloads beyond viewRadius+2.
   * Spends at most budgetMs per call.
   */
  update(px, pz, budgetMs = 5) {
    const pcx = Math.floor(px / CHUNK), pcz = Math.floor(pz / CHUNK);
    const R = this.viewRadius, GR = R + 1;
    const t0 = performance.now();

    // ---- ensure chunk records exist / unload far chunks ----
    for (let dz = -GR; dz <= GR; dz++)
      for (let dx = -GR; dx <= GR; dx++) {
        if (dx * dx + dz * dz > (GR + 0.5) * (GR + 0.5)) continue;
        const cx = pcx + dx, cz = pcz + dz;
        const key = ckey(cx, cz);
        if (!this.chunks.has(key)) this.chunks.set(key, new Chunk(cx, cz));
      }
    for (const [key, c] of this.chunks) {
      const dx = c.cx - pcx, dz = c.cz - pcz;
      if (dx * dx + dz * dz > (GR + 2) * (GR + 2)) {
        this.disposeChunk(c);
        this.chunks.delete(key);
        this.dirty.delete(key);
      }
    }

    // ---- work queues, nearest first ----
    const genList = [];
    const meshList = [];
    for (const c of this.chunks.values()) {
      const dx = c.cx - pcx, dz = c.cz - pcz;
      const d2 = dx * dx + dz * dz;
      if (c.state === 'pending') genList.push([d2, c]);
      else if (c.state === 'generated' && d2 <= R * R + 1 && this.neighborsGenerated(c)) {
        meshList.push([d2, c]);
      }
    }
    genList.sort((a, b) => a[0] - b[0]);
    meshList.sort((a, b) => a[0] - b[0]);

    // dirty chunks first (player edits feel instant), then mesh, then gen
    let worked = true;
    while (worked && performance.now() - t0 < budgetMs) {
      worked = false;
      if (this.dirty.size) {
        let best = null, bestD = Infinity;
        for (const key of this.dirty) {
          const c = this.chunks.get(key);
          if (!c) { this.dirty.delete(key); continue; }
          const dx = c.cx - pcx, dz = c.cz - pcz;
          const d2 = dx * dx + dz * dz;
          if (d2 < bestD) { bestD = d2; best = c; }
        }
        if (best && this.neighborsGenerated(best)) {
          this.dirty.delete(ckey(best.cx, best.cz));
          this.meshChunk(best);
          worked = true;
          continue;
        } else if (best) {
          // can't mesh yet — wait until neighbors generate
          this.dirty.delete(ckey(best.cx, best.cz));
          this.dirty.add(ckey(best.cx, best.cz));
        }
      }
      if (meshList.length) {
        const [, c] = meshList.shift();
        if (c.state === 'generated') { this.meshChunk(c); worked = true; continue; }
      }
      if (genList.length) {
        const [, c] = genList.shift();
        if (c.state === 'pending') { this.generateChunk(c); worked = true; }
      }
    }
  }

  neighborsGenerated(c) {
    for (let dz = -1; dz <= 1; dz++)
      for (let dx = -1; dx <= 1; dx++) {
        if (dx === 0 && dz === 0) continue;
        const n = this.chunks.get(ckey(c.cx + dx, c.cz + dz));
        if (!n || !n.blocks) return false;
      }
    return true;
  }

  generateChunk(c) {
    c.blocks = new Uint8Array(CHUNK * CHUNK * WORLD_H);
    c.heights = new Uint8Array(CHUNK * CHUNK);
    c.biomes = new Uint8Array(CHUNK * CHUNK);
    this.gen.generate(c);
    this.applyEditsToChunk(c);
    this.gen.computeHeights(c); // edits may change the heightmap
    c.state = 'generated';
    this.stats.generated++;
  }

  meshChunk(c) {
    const { solid, water } = buildChunkGeometries(this, c, { smoothLighting: this.smoothLighting });
    this.removeMeshes(c);
    if (solid) {
      c.solidMesh = new THREE.Mesh(solid, this.materials.solid);
      this.placeMesh(c, c.solidMesh);
    }
    if (water) {
      c.waterMesh = new THREE.Mesh(water, this.materials.water);
      c.waterMesh.renderOrder = 2;
      this.placeMesh(c, c.waterMesh);
    }
    c.state = 'ready';
    this.stats.meshed++;
  }

  placeMesh(c, mesh) {
    mesh.position.set(c.cx * CHUNK, 0, c.cz * CHUNK);
    mesh.matrixAutoUpdate = false;
    mesh.updateMatrix();
    this.scene.add(mesh);
  }

  removeMeshes(c) {
    for (const k of ['solidMesh', 'waterMesh']) {
      const m = c[k];
      if (m) {
        this.scene.remove(m);
        m.geometry.dispose();
        c[k] = null;
      }
    }
  }

  disposeChunk(c) {
    this.removeMeshes(c);
    c.blocks = null;
    c.heights = null;
    c.biomes = null;
    c.state = 'pending';
  }

  /** Remesh every ready chunk (used when toggling smooth lighting). */
  remeshAll() {
    for (const c of this.chunks.values()) {
      if (c.state === 'ready') this.dirty.add(ckey(c.cx, c.cz));
    }
  }

  /** Loading progress around a position (for the loading screen). */
  readiness(px, pz, radius) {
    const pcx = Math.floor(px / CHUNK), pcz = Math.floor(pz / CHUNK);
    let ready = 0, total = 0;
    for (let dz = -radius; dz <= radius; dz++)
      for (let dx = -radius; dx <= radius; dx++) {
        if (dx * dx + dz * dz > radius * radius + 1) continue;
        total++;
        const c = this.chunks.get(ckey(pcx + dx, pcz + dz));
        if (c && c.state === 'ready') ready++;
      }
    return { ready, total };
  }

  countLoaded() {
    let n = 0;
    for (const c of this.chunks.values()) if (c.state === 'ready') n++;
    return n;
  }

  dispose() {
    for (const c of this.chunks.values()) this.disposeChunk(c);
    this.chunks.clear();
    this.dirty.clear();
  }
}

// ---- player.js ----
// ============================================================
// Player — Minecraft-tuned first person physics:
// AABB vs voxel collision (per-axis sweep, fixed substeps),
// walking / sprinting (with FOV kick handled by main) /
// sneaking with edge-guard / jumping / swimming / creative
// flight, plus footstep & landing events for the audio system.
// Also: Amanatides-Woo voxel raycast for targeting blocks.
// ============================================================




const HALF = 0.3;            // half width of the player AABB
const HEIGHT = 1.8;          // standing height
const EYE_STAND = 1.62;
const EYE_SNEAK = 1.32;
const GRAVITY_PLR = 32;
const JUMP_V = 8.94;         // ~1.25 block jump
const TERMINAL = 72;
const EPS = 0.001;

const SPEED_WALK = 4.317;
const SPEED_SPRINT = 5.612;
const SPEED_SNEAK = 1.31;
const SPEED_FLY = 10.9;
const SPEED_FLY_SPRINT = 19;
const FLY_VERT = 9;
const SPEED_WATER = 2.6;

const SUBSTEP = 1 / 120;

const isSolidId = (id) => BLOCKS[id] ? BLOCKS[id].solid : false;

class Player {
  constructor(world) {
    this.world = world;
    this.pos = new THREE.Vector3(0.5, 80, 0.5); // feet center
    this.vel = new THREE.Vector3();
    this.yaw = 0;
    this.pitch = 0;

    this.onGround = false;
    this.flying = false;
    this.sprinting = false;
    this.sneaking = false;
    this.inWater = false;
    this.headInWater = false;
    this.hitWall = false;
    this.eyeHeight = EYE_STAND;

    this.walkCycle = 0;     // accumulates with horizontal travel (view bob)
    this.bobStrength = 0;   // 0..1, eases in/out with movement
    this.stepAccum = 0;
    this.events = [];       // {type, id?, impact?} drained by main
  }

  teleport(x, y, z) {
    this.pos.set(x, y, z);
    this.vel.set(0, 0, 0);
  }

  eyePosition(out = new THREE.Vector3()) {
    return out.set(this.pos.x, this.pos.y + this.eyeHeight, this.pos.z);
  }

  /** Forward look vector from yaw/pitch. */
  lookDir(out = new THREE.Vector3()) {
    const cp = Math.cos(this.pitch);
    return out.set(-Math.sin(this.yaw) * cp, Math.sin(this.pitch), -Math.cos(this.yaw) * cp).normalize();
  }

  // ----------------------------------------------------------
  // Per-frame update (fixed substeps inside)
  // ----------------------------------------------------------

  update(dt, input) {
    dt = Math.min(dt, 0.1);
    while (dt > 1e-6) {
      const h = Math.min(dt, SUBSTEP);
      this.step(h, input);
      dt -= h;
    }
    // eye height eases between stand/sneak
    const targetEye = this.sneaking && !this.flying ? EYE_SNEAK : EYE_STAND;
    this.eyeHeight += (targetEye - this.eyeHeight) * 0.35;
  }

  step(h, input) {
    const wasOnGround = this.onGround;
    const wasInWater = this.inWater;
    const prevVy = this.vel.y;

    // ---- water state ----
    const feetId = this.world.getBlock(Math.floor(this.pos.x), Math.floor(this.pos.y + 0.2), Math.floor(this.pos.z));
    const midId = this.world.getBlock(Math.floor(this.pos.x), Math.floor(this.pos.y + 1.0), Math.floor(this.pos.z));
    const eyeId = this.world.getBlock(Math.floor(this.pos.x), Math.floor(this.pos.y + this.eyeHeight), Math.floor(this.pos.z));
    this.inWater = feetId === B.WATER || midId === B.WATER;
    this.headInWater = eyeId === B.WATER;

    this.sneaking = input.sneak && !this.flying;

    // ---- wish direction (camera-relative, horizontal) ----
    const sin = Math.sin(this.yaw), cos = Math.cos(this.yaw);
    let fx = 0, fz = 0;
    if (input.forward) { fx -= sin; fz -= cos; }
    if (input.back) { fx += sin; fz += cos; }
    if (input.left) { fx -= cos; fz += sin; }
    if (input.right) { fx += cos; fz -= sin; }
    const wl = Math.hypot(fx, fz);
    if (wl > 0) { fx /= wl; fz /= wl; }

    // ---- target speed ----
    let speed;
    if (this.flying) speed = this.sprinting ? SPEED_FLY_SPRINT : SPEED_FLY;
    else if (this.inWater) speed = this.sprinting ? SPEED_WATER * 1.45 : SPEED_WATER;
    else if (this.sneaking) speed = SPEED_SNEAK;
    else if (this.sprinting) speed = SPEED_SPRINT;
    else speed = SPEED_WALK;

    // ---- horizontal acceleration ----
    const accel = this.flying ? 9 : this.inWater ? 7 : this.onGround ? 16 : 3.2;
    const k = Math.min(1, accel * h);
    this.vel.x += (fx * speed - this.vel.x) * k;
    this.vel.z += (fz * speed - this.vel.z) * k;

    // ---- vertical movement ----
    if (this.flying) {
      const targetY = input.jump ? FLY_VERT : input.sneak ? -FLY_VERT : 0;
      this.vel.y += (targetY - this.vel.y) * Math.min(1, 11 * h);
    } else if (this.inWater) {
      this.vel.y -= 10 * h;                       // weak gravity
      this.vel.y *= Math.max(0, 1 - 2.4 * h);     // water drag
      if (input.jump) this.vel.y = Math.min(this.vel.y + 42 * h, 3.6);
      // hop out of the water when pushing against an edge
      if (input.jump && this.hitWall && !this.headInWater) {
        this.vel.y = Math.max(this.vel.y, 5.4);
      }
    } else {
      this.vel.y -= GRAVITY_PLR * h;
      if (this.vel.y < -TERMINAL) this.vel.y = -TERMINAL;
      if (input.jump && this.onGround) {
        this.vel.y = JUMP_V;
        if (this.sprinting && wl > 0) { // sprint-jump boost
          this.vel.x += fx * 1.4;
          this.vel.z += fz * 1.4;
        }
        this.events.push({ type: 'jump' });
      }
    }

    // ---- integrate + collide (Y first, then X/Z) ----
    this.onGround = false;
    this.hitWall = false;
    this.moveAxis(1, this.vel.y * h);
    // sticky ground: tiny drift around the collision epsilon must not
    // flicker the grounded state (jumping, footsteps, sneak guard rely on it)
    if (!this.onGround && this.vel.y <= 0 && !this.flying && this.hasSupportBelow()) {
      this.onGround = true;
    }

    const guard = this.sneaking && wasOnGround && !this.flying && !this.inWater;
    this.moveAxisGuarded(0, this.vel.x * h, guard);
    this.moveAxisGuarded(2, this.vel.z * h, guard);

    // ---- events ----
    if (!wasOnGround && this.onGround && prevVy < -9) {
      this.events.push({ type: 'land', impact: -prevVy, id: this.blockBelow() });
    }
    if (!wasInWater && this.inWater && prevVy < -4) {
      this.events.push({ type: 'splash' });
    }

    // footsteps + view-bob bookkeeping
    const hSpeed = Math.hypot(this.vel.x, this.vel.z);
    if (this.onGround && hSpeed > 0.6) {
      this.walkCycle += hSpeed * h * 1.6;
      this.bobStrength = Math.min(1, this.bobStrength + 6 * h);
      this.stepAccum += hSpeed * h;
      const stride = this.sprinting ? 2.6 : 2.1;
      if (this.stepAccum > stride) {
        this.stepAccum = 0;
        const below = this.blockBelow();
        if (below !== B.AIR) this.events.push({ type: 'step', id: below });
      }
    } else {
      this.bobStrength = Math.max(0, this.bobStrength - 6 * h);
    }
  }

  blockBelow() {
    return this.world.getBlock(
      Math.floor(this.pos.x),
      Math.floor(this.pos.y - 0.05),
      Math.floor(this.pos.z),
    );
  }

  // ----------------------------------------------------------
  // Collision
  // ----------------------------------------------------------

  moveAxisGuarded(axis, amount, guard) {
    if (guard) {
      const before = axis === 0 ? this.pos.x : this.pos.z;
      this.moveAxis(axis, amount);
      if (!this.hasSupportBelow()) {
        // sneaking: don't walk off edges
        if (axis === 0) { this.pos.x = before; this.vel.x = 0; }
        else { this.pos.z = before; this.vel.z = 0; }
      }
    } else {
      this.moveAxis(axis, amount);
    }
  }

  moveAxis(axis, amount) {
    if (amount === 0) return;
    if (axis === 0) this.pos.x += amount;
    else if (axis === 1) this.pos.y += amount;
    else this.pos.z += amount;

    const minX = this.pos.x - HALF, maxX = this.pos.x + HALF;
    const minY = this.pos.y, maxY = this.pos.y + HEIGHT;
    const minZ = this.pos.z - HALF, maxZ = this.pos.z + HALF;

    const x0 = Math.floor(minX), x1 = Math.floor(maxX - 1e-9);
    const y0 = Math.max(0, Math.floor(minY)), y1 = Math.min(WORLD_H - 1, Math.floor(maxY - 1e-9));
    const z0 = Math.floor(minZ), z1 = Math.floor(maxZ - 1e-9);

    for (let by = y0; by <= y1; by++) {
      for (let bz = z0; bz <= z1; bz++) {
        for (let bx = x0; bx <= x1; bx++) {
          if (!isSolidId(this.world.getBlock(bx, by, bz))) continue;
          if (axis === 1) {
            if (amount < 0) {
              this.pos.y = Math.max(this.pos.y, by + 1 + EPS);
              this.vel.y = 0;
              this.onGround = true;
            } else {
              this.pos.y = Math.min(this.pos.y, by - HEIGHT - EPS);
              this.vel.y = 0;
            }
          } else if (axis === 0) {
            if (amount > 0) this.pos.x = Math.min(this.pos.x, bx - HALF - EPS);
            else this.pos.x = Math.max(this.pos.x, bx + 1 + HALF + EPS);
            this.vel.x = 0;
            this.hitWall = true;
          } else {
            if (amount > 0) this.pos.z = Math.min(this.pos.z, bz - HALF - EPS);
            else this.pos.z = Math.max(this.pos.z, bz + 1 + HALF + EPS);
            this.vel.z = 0;
            this.hitWall = true;
          }
        }
      }
    }
  }

  hasSupportBelow() {
    const y = Math.floor(this.pos.y - 0.06);
    if (y < 0) return false;
    const x0 = Math.floor(this.pos.x - HALF), x1 = Math.floor(this.pos.x + HALF - 1e-9);
    const z0 = Math.floor(this.pos.z - HALF), z1 = Math.floor(this.pos.z + HALF - 1e-9);
    for (let bz = z0; bz <= z1; bz++)
      for (let bx = x0; bx <= x1; bx++)
        if (isSolidId(this.world.getBlock(bx, y, bz))) return true;
    return false;
  }

  /** Would a solid block placed at this cell overlap the player? */
  intersectsCell(bx, by, bz) {
    return (
      bx + 1 > this.pos.x - HALF && bx < this.pos.x + HALF &&
      bz + 1 > this.pos.z - HALF && bz < this.pos.z + HALF &&
      by + 1 > this.pos.y && by < this.pos.y + HEIGHT
    );
  }
}

// ------------------------------------------------------------
// Voxel raycast (Amanatides & Woo DDA)
// ------------------------------------------------------------

/**
 * Walks the voxel grid along a ray. Returns the first block that is
 * targetable (anything but air and water), with the face normal that
 * was entered, or null.
 */
function raycastVoxel(world, origin, dir, maxDist) {
  let x = Math.floor(origin.x), y = Math.floor(origin.y), z = Math.floor(origin.z);

  const stepX = dir.x > 0 ? 1 : dir.x < 0 ? -1 : 0;
  const stepY = dir.y > 0 ? 1 : dir.y < 0 ? -1 : 0;
  const stepZ = dir.z > 0 ? 1 : dir.z < 0 ? -1 : 0;

  const tDeltaX = stepX !== 0 ? Math.abs(1 / dir.x) : Infinity;
  const tDeltaY = stepY !== 0 ? Math.abs(1 / dir.y) : Infinity;
  const tDeltaZ = stepZ !== 0 ? Math.abs(1 / dir.z) : Infinity;

  let tMaxX = stepX > 0 ? (x + 1 - origin.x) * tDeltaX : stepX < 0 ? (origin.x - x) * tDeltaX : Infinity;
  let tMaxY = stepY > 0 ? (y + 1 - origin.y) * tDeltaY : stepY < 0 ? (origin.y - y) * tDeltaY : Infinity;
  let tMaxZ = stepZ > 0 ? (z + 1 - origin.z) * tDeltaZ : stepZ < 0 ? (origin.z - z) * tDeltaZ : Infinity;

  let nx = 0, ny = 0, nz = 0;
  let t = 0;

  for (let i = 0; i < 256; i++) {
    const id = world.getBlock(x, y, z);
    if (id !== B.AIR && id !== B.WATER) {
      return { x, y, z, nx, ny, nz, id, dist: t };
    }
    if (tMaxX < tMaxY && tMaxX < tMaxZ) {
      t = tMaxX; tMaxX += tDeltaX; x += stepX; nx = -stepX; ny = 0; nz = 0;
    } else if (tMaxY < tMaxZ) {
      t = tMaxY; tMaxY += tDeltaY; y += stepY; ny = -stepY; nx = 0; nz = 0;
    } else {
      t = tMaxZ; tMaxZ += tDeltaZ; z += stepZ; nz = -stepZ; nx = 0; ny = 0;
    }
    if (t > maxDist) return null;
  }
  return null;
}

// ---- sky.js ----
// ============================================================
// Sky — full day/night cycle (20 minutes like Minecraft):
// square sun & moon orbiting the player, fading star dome,
// drifting blocky cloud layer, sky/fog colors with sunrise &
// sunset tinting, and the global "uDayLight" uniform that
// dims every baked skylight vertex at night.
// ============================================================




const DAY_LENGTH = 1200; // seconds for a full cycle (20 min, like MC)

const DAY_SKY = new THREE.Color(0.47, 0.66, 1.0);
const NIGHT_SKY = new THREE.Color(0.015, 0.025, 0.07);
const SUNSET = new THREE.Color(1.0, 0.48, 0.2);

class Sky {
  constructor(scene, uniforms) {
    this.scene = scene;
    this.uniforms = uniforms;
    this.timeOfDay = 0.04; // 0 = sunrise, 0.25 = noon, 0.5 = sunset, 0.75 = midnight
    this.dayLight = 1;
    this.viewDistance = 7 * CHUNK;
    this.underwater = false;

    this.skyColor = new THREE.Color();
    this.fogColor = new THREE.Color();
    scene.background = this.skyColor;
    scene.fog = new THREE.Fog(this.fogColor.getHex(), 60, 200);
    // re-link: THREE.Fog copies the color, keep a reference instead
    scene.fog.color = this.fogColor;

    // ---- celestial group (follows the camera) ----
    this.group = new THREE.Group();
    scene.add(this.group);

    const sunTex = new THREE.CanvasTexture(buildSunCanvas());
    sunTex.magFilter = sunTex.minFilter = THREE.NearestFilter;

    this.sun = new THREE.Mesh(
      new THREE.PlaneGeometry(64, 64),
      new THREE.MeshBasicMaterial({ map: sunTex, fog: false, transparent: true, depthWrite: false }),
    );
    this.group.add(this.sun);

    const moonTex = new THREE.CanvasTexture(buildMoonCanvas());
    moonTex.magFilter = moonTex.minFilter = THREE.NearestFilter;

    this.moon = new THREE.Mesh(
      new THREE.PlaneGeometry(38, 38),
      new THREE.MeshBasicMaterial({ map: moonTex, fog: false, transparent: true, depthWrite: false }),
    );
    this.group.add(this.moon);

    // ---- stars ----
    const starCount = 900;
    const starPos = new Float32Array(starCount * 3);
    const rng = (() => { let s = 1337; return () => ((s = (s * 16807) % 2147483647) / 2147483647); })();
    for (let i = 0; i < starCount; i++) {
      // random direction on the sphere
      const t = rng() * Math.PI * 2;
      const p = Math.acos(2 * rng() - 1);
      const r = 460;
      starPos[i * 3] = r * Math.sin(p) * Math.cos(t);
      starPos[i * 3 + 1] = r * Math.cos(p);
      starPos[i * 3 + 2] = r * Math.sin(p) * Math.sin(t);
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    this.starMat = new THREE.PointsMaterial({
      color: 0xffffff, size: 1.7, sizeAttenuation: false,
      transparent: true, opacity: 0, fog: false, depthWrite: false,
    });
    this.stars = new THREE.Points(starGeo, this.starMat);
    this.group.add(this.stars);

    // ---- clouds ----
    const cloudTex = new THREE.CanvasTexture(buildCloudCanvas());
    cloudTex.magFilter = cloudTex.minFilter = THREE.NearestFilter;
    cloudTex.wrapS = cloudTex.wrapT = THREE.RepeatWrapping;
    this.cloudTex = cloudTex;
    this.cloudMat = new THREE.MeshBasicMaterial({
      map: cloudTex, transparent: true, opacity: 0.55, fog: false,
      depthWrite: false, side: THREE.DoubleSide,
    });
    this.clouds = new THREE.Mesh(new THREE.PlaneGeometry(2048, 2048), this.cloudMat);
    this.clouds.rotation.x = -Math.PI / 2;
    this.clouds.position.y = 148;
    this.cloudTex.repeat.set(2, 2);
    scene.add(this.clouds);
    this.cloudDrift = 0;
  }

  setTimeOfDay(t) { this.timeOfDay = ((t % 1) + 1) % 1; }
  setViewDistance(chunks) { this.viewDistance = chunks * CHUNK; }
  setCloudsVisible(v) { this.clouds.visible = v; }
  setUnderwater(u) { this.underwater = u; }

  /** "HH:MM" — 0.0 timeOfDay corresponds to 06:00. */
  clockString() {
    const t = (this.timeOfDay * 24 + 6) % 24;
    const hh = String(Math.floor(t)).padStart(2, '0');
    const mm = String(Math.floor((t % 1) * 60)).padStart(2, '0');
    return `${hh}:${mm}`;
  }

  update(dt, camPos) {
    this.timeOfDay = (this.timeOfDay + dt / DAY_LENGTH) % 1;
    const a = this.timeOfDay * Math.PI * 2;
    const sunH = Math.sin(a); // -1..1, height of the sun

    // ---- celestial positions ----
    this.group.position.copy(camPos);
    this.sun.position.set(Math.cos(a) * 420, Math.sin(a) * 420, 0);
    this.sun.lookAt(camPos);
    this.moon.position.set(-Math.cos(a) * 420, -Math.sin(a) * 420, 0);
    this.moon.lookAt(camPos);
    this.stars.rotation.z = a;

    // ---- light level ----
    const k = THREE.MathUtils.clamp((sunH + 0.16) / 0.32, 0, 1); // 0 night .. 1 day
    const smooth = k * k * (3 - 2 * k);
    this.dayLight = 0.14 + 0.86 * smooth;
    this.uniforms.uDayLight.value = this.dayLight;

    // ---- sky / fog colors ----
    this.skyColor.copy(NIGHT_SKY).lerp(DAY_SKY, smooth);
    const sunsetF = THREE.MathUtils.clamp(1 - Math.abs(sunH) * 4.5, 0, 1);
    this.skyColor.lerp(SUNSET, sunsetF * 0.35);

    this.fogColor.copy(this.skyColor).multiplyScalar(1.12);
    this.fogColor.lerp(SUNSET, sunsetF * 0.18);

    const fog = this.scene.fog;
    if (this.underwater) {
      this.fogColor.setRGB(0.05, 0.18, 0.45).multiplyScalar(Math.max(0.25, this.dayLight));
      fog.near = 2;
      fog.far = 18;
    } else {
      fog.near = this.viewDistance * 0.55;
      fog.far = this.viewDistance * 0.98;
    }

    // ---- stars / sun fade ----
    this.starMat.opacity = THREE.MathUtils.clamp(1 - smooth * 1.6, 0, 1) * 0.9;
    this.sun.material.opacity = THREE.MathUtils.clamp(sunH * 6 + 0.7, 0, 1);
    this.moon.material.opacity = THREE.MathUtils.clamp(-sunH * 6 + 0.7, 0, 1);

    // ---- clouds drift along +x, world-anchored, dim at night ----
    this.cloudDrift += dt * 0.6;
    this.clouds.position.x = camPos.x;
    this.clouds.position.z = camPos.z;
    const cw = 2048 / this.cloudTex.repeat.x; // world units per texture repeat
    this.cloudTex.offset.set((camPos.x + this.cloudDrift) / cw, -camPos.z / cw);
    const cl = 0.25 + 0.75 * smooth;
    this.cloudMat.color.setRGB(cl, cl, cl);
  }
}

// ---- particles.js ----
// ============================================================
// Particles — pooled billboard quads in a single dynamic
// BufferGeometry (one draw call). Each particle samples a
// random 4x4-pixel patch of the broken block's texture, just
// like Minecraft's digging particles. Rendered with the chunk
// material so they obey day/night lighting.
// ============================================================




const MAX = 320;
const GRAVITY_PART = 15;

class Particles {
  constructor(scene, material) {
    this.list = [];
    this.pos = new Float32Array(MAX * 4 * 3);
    this.uv = new Float32Array(MAX * 4 * 2);
    this.col = new Float32Array(MAX * 4 * 3);

    const index = new Uint16Array(MAX * 6);
    for (let i = 0; i < MAX; i++) {
      const b = i * 4;
      index.set([b, b + 1, b + 2, b, b + 2, b + 3], i * 6);
    }

    this.geo = new THREE.BufferGeometry();
    this.geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    this.geo.setAttribute('uv', new THREE.BufferAttribute(this.uv, 2).setUsage(THREE.DynamicDrawUsage));
    this.geo.setAttribute('color', new THREE.BufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage));
    this.geo.setIndex(new THREE.BufferAttribute(index, 1));
    this.geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6); // never culled

    this.mesh = new THREE.Mesh(this.geo, material);
    this.mesh.frustumCulled = false;
    this.mesh.renderOrder = 1;
    scene.add(this.mesh);

    this._right = new THREE.Vector3();
    this._up = new THREE.Vector3();
  }

  spawn(x, y, z, id, count, speed = 2.6) {
    const def = BLOCKS[id];
    if (!def || !def.tex) return;
    const rect = atlasUV(def.tex.px || def.tex.py);
    const uw = rect.u1 - rect.u0, vw = rect.v1 - rect.v0;
    for (let i = 0; i < count; i++) {
      if (this.list.length >= MAX) this.list.shift();
      const u0 = rect.u0 + Math.random() * 0.75 * uw;
      const v0 = rect.v0 + Math.random() * 0.75 * vw;
      const ang = Math.random() * Math.PI * 2;
      const r = Math.random() * 0.35;
      this.list.push({
        x: x + 0.5 + Math.cos(ang) * r,
        y: y + 0.4 + Math.random() * 0.4,
        z: z + 0.5 + Math.sin(ang) * r,
        vx: Math.cos(ang) * speed * (0.3 + Math.random() * 0.7),
        vy: speed * (0.5 + Math.random() * 0.8),
        vz: Math.sin(ang) * speed * (0.3 + Math.random() * 0.7),
        life: 0.35 + Math.random() * 0.5,
        size: 0.055 + Math.random() * 0.05,
        u0, v0,
        u1: u0 + uw * 0.25,
        v1: v0 + vw * 0.25,
        shade: 0.65 + Math.random() * 0.35,
      });
    }
  }

  spawnBlockBreak(x, y, z, id) { this.spawn(x, y, z, id, 18); }

  spawnExplosion(x, y, z, ids) {
    for (let i = 0; i < 5; i++) {
      const id = ids[(Math.random() * ids.length) | 0];
      this.spawn(
        x + (Math.random() - 0.5) * 3,
        y + (Math.random() - 0.5) * 3,
        z + (Math.random() - 0.5) * 3,
        id, 8, 6,
      );
    }
  }

  update(dt, camera) {
    const list = this.list;
    for (let i = list.length - 1; i >= 0; i--) {
      const p = list[i];
      p.life -= dt;
      if (p.life <= 0) { list.splice(i, 1); continue; }
      p.vy -= GRAVITY_PART * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.z += p.vz * dt;
      p.vx *= 1 - 1.5 * dt;
      p.vz *= 1 - 1.5 * dt;
    }

    // billboard quads
    this._right.set(1, 0, 0).applyQuaternion(camera.quaternion);
    this._up.set(0, 1, 0).applyQuaternion(camera.quaternion);
    const R = this._right, U = this._up;
    const pos = this.pos, uv = this.uv, col = this.col;

    for (let i = 0; i < list.length; i++) {
      const p = list[i];
      const s = p.size;
      const b3 = i * 12, b2 = i * 8;
      // 4 corners: (-R-U, +R-U, +R+U, -R+U)
      pos[b3] = p.x - R.x * s - U.x * s; pos[b3 + 1] = p.y - R.y * s - U.y * s; pos[b3 + 2] = p.z - R.z * s - U.z * s;
      pos[b3 + 3] = p.x + R.x * s - U.x * s; pos[b3 + 4] = p.y + R.y * s - U.y * s; pos[b3 + 5] = p.z + R.z * s - U.z * s;
      pos[b3 + 6] = p.x + R.x * s + U.x * s; pos[b3 + 7] = p.y + R.y * s + U.y * s; pos[b3 + 8] = p.z + R.z * s + U.z * s;
      pos[b3 + 9] = p.x - R.x * s + U.x * s; pos[b3 + 10] = p.y - R.y * s + U.y * s; pos[b3 + 11] = p.z - R.z * s + U.z * s;
      uv[b2] = p.u0; uv[b2 + 1] = p.v0;
      uv[b2 + 2] = p.u1; uv[b2 + 3] = p.v0;
      uv[b2 + 4] = p.u1; uv[b2 + 5] = p.v1;
      uv[b2 + 6] = p.u0; uv[b2 + 7] = p.v1;
      for (let c = 0; c < 4; c++) {
        col[b3 + c * 3] = p.shade; // skylight channel
        col[b3 + c * 3 + 1] = 0.15; // tiny torch-ish fill so they read at night
        col[b3 + c * 3 + 2] = 0;
      }
    }

    this.geo.setDrawRange(0, list.length * 6);
    this.geo.attributes.position.needsUpdate = true;
    this.geo.attributes.uv.needsUpdate = true;
    this.geo.attributes.color.needsUpdate = true;
  }
}

// ---- audio.js ----
// ============================================================
// Audio — 100% synthesized with WebAudio (no sound assets).
// Filtered noise bursts tuned per material for digging,
// placing and footsteps, sine pings for glass, a deep boom
// for TNT, plus a gentle generative pentatonic music box that
// plays a soft phrase every so often (very C418-ish mood).
// ============================================================


const MATERIAL_PARAMS = {
  stone: { type: 'lowpass', freq: 760, q: 0.8, dur: 0.16, gain: 0.5 },
  dirt: { type: 'lowpass', freq: 360, q: 0.7, dur: 0.18, gain: 0.55 },
  grass: { type: 'lowpass', freq: 520, q: 0.6, dur: 0.16, gain: 0.5 },
  sand: { type: 'bandpass', freq: 1300, q: 0.6, dur: 0.14, gain: 0.4 },
  wood: { type: 'lowpass', freq: 620, q: 1.6, dur: 0.14, gain: 0.5 },
  glass: { type: 'highpass', freq: 2200, q: 1.0, dur: 0.22, gain: 0.4 },
  snow: { type: 'lowpass', freq: 900, q: 0.4, dur: 0.1, gain: 0.35 },
};

const NOTES = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33]; // C major pentatonic-ish

class AudioFX {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.musicGain = null;
    this.volume = 0.7;
    this.musicOn = true;
    this._noiseBuf = null;
    this._musicTimer = null;
  }

  /** Must be called from a user gesture. Safe to call repeatedly. */
  ensure() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.volume;
    this.master.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = this.musicOn ? 1 : 0;
    this.musicGain.connect(this.master);

    const len = this.ctx.sampleRate;
    this._noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this._noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  }

  setVolume(v) {
    this.volume = v;
    if (this.master) this.master.gain.value = v;
  }

  setMusicOn(on) {
    this.musicOn = on;
    if (this.musicGain) this.musicGain.gain.value = on ? 1 : 0;
  }

  // ----------------------------------------------------------
  // Noise-burst engine
  // ----------------------------------------------------------

  _noise({ type = 'lowpass', freq = 600, q = 0.8, dur = 0.15, gain = 0.5, rate = 1 }) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this._noiseBuf;
    src.playbackRate.value = rate * (0.9 + Math.random() * 0.2);
    src.loop = true;
    const filter = this.ctx.createBiquadFilter();
    filter.type = type;
    filter.frequency.value = freq * (0.85 + Math.random() * 0.3);
    filter.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(filter).connect(g).connect(this.master);
    src.start(t);
    src.stop(t + dur + 0.02);
  }

  _tone({ freq = 440, dur = 0.2, gain = 0.2, type = 'sine', attack = 0.005, dest = null }) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = type;
    osc.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(dest || this.master);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  }

  _materialOf(id) {
    return (BLOCKS[id] && MATERIAL_PARAMS[BLOCKS[id].sound]) || MATERIAL_PARAMS.stone;
  }

  // ----------------------------------------------------------
  // Game sounds
  // ----------------------------------------------------------

  blockBreak(id) {
    const p = this._materialOf(id);
    this._noise({ ...p });
    if (BLOCKS[id] && BLOCKS[id].sound === 'glass') {
      this._tone({ freq: 2600, dur: 0.12, gain: 0.1 });
      this._tone({ freq: 3400, dur: 0.09, gain: 0.07 });
    }
  }

  blockPlace(id) {
    const p = this._materialOf(id);
    this._noise({ ...p, dur: p.dur * 0.75, gain: p.gain * 0.8, freq: p.freq * 1.25 });
  }

  step(id) {
    const p = this._materialOf(id);
    this._noise({ ...p, dur: 0.07, gain: p.gain * 0.28, freq: p.freq * 1.2 });
  }

  land(impact) {
    this._noise({ type: 'lowpass', freq: 300, dur: 0.16, gain: Math.min(0.7, impact / 30) });
  }

  splash() {
    this._noise({ type: 'bandpass', freq: 900, q: 0.5, dur: 0.4, gain: 0.45 });
    this._noise({ type: 'highpass', freq: 2000, dur: 0.25, gain: 0.2 });
  }

  fuse() {
    this._noise({ type: 'highpass', freq: 3200, dur: 1.3, gain: 0.16 });
  }

  explosion() {
    if (!this.ctx) return;
    this._noise({ type: 'lowpass', freq: 130, q: 0.4, dur: 1.1, gain: 1.0 });
    this._noise({ type: 'lowpass', freq: 500, q: 0.4, dur: 0.35, gain: 0.5 });
    this._tone({ freq: 48, dur: 0.9, gain: 0.6, type: 'sine' });
  }

  click() {
    this._noise({ type: 'bandpass', freq: 1900, q: 2.5, dur: 0.05, gain: 0.35 });
  }

  pop() {
    this._tone({ freq: 820, dur: 0.06, gain: 0.12, type: 'square' });
  }

  // ----------------------------------------------------------
  // Generative ambient music
  // ----------------------------------------------------------

  _scheduleMusic(delaySec) {
    if (this._musicTimer) clearTimeout(this._musicTimer);
    this._musicTimer = setTimeout(() => {
      this._playPhrase();
      this._scheduleMusic(22 + Math.random() * 30);
    }, delaySec * 1000);
  }

  _playPhrase() {
    if (!this.ctx || !this.musicOn) return;
    const n = 3 + (Math.random() * 4) | 0;
    let when = 0;
    let last = (Math.random() * NOTES.length) | 0;
    for (let i = 0; i < n; i++) {
      // wander the scale instead of jumping randomly — sounds calmer
      last = Math.max(0, Math.min(NOTES.length - 1, last + ((Math.random() * 3) | 0) - 1));
      const freq = NOTES[last] * (Math.random() < 0.3 ? 0.5 : 1);
      const startIn = when;
      setTimeout(() => {
        this._tone({ freq, dur: 3.2, gain: 0.05, attack: 0.9, dest: this.musicGain });
        this._tone({ freq: freq * 2.003, dur: 2.6, gain: 0.018, attack: 1.1, dest: this.musicGain });
      }, startIn * 1000);
      when += 0.9 + Math.random() * 1.1;
    }
  }
}

// ---- entities.js ----
// ============================================================
// Entities — falling sand/gravel and primed TNT (with chained
// explosions, knockback, crater carving and debris particles).
// ============================================================






const GRAVITY_ENT = 30;

class Entities {
  constructor({ scene, world, particles, audio, material }) {
    this.scene = scene;
    this.world = world;
    this.particles = particles;
    this.audio = audio;
    this.material = material;
    this.list = [];
    this.geoCache = new Map();
    this.onExplosion = null; // set by main (camera shake)
    this.getPlayer = null;   // set by main (knockback)

    this.flashMat = new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0.85, depthWrite: false,
    });
  }

  setWorld(world) { this.world = world; this.clear(); }

  geometryFor(id) {
    let g = this.geoCache.get(id);
    if (!g) { g = buildBlockGeometry(id); this.geoCache.set(id, g); }
    return g;
  }

  makeMesh(id) {
    const mesh = new THREE.Mesh(this.geometryFor(id), this.material);
    this.scene.add(mesh);
    return mesh;
  }

  // ----------------------------------------------------------
  // Falling blocks (sand / gravel)
  // ----------------------------------------------------------

  spawnFallingBlock(x, y, z, id) {
    if (this.list.length > 80) return; // sanity cap
    this.world.setBlock(x, y, z, B.AIR, { silent: false });
    const mesh = this.makeMesh(id);
    mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
    this.list.push({ type: 'falling', id, mesh, vy: 0 });
  }

  // ----------------------------------------------------------
  // TNT
  // ----------------------------------------------------------

  igniteTNT(x, y, z, fuse = 1.5) {
    this.world.setBlock(x, y, z, B.AIR, { silent: true });
    const mesh = this.makeMesh(B.TNT);
    mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
    const flash = new THREE.Mesh(this.geometryFor(B.TNT), this.flashMat);
    flash.scale.setScalar(1.02);
    flash.visible = false;
    mesh.add(flash);
    this.list.push({ type: 'tnt', mesh, flash, fuse, age: 0 });
    if (this.audio) this.audio.fuse();
  }

  explode(cx, cy, cz, radius = 4.4) {
    const removedIds = [];
    const seed = (cx * 341 + cy * 173 + cz * 51) | 0;
    for (let dy = -radius - 1; dy <= radius + 1; dy++) {
      for (let dz = -radius - 1; dz <= radius + 1; dz++) {
        for (let dx = -radius - 1; dx <= radius + 1; dx++) {
          const x = Math.round(cx + dx), y = Math.round(cy + dy), z = Math.round(cz + dz);
          if (y < 1 || y >= WORLD_H) continue;
          const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
          // jagged crater edge
          const edge = radius * (0.82 + hf(hash3(x, y, z, seed)) * 0.35);
          if (d > edge) continue;
          const id = this.world.getBlock(x, y, z);
          if (id === B.AIR || id === B.WATER) continue;
          const def = BLOCKS[id];
          if (!def || def.hardness === Infinity || id === B.OBSIDIAN) continue;
          if (id === B.TNT) {
            this.igniteTNT(x, y, z, 0.25 + Math.random() * 0.65);
            continue;
          }
          this.world.setBlock(x, y, z, B.AIR);
          if (removedIds.length < 24) removedIds.push(id);
        }
      }
    }

    if (this.particles && removedIds.length) {
      this.particles.spawnExplosion(cx, cy, cz, removedIds);
    }
    if (this.audio) this.audio.explosion();

    // knockback
    const player = this.getPlayer ? this.getPlayer() : null;
    if (player) {
      const px = player.pos.x - cx, py = player.pos.y + 0.9 - cy, pz = player.pos.z - cz;
      const d = Math.sqrt(px * px + py * py + pz * pz);
      const range = radius * 2.1;
      if (d < range && d > 0.001) {
        const f = (1 - d / range) * 17;
        player.vel.x += (px / d) * f;
        player.vel.y += (py / d) * f * 0.6 + f * 0.25;
        player.vel.z += (pz / d) * f;
      }
    }
    if (this.onExplosion) this.onExplosion(cx, cy, cz);
  }

  // ----------------------------------------------------------
  // Update
  // ----------------------------------------------------------

  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const e = this.list[i];

      if (e.type === 'falling') {
        e.vy -= GRAVITY_ENT * dt;
        e.mesh.position.y += e.vy * dt;
        const bx = Math.floor(e.mesh.position.x);
        const bz = Math.floor(e.mesh.position.z);
        const below = Math.floor(e.mesh.position.y - 0.5);
        const belowId = this.world.getBlock(bx, below, bz);
        if (belowId !== B.AIR && BLOCKS[belowId].solid) {
          // settle on top of the solid block (replaces grass/flowers)
          this.world.setBlock(bx, below + 1, bz, e.id);
          this.despawn(i);
        } else if (e.mesh.position.y < -10) {
          this.despawn(i);
        }
      } else if (e.type === 'tnt') {
        e.fuse -= dt;
        e.age += dt;
        const rate = e.fuse < 0.5 ? 14 : 7;
        e.flash.visible = Math.floor(e.age * rate) % 2 === 0;
        const pulse = 1 + Math.max(0, 0.5 - e.fuse) * 0.5;
        e.mesh.scale.setScalar(Math.min(pulse, 1.25));
        if (e.fuse <= 0) {
          const p = e.mesh.position;
          const px = p.x, py = p.y, pz = p.z;
          this.despawn(i);
          this.explode(px, py, pz);
        }
      }
    }
  }

  despawn(i) {
    const e = this.list[i];
    this.scene.remove(e.mesh);
    this.list.splice(i, 1);
  }

  clear() {
    for (const e of this.list) this.scene.remove(e.mesh);
    this.list = [];
  }
}

// ============================================================
// Play Mini integration — replaces the upstream main.js + ui.js.
// No title screen, no menus: launches straight into the world,
// music comes from the shared audioManager (mindcraft.mp3),
// UI is restyled to the Play Mini glass design (Inter font).
// ============================================================

const CRAFT_WORLD_KEY = 'tss_mini_blocks_world';
const CRAFT_REACH = 5;

const craftLoadJSON = (k) => {
  try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; }
};
const craftSaveJSON = (k, v) => {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
};

const game = {
  rawGamepad: true,
  scene: null, camera: null, renderer: null, world: null, player: null,
  state: 'loading',
  pickerOpen: false,

  // ----------------------------------------------------------
  // Lifecycle
  // ----------------------------------------------------------

  init: function() {
    this.canvas = document.getElementById('webglCanvas');
    this.isTouch = !!(navigator.maxTouchPoints > 0 || window.matchMedia('(pointer: coarse)').matches);
    this.settings = { render: this.isTouch ? 5 : 7, fov: 73, sens: 100, bob: true, smooth: true };

    this.renderer = new THREE.WebGLRenderer({
      canvas: this.canvas, antialias: false, powerPreference: 'high-performance'
    });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.autoClear = true;

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(this.settings.fov, window.innerWidth / window.innerHeight, 0.1, 1500);
    this.camera.rotation.order = 'YXZ';
    this.fovCurrent = this.settings.fov;

    this.uniforms = { uDayLight: { value: 1 }, uMinLight: { value: 0.05 } };

    const atlasTex = new THREE.CanvasTexture(buildAtlasCanvas());
    atlasTex.magFilter = THREE.NearestFilter;
    atlasTex.minFilter = THREE.NearestFilter;
    atlasTex.generateMipmaps = false;
    this.atlasTex = atlasTex;

    const waterTex = new THREE.CanvasTexture(buildWaterCanvas());
    waterTex.magFilter = THREE.NearestFilter;
    waterTex.minFilter = THREE.NearestFilter;
    waterTex.generateMipmaps = false;
    waterTex.wrapS = waterTex.wrapT = THREE.RepeatWrapping;
    this.waterTex = waterTex;

    this.materials = {
      solid: this.makeWorldMaterial({ map: atlasTex, alphaTest: 0.5 }),
      water: this.makeWorldMaterial({
        map: waterTex, transparent: true, opacity: 0.72, depthWrite: false, side: THREE.DoubleSide
      })
    };

    this.outline = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(1.002, 1.002, 1.002)),
      new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.75 })
    );
    this.outline.visible = false;
    this.scene.add(this.outline);

    this.crackTextures = buildCrackCanvases().map((c) => {
      const t = new THREE.CanvasTexture(c);
      t.magFilter = t.minFilter = THREE.NearestFilter;
      t.generateMipmaps = false;
      return t;
    });
    this.crackMat = new THREE.MeshBasicMaterial({
      map: this.crackTextures[0], transparent: true, depthWrite: false,
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
    });
    this.crack = new THREE.Mesh(new THREE.BoxGeometry(1.004, 1.004, 1.004), this.crackMat);
    this.crack.visible = false;
    this.scene.add(this.crack);

    this.audio = new AudioFX();
    this.audio.setVolume(0.55);
    this.audio.setMusicOn(false);

    this.sky = new Sky(this.scene, this.uniforms);
    this.sky.setViewDistance(this.settings.render);
    this.sky.setCloudsVisible(true);

    this.particles = new Particles(this.scene, this.materials.solid);
    this.entities = new Entities({
      scene: this.scene, world: null, particles: this.particles,
      audio: this.audio, material: this.materials.solid
    });
    this.entities.getPlayer = () => this.player;
    this.entities.onExplosion = (x, y, z) => {
      this.shakeT = Math.max(this.shakeT, 0.45);
      const d = this.player.pos.distanceTo(new THREE.Vector3(x, y, z));
      if (d < 7) this.flashDamage();
      GamepadManager.rumble(220, 0.8, 0.5);
    };

    this.handScene = new THREE.Scene();
    this.handCamera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.01, 10);
    this.handGroup = new THREE.Group();
    this.handScene.add(this.handGroup);
    this.heldMesh = null;
    this.heldId = null;
    this.heldGeoCache = new Map();
    this.swingT = 1;
    this.dipT = 1;

    this.saveData = craftLoadJSON(CRAFT_WORLD_KEY);
    this.hotbar = [...DEFAULT_HOTBAR];
    this.selected = 0;
    if (this.saveData && Array.isArray(this.saveData.hotbar) && this.saveData.hotbar.length === 9) {
      this.hotbar = this.saveData.hotbar.slice();
    }
    if (this.saveData && Number.isInteger(this.saveData.slot)) {
      this.selected = Math.max(0, Math.min(8, this.saveData.slot));
    }

    this.state = 'loading';
    this.pickerOpen = false;
    this.mining = false;
    this.miningCell = null;
    this.miningProgress = 0;
    this.placeTimer = 0;
    this.rmbHeld = false;
    this.shakeT = 0;
    this.sprintLatch = false;
    this.lastW = 0;
    this.lastSpace = 0;
    this.autosaveTimer = 0;
    this._gpMining = false;
    this._gpPlaceAt = 0;
    this._touchScreen = null;

    this.icons = this.makeIcons();
    this.buildUI();
    this.updateHotbarUI();

    const seed = (this.saveData && typeof this.saveData.seed === 'number')
      ? (this.saveData.seed >>> 0) : ((Math.random() * 0xffffffff) >>> 0);
    this.createWorld(seed, this.saveData && this.saveData.edits, this.saveData && this.saveData.player);

    // pre-generate a slice of the spawn area so the bar starts moving
    for (let i = 0; i < 6; i++) this.world.update(this.player.pos.x, this.player.pos.z, 24);

    this.camera.position.set(this.player.pos.x, this.player.pos.y + 14, this.player.pos.z + 20);
    this.camera.lookAt(this.player.pos.x, this.player.pos.y + 2, this.player.pos.z);

    this.attachTouch();
    this._onResize = () => {
      this.renderer.setSize(window.innerWidth, window.innerHeight);
      this.camera.aspect = window.innerWidth / window.innerHeight;
      this.camera.updateProjectionMatrix();
      this.handCamera.aspect = window.innerWidth / window.innerHeight;
      this.handCamera.updateProjectionMatrix();
      // Wait a frame so the touch pad has its new size measured
      requestAnimationFrame(() => this.layoutHotbar());
    };
    window.addEventListener('resize', this._onResize);
    setTimeout(() => this.layoutHotbar(), 600);
  },

  makeWorldMaterial: function(params) {
    const mat = new THREE.MeshBasicMaterial({ vertexColors: true, ...params });
    const uniforms = this.uniforms;
    mat.onBeforeCompile = (shader) => {
      shader.uniforms.uDayLight = uniforms.uDayLight;
      shader.uniforms.uMinLight = uniforms.uMinLight;
      shader.fragmentShader = shader.fragmentShader
        .replace(
          '#include <common>',
          'uniform float uDayLight;\nuniform float uMinLight;\n#include <common>'
        )
        .replace(
          '#include <color_fragment>',
          ['#if defined( USE_COLOR )',
           '  vec3 mcLight = max(vec3(vColor.r * uDayLight), vec3(1.0, 0.82, 0.55) * vColor.g);',
           '  mcLight = max(mcLight, vec3(uMinLight));',
           '  mcLight = pow(mcLight, vec3(0.4545));',
           '  diffuseColor.rgb *= mcLight;',
           '#endif'].join('\n')
        );
