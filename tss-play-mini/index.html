      ctx.beginPath();
      ctx.moveTo(0, -20.4);
      ctx.lineTo(0, -9.8);
      ctx.stroke();
      ctx.fillStyle = "rgba(0,10,14,0.45)";
      ctx.fillRect(-5.6, -13.8, 3.4, 0.9);
      ctx.fillRect(2.2, -13.8, 3.4, 0.9);
      ctx.fillRect(-5.6, -12, 3.4, 0.9);
      ctx.fillRect(2.2, -12, 3.4, 0.9);
      ctx.fillStyle = "rgba(0,0,0,0.18)";
      ctx.beginPath();
      ctx.moveTo(-9.8, 15);
      ctx.quadraticCurveTo(0, 13.4, 9.8, 15);
      ctx.lineTo(9, 21.8);
      ctx.quadraticCurveTo(0, 23.2, -9, 21.8);
      ctx.closePath();
      ctx.fill();
    } else {
      const dk = ctx.createLinearGradient(0, -23, 0, 23);
      dk.addColorStop(0, "#181a24");
      dk.addColorStop(0.5, "#0c0d13");
      dk.addColorStop(1, "#13151e");
      ctx.fillStyle = dk;
      ctx.fillRect(-12, -23.5, 24, 14.1);
      ctx.fillRect(-12, 13.6, 24, 10.5);
      ctx.strokeStyle = "rgba(255,255,255,0.2)";
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(-11.5, -9.4);
      ctx.lineTo(11.5, -9.4);
      ctx.moveTo(-11.5, 13.6);
      ctx.lineTo(11.5, 13.6);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.beginPath();
      ctx.moveTo(0, -21);
      ctx.lineTo(0, -10.2);
      ctx.stroke();
    }
    ctx.restore();

    ctx.fillStyle = sleek ? "#0a4550" : "#14161d";
    this.rr(ctx, -13.5, -6.4, 3, 2.1, 1);
    ctx.fill();
    this.rr(ctx, 10.5, -6.4, 3, 2.1, 1);
    ctx.fill();

    const canopy = () => {
      ctx.beginPath();
      ctx.moveTo(-8.2, -6.8);
      ctx.quadraticCurveTo(0, -9.2, 8.2, -6.8);
      ctx.lineTo(8.8, 10.4);
      ctx.quadraticCurveTo(0, 12.8, -8.8, 10.4);
      ctx.closePath();
    };
    const glass = ctx.createLinearGradient(0, -8, 0, 13);
    glass.addColorStop(0, sleek ? "#0d2c38" : "#0a0f18");
    glass.addColorStop(0.5, sleek ? "#123f4c" : "#101826");
    glass.addColorStop(1, sleek ? "#0a222c" : "#080c14");
    canopy();
    ctx.fillStyle = glass;
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.5)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.save();
    canopy();
    ctx.clip();
    ctx.rotate(-0.45);
    ctx.fillStyle = "rgba(190,240,255,0.13)";
    ctx.fillRect(-14, -6.5, 28, 2.4);
    ctx.fillStyle = "rgba(190,240,255,0.07)";
    ctx.fillRect(-14, -2.6, 28, 1.2);
    ctx.restore();

    const roofG = ctx.createLinearGradient(-7, 0, 7, 0);
    if (sleek) {
      roofG.addColorStop(0, "#07404b");
      roofG.addColorStop(0.5, "#1cc3d4");
      roofG.addColorStop(1, "#063740");
    } else {
      roofG.addColorStop(0, "#0a0c12");
      roofG.addColorStop(0.5, "#272c37");
      roofG.addColorStop(1, "#080a10");
    }
    this.rr(ctx, -7.2, -0.8, 14.4, 7.8, 3);
    ctx.fillStyle = roofG;
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.lineWidth = 0.8;
    ctx.stroke();

    if (sleek) {
      ctx.fillStyle = "#04252c";
      this.rr(ctx, -12.4, 16.2, 24.8, 3.8, 1.8);
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.55)";
      ctx.lineWidth = 0.8;
      ctx.stroke();
      ctx.fillStyle = "rgba(120,240,255,0.4)";
      ctx.fillRect(-11.4, 16.9, 22.8, 0.8);
      ctx.fillStyle = "#062f38";
      this.rr(ctx, -13.2, 15.4, 2.4, 5.4, 1);
      ctx.fill();
      this.rr(ctx, 10.8, 15.4, 2.4, 5.4, 1);
      ctx.fill();
    } else {
      ctx.strokeStyle = "#191b22";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(-5.5, -22);
      ctx.lineTo(-5.5, -24.4);
      ctx.moveTo(5.5, -22);
      ctx.lineTo(5.5, -24.4);
      ctx.stroke();
      ctx.fillStyle = "#20222b";
      this.rr(ctx, -7.6, -25.4, 15.2, 2, 1);
      ctx.fill();

      const phase = opt.phase || 0;
      this.rr(ctx, -7.8, 0.4, 15.6, 3.6, 1.5);
      ctx.fillStyle = "#0b0c12";
      ctx.fill();
      ctx.save();
      if (!phase) { ctx.shadowBlur = 12; ctx.shadowColor = "#FF1744"; }
      ctx.fillStyle = phase ? "#5c0f1d" : "#FF2949";
      this.rr(ctx, -7.2, 1, 6.3, 2.4, 1);
      ctx.fill();
      ctx.shadowBlur = 0;
      if (phase) { ctx.shadowBlur = 12; ctx.shadowColor = "#2979FF"; }
      ctx.fillStyle = phase ? "#3f8cff" : "#0d1e52";
      this.rr(ctx, 0.9, 1, 6.3, 2.4, 1);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = "#171821";
      ctx.fillRect(-0.9, 1, 1.8, 2.4);
    }

    ctx.save();
    ctx.shadowBlur = 7;
    ctx.shadowColor = "#FFF3B0";
    ctx.fillStyle = "#fff6cf";
    if (sleek) {
      ctx.beginPath();
      ctx.moveTo(-8.9, -18.4);
      ctx.lineTo(-3.6, -21.2);
      ctx.lineTo(-3.2, -19.7);
      ctx.lineTo(-8.2, -17.1);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(8.9, -18.4);
      ctx.lineTo(3.6, -21.2);
      ctx.lineTo(3.2, -19.7);
      ctx.lineTo(8.2, -17.1);
      ctx.closePath();
      ctx.fill();
    } else {
      this.rr(ctx, -9.3, -21.2, 4, 1.8, 0.8);
      ctx.fill();
      this.rr(ctx, 5.3, -21.2, 4, 1.8, 0.8);
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    if (opt.braking) { ctx.shadowBlur = 12; ctx.shadowColor = "#FF1744"; }
    ctx.fillStyle = opt.braking ? "#FF2440" : "#8c1424";
    if (sleek) {
      this.rr(ctx, -10, 20.4, 7.2, 1.9, 0.9);
      ctx.fill();
      this.rr(ctx, 2.8, 20.4, 7.2, 1.9, 0.9);
      ctx.fill();
    } else {
      this.rr(ctx, -10.2, 20.6, 5.6, 2, 0.9);
      ctx.fill();
      this.rr(ctx, 4.6, 20.6, 5.6, 2, 0.9);
      ctx.fill();
    }
    ctx.restore();
  },
  srand: function(a, b) {
    const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
    return n - Math.floor(n);
  },

  buildTextures: function() {
    if (this._texAsphalt) return;

    const asphalt = document.createElement('canvas');
    asphalt.width = asphalt.height = 96;
    let g = asphalt.getContext('2d');
    g.fillStyle = '#17171d';
    g.fillRect(0, 0, 96, 96);
    for (let y = 0; y < 96; y += 2) {
      for (let x = 0; x < 96; x += 2) {
        const v = this.srand(x, y);
        if (v > 0.82) g.fillStyle = 'rgba(255,255,255,0.05)';
        else if (v > 0.62) g.fillStyle = 'rgba(210,220,255,0.03)';
        else if (v < 0.1) g.fillStyle = 'rgba(0,0,0,0.28)';
        else if (v < 0.24) g.fillStyle = 'rgba(0,0,0,0.14)';
        else continue;
        g.fillRect(x, y, 2, 2);
      }
    }
    for (let i = 0; i < 7; i++) {
      const px = this.srand(i, 51) * 96, py = this.srand(i, 52) * 96;
      const r = 5 + this.srand(i, 53) * 9;
      g.fillStyle = this.srand(i, 54) > 0.5 ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.12)';
      g.beginPath();
      g.arc(px, py, r, 0, Math.PI * 2);
      g.fill();
    }
    g.strokeStyle = 'rgba(0,0,0,0.3)';
    g.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      let cx2 = this.srand(i, 61) * 96, cy2 = this.srand(i, 62) * 96;
      g.beginPath();
      g.moveTo(cx2, cy2);
      for (let s = 0; s < 5; s++) {
        cx2 += (this.srand(i * 7 + s, 63) - 0.5) * 16;
        cy2 += 4 + this.srand(i * 7 + s, 64) * 9;
        g.lineTo(cx2, cy2);
      }
      g.stroke();
    }
    this._texAsphalt = asphalt;

    const ground = document.createElement('canvas');
    ground.width = ground.height = 128;
    g = ground.getContext('2d');
    g.fillStyle = '#120b20';
    g.fillRect(0, 0, 128, 128);
    for (let y = 0; y < 128; y += 2) {
      for (let x = 0; x < 128; x += 2) {
        const v = this.srand(x + 300, y);
        if (v > 0.88) g.fillStyle = 'rgba(148,110,255,0.06)';
        else if (v > 0.72) g.fillStyle = 'rgba(70,50,120,0.10)';
        else if (v < 0.12) g.fillStyle = 'rgba(0,0,0,0.22)';
        else continue;
        g.fillRect(x, y, 2, 2);
      }
    }
    g.strokeStyle = 'rgba(124,77,255,0.07)';
    g.lineWidth = 1;
    for (let i = 0; i <= 128; i += 32) {
      g.beginPath(); g.moveTo(i + 0.5, 0); g.lineTo(i + 0.5, 128); g.stroke();
      g.beginPath(); g.moveTo(0, i + 0.5); g.lineTo(128, i + 0.5); g.stroke();
    }
    this._texGround = ground;

    const glow = document.createElement('canvas');
    glow.width = glow.height = 96;
    g = glow.getContext('2d');
    const gr = g.createRadialGradient(48, 48, 2, 48, 48, 46);
    gr.addColorStop(0, 'rgba(255,224,130,0.28)');
    gr.addColorStop(0.5, 'rgba(255,224,130,0.10)');
    gr.addColorStop(1, 'rgba(255,224,130,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, 96, 96);
    this._texGlow = glow;
    this._pat = null;
  },

  car: null,
  trackPoints: [],
  scenery: [],
  skids: [],
  particles: [],
  flashes: [],
  score: 0,
  highScore: 0,
  gameState: "playing",
  camX: 0,
  camY: 0,
  shake: 0,
  boost: 0,
  danger: 0,
  driftBank: 0,
  driftTime: 0,
  driftMult: 1,
  offTrack: false,
  trackSeed: 0,
  speedKmh: 0,

  init: function() {
    audioManager.playMusic('drift', true);
    this.buildTextures();
    this.car = { x: 0, y: 0, heading: -Math.PI / 2, vx: 0, vy: 0, steer: 0 };
    this.trackPoints = [];
    this.scenery = [];
    this.skids = [];
    this.particles = [];
    this.flashes = [];
    this.score = 0;
    this.gameState = "playing";
    this.camX = 0;
    this.camY = -120;
    this.shake = 0;
    this.boost = 35;
    this.danger = 0;
    this.driftBank = 0;
    this.driftTime = 0;
    this.driftMult = 1;
    this.offTrack = false;
    this.trackSeed = 0;
    this.trackBase = 0;
    this.elapsed = 0;
    this.speedKmh = 0;

    let tx = 0, ty = 0;
    for (let i = 0; i < 40; i++) {
      this.trackPoints.push({ x: tx, y: ty, w: 240 });
      tx += Math.cos(-Math.PI / 2) * 38;
      ty += Math.sin(-Math.PI / 2) * 38;
    }
    this.extendTrack(70);
  },

  curveAt: function(i) {
    return Math.sin(i * 0.045) * 0.55 + Math.sin(i * 0.011 + 1.3) * 0.85 + Math.sin(i * 0.0031) * 0.6;
  },

  extendTrack: function(n) {
    for (let k = 0; k < n; k++) {
      const prev = this.trackPoints[this.trackPoints.length - 1];
      const i = ++this.trackSeed + 40;
      const a = -Math.PI / 2 + this.curveAt(i) * 0.42;
      const x = prev.x + Math.cos(a) * 38;
      const y = prev.y + Math.sin(a) * 38;
      const w = 200 + Math.sin(i * 0.07) * 35;
      this.trackPoints.push({ x: x, y: y, w: w });

      if (i % 4 === 0) {
        const nx = Math.cos(a + Math.PI / 2), ny = Math.sin(a + Math.PI / 2);
        const side = (i % 8 === 0) ? 1 : -1;
        const off = w / 2 + 46;
        const types = ["light", "building", "barrier", "building"];
        this.scenery.push({ x: x + nx * off * side, y: y + ny * off * side, type: types[i % types.length], r: 12 + (i % 3) * 5 });
      }
    }
  },

  nearestTrack: function(x, y) {
    let best = Infinity, bw = 240;
    const pts = this.trackPoints;
    const start = Math.max(0, pts.length - 240);
    for (let i = start; i < pts.length; i++) {
      const p = pts[i];
      const dx = x - p.x, dy = y - p.y;
      const d = dx * dx + dy * dy;
      if (d < best) { best = d; bw = p.w; }
    }
    return { dist: Math.sqrt(best), width: bw };
  },

  update: function(delta) {
    if (this.gameState !== "playing") return;
    const dt = Math.min(2.5, delta / 16.67);
    const c = this.car;

    const gp = GamepadManager.latest;
    const left = keysDown["ArrowLeft"] || keysDown["a"] || keysDown["A"];
    const right = keysDown["ArrowRight"] || keysDown["d"] || keysDown["D"];
    const handbrake = keysDown["ArrowDown"] || keysDown["s"] || keysDown["S"] || !!(gp && (gp.state.l2 || gp.state.l1));
    const nitroKey = keysDown["ArrowUp"] || keysDown["w"] || keysDown["W"] || keysDown[" "] || !!(gp && (gp.state.r2 || gp.state.r1));
    this._braking = handbrake;

    // Analog steering when a stick is deflected, digital otherwise
    let steerTarget = (left ? -1 : 0) + (right ? 1 : 0);
    if (gp && Math.abs(gp.state.axes[0]) > 0.1) steerTarget = Math.max(-1, Math.min(1, gp.state.axes[0] * 1.15));
    c.steer += (steerTarget - c.steer) * Math.min(1, 0.25 * dt);

    const fdx = Math.cos(c.heading), fdy = Math.sin(c.heading);
    const sdx = -fdy, sdy = fdx;
    let forward = c.vx * fdx + c.vy * fdy;
    let lateral = c.vx * sdx + c.vy * sdy;

    const nitro = nitroKey && this.boost > 0 && forward > 1;
    const maxSpeed = nitro ? 13.8 : 9.2;
    const accel = nitro ? 0.42 : 0.26;
    forward += accel * dt;
    if (forward > maxSpeed) forward = maxSpeed;
    if (forward < 0) forward = 0;

    let speed = Math.hypot(forward, lateral);
    const speedFactor = Math.min(1, speed / 3.5);
    c.heading += 0.04 * c.steer * speedFactor * (handbrake ? 1.7 : 1) * dt;

    const grip = handbrake ? 0.965 : (0.9 - speedFactor * 0.045);
    lateral *= Math.pow(grip, dt);
    forward *= Math.pow(0.998, dt);

    const near = this.nearestTrack(c.x, c.y);
    this.offTrack = near.dist > near.width / 2;
    if (this.offTrack) {
      forward *= Math.pow(0.9, dt);
      lateral *= Math.pow(0.9, dt);
      this.danger = Math.min(100, this.danger + 0.045 * delta);
      this.shake = Math.min(7, this.shake + 0.4);
      if (speed > 3 && Math.random() < 0.5) {
        this.particles.push({ x: c.x - fdx * 14, y: c.y - fdy * 14, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, life: 420, r: 3, type: "dirt" });
      }
      if (Math.random() < 0.04) audioManager.playNoise(0.1, 0.25);
    } else if (forward < 2.6 && this.elapsed > 3000) {
      this.danger = Math.min(100, this.danger + 0.028 * delta);
    } else {
      this.danger = Math.max(0, this.danger - 0.05 * delta);
    }
    this.elapsed = (this.elapsed || 0) + delta;
    if (this.danger > 40 && Math.random() < 0.015) {
      audioManager.playTone(660, 'square', 0.14, 0.05);
      setTimeout(() => audioManager.playTone(880, 'square', 0.14, 0.05), 150);
    }

    if (this.danger >= 100) {
      this.crash();
      return;
    }

    c.vx = fdx * forward + sdx * lateral;
    c.vy = fdy * forward + sdy * lateral;
    c.x += c.vx * dt;
    c.y += c.vy * dt;

    speed = Math.hypot(forward, lateral);
    this.speedKmh = Math.round(speed * 16 + (nitro ? 20 : 0));
    const driftAngle = Math.atan2(lateral, Math.abs(forward) + 0.001);
    const absDrift = Math.abs(driftAngle);

    if (absDrift > 2.35 && speed < 6 && this.driftBank > 0) {
      this.flashes.push({ text: "SPIN OUT", color: "#FF5252", life: 900, vy: -0.4, x: 0, y: 0 });
      this.driftBank = 0; this.driftTime = 0; this.driftMult = 1;
      this.shake = Math.min(12, this.shake + 8);
      audioManager.playTone(90, 'sawtooth', 0.3, 0.4, -40);
    }

    const drifting = speed > 4.2 && absDrift > 0.22 && !this.offTrack;
    if (drifting) {
      const gain = speed * absDrift * dt * 0.5;
      this.driftBank += gain;
      this.driftTime += delta;
      this.driftMult = Math.min(5, 1 + Math.floor(this.driftTime / 1100));
      this.boost = Math.min(100, this.boost + gain * 0.55);
      this.shake = Math.min(8, this.shake + absDrift * 0.4);

      const rx = c.x - fdx * 15, ry = c.y - fdy * 15;
      this.skids.push({ x: rx + sdx * 7, y: ry + sdy * 7, life: 5000 });
      this.skids.push({ x: rx - sdx * 7, y: ry - sdy * 7, life: 5000 });
      if (Math.random() < 0.6) {
        this.particles.push({ x: rx, y: ry, vx: -fdx + (Math.random() - 0.5) * 2, vy: -fdy + (Math.random() - 0.5) * 2, life: 600, r: 5, type: "smoke" });
      }
      if (Math.random() < 0.08) audioManager.playTone(150 + speed * 6, 'sawtooth', 0.1, 0.13, -40);
    } else if (this.driftBank > 0) {
      const earned = Math.floor(this.driftBank * this.driftMult);
      if (earned > 0) {
        this.score += earned;
        this.flashes.push({ text: "+" + earned + (this.driftMult > 1 ? "  x" + this.driftMult : ""), color: "#FFD740", life: 1100, vy: -0.5, x: 0, y: 0 });
        if (earned > 40) audioManager.playSFX('score');
      }
      this.driftBank = 0; this.driftTime = 0; this.driftMult = 1;
    }

    if (nitro) {
      this.boost = Math.max(0, this.boost - 0.05 * delta);
      this.shake = Math.min(9, this.shake + 0.5);
      if (Math.random() < 0.7) {
        this.particles.push({ x: c.x - fdx * 18, y: c.y - fdy * 18, vx: -fdx * 2, vy: -fdy * 2, life: 300, r: 4, type: "flame" });
      }
    }

    const lastP = this.trackPoints[this.trackPoints.length - 1];
    if (Math.hypot(c.x - lastP.x, c.y - lastP.y) < 1700) this.extendTrack(40);
    if (this.trackPoints.length > 420) { this.trackPoints.splice(0, 80); this.trackBase = (this.trackBase || 0) + 80; }
    this.scenery = this.scenery.filter(s => s.y < c.y + 1000);

    for (let i = this.skids.length - 1; i >= 0; i--) {
      this.skids[i].life -= delta;
      if (this.skids[i].life <= 0) this.skids.splice(i, 1);
    }
    if (this.skids.length > 700) this.skids.splice(0, this.skids.length - 700);

    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.type === "smoke") { p.r += 0.25 * dt; p.vx *= 0.94; p.vy *= 0.94; }
      p.life -= delta;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
    if (this.particles.length > 220) this.particles.splice(0, this.particles.length - 220);

    for (let i = this.flashes.length - 1; i >= 0; i--) {
      this.flashes[i].life -= delta;
      this.flashes[i].y += (this.flashes[i].vy || -0.4) * dt;
      if (this.flashes[i].life <= 0) this.flashes.splice(i, 1);
    }

    this.shake *= Math.pow(0.86, dt);

    const tx = c.x + c.vx * 7;
    const ty = c.y + c.vy * 7 - 50;
    this.camX += (tx - this.camX) * Math.min(1, 0.09 * dt);
    this.camY += (ty - this.camY) * Math.min(1, 0.09 * dt);
  },

  crash: function() {
    this.gameState = "over";
    const c = this.car;
    for (let i = 0; i < 26; i++) {
      this.particles.push({ x: c.x, y: c.y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8, life: 700, r: 4 + Math.random() * 4, type: "flame" });
    }
    this.shake = 16;
    if (this.score > this.highScore) this.highScore = this.score;
    audioManager.stopMusic();
    audioManager.playSFX('explosion');
    audioManager.playSFX('gameover');
  },

  rr: function(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  },

  drawCop: function(ctx) {
    const c = this.car;
    const d = 300 - this.danger * 2.4;
    const px = c.x - Math.cos(c.heading) * d;
    const py = c.y - Math.sin(c.heading) * d;
    const phase = Math.floor(performance.now() / 450) % 2;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(c.heading + Math.PI / 2);

    const beam = ctx.createLinearGradient(0, -22, 0, -112);
    beam.addColorStop(0, "rgba(255,249,196,0.18)");
    beam.addColorStop(1, "rgba(255,249,196,0)");
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(-7, -22); ctx.lineTo(-32, -112); ctx.lineTo(32, -112); ctx.lineTo(7, -22);
    ctx.closePath(); ctx.fill();

    ctx.save();
    ctx.shadowBlur = 16;
    ctx.shadowColor = phase ? "#FF1744" : "#2979FF";
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    this.rr(ctx, -12, -21, 24, 42, 9);
    ctx.fill();
    ctx.restore();
    this.drawVehicle(ctx, 'police', { phase: phase });
    ctx.restore();
  },

  drawCar: function(ctx) {
    const c = this.car;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.heading + Math.PI / 2);

    const beam = ctx.createLinearGradient(0, -22, 0, -132);
    beam.addColorStop(0, "rgba(255,249,196,0.26)");
    beam.addColorStop(1, "rgba(255,249,196,0)");
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(-8, -22); ctx.lineTo(-40, -132); ctx.lineTo(40, -132); ctx.lineTo(8, -22);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = "rgba(0,0,0,0.35)";
    this.rr(ctx, -13, -20, 26, 44, 8);
    ctx.fill();

    ctx.save();
    ctx.shadowBlur = 18; ctx.shadowColor = "#18FFFF";
    ctx.fillStyle = "rgba(24,255,255,0.30)";
    this.rr(ctx, -12, -21, 24, 42, 9);
    ctx.fill();
    ctx.restore();
    this.drawVehicle(ctx, 'player', { steer: c.steer, braking: this._braking });
    ctx.restore();
  },

  drawCity: function(ctx, w, base) {
    const par = this.camX * 0.12;
    const first = Math.floor((par - 70) / 70);
    const last = Math.ceil((par + w + 70) / 70);
    for (let i = first; i <= last; i++) {
      const s = ((i % 17) + 17) % 17;
      const bh = 30 + ((s * 41) % 70);
      const bw = 44 + ((s * 13) % 16);
      const bx = i * 70 - par;
      ctx.fillStyle = "#110a24";
      ctx.fillRect(bx, base - bh, bw - 8, bh);
      ctx.fillStyle = "rgba(150,110,255,0.45)";
      ctx.fillRect(bx, base - bh, bw - 8, 2);
      ctx.fillStyle = "rgba(255,184,92,0.45)";
      let wrow = 0;
      for (let wy = base - bh + 8; wy < base - 7; wy += 11, wrow++) {
        let wcol = 0;
        for (let wx = bx + 5; wx < bx + bw - 14; wx += 10, wcol++) {
          if (((s * 5 + wcol * 3 + wrow * 7) % 5) < 2) ctx.fillRect(wx, wy, 3, 5);
        }
      }
    }
  },

  // The world renders into a low-res buffer that's blown up with hard
  // pixels: the vector track and cars become a cohesive 16-bit scene, and the
  // huge stroked track costs a fraction of the fill rate
  draw: function(ctx) {
    const w = canvas.width, h = canvas.height;
    const S = PIX.scaleFor();
    const bw = Math.ceil(w / S), bh = Math.ceil(h / S);
    if (!this._lo || this._lo.width !== bw || this._lo.height !== bh) {
      this._lo = document.createElement('canvas');
      this._lo.width = bw; this._lo.height = bh;
      this._loCtx = this._lo.getContext('2d', { alpha: false });
      this._pat = null; // patterns belong to the context that made them
    }
    const g = this._loCtx;
    g.setTransform(1 / S, 0, 0, 1 / S, 0, 0);
    g.imageSmoothingEnabled = true;
    this.drawWorld(g, w, h);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this._lo, 0, 0, bw * S, bh * S);
    this.drawHud(ctx, w, h);
  },

  drawWorld: function(ctx, w, h) {
    // On short landscape screens the car sits mid-screen, clear of the gauges
    const camYF = w > h * 1.3 && hudBottomInset() > 0 ? 0.5 : 0.62;
    const sx = (Math.random() - 0.5) * this.shake;
    const sy = (Math.random() - 0.5) * this.shake;

    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, "#090614");
    sky.addColorStop(0.5, "#1a0e30");
    sky.addColorStop(1, "#2a1240");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    const horizon = h * 0.4;
    const dstars = getEvenStarfield('drift-sky', 58, w, horizon, 7);
    for (const s of dstars) {
      const tw = 0.25 + 0.5 * (0.5 + 0.5 * Math.sin(performance.now() / 850 + s.phase));
      ctx.fillStyle = "rgba(255,255,255," + tw.toFixed(2) + ")";
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    const sunGlow = ctx.createRadialGradient(w / 2, horizon, 18, w / 2, horizon, 155);
    sunGlow.addColorStop(0, "rgba(255,93,162,0.33)");
    sunGlow.addColorStop(1, "rgba(255,93,162,0)");
    ctx.fillStyle = sunGlow;
    ctx.fillRect(0, 0, w, h);
    ctx.save();
    ctx.beginPath(); ctx.arc(w / 2, horizon, 76, 0, Math.PI * 2); ctx.clip();
    const sun = ctx.createLinearGradient(0, horizon - 76, 0, horizon + 76);
    sun.addColorStop(0, "#FFE65A");
    sun.addColorStop(0.5, "#FF6FA8");
    sun.addColorStop(1, "#B22A8E");
    ctx.fillStyle = sun;
    ctx.fillRect(w / 2 - 80, horizon - 80, 160, 160);
    ctx.fillStyle = "#1a0e30";
    for (let i = 0; i < 6; i++) ctx.fillRect(w / 2 - 80, horizon + 8 + i * 11, 160, 3 + i * 1.4);
    ctx.restore();
    this.drawCity(ctx, w, horizon + 76);
    ctx.fillStyle = "rgba(124,77,255,0.55)";
    ctx.fillRect(0, horizon + 76, w, 2);

    if (!this._pat && this._texAsphalt) {
      this._pat = {
        asphalt: ctx.createPattern(this._texAsphalt, 'repeat'),
        ground: ctx.createPattern(this._texGround, 'repeat')
      };
    }

    // Textured ground plane below the skyline, anchored to the world
    const groundTop = horizon + 78;
    const gg = ctx.createLinearGradient(0, groundTop, 0, h);
    gg.addColorStop(0, "#1a1130");
    gg.addColorStop(0.35, "#140c24");
    gg.addColorStop(1, "#0b0715");
    ctx.fillStyle = gg;
    ctx.fillRect(0, groundTop, w, h - groundTop);
    if (this._pat) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, groundTop, w, h - groundTop);
      ctx.clip();
      ctx.translate(w / 2 - this.camX + sx, h * camYF - this.camY + sy);
      ctx.fillStyle = this._pat.ground;
      ctx.fillRect(this.camX - w, this.camY - h, w * 2, h * 2);
      ctx.restore();
    }

    ctx.save();
    ctx.translate(w / 2 - this.camX + sx, h * camYF - this.camY + sy);

    const pts = this.trackPoints;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // Only trace the stretch of track near the camera
    const vcx = this.camX, vcy = this.camY - h * (camYF - 0.5);
    const reach = Math.max(w, h) * 0.85 + 180;
    let i0 = pts.length, i1 = -1;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      if (Math.abs(p.x - vcx) < reach && Math.abs(p.y - vcy) < reach) { if (i < i0) i0 = i; i1 = i; }
    }
    i0 = Math.max(0, i0 - 2); i1 = Math.min(pts.length - 1, i1 + 2);
    const tracePath = () => {
      ctx.beginPath();
      for (let i = i0; i <= i1; i++) { const p = pts[i]; if (i === i0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }
    };

    ctx.save();
    ctx.strokeStyle = "rgba(4,5,9,0.5)";
    ctx.shadowBlur = 20; ctx.shadowColor = "rgba(0,0,0,0.85)";
    ctx.lineWidth = 266;
    tracePath();
    ctx.stroke();
    ctx.restore();

    // Grey gravel shoulders with a darker packed inner band
    tracePath();
    ctx.strokeStyle = "#4c4d54";
    ctx.lineWidth = 252;
    ctx.stroke();
    if (this._pat) {
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.strokeStyle = this._pat.asphalt;
      ctx.stroke();
      ctx.restore();
    }
    ctx.strokeStyle = "#2d2e34";
    ctx.lineWidth = 240;
    ctx.stroke();

    // Dark edge seam, then the asphalt body
    ctx.strokeStyle = "#0e0e13";
    ctx.lineWidth = 234;
    ctx.stroke();
    ctx.strokeStyle = this._pat ? this._pat.asphalt : "#191920";
    ctx.lineWidth = 226;
    ctx.stroke();

    // White fog lines inset from each edge
    ctx.strokeStyle = "rgba(224,230,237,0.75)";
    ctx.lineWidth = 212;
    ctx.stroke();
    ctx.strokeStyle = this._pat ? this._pat.asphalt : "#191920";
    ctx.lineWidth = 206;
    ctx.stroke();

    // Tire-polished lanes: two darker wear bands along the driving lines
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = "#101015";
    ctx.lineWidth = 152;
    ctx.stroke();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = "#1c1c23";
    ctx.lineWidth = 60;
    ctx.stroke();
    ctx.restore();

    for (let i = 0; i < this.skids.length; i++) {
      const s = this.skids[i];
      ctx.globalAlpha = Math.min(0.6, s.life / 5000 * 0.6);
      ctx.fillStyle = "#050507";
      ctx.beginPath();
      ctx.arc(s.x, s.y, 3.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.strokeStyle = "rgba(255,238,130,0.9)";
    ctx.shadowBlur = 10; ctx.shadowColor = "#FFEB3B";
    ctx.lineWidth = 5;
    ctx.setLineDash([26, 30]);
    // Keep the dash phase pinned to the world as the traced range slides
    ctx.lineDashOffset = (((this.trackBase || 0) + i0) * 38) % 56;
    tracePath();
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
    ctx.restore();

    for (let i = 0; i < this.scenery.length; i++) {
      const s = this.scenery[i];
      if (s.type === "building") {
        const bw2 = s.r * 2.4, bh2 = s.r * 3.4;
        const wall = ctx.createLinearGradient(s.x - bw2 / 2, 0, s.x + bw2 / 2, 0);
        wall.addColorStop(0, "#1b1630");
        wall.addColorStop(0.5, "#141021");
        wall.addColorStop(1, "#0d0a17");
        ctx.fillStyle = wall;
        ctx.fillRect(s.x - bw2 / 2, s.y - bh2, bw2, bh2);
        ctx.fillStyle = "rgba(150,110,255,0.5)";
        ctx.fillRect(s.x - bw2 / 2, s.y - bh2, bw2, 2);
        ctx.fillStyle = "#2a2438";
        ctx.fillRect(s.x - 1, s.y - bh2 - 7, 2, 7);
        ctx.fillStyle = "rgba(255, 200, 90, 0.7)";
        for (let wy = 0; wy < 3; wy++) {
          for (let wx = 0; wx < 2; wx++) {
            if ((((s.x | 0) * 7 + wy * 3 + wx * 5) % 3) === 0) continue;
            ctx.fillRect(s.x - bw2 / 2 + 4 + wx * (bw2 / 2), s.y - bh2 + 5 + wy * (bh2 / 3.4), 5, 7);
          }
        }
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.fillRect(s.x - bw2 / 2, s.y - 2, bw2, 4);
      } else if (s.type === "light") {
        if (this._texGlow) ctx.drawImage(this._texGlow, s.x - 48, s.y - 44, 96, 96);
        ctx.fillStyle = "#2a2a33";
        ctx.fillRect(s.x - 2, s.y - 34, 4, 36);
        ctx.shadowBlur = 12; ctx.shadowColor = "#FFE082";
        ctx.fillStyle = "#FFE082";
        ctx.beginPath(); ctx.arc(s.x, s.y - 36, 5, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      } else {
        ctx.fillStyle = "#c62828";
        ctx.fillRect(s.x - 14, s.y - 8, 28, 10);
        ctx.fillStyle = "#eee";
        ctx.fillRect(s.x - 14, s.y - 8, 9, 10);
        ctx.fillRect(s.x + 4, s.y - 8, 9, 10);
        ctx.fillStyle = "#2a2a33";
        ctx.fillRect(s.x - 12, s.y + 2, 3, 8);
        ctx.fillRect(s.x + 9, s.y + 2, 3, 8);
      }
    }

    for (let i = 0; i < this.particles.length; i++) {
      const p = this.particles[i];
      if (p.type === "smoke") {
        ctx.globalAlpha = Math.max(0, p.life / 600) * 0.5;
        ctx.fillStyle = "#d9d9d9";
      } else if (p.type === "flame") {
        ctx.globalAlpha = Math.max(0, p.life / 700);
        ctx.fillStyle = Math.random() < 0.5 ? "#FF9100" : "#FFEA00";
      } else {
        ctx.globalAlpha = Math.max(0, p.life / 420);
        ctx.fillStyle = "#6b4a2b";
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    this.drawCop(ctx);
    this.drawCar(ctx);
    ctx.restore();
  },

  drawHud: function(ctx, w, h) {
    if (this.speedKmh > 150) {
      ctx.strokeStyle = "rgba(255,255,255,0.10)";
      ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        const r1 = 180, r2 = 360;
        ctx.beginPath();
        ctx.moveTo(w / 2 + Math.cos(ang) * r1, h / 2 + Math.sin(ang) * r1);
        ctx.lineTo(w / 2 + Math.cos(ang) * r2, h / 2 + Math.sin(ang) * r2);
        ctx.stroke();
      }
    }

    if (this.danger > 5) {
      const sirenCol = Math.floor(performance.now() / 500) % 2 ? "41,121,255" : "255,23,68";
      const v = ctx.createRadialGradient(w / 2, h / 2, h * 0.3, w / 2, h / 2, h * 0.75);
      v.addColorStop(0, "rgba(" + sirenCol + ",0)");
      v.addColorStop(1, "rgba(" + sirenCol + "," + (this.danger / 100 * 0.5).toFixed(3) + ")");
      ctx.fillStyle = v;
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "rgba(255,80,80," + (0.55 + 0.25 * Math.sin(performance.now() / 280)).toFixed(3) + ")";
      ctx.font = "bold 22px Inter";
      ctx.textAlign = "center";
      const wy = w < 700 ? 150 : 120;
      const wa = 0.6 + 0.3 * Math.sin(performance.now() / 280);
      const ws = w < 500 ? 2 : 3;
      if (this.offTrack) PIX.text(ctx, "GET BACK ON THE ROAD!", w / 2, wy, ws, "#FF5A5A", { shadow: "#4a0000", alpha: wa });
      else if (this.danger > 55) PIX.text(ctx, "THEY'RE GAINING ON YOU", w / 2, wy, ws, "#FF5A5A", { shadow: "#4a0000", alpha: wa });
    }

    drawHUDChips(ctx, [
      { label: "Score", value: this.score },
      { label: "Best", value: Math.floor(this.highScore), color: "#18FFFF" }
    ]);

    const topY = w < 700 ? 96 : 70;
    if (this.driftBank > 0) {
      const ds = w < 500 ? 3 : 4;
      PIX.drawGlow(ctx, w / 2, topY, 90, "#FFD740", 0.35);
      PIX.text(ctx, "DRIFT +" + Math.floor(this.driftBank * this.driftMult), w / 2, topY, ds, "#FFD740", { shadow: "#8a4b00", outline: "#2a1600" });
      if (this.driftMult > 1) {
        PIX.text(ctx, "x" + this.driftMult, w / 2, topY + ds * 7 + 4, 3, "#FF8A65", { shadow: "#5a1a00" });
      }
    }

    for (let i = 0; i < this.flashes.length; i++) {
      const f = this.flashes[i];
      const R = PIX.ramp(f.color || "#FFD740");
      PIX.text(ctx, f.text, w / 2, topY + 80 + f.y, 3, f.color || "#FFD740", { shadow: R.d, outline: R.o, alpha: Math.max(0, Math.min(1, f.life / 1100)) });
    }
    ctx.globalAlpha = 1;

    // Portrait: lift above the touch pad. Landscape: sit between the pad
    // (left) and the A button (right) instead of climbing up the screen
    const inset = hudBottomInset();
    const wideTouch = inset > 0 && w > h * 1.3;
    const lift = wideTouch ? SAFE.bottom : Math.max(inset, SAFE.bottom);
    const gx = wideTouch ? Math.round(w / 2 - 90) : 74, gy = h - 74 - lift, gr = 48;
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.beginPath(); ctx.arc(gx, gy, gr + 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(gx, gy, gr, Math.PI * 0.75, Math.PI * 2.25); ctx.stroke();
    const sp = Math.min(1, this.speedKmh / 240);
    ctx.strokeStyle = sp > 0.8 ? "#FF5252" : "#18FFFF";
    ctx.shadowBlur = 10; ctx.shadowColor = ctx.strokeStyle;
    ctx.beginPath(); ctx.arc(gx, gy, gr, Math.PI * 0.75, Math.PI * 0.75 + sp * Math.PI * 1.5); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "800 22px Inter";
    ctx.fillText(this.speedKmh, gx, gy + 2);
    ctx.font = "600 10px Inter";
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.fillText("KM/H", gx, gy + 18);

    const bx = gx + 66, by = h - 40 - lift, bw = Math.min(150, w - gx - 82), bh = 14;
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    this.rr(ctx, bx, by, bw, bh, 7); ctx.fill();
    ctx.save();
    if (this.boost > 30) { ctx.shadowBlur = 10; ctx.shadowColor = "#7C4DFF"; }
    ctx.fillStyle = this.boost > 30 ? "#9B6BFF" : "#4527A0";
    this.rr(ctx, bx, by, Math.max(0, bw * this.boost / 100), bh, 7); ctx.fill();
    ctx.restore();
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.textAlign = "left";
    ctx.font = "600 11px Inter";
    ctx.fillText(TouchControls.enabled ? "NITRO" : "NITRO  (Up / A)", bx, by - 6);

    const hy = by - 44;
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    this.rr(ctx, bx, hy, bw, bh, 7); ctx.fill();
    if (this.danger > 1) {
      ctx.fillStyle = this.danger > 60 ? "#FF1744" : "#FF6E40";
      this.rr(ctx, bx, hy, Math.max(6, bw * this.danger / 100), bh, 7); ctx.fill();
    }
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.fillText("HEAT", bx, hy - 6);

    if (this.gameState === "over") {
      drawGameOverScreen(ctx, {
        title: "BUSTED",
        titleColor: "#FF1744",
        score: this.score,
        isNewBest: this.score === this.highScore && this.score > 0,
        lines: ["The law caught up with you"]
      });
    }
  },

  keyDown: function(e) {
    if (this.gameState === "over" && (e.key === " " || e.key === "Enter")) this.init();
  },
  keyUp: function(e) {},
  end: function() {}
};

  // Pixel sprite sheets, same treatment as Invader's aliens (15x15 grids)
  buildSprites: function() {
    const W = 15;
    const domeHW = [2, 4, 5, 6, 6, 7, 7, 7];
    this.ghostFrames = [0, 1].map(f => {
      const rows = [];
      for (let y = 0; y < 15; y++) {

        for (let x = 0; x < W; x++) {
          let on = false;
          if (y <= 7) on = Math.abs(x - 7) <= domeHW[y];
          else if (y <= 12) on = true;
          else if (y === 13) on = ((x + f * 2) % 4) < 3;
          else on = ((x + f * 2) % 4) < 2;
          row += on ? "1" : "0";
        }
        rows.push(row);
      }
      return rows;

    this.pacFrames = [0, 0.48, 0.92].map(half => {
      const rows = [];
      for (let y = 0; y < 15; y++) {
        let row = "";
        for (let x = 0; x < W; x++) {
          const dx = x - 7, dy = y - 7;
          const dist = Math.hypot(dx, dy);
          let on = dist <= 7.35;
          if (on && half > 0 && dist > 0.8 && Math.abs(Math.atan2(dy, dx)) < half) on = false;

  drawGrid: function(ctx, rows, cx, cy, px, color) {

        if (row[c] === "1") ctx.fillRect(cx + (c - 7.5) * px, cy + (r - 7.5) * px, px + 0.5, px + 0.5);

    }

  cell: function(ctx, cx, cy, px, gx, gy, w, h, color) {

    ctx.fillRect(cx + (gx - 7.5) * px, cy + (gy - 7.5) * px, w * px + 0.5, h * px + 0.5);

  drawGhostEyes: function(ctx, cx, cy, px, dir) {
    this.cell(ctx, cx, cy, px, 3, 3.6, 3, 3.6, "#FFF");
    this.cell(ctx, cx, cy, px, 9, 3.6, 3, 3.6, "#FFF");
    const ox = dir.x * 0.9, oy = dir.y * 0.9;
    this.cell(ctx, cx, cy, px, 4 + ox, 5 + oy, 1.6, 1.8, "#1A237E");
    this.cell(ctx, cx, cy, px, 10 + ox, 5 + oy, 1.6, 1.8, "#1A237E");

  setDir: function(d) {
    if (!this.player) return;
    const p = this.player;
    p.nextDir = { x: d.x, y: d.y };
    // Reversing along the current corridor is always allowed, instantly
    if ((p.dir.x || p.dir.y) && d.x === -p.dir.x && d.y === -p.dir.y) {
      p.dir = { x: d.x, y: d.y };
    }

  nextLevel: function() {
    this.level++;
    this.setupLevel();
    audioManager.playMusic('ghost', true);
  },

  setupLevel: function() {
    this.maze = this.originalMaze.map(row => [...row]);
    this.gameState = "playing";
    this.frightenedTimer = 0;
    this.caughtTimer = 0;
    this.particles = [];
    this.floaters = [];
    this.ghostCombo = 0;
    this.speedMult = Math.min(1.22, 1 + (this.level - 1) * 0.06);

    this.layout();
    this.resetPositions();

  // Whole-pixel tiles keep the maze crisp; speeds scale with the tile so the
  // game plays the same on a phone (small tiles) as on a monitor
  layout: function() {
    const top = Math.max(52, SAFE.top + 48), bottom = 12 + SAFE.bottom;
    this.tileSize = Math.max(8, Math.floor(Math.min(canvas.width / (this.mazeWidth + 1), (canvas.height - top - bottom) / this.mazeHeight)));
    this.offsetX = Math.floor((canvas.width - this.mazeWidth * this.tileSize) / 2);
    this.offsetY = Math.floor(top + (canvas.height - top - bottom - this.mazeHeight * this.tileSize) / 2);
    this.speedScale = this.tileSize / 40;

  onResize: function() {
    if (!this.player) return;
    const t0 = this.tileSize, ox = this.offsetX, oy = this.offsetY;
    this.layout();
    const conv = (e) => {
      e.pixelX = (e.pixelX - ox) / t0 * this.tileSize + this.offsetX;
      e.pixelY = (e.pixelY - oy) / t0 * this.tileSize + this.offsetY;
    };
    conv(this.player);
    this.ghosts.forEach(conv);
    this.particles = [];

  resetPositions: function() {
    this.player = {
      x: 9, y: 13,
      pixelX: 9 * this.tileSize + this.tileSize / 2 + this.offsetX,
      pixelY: 13 * this.tileSize + this.tileSize / 2 + this.offsetY,
      dir: { x: 0, y: 0 },
      nextDir: { x: 0, y: 0 },
      speed: 0.19,
      angle: 0,
      mouthOpen: 0
    };

    const W = this.mazeWidth, H = this.mazeHeight;
    this.ghosts = [
      { x: 9,  y: 7, color: "#FF0000", dir: { x: 1, y: 0 },  speed: 0.12, state: "normal", id: "blinky", out: true,  releaseTimer: 0,    corner: { x: W - 2, y: 1 } },
      { x: 9,  y: 9, color: "#FFB8FF", dir: { x: 0, y: -1 }, speed: 0.12, state: "normal", id: "pinky",  out: false, releaseTimer: 1500, corner: { x: 1, y: 1 } },
      { x: 8,  y: 9, color: "#00FFFF", dir: { x: 0, y: -1 }, speed: 0.12, state: "normal", id: "inky",   out: false, releaseTimer: 4200, corner: { x: W - 2, y: H - 2 } },
      { x: 10, y: 9, color: "#FFB852", dir: { x: 0, y: -1 }, speed: 0.12, state: "normal", id: "clyde",  out: false, releaseTimer: 7600, corner: { x: 1, y: H - 2 } }
    ];

    this.mode = "scatter";
    this.modeTimer = 7000;
    this.frightenedTimer = 0;
    this._pelletsLeft = 999;

    this.ghosts.forEach(g => {
      g.pixelX = g.x * this.tileSize + this.tileSize / 2 + this.offsetX;
      g.pixelY = g.y * this.tileSize + this.tileSize / 2 + this.offsetY;
      g.lastTile = null;
    });
  },

  loseLife: function() {
    this.lives--;
    GamepadManager.rumble(200, 0.8, 0.5);
    this.createExplosion(this.player.pixelX, this.player.pixelY, "#FFFF00");
    audioManager.playSFX('explosion');
    if (this.lives <= 0) {
      this.gameState = "over";
      audioManager.playSFX('gameover');
      if (this.score > this.highScore) this.highScore = this.score;
    } else {
      this.gameState = "caught";
      this.caughtTimer = 1300;
